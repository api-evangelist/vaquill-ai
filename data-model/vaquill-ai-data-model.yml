  description: What to fill the template with.
- name: TemplateSlot
  fields: 3
  description: One variable and the value the run put in it.
- name: TemplateUpdateRequest
  fields: 3
  description: Replace a template's body, and optionally its title and description.
- name: TemplateVariable
  fields: 7
  description: One fillable span the template declares.
- name: ToolReportExport
  fields: 5
  description: A short-lived URL to the rendered report.
- name: ToolReportExportRequest
  fields: 1
  description: Which format to render the finished analysis in.
- name: UpdateWatchRequest
  fields: 6
- name: UploadCompleteRequest
  fields: 1
  description: Assemble the parts into the final object and start ingesting it.
- name: UploadFormats
  fields: 5
  description: What this API will accept, and how it will cut it into parts.
- name: UploadInitiateRequest
  fields: 6
  description: Ask for somewhere to put a file.
- name: UploadPartLink
  fields: 3
  description: Where to PUT one part, and how long that stays true.
- name: UploadSession
  fields: 5
  description: An open upload, and every URL needed to fill it.
- name: UploadSummary
  fields: 9
  description: 'One upload session as a LIST publishes it: no URLs, ever.'
- name: UsCorpusTypeInfo
  fields: 6
  description: 'One entry in the coverage legend: what a `corpusType` token means.'
- name: UsDivisionNode
  fields: 6
  description: One child division in a `GET /us/statutes/divisions` listing.
- name: UsFreeCallMeta
  fields: 2
  description: '`meta` on a free discovery endpoint.'
- name: UsJurisdictionCoverage
  fields: 8
  description: One row of the /us/statutes/states response.
- name: UsStatutesCoverageEnvelope
  fields: 2
  description: 'What `GET /us/statutes/coverage` returns: the matrix under `data`.'
- name: UsStatutesCoverageResponse
  fields: 6
  description: Response for `GET /us/statutes/coverage`.
- name: UsStatutesDivisionsResponse
  fields: 11
  description: Response for `GET /us/statutes/divisions`.
- name: ValidationError
  fields: 5
- name: ValidationProblem
  fields: 7
  description: A problem document for a schema rejection. `errors` lists the fields that were refused. The value
    you submitted is deliberately not echoed, so a validation failure cannot copy your content into an err
- name: Verification
  fields: 11
  description: Whether an answer accurately represented the sources it was built from.
- name: VerifiedClaim
  fields: 6
  description: One statement pulled out of an answer, and whether the sources support it.
- name: WebResult
  fields: 9
  description: One page a web search found.
- name: WebSearchRequest
  fields: 3
  description: A one-off web search. Touches no client data and stores nothing.
- name: WebSearchResults
  fields: 3
  description: What a web search returned. Nothing is stored.
- name: WebhookAuthRequest
  fields: 3
  description: How a delivery should authenticate itself to your endpoint.
- name: WorkflowArtifact
  fields: 4
  description: 'An artifact a finished run produced. No URL: fetching one is its own call.'
- name: WorkflowArtifactDownload
  fields: 3
  description: A short-lived pointer to one artifact's bytes.
- name: WorkflowArtifactSpec
  fields: 4
  description: A deliverable this workflow produces, named before it exists.
- name: WorkflowDefinition
  fields: 12
  description: One catalogue entry.
- name: WorkflowDocumentSlot
  fields: 6
  description: What a definition will accept in one role, so a caller can validate first.
- name: WorkflowInputField
  fields: 7
  description: One question the definition asks, and how it is answered.
- name: WorkflowRun
  fields: 12
  description: One run. `status` is the public five, never the stored spelling.
- name: WorkflowRunDocument
  fields: 3
  description: One document attached to a run, in a role the definition declares.
- name: WorkflowRunRequest
  fields: 3
  description: Launch a run of one definition inside one matter.
