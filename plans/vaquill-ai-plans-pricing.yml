notes:
- The India pricing endpoint https://api.vaquill.ai/api/v1/in/api-credits/pricing returns the same dollarPerCredit, minCredits and maxCredits.
- Webhook delivery on board watches and the 100-watch cap require the Business plan (https://www.vaquill.ai/docs/api-guide/errors); no price for
  Business is published on the site.
- The Vaquill AI workspace product is priced per seat (Plus, Power, Enterprise; 7-day free trial) at https://www.vaquill.ai/docs/guides/plans-and-limits
  with no numeric prices on that page; /pricing redirects to /legal-api.
- Legal aid and civil-justice organisations can apply for free access (https://www.vaquill.ai/legal-api).
