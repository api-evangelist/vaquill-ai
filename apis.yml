- aid: vaquill-ai:vaquill-ai-us-session-laws-api
  name: Vaquill AI US Session Laws API
  description: >-
    State session laws: the acts of each legislature as they were enacted, chapter by chapter, before
    they are folded into a code. A session law is what the governor signs. It carries the act's own text,
    including the language it strikes and inserts, its approval and effective dates, and, where the publisher
    prints one, the code sections it changes. That makes it the source for "which act changed this section,
    and when did it take effect".


    Every act has a permanent `sessionLawId` (for example `SSL_MN_2025R_G_Y2025_C1`, Minnesota Laws 2025,
    regular session, chapter 1) whether or not we hold its text, and a citation or bill number such as
    `S.F.No. 1552` is accepted where an id goes. v1 serves STATE acts only. Federal session laws (the
    Statutes at Large, `SAL_` ids) are served by `/us/statutes/section`, and `/us/statutes/resolve` points
    a session-law citation here.


    **Start here**: check `/us/statutes/coverage` (free) for what we hold per state: each jurisdiction's
    `sessionLaws` block lists its sessions, which are complete or only partly collected, and the `series`
    and `instrumentTypes` that exist. Then **List** a session or a date range to get ids, **Get** one
    act for its record, then **Body** for its text. A law missing from a partly collected session is a
    free 404 (`session_not_fully_collected`), not proof it does not exist.


    - **List**: everything enacted in a state's session, approved in a window, or taking effect on a date

    - **Get**: one act by id or by citation; dates (`effectiveDates` is always a list), sources and the
    code sections it affects

    - **Body**: the act's text as printed, paged by cursor, with amendatory markup preserved where the
    publisher printed it

    - **Batch**: up to 50 ids or citations in one call, the same record as Get, billed per law served,
    with every miss listed and its reason

    - **Changes**: a sync feed of the registry over an integer cursor (`sinceId`): what began to be served,
    was corrected, withdrawn or merged


    The reverse link, from a code section to the acts a publisher's own tables list against it, is `GET
    /us/statutes/section/{actId}/enactments`.
  humanURL: https://www.vaquill.ai/legal-api
  baseURL: https://api.vaquill.ai/api/v1
