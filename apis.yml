apis:
- aid: vaquill-ai:vaquill-ai-board-watches-api
  name: Vaquill AI Board Watches API
  description: >-
    Law-change alerts. Subscribe to a **board** (a tracked corpus source, identified by `corpusType` plus
    an optional `state`) and get a webhook or email whenever it refreshes with real changes, naming the
    exact sections that changed. Fetch old-vs-new text for any amended section via the change diff.


    Boards refresh on their own existing cadence; watching one does not change how often it refreshes.
    Every endpoint here is **free**: authenticated by API key and rate-limited, but not credit-metered.


    See the [Law Change Alerts guide](https://www.vaquill.ai/docs/api-guide/alerts) for the full walkthrough.
  humanURL: https://www.vaquill.ai/legal-api
  baseURL: https://api.vaquill.ai/api/v1
