- aid: vaquill-ai:vaquill-ai-us-statutes-api
  name: Vaquill AI US Statutes API
  description: >-
    Search and retrieve US primary law. Covers the United States Code and the Statutes at Large, the Code
    of Federal Regulations and its annual editions, state statutory codes and administrative regulations,
    federal and state constitutions, court rules, Federal Register rules and Presidential documents, federal
    and state agency guidance, agency adjudications, state Attorney General opinions, the Sentencing Guidelines
    and US tax treaties. Scope a search with the `corpusType` filter, and call `/us/statutes/coverage`
    for the live jurisdiction-by-corpusType list.


    - **Search**: Search across all USC, CFR, state, and regulatory sections

    - **Section**: Get metadata, citation, hierarchy, and source links for a specific section

    - **Body**: Get the full text of a section

    - **Enactments**: Which state session laws a publisher's own tables list against a section (supported
    jurisdictions only, never a complete history)
