  terms:
  - term: US Statutes
    definition: Search and retrieve US primary law. Covers the United States Code and the Statutes at Large, the Code of Federal Regulations and
      its annual editions, state statutory codes and administrative regulations, federal and state constitutions, court rules, Federal Register
      rules and Presidential documents, federal and state agency guidance, agency adjudications, state Attorney General opinions, the Sente
    tags:
    - Resource Group
    source: openapi/vaquill-ai-openapi.yml
  - term: US Session Laws
    definition: 'State session laws: the acts of each legislature as they were enacted, chapter by chapter, before they are folded into a code.
      A session law is what the governor signs. It carries the act''s own text, including the language it strikes and inserts, its approval and
      effective dates, and, where the publisher prints one, the code sections it changes. That makes it the source for "which act changed this'
    tags:
    - Resource Group
    source: openapi/vaquill-ai-openapi.yml
  - term: Board Watches
    definition: Law-change alerts. Subscribe to a **board** (a tracked corpus source, identified by `corpusType` plus an optional `state`) and
      get a webhook or email whenever it refreshes with real changes, naming the exact sections that changed. Fetch old-vs-new text for any amended
      section via the change diff. Boards refresh on their own existing cadence; watching one does not change how often it refreshes. Eve
    tags:
    - Resource Group
    source: openapi/vaquill-ai-openapi.yml
  - term: Pricing
    definition: Credit pricing and conversion rates. No authentication required. 1 credit = $0.01 USD.
    tags:
    - Resource Group
    source: openapi/vaquill-ai-openapi.yml
  - term: Credits
    definition: 'Your own credit balance: what is spendable right now, where it came from, and what is about to expire. Free and never charged,
      so it is safe to poll for low-balance alerting or to pre-flight a batch job.'
    tags:
    - Resource Group
    source: openapi/vaquill-ai-openapi.yml
  - term: Operations
    definition: 'The one job envelope. Every long-running call answers `202` with an operation, and polling this resource is the only way to learn
      it finished: there are no webhooks. Five statuses, no synonyms.'
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Clients
    definition: The people and companies matters are filed under. Synchronous CRUD.
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Matters
    definition: The unit of work everything else hangs off. A matter scopes documents, drafts, reviews, comparisons and matrices, and it is what
      a credential's access is checked against.
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Folders
    definition: Organization inside and across matters. The same folders the web app shows, so one created here appears in the customer's browser.
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Documents
    definition: 'Files in a matter: their metadata, their ingested text, and the original bytes. A document is only usable by retrieval, drafting
      and review once its status is `succeeded`.'
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Uploads
    definition: Getting files in. One presigned multipart flow at every size, with the bytes going straight to storage and never through this
      API. Initiate, PUT each part, then complete.
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Research
    definition: 'Asking legal questions and getting grounded, cited answers. This API does NOT stream: an ask answers `202` and you poll the operation,
      then read the answer off the message it points at. Conversation state is kept here, so you hold a chat id rather than replaying a transcript.
      Also covers the matter settings behind an answer, the skills you can ask through, and the standalone web-research tools.'
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Drafting
    definition: Generating, revising and exporting draft documents. Bodies come out as sections and go in as markdown; the editor's own format
      is never on the wire. Rendered files come from the export route.
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Playbooks
    definition: The organization's negotiating positions, per contract type, and the starter templates to build them from. A playbook is the input
      a contract review is measured against.
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Reviews
    definition: 'Reviewing one contract against a playbook: clause analysis, redlines, flags, liability exposure and a reported sign-off gate.
      Export applies the redlines as native Word tracked changes.'
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Facts
    definition: 'The cross-document fact ledger for a matter: what every document in it asserts, coalesced and cited back to its source passages.'
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Matter summary
    definition: A citation-backed summary of everything filed to a matter, generated on demand and readable claim by claim.
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Chronology
    definition: The dated events across a matter's documents, as one timeline, with duplicate and date-conflict flags.
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: NDA triage
    definition: Screening one inbound NDA against ten standard criteria and, where you name one, your own NDA playbook. Answers `green`, `yellow`
      or `red` with the reasoning per criterion, plus a report you can forward.
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Compliance
    definition: 'Checking one document against one regulation''s requirement checklist: a verdict per requirement with the article it comes from,
      the gaps, and what to do about them. Only regulations with a real checklist behind them are accepted.'
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Comparisons
    definition: Diffing two documents in a matter into structural changes, with a substantive-versus-cosmetic judgment and a downloadable redline.
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Matrices
    definition: 'Spreadsheet-style extraction across many documents: rows are documents, columns are questions, cells are answers with verified
      citations. Building a grid is free; running it is what costs.'
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
  - term: Workflows
    definition: Multi-step analyses from a fixed catalogue. Read a definition to learn what documents and inputs it takes, launch a run inside
      a matter, then download the artifacts it produces.
    tags:
    - Resource Group
    source: openapi/vaquill-ai-workspace-openapi.yml
