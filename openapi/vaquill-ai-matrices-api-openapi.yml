components:
  schemas:
    Page_MatrixSummary_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/MatrixSummary'
          type: array
          title: Data
          description: The rows in this window, in the collection's default order.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Where this window sits in the full result set.
      additionalProperties: false
      type: object
      required:
      - data
      - pagination
      title: Page[MatrixSummary]
    MatrixRunRequest:
      properties:
        force:
          type: boolean
          title: Force
          description: 'False (the default) runs only cells that have not answered yet: never-run cells, failed cells, and cells that ran and found nothing. Answers you or a reviewer wrote, approved or rejected are left alone and are not charged for. True re-runs EVERY cell including those, OVERWRITING any answer a human wrote, approved or rejected, and charges for all of them. It is the only way to pick up an edited question.'
          default: false
          examples:
          - false
      additionalProperties: false
      type: object
      title: MatrixRunRequest
      description: 'Start extraction.


        An empty body runs every cell that has not answered yet. `force` re-runs

        cells that already have an answer, which is the only way to pick up an

        edited question, and is charged like any other run.


        Cell, row and column subsetting is not published. The internal request

        accepts all three; each is a list of ids a customer would have to have read

        from a cells page first, and none of them changes what a customer can

        achieve, only how narrowly. The explicit `cell_ids` path is also the one

        that bypasses the terminal-status filter below, which is why `schedule_run`

        re-applies that filter by hand for it: publishing the subset would put the

        one path that can clobber a reviewed answer into the public contract.'
    MatrixCellPatch:
      properties:
        answer:
          anyOf:
          - type: string
            maxLength: 20000
            minLength: 1
          - type: 'null'
          title: Answer
          description: The answer to record for this cell, replacing whatever is there. There is no way to clear an answer back to empty; re-run the cell with `force` to have the extractor produce a fresh one.
          examples:
          - Twelve months of fees paid.
        review:
          anyOf:
          - type: string
            enum:
            - approved
            - rejected
          - type: 'null'
          title: Review
          description: '`approved` or `rejected`, recording what a reviewer decided about the answer. The extractor''s own statuses cannot be written here: an integration writing `extracted` onto an answer no machine produced makes the grid unauditable.'
          examples:
          - approved
      additionalProperties: false
      type: object
      title: MatrixCellPatch
      description: 'Write a human answer into a cell, or record a review decision on it.


        Writing `answer` promotes the cell to an edited state, and **an edited,

        approved or rejected cell is not re-run and not re-charged by a default

        run.** `MatrixService._select_cells_for_run` selects only `pending`,

        `error`, `not_found` and `not_applicable`, `schedule_run` re-applies that

        filter on its bulk reset, and `extract_cell_by_id` short-circuits before any

        model call. `force: true` on a run has none of those guards and overwrites

        the answer with no warning.


        The cell keeps reading as `succeeded`, because the extraction job did

        succeed. The review verdict is not published back on the cell for the same

        reason the comments and decisions are not published at all: it is a

        collaboration primitive, and this API publishes the five public statuses and

        no sixth.'
    MatrixExportRequest:
      properties:
        format:
          type: string
          enum:
          - csv
          - xlsx
          title: Format
          description: 'Which format to render: `csv` or `xlsx`.'
          examples:
          - csv
        includeCitations:
          type: boolean
          title: Includecitations
          description: True (the default) adds one extra column per question holding that answer's supporting quotes. False renders answers only.
          default: true
          examples:
          - true
      additionalProperties: false
      type: object
      required:
      - format
      title: MatrixExportRequest
      description: Ask for the finished grid rendered to a file.
    MatrixColumnPatch:
      properties:
        label:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Label
          description: New column heading. Resets nothing.
          examples:
          - Liability cap
        question:
          anyOf:
          - type: string
            maxLength: 4000
            minLength: 1
          - type: 'null'
          title: Question
          description: 'New question for this column. WARNING: changing it clears every existing answer in this column, including answers a human wrote or approved and any verification verdict on them, and leaves the cells unanswered until the next run.'
          examples:
          - What is the liability cap, and what does it apply to?
        columnType:
          anyOf:
          - type: string
            enum:
            - free_text
            - single_select
            - date
            - money
            - yes_no
            - party_name
          - type: 'null'
          title: Columntype
          description: 'New answer shape: `free_text`, `single_select`, `date`, `money`, `yes_no` or `party_name`. WARNING: changing it clears every existing answer in this column, as changing the question does.'
          examples:
          - free_text
        options:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Options
          description: 'New allowed answers for a `single_select` column. WARNING: changing them clears every existing answer in this column, as changing the question does.'
          examples:
          - - 'yes'
            - 'no'
            - not addressed
        instructions:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Instructions
          description: New extractor guidance scoped to this column. Resets nothing.
          examples:
          - House paper. Cap liability at 12 months of fees; never accept uncapped indemnity.
        dependsOnColumnId:
          anyOf:
          - type: string
          - type: 'null'
          title: Dependsoncolumnid
          description: '`col_` identifier of a column in this same matrix that this one becomes conditional on, or null to make it unconditional again. A cycle is refused.'
          examples:
          - col_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        gateExpression:
          anyOf:
          - type: string
            maxLength: 500
            pattern: ^(any|not_empty|yes|no|yes_no:(?:yes|no)|equals:.+|in:.+)$
          - type: 'null'
          title: Gateexpression
          description: 'The condition on the upstream answer that has to hold for this column to run, or null to run whenever the dependency has answered. One of `any`, `not_empty`, `yes`, `no`, `yes_no:yes`, `yes_no:no`, `equals:VALUE` or `in:A|B|C`. Anything else is refused: an expression we cannot parse would mark every cell in the column as deliberately skipped with no error anywhere. `yes`, `no` and `equals:` match the WHOLE upstream answer, not part of it, so they belong on a `yes_no` or `single_select` upstream column; over a `free_text` one, use `not_empty`.'
          examples:
          - 'yes'
        injectUpstream:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Injectupstream
          description: True prepends the upstream column's answer to this column's prompt, so the question can refer to it. False asks the question on its own.
          examples:
          - false
      additionalProperties: false
      type: object
      title: MatrixColumnPatch
      description: 'Change one column, including whether it is conditional on another.


        **Changing `question`, `columnType` or `options` BLANKS every cell in this

        column.** `MatrixService.update_column` bulk-resets them to pending with a

        null answer, no citations and no `answer_data`, which destroys a manually

        edited or approved answer and the verifier''s verdict along with it. That is

        defensible in a browser where a human just typed the new question and is

        looking at the grid; it is not something a PATCH should do silently, which is

        why it is stated in each of those three field descriptions and not only

        here. A generated client shows the field description.


        `label` and `instructions` do not reset anything: they change how the column

        reads and what guidance it carries, not what was asked.'
    MatrixColumnsRequest:
      properties:
        columns:
          items:
            $ref: '#/components/schemas/MatrixColumnSpec'
          type: array
          maxItems: 60
          minItems: 1
          title: Columns
          description: The questions to add, one column each. At most 60 in one request, and at most 60 in the grid.
      additionalProperties: false
      type: object
      required:
      - columns
      title: MatrixColumnsRequest
      description: 'Questions to add to the grid, one column each.


        Every added column backfills a pending cell against every existing row, so

        adding one column to a forty-row grid creates forty cells and moves

        `pendingCellCount` by forty. That is why the response is the whole matrix

        rather than the created columns: the number a caller needs before deciding

        whether to run is the new cell count, and it is invisible in a response that

        only describes what was created.


        Conditional columns are not settable here. A dependency names a `col_` id,

        and the ids in this request do not exist yet; patch the edges with

        `matrices.updateColumn` once the create has returned them.'
    MatrixColumn:
      properties:
        id:
          type: string
          title: Id
          description: Public identifier for the column, `col_` followed by 32 hex characters. Cells reference it as `columnId`.
          examples:
          - col_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        label:
          type: string
          title: Label
          description: Column heading.
          examples:
          - Liability cap
        question:
          type: string
          title: Question
          description: The question asked of every document in this column.
          examples:
          - What is the liability cap, and what does it apply to?
        columnType:
          type: string
          title: Columntype
          description: What shape of answer this column asks for. Published as a plain string, since production predates this API.
          examples:
          - free_text
        options:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Options
          description: Allowed answers for a select column.
          examples:
          - - 'yes'
            - 'no'
            - not addressed
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
          description: Extra extractor guidance scoped to this column.
          examples:
          - House paper. Cap liability at 12 months of fees; never accept uncapped indemnity.
        dependsOnColumnId:
          anyOf:
          - type: string
          - type: 'null'
          title: Dependsoncolumnid
          description: '`col_` identifier of the column this one is conditional on, or null when it always runs.'
          examples:
          - col_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        gateExpression:
          anyOf:
          - type: string
          - type: 'null'
          title: Gateexpression
          description: The condition on the upstream answer that has to hold for this column to run. Null means it always runs when its dependency has answered.
          examples:
          - 'yes'
        injectUpstream:
          type: boolean
          title: Injectupstream
          description: Whether the upstream column's answer is prepended to this column's prompt.
          default: false
          examples:
          - false
        position:
          type: integer
          title: Position
          description: 'Left-to-right position of the column in the grid. Ascending, and not necessarily contiguous: deleting a column leaves a gap rather than renumbering.'
          examples:
          - 0
      additionalProperties: false
      type: object
      required:
      - id
      - label
      - question
      - columnType
      - position
      title: MatrixColumn
      description: One column of the grid, as stored.
    Problem:
      type: object
      title: Problem
      description: An RFC 9457 problem document. Branch on `type`, which is stable; `title` and `detail` are written for people and may be reworded. Some problems carry extra members (`requiredScopes`, `limit`, `expectedVersion`), which is why this object is open.
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          format: uri
          description: The stable identifier for this error, and the one field to branch on. Resolves to a page describing it.
          examples:
          - https://vaquill.ai/docs/workspace-api/errors/insufficient-scope
        title:
          type: string
          description: A short human-readable summary.
          examples:
          - Insufficient scope
        status:
          type: integer
          description: The HTTP status code, repeated.
          examples:
          - 403
        detail:
          type: string
          description: What went wrong on this specific request. May be reworded at any time.
          examples:
          - This credential carries matters:read. This operation needs matters:write.
        instance:
          type: string
          description: The path this problem occurred on.
          examples:
          - /workspace/v1/matters/mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        requestId:
          type: string
          description: The id of this request, identical to the `X-Request-ID` response header. Quote it when contacting support.
          examples:
          - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
      additionalProperties: true
    OperationProgress:
      properties:
        done:
          type: integer
          minimum: 0.0
          title: Done
          description: How many units are finished.
          examples:
          - 24
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: How many units there are in total. Can legitimately be zero for an empty run.
          examples:
          - 128
        unit:
          type: string
          enum:
          - cells
          - steps
          - documents
          - files
          - rows
          - percent
          title: Unit
          description: 'What `done` and `total` are counting. Always read it: a workflow run counts `percent` while a matrix run counts `cells`, so `{done: 43, total: 100}` alone is ambiguous.'
          examples:
          - cells
      additionalProperties: false
      type: object
      required:
      - done
      - total
      - unit
      title: OperationProgress
      description: 'How far along, and in what units.


        The unit is not decoration. A workflow run stores only a percentage while a

        matrix run stores cell counts, so `{done: 43, total: 100}` with no unit reads

        as 43 of 100 documents and a client builds a wrong estimate from it.'
    ColumnOrderRequest:
      properties:
        columnIds:
          items:
            type: string
          type: array
          minItems: 1
          title: Columnids
          description: '`col_` identifiers of every column in this matrix, in the order you want them. The set has to match the matrix''s columns exactly, with no omissions, extras or repeats.'
          examples:
          - - value
      additionalProperties: false
      type: object
      required:
      - columnIds
      title: ColumnOrderRequest
      description: 'The complete left-to-right order of the grid''s columns.


        Every column in the matrix, exactly once. A subset is refused with a 422

        rather than applied, because `MatrixService.reorder_columns` drops ids it

        does not recognise and returns an empty list when none match, so one typo

        would give a partial reorder and a 200 and an all-wrong body would give no

        reorder and a 200. A reorder naming some of the columns is not a reorder; it

        is an unstated rule about where the rest go.'
    OperationResource:
      properties:
        kind:
          type: string
          title: Kind
          description: What sort of thing was produced, for example `matrix` or `document`.
          examples:
          - matrix
        id:
          type: string
          title: Id
          description: Public identifier of the produced resource, carrying its own type prefix, for example `mtx_` for a matrix.
          examples:
          - mtx_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
          description: Path on this API where the resource can be read, RELATIVE to the API root and never absolute. Absent when the resource has no addressable path, which happens for work started outside a matter. Absent means the id is real and there is nowhere to GET it; it is not an error.
          examples:
          - https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
      additionalProperties: false
      type: object
      required:
      - kind
      - id
      title: OperationResource
      description: 'What the operation produced, or is producing.


        `url` is a path on this API rather than an absolute URL, because the service

        is mounted today and gets its own hostname later (docs 07.5). A relative

        path survives that move; a baked-in host does not.'
    Page_MatrixCell_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/MatrixCell'
          type: array
          title: Data
          description: The rows in this window, in the collection's default order.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Where this window sits in the full result set.
      additionalProperties: false
      type: object
      required:
      - data
      - pagination
      title: Page[MatrixCell]
    MatrixUpdateRequest:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 300
            minLength: 1
          - type: 'null'
          title: Title
          description: New display title for the matrix.
          examples:
          - Vendor agreement review
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
          description: New description, or null to clear it.
          examples:
          - Master services agreement with Acme for the 2026 platform rollout.
      additionalProperties: false
      type: object
      title: MatrixUpdateRequest
      description: 'Rename a matrix, or change what it says it is for.


        `title` and `description`, and nothing else. The internal

        `MatrixUpdateRequest` also carries `status`, `metadata`, `folder_id`,

        `matter_id` and `share_with_organization_id`; the module docstring records

        why each of the last three is not here, and `status` is absent because

