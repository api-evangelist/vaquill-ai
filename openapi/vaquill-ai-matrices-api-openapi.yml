  /v1/matters/{matterId}/matrices/{matrixId}:
    get:
      tags:
      - Matrices
      summary: Get a matrix
      description: 'The grid header with its rows and columns. Cells are a separate read.


        Rows and columns are inlined because a cell names only a `rowId` and a

        `columnId`, so these are what make one readable. Watch `pendingCellCount`

        for completion and `errorCellCount` for cells that failed, which is a

        different thing from a cell that succeeded with no answer.'
      operationId: matrices.get
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: matrixId
        in: path
        required: true
        schema:
          type: string
          title: Matrixid
        description: '`mtx_` identifier of the matrix. Take it from the matter''s matrix list.'
      responses:
