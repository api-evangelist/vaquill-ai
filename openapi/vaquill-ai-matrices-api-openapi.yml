openapi: 3.2.0
info:
  title: Vaquill Ai Matrices API
  version: 1.0.0
  description: 'Operations tagged Matrices across 2 of this provider''s published API definitions: vaquill-ai-workspace-openapi.json, vaquill-ai-workspace-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vaquill.ai/workspace
  description: Vaquill Legal Workspace API (production)
- url: /workspace
  description: Vaquill Legal Workspace API (relative to the mount)
security:
- WorkspaceAuth: []
tags:
- name: Matrices
  description: 'Spreadsheet-style extraction across many documents: rows are documents, columns are questions, cells are answers with verified citations. Building a grid is free; running it is what costs.'
paths:
  /v1/matters/{matterId}/matrices:
    post:
      tags:
      - Matrices
      summary: Create a matrix
      description: 'Build a grid. Nothing is extracted until you run it.


        Rows are documents and columns are questions, so the grid is `documents x

        columns` cells and each cell is one billable extraction when the matrix is

        run. Every document must already be in this matter and finished ingesting:

        a still-ingesting document is refused, because retrieval over it would

        answer "not in this document" for every column.


        Note the column vocabulary: `free_text`, `single_select`, `date`, `money`,

        `yes_no`, `party_name`. There is no `text`, `number` or `boolean`.'
      operationId: matrices.create
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatrixCreateRequest'
            example:
              title: Vendor agreement review
              description: Master services agreement with Acme for the 2026 platform rollout.
              documentIds:
              - value
              columns:
              - label: Liability cap
                question: What is the liability cap, and what does it apply to?
                columnType: free_text
                options:
                - 'yes'
                - 'no'
                - not addressed
                instructions: House paper. Cap liability at 12 months of fees; never accept uncapped indemnity.
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matrix'
              example:
                id: mtx_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                matterId: mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                title: Vendor agreement review
                description: Master services agreement with Acme for the 2026 platform rollout.
                status: succeeded
                columns:
                - id: col_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  label: Liability cap
                  question: What is the liability cap, and what does it apply to?
                  columnType: free_text
                  options:
                  - 'yes'
                  - 'no'
                  - not addressed
                  instructions: House paper. Cap liability at 12 months of fees; never accept uncapped indemnity.
                  dependsOnColumnId: col_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  gateExpression: 'yes'
                  injectUpstream: false
                  position: 0
                rows:
                - id: row_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  documentId: doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  filename: msa-acme-v3.docx
                  position: 0
                cellCount: 24
                pendingCellCount: 0
                errorCellCount: 0
                createdAt: '2026-08-19T14:32:10Z'
                updatedAt: '2026-08-19T14:32:10Z'
        '422':
          description: The request does not match the published schema. `errors` names each rejected field and why. The submitted value is never echoed back.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: The credential is missing, malformed, unknown, revoked or expired. `type` is `invalid-credential`, or `wrong-product-credential` when a `vq_key_` Data API key was sent to this API.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
            WWW-Authenticate:
              description: RFC 9110 authentication challenge.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The credential does not carry a scope this operation requires (`insufficient-scope`), or the organization's installation is suspended (`installation-inactive`).
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
            WWW-Authenticate:
              description: RFC 9110 authentication challenge.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The resource does not exist, is not this organization's, or is outside this installation's matter allowlist. The three are deliberately indistinguishable, so the status code cannot be used to discover which ids exist in another organization. Each resource has its own `type`.
          headers:
