    delete:
      tags:
      - Matrices
      summary: Delete a matrix
      description: 'Delete the matrix, its rows, its columns and every answer in it.


        There is no undo and no trash. The cells, columns, rows, comments, history

        and any webhooks configured on it in the web app all go with it. A workflow

        run that produced this matrix survives and loses its reference to it.


        Refused with 409 `operation-in-flight` while a run over the matrix has not

        finished: deleting a matrix mid-run would leave that run''s operation

        reporting `running` until a sweeper marked it failed hours later. Poll the

        operation first, or cancel the run.


        Not idempotent. A second delete of the same id answers 404, so on a delete

        that timed out, treat a subsequent 404 as success.'
      operationId: matrices.delete
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: matrixId
        in: path
        required: true
        schema:
          type: string
          title: Matrixid
        description: '`mtx_` identifier of the matrix. Take it from the matter''s matrix list.'
      responses:
