  /v1/matters/{matterId}/matrices/{matrixId}/columns/order:
    put:
      tags:
      - Matrices
      summary: Reorder matrix columns
      description: 'Set the complete left-to-right order of the grid''s columns.


        `columnIds` has to name every column in this matrix exactly once. A subset

        is refused with 422 naming what was left out, and a repeat is refused too: a

        reorder naming some of the columns is not a reorder, it is an unstated rule

        about where the rest go.


        This is the only way to move a column. `position` is not writable on a

        column patch, because writing one directly collides with the uniqueness

        constraint the reorder exists to work around.'
      operationId: matrices.reorderColumns
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
