  /v1/matters/{matterId}/matrices/{matrixId}/exports:
    post:
      tags:
      - Matrices
      summary: Export a matrix as CSV or XLSX
      description: 'Render the grid to CSV or XLSX and return the file inline.


        Bytes rather than a signed URL, and it is one of only two operations here

        that work that way. A matrix export is rendered per call and stored nowhere,

        so a URL would mean writing your work product into our storage first.

        `content` is base64 and `sizeBytes` is the length of the DECODED file.


        `includeCitations` adds one extra column per question holding that answer''s

        supporting quotes. It is on by default, and it is what makes the export

        checkable by somebody who was not watching the run.


        413 `export-too-large` above 10 MiB. Export without citations, or split the

        matrix.'
      operationId: matrices.export
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: matrixId
        in: path
        required: true
        schema:
          type: string
          title: Matrixid
        description: '`mtx_` identifier of the matrix. Take it from the matter''s matrix list.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatrixExportRequest'
            example:
              format: csv
              includeCitations: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixExport'
              example:
                format: csv
                filename: msa-acme-v3.docx
                sizeBytes: 248193
                content: UEsDBBQABgAIAAAAIQ...
        '422':
          description: The request does not match the published schema. `errors` names each rejected field and why. The submitted value is never echoed back.
