    get:
      tags:
      - Matrices
      summary: List a matter's matrices
      description: 'The matrices filed to this matter, newest first.


        Headers only, so this is for finding a matrix rather than for reading one.

        Cell counts and the grid itself are deliberately absent: the counts are

        three queries per matrix, so a page of two hundred would be six hundred

        round trips on the cheapest read this API offers. `GET

        .../matrices/{matrixId}` is where they live.


        Only matrices filed to this matter appear. Every matrix created through this

        API is one, because the create always names a matter; a matrix somebody made

        in the web app without filing it to a matter is not visible here.'
      operationId: matrices.list
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: How many rows to return, 1 to 200. Defaults to 50.
          default: 50
          title: Limit
        description: How many rows to return, 1 to 200. Defaults to 50.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: 'How many rows to skip before returning any. Combine with `limit` to page: `offset=0`, then `offset=50`, and so on. Offsets are positional, not stable, so a set that changes while you page can show a row twice or not at all.'
          default: 0
          title: Offset
        description: 'How many rows to skip before returning any. Combine with `limit` to page: `offset=0`, then `offset=50`, and so on. Offsets are positional, not stable, so a set that changes while you page can show a row twice or not at all.'
