    post:
      tags:
      - Matrices
      summary: Run a matrix
      description: 'Extract every unanswered cell. 202 with an operation to poll.


        An answer a person wrote, approved or rejected is left alone and is not

        charged for; `force` re-runs it and overwrites it. A run whose every

        eligible cell was stopped by a cancel is refused rather than accepted,

        because the extractor skips a cancelled cell and the run would otherwise do

        nothing while reporting success.


        413 when the run is over the single-run cell ceiling, 429 when too many runs

        are already in flight, 503 when the guard deciding that cannot be reached.

        None of the three writes anything, so a refused run is free.


        The 429 counts runs per PERSON rather than per organization, and the person

        is the human who provisioned this installation, so the three slots are

        shared with that person''s own matrix runs in the web app. An integration can

        be refused with no API run outstanding at all.'
      operationId: matrices.run
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
