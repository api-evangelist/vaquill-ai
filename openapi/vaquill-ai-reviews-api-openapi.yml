    delete:
      tags:
      - Reviews
      summary: Delete a contract review
      description: 'Delete a review and its findings.


        The contract itself is untouched: a review takes contract TEXT rather than a

        document, so nothing in the matter depends on this row.


        Refused with `409 operation-in-flight` while the review is still running.

        Poll the operation that started it first.


        There is no undo, and a repeated delete answers `404`. If a delete timed

        out, treat a subsequent `404` as success.'
      operationId: reviews.delete
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
