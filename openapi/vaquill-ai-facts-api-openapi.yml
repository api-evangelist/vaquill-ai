  /v1/matters/{matterId}/fact-sets/{factSetId}:
    get:
      tags:
      - Facts
      summary: Get a fact set
      description: 'One fact set''s header: status, coverage and staleness. Facts are a separate read.


        `coverage` is the field to read before trusting a ledger as complete. The

        reducer extracts at most 60 documents inline, so on a larger matter

        `coverage.excluded` is non-zero and the operation still reports 100 percent:

        it IS complete, for what it read, and this is the only place that says what

        that was.


        `isStale` is computed per request against the matter''s documents as they are

        now, never stored.


        A `404` covers every reason the set is not readable: no such id, another

        organization''s, another matter''s, or a matter that has never generated one.'
      operationId: factSets.get
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: factSetId
        in: path
        required: true
        schema:
          type: string
          title: Factsetid
        description: '`fct_` identifier of the fact set. Returned on the operation that generated it.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactSet'
              example:
