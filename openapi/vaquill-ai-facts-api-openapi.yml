  /v1/matters/{matterId}/fact-sets/{factSetId}/exports:
    post:
      tags:
      - Facts
      summary: Export a fact set as CSV, PDF or DOCX
      description: 'Render the whole ledger to CSV, PDF or DOCX and return the bytes.


        A POST rather than a GET because it produces something that did not exist:

        the file is rendered per call rather than fetched, and recording that as a

        creation is what lets an audit answer who took a copy and when.


        The whole set, never a page of it. Over the inline ceiling this answers 413

        rather than sending a partial file, because a truncated ledger a customer

        believes is complete is worse than a refusal.'
      operationId: factSets.export
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: factSetId
        in: path
        required: true
        schema:
          type: string
          title: Factsetid
        description: '`fct_` identifier of the fact set. Returned on the operation that generated it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactSetExportRequest'
            example:
              format: csv
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactSetExport'
              example:
                format: docx
                filename: msa-acme-v3.docx
                sizeBytes: 248193
                content: UEsDBBQABgAIAAAAIQ...
                factCount: 1
        '422':
          description: The request does not match the published schema. `errors` names each rejected field and why. The submitted value is never echoed back.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
