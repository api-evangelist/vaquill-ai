components:
  schemas:
    Page_Fact_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Fact'
          type: array
          title: Data
          description: The rows in this window, in the collection's default order.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Where this window sits in the full result set.
      additionalProperties: false
      type: object
      required:
      - data
      - pagination
      title: Page[Fact]
    OperationStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - cancelled
      title: OperationStatus
      description: 'The public five. There is no sixth, and there are no synonyms.


        Internal vocabularies spell terminal success `completed`, `ready`,

        `extracted`, `succeeded` and `fresh`; terminal failure `failed` and `error`;

        queued `pending`, `queued` and `draft`. All of that is collapsed here by

        `app.workspace_api.adapters.status_map`, which refuses to guess.'
    FactSetExportRequest:
      properties:
        format:
          type: string
          enum:
          - csv
          - pdf
          - docx
          title: Format
          description: '`csv` for a spreadsheet, `pdf` or `docx` for a document.'
          examples:
          - csv
      additionalProperties: false
      type: object
      required:
      - format
      title: FactSetExportRequest
    Fact:
      properties:
        id:
          type: string
          title: Id
          description: '`fac_` identifier, stable for the life of this fact set.'
          examples:
          - fac_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        section:
          type: string
          title: Section
          description: 'Which part of the ledger this fact was clustered into, for example `key_fact`, `party` or `chronology`. Publisher-controlled and open: read it, do not switch on an exhaustive list of it.'
          examples:
          - obligation
        factType:
          type: string
          title: Facttype
          description: What kind of statement this is, for example `party`, `date`, `amount` or `obligation`. Open, for the same reason as `section`.
          examples:
          - obligation
        canonicalText:
          type: string
          title: Canonicaltext
          description: The fact as one sentence, merged across its sources.
          examples:
          - The Supplier's total liability under the Master Services Agreement is capped at the fees paid in the preceding twelve months.
        shortLabel:
          anyOf:
          - type: string
          - type: 'null'
          title: Shortlabel
          description: A compact label for a table cell.
          examples:
          - Liability cap
        explanation:
          anyOf:
          - type: string
          - type: 'null'
          title: Explanation
          description: Rarely populated; the reducer leaves it empty by design.
          examples:
          - The cap is stated in clause 8.2 and is not repeated in the order form.
        eventDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Eventdate
          description: The date this fact is about, when it has one.
          examples:
          - '2026-08-19'
        eventDateEnd:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Eventdateend
          description: The end of a date range, when the fact spans one.
          examples:
          - '2026-08-19'
        amountValue:
          anyOf:
          - type: number
          - type: 'null'
          title: Amountvalue
          description: The monetary amount, when the fact carries one.
          examples:
          - 1.0
        amountCurrency:
          anyOf:
          - type: string
          - type: 'null'
          title: Amountcurrency
          description: ISO code for `amountValue`.
          examples:
          - USD
        issueLabel:
          anyOf:
          - type: string
          - type: 'null'
          title: Issuelabel
          description: The issue this fact bears on.
          examples:
          - Limitation of liability
        entities:
          items:
            type: string
          type: array
          title: Entities
          description: Party and entity names named by this fact.
          examples:
          - - value
        citations:
          items:
            $ref: '#/components/schemas/FactCitation'
          type: array
          title: Citations
          description: Every passage behind the fact, `primary` first. Never empty on a generated fact.
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
          description: 0 to 1, the strongest supporting passage's confidence.
          examples:
          - 0.92
        supportCount:
          type: integer
          title: Supportcount
          description: How many passages support this fact.
          examples:
          - 1
        contradictionCount:
          type: integer
          title: Contradictioncount
          description: How many rival statements of the same thing were found in the matter.
          examples:
          - 1
        isConflicted:
          type: boolean
          title: Isconflicted
          description: True when the matter's documents state this fact more than one way. The rival statements are separate facts; this flags that they exist.
          examples:
          - false
        position:
          type: integer
          title: Position
          description: 'Ordering within the set: section first, then dated facts ascending, then the best-supported. It is a reading order, not a chronology.'
          examples:
          - 0
      additionalProperties: false
      type: object
      required:
      - id
      - section
      - factType
      - canonicalText
      - supportCount
      - contradictionCount
      - isConflicted
      - position
      title: Fact
      description: One clustered statement, with every passage that supports it.
    FactCitation:
      properties:
        documentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Documentid
          description: The `doc_` document this passage came from, or null when the citation predates a document that has since been deleted.
          examples:
          - doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        documentName:
          anyOf:
          - type: string
          - type: 'null'
          title: Documentname
          description: The document's filename at the moment the set was generated.
          examples:
          - msa-acme-v3.docx
        quote:
          anyOf:
          - type: string
          - type: 'null'
          title: Quote
          description: 'The verbatim passage. This is the citation''s anchor: locate it in the document''s text rather than relying on any offset.'
          examples:
          - in no event shall either party be liable for indirect damages
        pageStart:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pagestart
          description: First page the quote appears on.
          examples:
          - 1
        pageEnd:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pageend
          description: Last page the quote appears on.
          examples:
          - 1
        citationRole:
          type: string
          title: Citationrole
          description: '`primary` for the strongest passage behind the fact, `support` for the others that were clustered with it.'
          default: support
          examples:
          - primary
        sourceAvailable:
          type: boolean
          title: Sourceavailable
          description: False when the document this quote came from is no longer in the workspace. The quote is still accurate (it is a snapshot), but there is nothing to fetch and nothing to highlight it in.
          examples:
          - false
      additionalProperties: false
      type: object
      required:
      - sourceAvailable
      title: FactCitation
      description: 'One verified passage behind a fact.


        An immutable snapshot taken when the set was generated, so it survives the

        document being deleted and the evidence being re-extracted. Resolve it by

        searching for `quote` inside `GET /v1/matters/{matterId}/documents/{id}/text`;

        that is the durable mechanism, and it is what the product''s own verifier

        uses.'
    FactSetCoverage:
      properties:
        included:
          type: integer
          title: Included
          description: Documents whose evidence went into this set.
          examples:
          - 1
        total:
          type: integer
          title: Total
          description: Documents in the matter at generation time.
          examples:
          - 128
        excluded:
          type: integer
          title: Excluded
          description: Documents in the matter that this generation did not read, because it hit the per-run inline ceiling. Generate again to pick up more.
          examples:
          - 1
      additionalProperties: false
      type: object
      required:
      - included
      - total
      - excluded
      title: FactSetCoverage
      description: 'What the generation actually read, and what it did not.


        Not decoration. The reducer extracts at most 60 documents inline, so on a

        larger matter `included` is 60 and `excluded` is the rest, while the

        operation reports 60 of 60 and looks complete. It IS complete, for what it

        read. This is the only place that says what that was.'
    Pagination:
      properties:
        limit:
          type: integer
          title: Limit
          description: The `limit` that was applied to this request.
          examples:
          - 50
        offset:
          type: integer
          title: Offset
          description: The `offset` that was applied to this request.
          examples:
          - 0
        total:
          type: integer
          title: Total
          description: Total rows matching the filter, not the number returned in `data`. Use it to size a job before running it.
          examples:
          - 128
        hasMore:
          type: boolean
          title: Hasmore
          description: True when rows remain beyond this window. Derived from `offset + len(data) < total`, so a full final page correctly reports `false` rather than sending you after an empty page.
          examples:
          - false
      additionalProperties: false
      type: object
      required:
      - limit
      - offset
      - total
      - hasMore
      title: Pagination
      description: 'Where the caller is, and whether there is more.


        `total` is the count of rows matching the filter, not the count returned,

        so a caller can size a job before running it.'
    Operation:
      properties:
        id:
          type: string
          title: Id
          description: Public identifier, `op_` followed by 32 hex characters. Poll `GET /v1/operations/{operationId}` with it.
          examples:
          - op_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        type:
          type: string
          title: Type
          description: What kind of work this is, for example `matrix.run` or `draft.generate`.
          examples:
          - matrix.run
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: 'One of five values: `queued`, `running`, `succeeded`, `failed`, `cancelled`. There is no sixth and there are no synonyms. Stop polling once it is `succeeded`, `failed` or `cancelled`.'
          examples:
          - succeeded
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: When the operation was accepted (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completedat
          description: When the operation reached a terminal status (RFC 3339). Present if and only if the status is terminal.
          examples:
          - '2026-08-19T14:32:10Z'
        matterId:
          anyOf:
          - type: string
          - type: 'null'
          title: Matterid
          description: '`mat_` identifier of the matter this work belongs to, when it belongs to one.'
          examples:
          - mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        resource:
          anyOf:
          - $ref: '#/components/schemas/OperationResource'
          - type: 'null'
          description: What the operation produced. Absent until the underlying job row exists, which an idempotent replay can briefly observe, so treat absence as 'not yet' rather than 'never'.
        error:
          anyOf:
          - $ref: '#/components/schemas/OperationError'
          - type: 'null'
          description: Why the work failed. Present only when `status` is `failed`. Partial success is `succeeded` with `progress.done < progress.total`, never an error.
        progress:
          anyOf:
          - $ref: '#/components/schemas/OperationProgress'
          - type: 'null'
          description: How far along the work is, when the underlying job reports it. Absent does not mean no progress.
        requestId:
          anyOf:
          - type: string
          - type: 'null'
          title: Requestid
          description: The `X-Request-ID` of the request that created this operation. Quote it in a support ticket.
          examples:
          - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
      additionalProperties: false
      type: object
      required:
      - id
      - type
      - status
      - createdAt
      title: Operation
      description: 'One long-running operation, whatever kind of work it is.


        Readable for `OPERATION_RETENTION_DAYS` after creation, per AIP-151.'
    ValidationProblem:
      type: object
      title: ValidationProblem
      description: A problem document for a schema rejection. `errors` lists the fields that were refused. The value you submitted is deliberately not echoed, so a validation failure cannot copy your content into an error response or into either side's logs.
      required:
      - type
      - title
      - status
      - detail
      - instance
      - errors
      properties:
        type:
          type: string
          format: uri
          description: The stable identifier for this error, and the one field to branch on. Resolves to a page describing it.
          examples:
          - https://vaquill.ai/docs/workspace-api/errors/insufficient-scope
        title:
          type: string
          description: A short human-readable summary.
          examples:
          - Insufficient scope
        status:
          type: integer
          description: The HTTP status code, repeated.
          examples:
          - 403
        detail:
          type: string
          description: What went wrong on this specific request. May be reworded at any time.
          examples:
          - This credential carries matters:read. This operation needs matters:write.
        instance:
          type: string
          description: The path this problem occurred on.
          examples:
          - /workspace/v1/matters/mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        requestId:
          type: string
          description: The id of this request, identical to the `X-Request-ID` response header. Quote it when contacting support.
          examples:
          - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        errors:
          type: array
          description: One entry per rejected field.
          items:
            type: object
            required:
            - location
            - message
            - type
            properties:
              location:
                type: string
                description: Dotted path to the rejected field, for example `body.contentMarkdown`.
              message:
                type: string
                description: Why it was rejected.
              type:
                type: string
                description: The validation rule that failed.
      additionalProperties: true
    OperationProgress:
      properties:
        done:
          type: integer
          minimum: 0.0
          title: Done
          description: How many units are finished.
          examples:
          - 24
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: How many units there are in total. Can legitimately be zero for an empty run.
          examples:
          - 128
        unit:
          type: string
          enum:
          - cells
          - steps
          - documents
          - files
          - rows
          - percent
          title: Unit
          description: 'What `done` and `total` are counting. Always read it: a workflow run counts `percent` while a matrix run counts `cells`, so `{done: 43, total: 100}` alone is ambiguous.'
          examples:
          - cells
      additionalProperties: false
      type: object
      required:
      - done
      - total
      - unit
      title: OperationProgress
      description: 'How far along, and in what units.


        The unit is not decoration. A workflow run stores only a percentage while a

        matrix run stores cell counts, so `{done: 43, total: 100}` with no unit reads

        as 43 of 100 documents and a client builds a wrong estimate from it.'
    FactSetGenerateRequest:
      properties:
        mode:
          type: string
          enum:
          - standard
          - incremental
          title: Mode
          description: '`standard` re-reads every document in the matter. `incremental` reads only documents that changed since the current set, which is cheaper and reports its progress against the changed count rather than the matter size.'
          default: standard
          examples:
          - standard
      additionalProperties: false
      type: object
      title: FactSetGenerateRequest
      description: 'What to generate.


        Empty is valid and means `standard`. There is no `force` flag: on the Facts

        side that word is the delete-and-reinsert path through the shared evidence

        spine, and a caller that genuinely needs a rebuild changes something the

        corpus hash can see.'
    OperationResource:
      properties:
        kind:
          type: string
          title: Kind
          description: What sort of thing was produced, for example `matrix` or `document`.
          examples:
          - matrix
        id:
          type: string
          title: Id
          description: Public identifier of the produced resource, carrying its own type prefix, for example `mtx_` for a matrix.
          examples:
