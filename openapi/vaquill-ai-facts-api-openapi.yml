  /v1/matters/{matterId}/fact-sets/{factSetId}/facts:
    get:
      tags:
      - Facts
      summary: List the facts in a set
      description: 'The facts in one set, in the reducer''s reading order.


        Ordered by `position` ascending, which is section-clustered and then date

        ascending WITHIN a section. It is a reading order, not a chronology; for a

        chronology use the chronology routes.


        Each fact ships with every passage behind it. **Resolve a citation by finding

        its `quote` in the document''s text**, not by any offset: no offset is

        published, because the ones we store index a string this API does not serve.

        A citation whose `sourceAvailable` is false points at a document that has

        since been removed; its quote is a snapshot and stays accurate.'
      operationId: factSets.facts
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: factSetId
        in: path
        required: true
        schema:
          type: string
          title: Factsetid
        description: '`fct_` identifier of the fact set. Returned on the operation that generated it.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: How many rows to return, 1 to 200. Defaults to 50.
          default: 50
          title: Limit
        description: How many rows to return, 1 to 200. Defaults to 50.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: 'How many rows to skip before returning any. Combine with `limit` to page: `offset=0`, then `offset=50`, and so on. Offsets are positional, not stable, so a set that changes while you page can show a row twice or not at all.'
          default: 0
          title: Offset
        description: 'How many rows to skip before returning any. Combine with `limit` to page: `offset=0`, then `offset=50`, and so on. Offsets are positional, not stable, so a set that changes while you page can show a row twice or not at all.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Fact_'
              example:
                data:
                - id: fac_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  section: obligation
                  factType: obligation
                  canonicalText: The Supplier's total liability under the Master Services Agreement is capped at the fees paid in the preceding twelve months.
                  shortLabel: value
                  explanation: value
                  eventDate: '2026-08-19'
                  eventDateEnd: '2026-08-19'
                  amountValue: 1.0
                  amountCurrency: value
                  issueLabel: value
                  entities:
                  - value
                  citations:
                  - documentId: doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                    documentName: value
                    quote: in no event shall either party be liable for indirect damages
                    pageStart: 1
                    pageEnd: 1
                    citationRole: primary
                    sourceAvailable: false
                  confidence: 0.92
                  supportCount: 1
                  contradictionCount: 1
                  isConflicted: false
                  position: 0
                pagination:
                  limit: 50
                  offset: 0
                  total: 128
                  hasMore: false
        '422':
          description: The request does not match the published schema. `errors` names each rejected field and why. The submitted value is never echoed back.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: The credential is missing, malformed, unknown, revoked or expired. `type` is `invalid-credential`, or `wrong-product-credential` when a `vq_key_` Data API key was sent to this API.
          headers:
