    post:
      tags:
      - Facts
      summary: Generate a fact set
      description: 'Build a fact ledger for the matter. 202 with an operation to poll.


        Two callers asking for the same matter at once do NOT start two runs: the

        second attaches to the first and both operations poll the same set to the

        same terminal status. That is separate from `Idempotency-Key`, which makes

        ONE caller''s retry free.


        409 when the matter holds no finished documents, 429 when too many

        generations are already in flight, 503 when the guard deciding that cannot be

        reached. None of the three writes anything, so a refused run is free.


        **A regeneration resets attorney review.** `userStatus` on a fact is per fact

        and per set, so a lawyer who confirmed forty facts yesterday sees forty

        unreviewed facts after the next run. Nightly regeneration is therefore a

        decision, not a default.'
      operationId: factSets.generate
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: A unique value of your choosing, so a retried launch returns the FIRST operation instead of starting a second billable job. Reusing one with a different body is refused. Retrying with the same key and the same body is free and is the intended way to recover from a timeout.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/FactSetGenerateRequest'
              - type: 'null'
              title: Body
            example:
              mode: standard
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                id: op_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                type: matrix.run
                status: succeeded
                createdAt: '2026-08-19T14:32:10Z'
                completedAt: '2026-08-19T14:32:10Z'
                matterId: mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                resource:
                  kind: matrix
                  id: mtx_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  url: https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
                progress:
                  done: 24
