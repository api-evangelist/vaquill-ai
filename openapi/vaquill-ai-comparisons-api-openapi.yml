    delete:
      tags:
      - Comparisons
      summary: Delete a comparison
      description: 'Delete a comparison.


        It goes to the trash a lawyer can see in the app, so somebody at the firm

        can still restore it there. Through this API it is gone: it answers `404` on

        its own `GET`, disappears from this list, and its export stops being

        signable. The redline files it produced are left in storage and are no

        longer reachable.


        Refused with `409 operation-in-flight` while the comparison is still

        running. Poll the operation that started it first.


        A repeated delete answers `404`. If a delete timed out, treat a subsequent

        `404` as success.'
      operationId: comparisons.delete
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: comparisonId
