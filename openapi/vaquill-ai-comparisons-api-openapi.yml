  /v1/matters/{matterId}/comparisons/{comparisonId}:
    get:
      tags:
      - Comparisons
      summary: Get a comparison
      description: 'One comparison: its status, its two sides, and its summary.


        The sources are recorded as they were at launch, so they stay true after a

        document is renamed or replaced. `substantiveCount` is the number a reviewer

        actually has to look at; `hunkCount` includes cosmetic changes too. A `404`

        covers every reason it is not readable.'
      operationId: comparisons.get
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: comparisonId
