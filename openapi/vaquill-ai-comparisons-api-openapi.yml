components:
  schemas:
    OperationStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - cancelled
      title: OperationStatus
      description: 'The public five. There is no sixth, and there are no synonyms.


        Internal vocabularies spell terminal success `completed`, `ready`,

        `extracted`, `succeeded` and `fresh`; terminal failure `failed` and `error`;

        queued `pending`, `queued` and `draft`. All of that is collapsed here by

        `app.workspace_api.adapters.status_map`, which refuses to guess.'
    ComparisonExport:
      properties:
        format:
          type: string
          enum:
          - redlineDocx
          - redlinePdf
          title: Format
          description: The format that was exported.
          examples:
          - redlineDocx
        url:
          type: string
          title: Url
          description: Short-lived signed URL to download the rendered redline. Fetch it promptly and do not store it.
          examples:
          - https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
        expiresAt:
          type: string
          format: date-time
          title: Expiresat
          description: When the URL stops working (RFC 3339). Absolute rather than a duration, so it is meaningful whenever you read it.
          examples:
          - '2026-08-19T14:32:10Z'
      additionalProperties: false
      type: object
      required:
      - format
      - url
      - expiresAt
      title: ComparisonExport
      description: 'A short-lived pointer to the rendered comparison.


        A URL rather than the bytes: the file is already in object storage, and

        proxying it would put a customer''s large DOCX through our request path for

        no benefit. `expiresAt` is absolute rather than a duration, because a

        duration is only meaningful if the client knows when the response was

        produced.'
    ComparisonCreateRequest:
      properties:
        title:
          type: string
          maxLength: 300
          minLength: 1
          title: Title
          description: Display title for the comparison. Trimmed; whitespace alone is refused.
          examples:
          - MSA v2 against v3
        originalDocumentId:
          type: string
          title: Originaldocumentid
          description: '`doc_` identifier of the ORIGINAL document, the one being compared against. Must be in this matter.'
          examples:
          - doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        revisedDocumentId:
          type: string
          title: Reviseddocumentid
          description: '`doc_` identifier of the REVISED document. Must be in this matter, and must differ from `originalDocumentId`.'
          examples:
          - doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        settings:
          $ref: '#/components/schemas/ComparisonSettings'
          description: How the diff engine should treat the two inputs. Omit for sensible defaults.
      additionalProperties: false
      type: object
      required:
      - title
      - originalDocumentId
      - revisedDocumentId
      title: ComparisonCreateRequest
      description: 'Start a comparison between two documents already in the matter.


        Both sides are matter documents. The internal API also accepts drafts,

        draft versions and loose uploads; publishing those would mean publishing

        three more identifier spaces, and a customer that wants to compare arbitrary

        bytes uploads them to the matter first, which is one call it was going to

        make anyway.


        There is no `matterId` field. The matter is the path, which is what makes

        the authorization boundary visible in the URL.'
    Comparison:
      properties:
        id:
          type: string
          title: Id
          description: Public identifier, `cmp_` followed by 32 hex characters.
          examples:
          - cmp_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        matterId:
          type: string
          title: Matterid
          description: '`mat_` identifier of the matter this comparison belongs to.'
          examples:
          - mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        title:
          type: string
          title: Title
          description: Display title for the comparison.
          examples:
          - MSA v2 against v3
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: Comparison status, using the same five public values as an operation. Hunks are only complete once this is `succeeded`.
          examples:
          - succeeded
        original:
          $ref: '#/components/schemas/ComparisonSource'
          description: The original side, as resolved at launch.
        revised:
          $ref: '#/components/schemas/ComparisonSource'
          description: The revised side, as resolved at launch.
        settings:
          $ref: '#/components/schemas/ComparisonSettings'
          description: The settings this comparison actually ran with.
        hunkCount:
          type: integer
          title: Hunkcount
          description: Total structural changes found, cosmetic ones included.
          examples:
          - 37
        substantiveCount:
          type: integer
          title: Substantivecount
          description: Changes the engine judged substantive rather than cosmetic. This is the number a reviewer actually has to look at.
          examples:
          - 12
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
          description: Prose summary of what changed. Absent until the comparison succeeds.
          examples:
          - Twelve substantive changes, seven of them in the liability and indemnity sections.
        summaryBullets:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Summarybullets
          description: The same summary as discrete points, for rendering as a list.
          examples:
          - - Liability cap reduced
            - Governing law moved to California
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: When the comparison was created (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
          description: When the comparison was last updated (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
      additionalProperties: false
      type: object
      required:
      - id
      - matterId
      - title
      - status
      - original
      - revised
      - settings
      - hunkCount
      - substantiveCount
      - createdAt
      - updatedAt
      title: Comparison
      description: One comparison. `status` is the public five, never the stored spelling.
    Pagination:
      properties:
        limit:
          type: integer
          title: Limit
          description: The `limit` that was applied to this request.
          examples:
          - 50
        offset:
          type: integer
          title: Offset
          description: The `offset` that was applied to this request.
          examples:
          - 0
        total:
          type: integer
          title: Total
          description: Total rows matching the filter, not the number returned in `data`. Use it to size a job before running it.
          examples:
          - 128
        hasMore:
          type: boolean
          title: Hasmore
          description: True when rows remain beyond this window. Derived from `offset + len(data) < total`, so a full final page correctly reports `false` rather than sending you after an empty page.
          examples:
          - false
      additionalProperties: false
      type: object
      required:
      - limit
      - offset
      - total
      - hasMore
      title: Pagination
      description: 'Where the caller is, and whether there is more.


        `total` is the count of rows matching the filter, not the count returned,

        so a caller can size a job before running it.'
    OperationProgress:
      properties:
        done:
          type: integer
          minimum: 0.0
          title: Done
          description: How many units are finished.
          examples:
          - 24
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: How many units there are in total. Can legitimately be zero for an empty run.
          examples:
          - 128
        unit:
          type: string
          enum:
          - cells
          - steps
          - documents
          - files
          - rows
          - percent
          title: Unit
          description: 'What `done` and `total` are counting. Always read it: a workflow run counts `percent` while a matrix run counts `cells`, so `{done: 43, total: 100}` alone is ambiguous.'
          examples:
          - cells
      additionalProperties: false
      type: object
      required:
      - done
      - total
      - unit
      title: OperationProgress
      description: 'How far along, and in what units.


        The unit is not decoration. A workflow run stores only a percentage while a

        matrix run stores cell counts, so `{done: 43, total: 100}` with no unit reads

        as 43 of 100 documents and a client builds a wrong estimate from it.'
    Operation:
      properties:
        id:
          type: string
          title: Id
          description: Public identifier, `op_` followed by 32 hex characters. Poll `GET /v1/operations/{operationId}` with it.
          examples:
          - op_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        type:
          type: string
          title: Type
          description: What kind of work this is, for example `matrix.run` or `draft.generate`.
          examples:
          - matrix.run
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: 'One of five values: `queued`, `running`, `succeeded`, `failed`, `cancelled`. There is no sixth and there are no synonyms. Stop polling once it is `succeeded`, `failed` or `cancelled`.'
          examples:
          - succeeded
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: When the operation was accepted (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completedat
          description: When the operation reached a terminal status (RFC 3339). Present if and only if the status is terminal.
          examples:
          - '2026-08-19T14:32:10Z'
        matterId:
          anyOf:
          - type: string
          - type: 'null'
          title: Matterid
          description: '`mat_` identifier of the matter this work belongs to, when it belongs to one.'
          examples:
          - mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        resource:
          anyOf:
          - $ref: '#/components/schemas/OperationResource'
          - type: 'null'
          description: What the operation produced. Absent until the underlying job row exists, which an idempotent replay can briefly observe, so treat absence as 'not yet' rather than 'never'.
        error:
          anyOf:
          - $ref: '#/components/schemas/OperationError'
          - type: 'null'
          description: Why the work failed. Present only when `status` is `failed`. Partial success is `succeeded` with `progress.done < progress.total`, never an error.
        progress:
          anyOf:
          - $ref: '#/components/schemas/OperationProgress'
          - type: 'null'
          description: How far along the work is, when the underlying job reports it. Absent does not mean no progress.
        requestId:
          anyOf:
          - type: string
          - type: 'null'
          title: Requestid
