  /api/v1/us/statutes/section/{act_id}/changes:
    get:
      tags:
      - US Statutes
      summary: Get this section's change history
      description: 'Every change our refreshes have observed to one section: when it was added,

        each time its text was replaced, and whether it has since been removed.


        **Cost**: 1 credit. Not-found and failed lookups are not charged. An empty

        history for a section that exists IS the answer and is charged.


        A section lookup tells you what the law says today. This tells you whether that

        is the same thing it said when you last reviewed it. Unlike a board watch, which

        can only show changes that postdate the subscription, this reads the history

        already captured.


        **What this is, and is not.** These are OBSERVED changes: a refresh compared

        the source against the copy we held and found it different. `detectedAt` is

        when we saw it, an upper bound on when it took effect, never the effective date

        itself. For the publisher''s own effective and amendment dates, read

        `amendmentHistory` on `GET /us/statutes/section/{act_id}`. The two are

        complements: the publisher tells you what it says changed, this tells you what

        actually moved and when we could have told you.


        **Coverage is bounded by capture, not by the age of the law.** Change capture

        began long after the corpus itself did, it is per-source, and events are swept

        at 5 years. An empty `changes` list therefore means *no captured change*, not

        *never amended*. The `coverage` field on every response says so; surface it

        rather than rendering an empty list as "unchanged".


        **A removed section still answers.** When the newest change is a `removed`, the

        section is gone from the corpus and `section` comes back null. That is a

        successful, charged response, not a 404 -- learning that a provision was

        repealed is the point.


        **Paging.** `hasMore` is true when the page filled to `limit`. Walk backwards

        through history with `beforeId` (the smallest `id` you hold) and forward into

        new changes with `sinceId` (`cursor` from your last page).


        **Alerting on future changes** is a different surface: subscribe to the

        `corpusType` on this response via `POST /boards/watches`, optionally scoped to

        this exact `actId`, and take before/after diff text from the watch''s own diff

        endpoint.'
      operationId: get_section_changes_api_v1_us_statutes_section__act_id__changes_get
      parameters:
      - name: act_id
        in: path
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 200
          description: 'Section identifier, e.g. `USC_T42_C21_S1983` (Title 42, Chapter 21, Section 1983, which a lawyer writes as 42 U.S.C. § 1983). Take it from a `/us/statutes/search` or `/us/statutes/resolve` result.


            A citation also works here: `26 U.S.C. § 1`, `42 USC 1983` or `Cal. Civ. Code § 1950.5` is resolved with the same resolver `/resolve` uses, and the section is served. A citation costs this endpoint''s price PLUS the `/resolve` price (2 credits), charged as its own line whether or not it resolves, exactly as `/resolve` charges; that is the same total as calling `/resolve` and then this endpoint, in one round trip. An exact act_id costs only this endpoint''s price. When a citation resolves, or when the id only matched after surrounding whitespace, quotes or a trailing period were removed, the response carries `resolvedFrom` saying what your input was matched as. Check it the way you would check a `/resolve` answer. A citation containing `/` cannot travel in a URL path segment; resolve it with `GET /us/statutes/resolve` instead.


            Do not assemble an id from a citation: the title and section are derivable, but the CHAPTER is not, so `USC_T26_S1` misses. A miss returns 404 with `reason` and, where the section exists under another id, `didYouMean`.


            State session laws (acts as enacted, ids starting `SSL_`) are not code sections: read them at `/us/session-laws/{sessionLawId}`.'
          examples:
          - CFR_T21_P314_S314_50
          title: Act Id
        description: 'Section identifier, e.g. `USC_T42_C21_S1983` (Title 42, Chapter 21, Section 1983, which a lawyer writes as 42 U.S.C. § 1983). Take it from a `/us/statutes/search` or `/us/statutes/resolve` result.


          A citation also works here: `26 U.S.C. § 1`, `42 USC 1983` or `Cal. Civ. Code § 1950.5` is resolved with the same resolver `/resolve` uses, and the section is served. A citation costs this endpoint''s price PLUS the `/resolve` price (2 credits), charged as its own line whether or not it resolves, exactly as `/resolve` charges; that is the same total as calling `/resolve` and then this endpoint, in one round trip. An exact act_id costs only this endpoint''s price. When a citation resolves, or when the id only matched after surrounding whitespace, quotes or a trailing period were removed, the response carries `resolvedFrom` saying what your input was matched as. Check it the way you would check a `/resolve` answer. A citation containing `/` cannot travel in a URL path segment; resolve it with `GET /us/statutes/resolve` instead.


          Do not assemble an id from a citation: the title and section are derivable, but the CHAPTER is not, so `USC_T26_S1` misses. A miss returns 404 with `reason` and, where the section exists under another id, `didYouMean`.


          State session laws (acts as enacted, ids starting `SSL_`) are not code sections: read them at `/us/session-laws/{sessionLawId}`.'
      - name: limit
        in: query
        required: false
