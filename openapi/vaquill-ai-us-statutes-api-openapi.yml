        effectiveFirst:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effectivefirst
          description: 'Earliest of the act''s effective dates we hold, ISO 8601. Null when we hold none: a date the publisher does not print, or prints as a relative rule, is not guessed. Read every date from `effectiveDates` on `GET /us/session-laws/{sessionLawId}`. Null when ambiguous.'
          examples:
