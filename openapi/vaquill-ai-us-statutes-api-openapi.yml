          title: Candidates
          description: Every law an ambiguous citation names. Empty when `status` is `matched`.
        defaultSessionLawId:
          anyOf:
          - type: string
          - type: 'null'
          title: Defaultsessionlawid
          description: On an ambiguous citation, the publisher's conventional reading when there is one. Never served for you.
          examples:
          - null
      type: object
      required:
