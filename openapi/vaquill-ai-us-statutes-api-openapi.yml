          title: Note
          description: Set only when the answer is not a real zero. Reverse citation is built on the cross-reference index, which exists for USC and CFR; for any other corpus this explains that the section is out of scope and the call is refunded. When it is null, an empty `citers` means nothing cites this section.
        resolvedFrom:
          anyOf:
          - $ref: '#/components/schemas/SectionIdentifierResolution'
          - type: 'null'
