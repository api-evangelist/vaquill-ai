      - loc
      - msg
      - type
      title: ValidationError
    StatuteCrossStateResponse:
      properties:
        section:
          $ref: '#/components/schemas/StatuteResult'
          description: The section you asked about.
        neighbors:
          items:
            $ref: '#/components/schemas/StatuteCrossStateNeighbor'
          type: array
          title: Neighbors
          description: Comparable provisions in other states, most similar first. At most one entry per state, so this reads as a jurisdiction comparison rather than a relevance list.
        statesCovered:
          type: integer
          title: Statescovered
          description: How many distinct states are represented. Fewer than you asked for means no provision in the remaining states cleared the similarity floor, not that those states are missing from the corpus.
          default: 0
          examples:
          - 5
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
          description: Set only when the answer is not a real zero. Cross-state comparison is defined for state statute sections; for USC, CFR and other corpora this explains that the section has no state analogues and the call is refunded.
        rankingDegraded:
          type: boolean
          title: Rankingdegraded
          description: True when the relevance model was unavailable, so the neighbors are in retrieval order and `similarity` is a retrieval score on a much smaller scale rather than the usual 0-1. The provisions are still the retrieved analogues; retry shortly for the fully ranked answer.
          default: false
          examples:
          - false
        resolvedFrom:
          anyOf:
          - $ref: '#/components/schemas/SectionIdentifierResolution'
          - type: 'null'
          description: 'Null when the section is exactly the act_id you sent. Otherwise how your input was matched: a citation, or an act_id with transport damage (whitespace, quotes, a trailing period) removed.'
        processingTimeMs:
          type: number
          title: Processingtimems
          description: Server-side time for this request in milliseconds, excluding network transit. Useful for spotting a slow query; not billed on.
          default: 0.0
          examples:
          - 420.1
        creditsConsumed:
          type: number
          title: Creditsconsumed
          description: 'Credits actually charged for this call. Read it rather than assuming the list price: failed and refunded work bills 0.'
          default: 0.0
          examples:
          - 6
      type: object
      required:
      - section
      title: StatuteCrossStateResponse
      description: Response for `GET /us/statutes/section/{act_id}/cross-state`.
    SubsectionNode:
      properties:
        label:
          type: string
          title: Label
          description: The marker as printed, e.g. `(b)` or `(2)`.
        pincite:
          type: string
          title: Pincite
          description: 'Full path to this subsection from the top of the section, e.g. `(b)(2)`. Append it to the section''s citation to point at this exact passage: 42 U.S.C. § 1983(b)(2). Lawyers call that a pincite, a citation to the precise place rather than the whole section.'
          examples:
          - (b)(2)
        type:
          type: string
          title: Type
          description: 'The drafting level of this node: `subsection`, `paragraph`, `subparagraph`, `clause`, or `subclause`. Use it to render the marker style (letters, numbers, roman).'
          default: subsection
        citation:
          anyOf:
          - type: string
          - type: 'null'
          title: Citation
          description: Full pinpoint citation when the section citation is known, e.g. `42 U.S.C. § 1983(b)(2)`.
        text:
          type: string
          title: Text
          description: This node's own text, excluding nested children.
          default: ''
        children:
          items:
            $ref: '#/components/schemas/SubsectionNode'
          type: array
          title: Children
          description: Nested subsections one level deeper.
      type: object
      required:
      - label
      - pincite
      title: SubsectionNode
      description: One node in a section's subsection tree (see `/body?structured=true`).
    SectionEnactmentsResponse:
      properties:
        actId:
          type: string
          title: Actid
          description: The section's act_id as served, after any citation or copy damage was resolved.
          examples:
          - STATE_MS_T27_C71_S27-71-5
        resolvedFrom:
          anyOf:
          - $ref: '#/components/schemas/SectionIdentifierResolution'
          - type: 'null'
          description: 'Present only when your input was a citation or an id carrying copy damage: what it was matched as. Null when you sent an exact act_id.'
        jurisdiction:
          anyOf:
          - type: string
          - type: 'null'
          title: Jurisdiction
          description: Lowercase two-letter code of the section's jurisdiction. Null for a federal section.
          examples:
          - ms
        supported:
          type: boolean
          title: Supported
          description: 'True when this section''s jurisdiction is one whose publisher table is mapped to the statutes section numbers and this section is in the form that mapping was proven on: then `enactments` is an answer, even when it is empty, and the call is charged. False when it is not (see `reason`): `enactments` is empty, says nothing about the section, and the call is NOT charged.'
          examples:
          - true
        reason:
          anyOf:
          - type: string
            enum:
            - unsupported_jurisdiction
            - not_a_state_code_section
            - section_not_in_proven_form
          - type: 'null'
          title: Reason
          description: 'Why `supported` is false. `unsupported_jurisdiction`: we do not read this jurisdiction''s table (none is printed, or its form is not verified against our section numbers), see `coverage.note`. `not_a_state_code_section`: the section is not a state statute (a federal, regulation or constitution section). `section_not_in_proven_form`: the jurisdiction is read, but this section''s stored number is not in a form the mapping was proven on, so it is not guessed at. Null when `supported` is true.'
          examples:
          - null
        enactments:
          items:
            $ref: '#/components/schemas/SectionEnactment'
          type: array
          title: Enactments
          description: 'The entries of the publisher''s tables whose printed section is this section, newest act first (by approval date, undated last), one per printed entry: an act that lists the section twice appears twice. NEVER a complete history: only acts we hold, in sessions we hold, whose table lists the section in the printed form this jurisdiction''s mapping reads. Empty with `supported: true` is a real answer: no held table lists it.'
        count:
          type: integer
          title: Count
          description: Entries returned in `enactments`.
          default: 0
          examples:
          - 1
        truncated:
          type: boolean
          title: Truncated
          description: True when more entries matched than are returned (the newest are kept). A section amended by that many acts is not a case we have met.
          default: false
          examples:
          - false
        coverage:
          $ref: '#/components/schemas/EnactmentCoverage'
          description: What this answer is read from, and what it is not. Show it with the list.
        creditsConsumed:
          type: integer
          title: Creditsconsumed
          description: Credits actually charged for this call, never the list price. 0 when `supported` is false (refunded) and on a failure. A citation sent in place of the act_id adds the `/us/statutes/resolve` price, charged whether or not it resolves.
          default: 0
          examples:
          - 1
        processingTimeMs:
          type: number
          title: Processingtimems
          description: Server-side time for this request in milliseconds, excluding network transit. Not billed on.
          default: 0.0
          examples:
          - 96.4
      type: object
      required:
      - actId
      - supported
      - coverage
      title: SectionEnactmentsResponse
      description: Response for `GET /us/statutes/section/{act_id}/enactments`.
    UsStatutesCoverageResponse:
      properties:
        corpusTypes:
          items:
            $ref: '#/components/schemas/UsCorpusTypeInfo'
          type: array
          title: Corpustypes
          description: Legend of every corpusType token, its meaning, and its scope.
        jurisdictions:
          items:
            $ref: '#/components/schemas/UsJurisdictionCoverage'
          type: array
          title: Jurisdictions
          description: One row per jurisdiction (federal first, then states and territories), each carrying its per-corpusType counts in `corpora`.
        totalSections:
          type: integer
          title: Totalsections
          description: Count of distinct sections (one per provision or document) across the corpus. This is the deduplicated legal-document total, not the raw index size; see `totalPassages`.
        totalPassages:
          type: integer
          title: Totalpassages
          description: Total indexed retrieval passages across the corpus. Longer sections and documents are split into several passages for retrieval, so this runs well above `totalSections`. The Federal Register (long agency rules) accounts for over half.
          default: 0
        stateCountWithData:
          type: integer
          title: Statecountwithdata
        measuredAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Measuredat
          description: 'When these counts were last measured against the index, as the OLDEST per-jurisdiction measurement in this response. This is OUR measurement''s age, not the publisher''s currency: for what a section is current THROUGH, read `currentThrough` on the section, and for when a source was last checked, read `GET /boards`.\n\nIt exists because a jurisdiction whose measurement keeps failing is served from the last value we knew to be correct, which is the right trade (a stale count is accurate, a degraded one reports a real corpus as absent) and used to be indistinguishable from a fresh one. Null means nothing in this response has been successfully measured yet.'
      type: object
      required:
      - corpusTypes
      - jurisdictions
      - totalSections
      - stateCountWithData
      title: UsStatutesCoverageResponse
      description: 'Response for `GET /us/statutes/coverage`.


        A self-describing matrix: a legend of every `corpusType` token plus, for

        each jurisdiction, the per-corpusType ingested-document counts. Use it to learn

        exactly what is queryable where before calling `/us/statutes/search`.'
    EnactmentSession:
      properties:
        code:
          type: string
          title: Code
          description: Session code, `{year}{type}{ordinal}`, as on `GET /us/session-laws/list`.
