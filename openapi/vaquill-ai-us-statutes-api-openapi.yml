            type: array
          - type: 'null'
          title: Fields
          description: Return only these result fields, e.g. `["title", "excerpt"]`. A result carries 40+ fields and most are null on any given row, so a full page of 50 ships a lot of nulls. `actId` and `citation` are always included, because a row without them cannot be used or attributed. Unknown names are rejected with 422 so a typo does not silently drop a field you needed. Omit for the full object.
          examples:
          - - title
            - excerpt
            - state
        limit:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Limit
          description: Number of results to return per page.
          default: 10
        offset:
          type: integer
          maximum: 70.0
          minimum: 0.0
          title: Offset
          description: How many results to skip, for paging. Every page of a given query is cut from one ranking, so results never repeat or go missing between pages, and a later page costs no more than the first. The deepest reachable result is `offset` + `limit`; check `hasMore` to know when there is nothing further.
          default: 0
        includeBody:
          type: boolean
          title: Includebody
          description: 'Return the full text of every hit inline, on each result''s `body`, instead of making you fetch it per section afterwards.


            **Why it exists.** Search returns a ranking preview, so the alternative is a search call plus one `/section/{actId}/body` call per hit. This collapses a whole page to a single round trip.


            **Cost**: the 4-credit search PLUS the ordinary 6-credit body price for each row that actually returns text. Ten rows with text is 4 + 60 = 64 credits. A row whose text cannot be resolved comes back with `body: null` and is NOT charged, so read `creditsConsumed` rather than computing it from `limit` -- it is the same price as fetching them yourself, so this buys latency, not a discount.


            ⚠️ It multiplies with `limit`. `limit: 50` with this set is 304 credits in a single call. Page deliberately.


            Prefer this over raising `excerptChars`: the excerpt is windowed around the match and can begin mid-section, dropping a leading subsection marker, so it is not safe to quote. `body` is the publisher''s text.'
          default: false
          examples:
          - true
        excerptChars:
          type: integer
          maximum: 4000.0
          minimum: 100.0
          title: Excerptchars
          description: Characters of matching text to include in each result's `excerpt`. The excerpt is a ranking preview; use `/us/statutes/section/{actId}/body` for the full text. Default 500.
          default: 500
        matchType:
          type: string
          enum:
          - any
          - all
          - phrase
          title: Matchtype
          description: 'Controls exact vs. semantic matching, so there is no need for a separate keyword-only search mode. `any` (default) is hybrid semantic + keyword ranking and suits natural-language questions. Use `all` for strict keyword matching (every query word must appear in the text) or `phrase` for an exact-phrase match (the query''s words, contiguous and in order), e.g. a defined term or a statutory phrase, when you want lexical precision. Both match WHOLE words, case-insensitively, ignoring punctuation: `act` does not match `fact`, `10b-5` matches `10b 5`, and `§ 1983` matches `section 1983`. To pull up one specific section, pass its citation as the query (e.g. `42 U.S.C. § 1983`, `Cal. Civ. Code § 1950.5`) and it resolves to that section at rank 1.'
          default: any
          examples:
          - phrase
      additionalProperties: false
      type: object
      required:
      - query
      title: StatuteSearchRequest
      example:
        corpusType: STATE
        limit: 5
        matchType: any
        query: data breach notification deadline
        state: ca
    StatuteResolveBatchItem:
      properties:
        resolved:
          type: boolean
          title: Resolved
          description: True when this citation resolved to an exact section.
        inputCitation:
          type: string
          title: Inputcitation
          description: The citation string you asked to resolve, echoed back.
        section:
          anyOf:
          - $ref: '#/components/schemas/StatuteResult'
          - type: 'null'
          description: The resolved section, or null when this citation did not resolve.
        subsection:
          anyOf:
          - type: string
          - type: 'null'
          title: Subsection
          description: Parsed pinpoint subsection when the citation carried one. See the single-citation route for the full semantics, including the case where the publisher issues a larger unit than the citation names.
        citationOutsideFilters:
          anyOf:
          - $ref: '#/components/schemas/CitationOutsideFilters'
          - type: 'null'
          description: 'Set only when `resolved` is false because the batch''s `state` or `corpusType` scope excludes a section this citation DOES name, e.g. a federal citation under `state: ca`. The scope is a constraint, so the verdict stays `resolved: false`; this says why. Retry without the scope named in `excludedBy` to resolve it. No extra charge.'
        matchedCorpus:
          anyOf:
          - type: string
            const: session_law
          - type: 'null'
          title: Matchedcorpus
          description: Present only when the citation names a STATE session law (an act as enacted, for example `CHAPTER 2025-12` or `S.F.No. 1552`) rather than a code section. `resolved` stays false and `section` stays null, because both describe a code section; the law is in `sessionLaw`.
        sessionLaw:
          anyOf:
          - $ref: '#/components/schemas/SessionLawCitationMatch'
          - type: 'null'
          description: The state session law this citation names, when it names no code section. `status` is `matched` (one law, read it at `href`) or `ambiguous` (several, all in `candidates`, none chosen for you). Absent when the citation resolved to a section, and whenever session laws cannot be checked. No extra charge.
      type: object
      required:
      - resolved
      - inputCitation
      title: StatuteResolveBatchItem
      description: 'One citation''s verdict inside a batch response.


        Deliberately the same field names as `StatuteResolveResponse` minus the

        per-request bookkeeping, so a caller migrating from the single route reads

        each item with the code it already has.'
    StatuteSectionsRequest:
      properties:
        actIds:
          items:
            type: string
          type: array
          maxItems: 50
          minItems: 1
          title: Actids
          description: 'Section identifiers from a prior `/us/statutes/search` response. Up to 50 per call. Duplicates are collapsed, and order is preserved in the response. Each id encodes the citation''s hierarchy: `USC_T42_C21_S1983` is Title 42, Chapter 21, Section 1983. DO NOT BUILD THESE FROM A CITATION: the chapter/article/part segments exist only in the data, so `Tex. Property Code § 93.005` is `STATE_TX_Cpr_C93_S93.005`, not `STATE_TX_C93_S93.005`. Assembled ids miss, and `notFoundDetail` will say so and suggest the real ones. A citation (`26 U.S.C. § 1`) is also accepted in place of an id: it is resolved and served, and listed in `resolved`.'
          examples:
          - - USC_T42_C21_S1983
            - CFR_T17_P240_S240_10b5_1
        includeBody:
          type: boolean
          title: Includebody
          description: 'Return each section''s full text inline on `body`, instead of metadata only. Adds the ordinary body price per row that returns text, so 20 ids resolving 20 bodies is 40 + 120 = 160 credits. Rows whose text cannot be resolved come back with `body: null` and are not charged for it, so read `creditsConsumed` rather than computing the total. Without this, use `/us/statutes/section/{actId}/body` one id at a time.'
          default: false
          examples:
          - true
      type: object
      required:
      - actIds
      title: StatuteSectionsRequest
      description: Batch metadata lookup. See `POST /us/statutes/sections`.
      example:
        actIds:
        - USC_T42_C21_S1983
        - USC_T42_C21_S1981a
    AsOfProvenance:
      properties:
        requested:
          type: string
          title: Requested
          description: The date you asked for, echoed back (`YYYY-MM-DD`).
          examples:
          - '2026-01-15'
        engine:
          type: string
          enum:
          - stored_edition
          - observed_change
          title: Engine
          description: 'WHICH BACKEND ANSWERED. `asOf` is one parameter over two engines and they make different promises.


            `stored_edition`: the answer is a publisher''s own printed edition of the text, held verbatim. Used wherever we hold published editions, which today is `corpusType=CFR_ANNUAL` (annual editions per title), the US Code, the Copyright Compendium and OFAC FAQs. The date is resolved to a held edition and that edition''s text is returned as printed.


            Coverage under this engine is per corpus and is NOT continuous. The CFR annual editions tile the calendar per title; the others are ENUMERATED editions with gaps between them. A date that falls in a gap returns `source: "unavailable"` with `outOfCoverageReason` and NO text, rather than the neighbouring edition, because the text may have changed in the gap. For the US Code in particular, most dates are currently out of coverage: see `outOfCoverageReason` for which editions we hold.


            `observed_change`: the answer is RECONSTRUCTED from changes we observed, and reaches back only as far as capture began for that source. Every other corpus.


            Read this before `isBounded`, which does not make the same claim on both engines.'
          default: observed_change
          examples:
          - observed_change
        source:
          type: string
          enum:
          - live
          - reconstructed
          - unavailable
          - published
          title: Source
          description: 'The detail WITHIN the engine above.


            On `observed_change` -- `live`: we captured no change to this section after your date, so today''s text is what stood then as far as we ever saw. `reconstructed`: rebuilt from the before-side of the first change we captured after your date. `unavailable`: we know it changed but cannot rebuild the earlier text, so no text is returned. That is different from the section being empty, and different again from it not existing.


            On `stored_edition` -- `published`: an edition we hold answered, verbatim. `unavailable`: the date is out of coverage for this section and no text is returned, and `outOfCoverageReason` says why in a sentence. Out of coverage means the date falls outside every edition we hold, or inside a gap between two of them; it is never answered from a neighbouring edition.'
          examples:
          - reconstructed
        existed:
          type: boolean
          title: Existed
          description: False when the earliest thing we ever captured for this section is its ADDITION and that addition postdates your date, so it demonstrably did not exist yet. A real answer, not a miss.
        basisChangeId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Basischangeid
          description: The change event whose before-side supplied this text. Null when `source` is `live`. Pass it to `/us/statutes/section/{actId}/changes` to see the event this answer rests on.
          examples:
          - 91
        observedFrom:
          anyOf:
          - type: string
          - type: 'null'
          title: Observedfrom
          description: The earliest change we ever captured for this section. Null when we captured none. This is how far back the reconstruction can see, and it is a property of when capture began for this source, not of the age of the law.
          examples:
          - '2026-08-09T04:10:00Z'
        resolvedEditionYear:
          anyOf:
          - type: integer
          - type: 'null'
          title: Resolvededitionyear
          description: '`stored_edition` only. The revision year actually served, read from the edition''s own printed revision statement. 🔴 This is NOT always the year the schedule computes: a publisher reprints an unchanged volume into the next year without re-dating it, so the 2024 printing of 4 CFR is the January 1 2019 revision. Render THIS year, never `scheduledEditionYear`.'
          examples:
          - 2019
        scheduledEditionYear:
          anyOf:
          - type: integer
          - type: 'null'
          title: Schedulededitionyear
          description: '`stored_edition` only. The edition the revision schedule says SHOULD cover your date. Differs from `resolvedEditionYear` whenever the publisher reprinted an unchanged volume. Exposed so the disagreement is auditable, not so it can be displayed.'
          examples:
          - 2024
        editionsObserved:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Editionsobserved
          description: '`stored_edition` only. Every edition year in which this exact text was observed, enumerated. An ENUMERATION, not a range: a year between the first and last that is absent here is an edition nobody read, and a date resolving to it is reported out of coverage rather than answered from a neighbour.'
          examples:
          - - 2014
            - 2015
            - 2016
        outOfCoverageReason:
          anyOf:
          - type: string
          - type: 'null'
          title: Outofcoveragereason
          description: Why no text was returned, in a sentence safe to show a reader. Null when text was returned.
        isBounded:
          type: boolean
          title: Isbounded
          description: '⚠️ This flag does NOT make the same claim on both engines. Read `engine` first.


            On `stored_edition`, TRUE means your date falls inside the editions we actually parsed for this title, so the text is a verified published printing rather than an inference. FALSE means out of coverage, and no text is returned.


            On `observed_change`, TRUE means: we observed no change affecting your date, and that is NOT the same as there having been none.


            Set when your date predates `observedFrom`, or when we captured no change for this section at all. Change capture began long after the corpus did and is per-source, so a bounded answer is our best reconstruction rather than a verified historical text. Surface it. Rendering a bounded answer as authoritative point-in-time law makes a claim we did not make.'
        coverage:
          type: string
          title: Coverage
          description: Prose statement of the same limit, safe to show a reader verbatim.
      type: object
      required:
      - requested
      - source
      - existed
      - isBounded
      - coverage
      title: AsOfProvenance
      description: 'Where an `asOf` body came from, and how far the evidence reaches.


        Every field but `text` on the parent exists so this answer cannot be

        over-read. The corpus holds ONE current text per citation; an earlier one is

        RECONSTRUCTED from observed changes, and observation started when it started.'
    StatuteNeighborsResponse:
      properties:
        section:
          $ref: '#/components/schemas/StatuteResult'
          description: The section you asked about.
        previous:
          items:
            $ref: '#/components/schemas/StatuteResult'
          type: array
          title: Previous
          description: Sections immediately BEFORE this one in the same container, nearest last.
        next:
          items:
            $ref: '#/components/schemas/StatuteResult'
          type: array
          title: Next
          description: Sections immediately AFTER this one, nearest first.
        container:
          anyOf:
          - type: string
          - type: 'null'
          title: Container
          description: Human label for the grouping the neighbours were drawn from, e.g. the chapter name. Neighbours never cross this boundary.
        resolvedFrom:
          anyOf:
          - $ref: '#/components/schemas/SectionIdentifierResolution'
          - type: 'null'
          description: 'Null when the section is exactly the act_id you sent. Otherwise how your input was matched: a citation, or an act_id with transport damage (whitespace, quotes, a trailing period) removed.'
        processingTimeMs:
          type: number
          title: Processingtimems
          description: Server-side time for this request in milliseconds, excluding network transit. Useful for spotting a slow query; not billed on.
          default: 0.0
          examples:
          - 240.5
        creditsConsumed:
          type: number
          title: Creditsconsumed
          description: 'Credits actually charged for this call. Read it rather than assuming the list price: failed and refunded work bills 0, and batch endpoints charge per item returned, so a partial result costs less than a full one.'
          default: 0.0
          examples:
          - 4
      type: object
      required:
      - section
      title: StatuteNeighborsResponse
      description: Response for `GET /us/statutes/section/{act_id}/related`.
    EnactmentCoverage:
      properties:
        jurisdiction:
          anyOf:
          - type: string
          - type: 'null'
          title: Jurisdiction
          description: Lowercase two-letter code of the section's jurisdiction. Null for a section that is not a state statute (a federal section).
          examples:
          - ms
        sessionsHeld:
          items:
            $ref: '#/components/schemas/EnactmentSession'
          type: array
          title: Sessionsheld
          description: 'The sessions of this jurisdiction whose code-section tables are held. A session not listed contributes nothing to `enactments`: an empty list says we read nothing, not that the section was untouched. Empty for an unsupported jurisdiction.'
        note:
          type: string
          title: Note
          description: 'In words: where the list comes from for this jurisdiction, and what it does not read. Show it beside the list: `enactments` is what the publisher''s table prints, never a complete amendment history.'
          examples:
          - 'Mississippi: the Legislature''s bill-status record lists Code sections in a zero-padded form. Entries the publisher prints as a list or range are not matched.'
      type: object
      required:
      - note
      title: EnactmentCoverage
      description: What this answer is read from, and what it is not.
    StatuteSearchResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/StatuteResult'
          type: array
          title: Results
          description: Matching sections, most relevant first. Ordering is by relevance, not statutory order; use `/us/statutes/section/{actId}/related` for what sits either side of a section in its code.
        count:
          type: integer
          title: Count
          description: 'How many results came back in THIS response, i.e. the length of `results`. It is not a total match count: the API ranks a bounded set of candidates rather than scoring the whole corpus, so no such total exists. Use `hasMore` to decide whether to ask for another page.'
          default: 0
        total:
          type: integer
          title: Total
          description: DEPRECATED alias for `count`, kept for backward compatibility. The name reads as a corpus-wide match total, which it never was. Use `count` instead.
          default: 0
          deprecated: true
        offset:
          type: integer
          title: Offset
          description: The offset applied to this page.
          default: 0
        hasMore:
          type: boolean
          title: Hasmore
          description: Whether more results exist beyond this page.
          default: false
        changedSectionCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Changedsectioncount
          description: 'Only present when `changedSince` is set: how many sections changed in that window, before ranking. Compare it against `count`. `changedSince` is a filter on a RANKED search, so a window holding more sections than one query can return is normal and the page you get is the most relevant slice of it, not all of it. When this number is larger than you can page to, the filter is a trigger rather than an inventory: subscribe to the board and poll `GET /watches/{id}/changes`, which is complete and costs no credits.'
          examples:
          - 19055
        rankingDegraded:
          type: boolean
          title: Rankingdegraded
          description: 'True when the relevance model (a cross-encoder) was unavailable and the results are in hybrid-retrieval order instead. The sections are still real matches for the query, but the ordering is coarser and `relevanceScore` is a retrieval score rather than a 0-1 relevance, so do not threshold on it. Such a ranking is never cached: retrying shortly returns the fully ranked result once the model recovers.'
          default: false
          examples:
          - false
        noGoodMatch:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Nogoodmatch
          description: True when nothing in the corpus looks on point for this query. It says nothing about whether the top result is the right section; check its citation and jurisdiction. False when the top result clears the relevance bar, or when the query is a citation or a section number that matched exactly. Null when `rankingDegraded` is true, because the bar is on the relevance model's scale. The same on every page of a query.
          examples:
          - false
        matchQuality:
          anyOf:
          - type: string
            enum:
            - exact
            - strong
            - moderate
            - weak
            - none
          - type: 'null'
          title: Matchquality
          description: 'How strongly the evidence says result #1 answers the query. exact: a citation or section-number match. strong: the top result was correct about 94% of the time in our measurements (about 91% on questions whose answer is a statute or regulation). moderate: about 67%. weak: about 35%. none: nothing on point (same as noGoodMatch). Measured on our labelled evaluation set; tiers may be re-cut as the index changes, so treat unknown values as moderate. Null when `rankingDegraded` is true. The same on every page of a query.'
          examples:
          - strong
        citationOutsideFilters:
          anyOf:
          - $ref: '#/components/schemas/CitationOutsideFilters'
          - type: 'null'
          description: 'Your query is a citation to a real section that your filters exclude. To read it, retry without the filters named in `excludedBy`, or call `GET /us/statutes/resolve` without them. Null when the query is not a citation, when the citation is inside your filters (it then ranks first), or when it names no section we hold. `results` are unchanged: a filter is a promise, so the section is reported here and not forced into the results. The same on every page of a query.'
        query:
          type: string
          title: Query
          description: The search query used.
          default: ''
        processingTimeMs:
          type: number
          title: Processingtimems
          description: Server-side time for this request in milliseconds, excluding network transit. Useful for spotting a slow query; not billed on.
          default: 0.0
          examples:
          - 240.5
        creditsConsumed:
          type: number
          title: Creditsconsumed
          description: 'Credits actually charged for this call. Read it rather than assuming the list price: failed and refunded work bills 0, and batch endpoints charge per item returned, so a partial result costs less than a full one.'
          default: 0.0
          examples:
          - 4
      type: object
      title: StatuteSearchResponse
    UsStatutesCoverageEnvelope:
      properties:
        data:
          $ref: '#/components/schemas/UsStatutesCoverageResponse'
        meta:
          $ref: '#/components/schemas/UsFreeCallMeta'
      type: object
      required:
      - data
      - meta
      title: UsStatutesCoverageEnvelope
      description: 'What `GET /us/statutes/coverage` returns: the matrix under `data`.


        Declared because the route used to return a hand-built dict with no

        `response_model`, so its published schema was `{}`. Every field was

        discoverable only if the example happened to show it, and the MCP tool and

        generated clients built from the document got no types at all for the one

        endpoint that exists to be read before anything else.'
    SessionLawSessionCoverage:
      properties:
        code:
          type: string
          title: Code
          description: Session code, for example `2025R`.
          examples:
          - 2025R
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
          description: The session's canonical label.
          examples:
          - 2025 Regular Session
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
          description: '`regular`, `special`, `extraordinary`, `fiscal`, `veto` or `unknown`.'
          examples:
          - regular
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
          description: The year the session convened, the year `code` starts with.
          examples:
          - 2025
        status:
          type: string
          enum:
          - complete
          - partial
          title: Status
          description: '`complete` when every law the publisher lists for the session is accounted for. Anything less is `partial`: a law missing from a partial session is not evidence that it does not exist, and asking for one by id or citation answers `session_not_fully_collected`, free of charge, rather than a plain not found.'
          examples:
          - complete
        servedCount:
          type: integer
          minimum: 0.0
          title: Servedcount
          description: 'Laws from this session we serve: every one we answer for by id, citation or list, whether or not we hold its text (`notHeldCount` of them have none). Laws whose text is withheld are not counted here, they are `withheldCount`. `servedCount + withheldCount` is `registryCount`, less any law still being verified.'
          examples:
          - 39
        withheldCount:
          type: integer
          minimum: 0.0
          title: Withheldcount
          description: 'Laws from this session we hold and list but whose text is withheld for a measured defect (`textStatus: withheld`). They are real laws: their records are served, their text is not.'
          default: 0
          examples:
          - 0
        notHeldCount:
          type: integer
          minimum: 0.0
          title: Notheldcount
          description: 'Of the laws counted in `servedCount`, how many have no text held (`textStatus: not_held` or `pending`). A subset of `servedCount`, not an addition to it: do not add it to `servedCount` or `withheldCount`.'
          default: 0
          examples:
          - 0
        registryCount:
          type: integer
          minimum: 0.0
          title: Registrycount
          description: 'Every law of this session in our registry, whether or not its text is held: `servedCount + withheldCount`. Any difference is a law still being verified, which is neither.'
          default: 0
          examples:
          - 39
        collectedCount:
          type: integer
          minimum: 0.0
          title: Collectedcount
          description: Laws from this session whose text we have collected, served or withheld. Compare it with `denominator.value` to see how much of the session we hold.
          default: 0
          examples:
          - 39
        denominator:
          anyOf:
          - $ref: '#/components/schemas/SessionLawDenominator'
          - type: 'null'
          description: How many laws the session is expected to hold, and where that figure comes from. Null when it could not be read.
          examples:
          - derivation: The publisher's complete listing of this session names 296 measures. We hold 43 of them; the rest are not yet collected.
            kind: complete_listing
            value: 296
        openGaps:
          type: integer
          minimum: 0.0
          title: Opengaps
          description: Laws the publisher lists for this session that we could not collect and have not yet. 0 on a `complete` session.
          default: 0
          examples:
          - 0
        measuredAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Measuredat
          description: When this session's coverage was last measured, ISO 8601 UTC.
          examples:
          - '2026-10-05T09:07:12+00:00'
      type: object
      required:
      - code
      - status
      - servedCount
      title: SessionLawSessionCoverage
      description: One legislative session's session-law coverage.
    StatuteChangesResponse:
      properties:
        actId:
          type: string
          title: Actid
          description: The act_id of the section served. Equal to your request unless `resolvedFrom` is set, in which case it is the id your citation or cleaned-up input resolved to.
          examples:
          - CFR_T21_P314_S314_50
        section:
          anyOf:
          - $ref: '#/components/schemas/StatuteResult'
          - type: 'null'
          description: 'The section as it stands today. NULL is meaningful and not an error: it means the section is no longer in the corpus, which is exactly the case when the newest change is a `removed`. The history below is still the answer.'
        changes:
          items:
            $ref: '#/components/schemas/StatuteChangeEvent'
          type: array
          title: Changes
          description: Observed changes, newest first by default. Empty is a real answer, and it means NO CAPTURED CHANGE, not that the section has never been amended. See `coverage`.
        total:
          type: integer
          title: Total
          description: 'Size of `changes` on this page, not a corpus-wide count: it is capped by `limit`.'
          default: 0
          examples:
          - 3
        hasMore:
          type: boolean
          title: Hasmore
          description: True when the page filled to `limit`, so more may sit behind it. Page with `beforeId` (walking back) or `sinceId` (walking forward) rather than by raising `limit`.
          default: false
        cursor:
          anyOf:
          - type: integer
          - type: 'null'
          title: Cursor
          description: Highest `id` on this page, or null when the page is empty. Carry it into `sinceId` to poll for what is new; keep the one you hold when a page comes back empty.
          examples:
          - 91
        observedFrom:
          anyOf:
          - type: string
          - type: 'null'
          title: Observedfrom
          description: 'The earliest change we ever captured for this section: the OBSERVATION HORIZON this history sits on. Read it before treating an empty or short list as the section''s full history.


            **Null means we have never captured a change for this section**, so an empty `changes` list is not evidence that it is stable. A non-null value with an empty list means your filters or cursor excluded everything we hold, which is a different answer.


            `coverage` states the same caveat in prose. This is the fact behind it, and it is the same field, meaning the same thing, as `asOf.observedFrom` on `GET /section/{actId}/body`.'
          examples:
          - '2026-08-14T04:10:00Z'
        coverage:
          type: string
          title: Coverage
          description: What this history can and cannot tell you, in one sentence. Change capture began well after the corpus itself did and is swept on a retention window, so this endpoint reports the changes we OBSERVED in that window, never the section's full legislative history. Read it before treating an empty list as 'unchanged'.
          examples:
          - Observed changes only, from when capture began for this source through today, retained 24 months. Not a full legislative history.
        resolvedFrom:
          anyOf:
          - $ref: '#/components/schemas/SectionIdentifierResolution'
          - type: 'null'
          description: 'Null when the section is exactly the act_id you sent. Otherwise how your input was matched: a citation, or an act_id with transport damage (whitespace, quotes, a trailing period) removed.'
        processingTimeMs:
          type: number
          title: Processingtimems
          description: Server-side time for this request in milliseconds, excluding network transit. Useful for spotting a slow query; not billed on.
          default: 0.0
          examples:
          - 18.4
        creditsConsumed:
          type: number
          title: Creditsconsumed
          description: 'Credits actually charged for this call. Read it rather than assuming the list price: failed and refunded work bills 0.'
          default: 0.0
          examples:
          - 1
      type: object
      required:
      - actId
      - coverage
      title: StatuteChangesResponse
      description: Response for `GET /us/statutes/section/{act_id}/changes`.
    SessionLawCitationMatch:
