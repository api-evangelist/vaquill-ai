        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
          description: The session's canonical label, as the publisher names it.
          examples:
          - 2025 Regular Session
        status:
          anyOf:
          - type: string
            enum:
            - complete
            - partial
          - type: 'null'
          title: Status
          description: 'Whether we hold every act of the session (`complete`) or only part of it (`partial`): an act missing from a partial session is not evidence that it did not touch the section. Null when coverage could not be read just now.'
          examples:
          - complete
      type: object
      required:
      - code
      title: EnactmentSession
      description: One legislative session of the jurisdiction whose code-section tables are read.
    StatuteCitedByResponse:
      properties:
