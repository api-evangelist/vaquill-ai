        effectiveLast:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effectivelast
          description: 'Latest of the act''s effective dates we hold, ISO 8601: equal to `effectiveFirst` when the act takes effect on one date. Null when we hold none. Null when ambiguous.'
          examples:
          - '2025-09-01'
        enactmentOutcome:
          anyOf:
          - type: string
          - type: 'null'
          title: Enactmentoutcome
          description: 'How the measure became, or failed to become, law: `signed`, `became_law_without_signature`, `veto_overridden`, `line_item_veto` (signed with some items vetoed), `vetoed` and `pocket_veto` (not law), `not_presented`, `approved_by_voters`, or `unknown` when the publisher does not say. Null when ambiguous.'
          examples:
