  /api/v1/us/statutes/resolve:
    get:
      tags:
      - US Statutes
      summary: Resolve a citation to its section
      description: 'Resolve a Bluebook citation string to the exact section it names, confirmed

        against the corpus, with an official source link.


        **Cost**: 2 credits. Charged whether or not the citation resolves,

        because a confident "this citation does not resolve" is the answer you want when

        verifying a citation an LLM produced. Only server errors are refunded.


        Pass a Bluebook citation as `cite`:


        - Federal statute: `42 U.S.C. 1983`

        - Federal regulation: `16 C.F.R. 444.1`

        - State statute: `Del. Code Ann. tit. 13, 1301`


        A pinpoint subsection (`42 U.S.C. 1983(b)(2)`) resolves to the parent section and

        is echoed back in `subsection`. When the citation resolves, `section` carries the

        full metadata (the same shape as `/us/statutes/section/{actId}`) and `resolved` is

        `true`. When it does not, `resolved` is `false` and `section` is `null`: treat

        that as "unverified", not "current".


        A citation to a STATE session law (an act as enacted, for example `CHAPTER 2025-12` or `S.F.No. 1552`) names no code section, so `resolved` stays `false` and `section` stays `null`. The law is described in `sessionLaw`, beside `matchedCorpus: "session_law"`, with an `href` to read it under `/us/session-laws`, and enough to answer what it is and when it took effect without a second call: `title`, `billNumber`, `approvedDate`, `effectiveFirst` and `effectiveLast` (null when the publisher prints no effective date), `enactmentOutcome` and `sourceUrl`, the government publisher''s own text. A citation naming several laws comes back `ambiguous` with every candidate and none chosen for you. A `state` scope applies to session laws; a `corpusType` scope excludes them. No extra charge, and a citation that resolves to a section is never checked against session laws. A citation that names no state is matched against every state''s laws, so at most 6 of them are checked per call: the others carry no `sessionLaw` block, which says nothing about whether the law exists. Name the state, or send the rest in another call.'
      operationId: resolve_statute_citation
      parameters:
      - name: cite
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 200
          description: A Bluebook citation string, e.g. '42 U.S.C. 1983' or '16 C.F.R. 444.1'.
          examples:
          - 42 U.S.C. 1983
          title: Cite
        description: A Bluebook citation string, e.g. '42 U.S.C. 1983' or '16 C.F.R. 444.1'.
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 7
            enum:
            - federal
            - al
            - ak
            - az
            - ar
            - ca
            - co
            - ct
            - de
            - dc
            - fl
            - ga
            - gu
            - hi
            - id
            - il
            - in
            - ia
            - ks
            - ky
            - la
            - me
            - md
            - ma
            - mi
            - mn
            - ms
            - mo
            - mt
            - ne
            - nv
            - nh
            - nj
            - nm
            - ny
            - nc
            - nd
            - mp
            - oh
            - ok
            - or
            - pa
            - pr
            - ri
            - sc
            - sd
            - tn
            - tx
            - ut
            - vt
            - va
            - wa
            - wv
            - wi
            - wy
          - type: 'null'
          description: 'Optional jurisdiction to resolve WITHIN: a two-letter state code, e.g. `tx`, or `federal` for the U.S. Code, the C.F.R., federal rules and the U.S. Constitution. Some citation forms are shared: `8 CCR 1206-2` is Colorado and `22 CCR 76227` is California, and the acronym alone cannot say which. This is a constraint, not a hint -- a citation that names a different jurisdiction returns `resolved: false` rather than being forced into this one, and `citationOutsideFilters` says which section it names.'
          examples:
          - tx
          title: State
        description: 'Optional jurisdiction to resolve WITHIN: a two-letter state code, e.g. `tx`, or `federal` for the U.S. Code, the C.F.R., federal rules and the U.S. Constitution. Some citation forms are shared: `8 CCR 1206-2` is Colorado and `22 CCR 76227` is California, and the acronym alone cannot say which. This is a constraint, not a hint -- a citation that names a different jurisdiction returns `resolved: false` rather than being forced into this one, and `citationOutsideFilters` says which section it names.'
      - name: corpusType
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            enum:
            - CONSTITUTION
            - REGULATION
            - STATE
            - STATE_CONSTITUTION
            - STATE_RULES
          - type: 'null'
          description: 'Optional corpus to resolve WITHIN: `STATE` (statutory text, federal or state), `REGULATION` (administrative codes), `STATE_RULES` (court rules), `CONSTITUTION` (constitutional text), `STATE_CONSTITUTION` (constitutional text; a synonym of `CONSTITUTION` here, since `state` is what separates the two). Narrows a citation whose form several corpora share; like `state`, a citation belonging to another corpus resolves to nothing instead.'
          examples:
          - REGULATION
          title: Corpustype
        description: 'Optional corpus to resolve WITHIN: `STATE` (statutory text, federal or state), `REGULATION` (administrative codes), `STATE_RULES` (court rules), `CONSTITUTION` (constitutional text), `STATE_CONSTITUTION` (constitutional text; a synonym of `CONSTITUTION` here, since `state` is what separates the two). Narrows a citation whose form several corpora share; like `state`, a citation belonging to another corpus resolves to nothing instead.'
      responses:
        '200':
          description: The resolution verdict, with the section when resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatuteResolveResponse'
              example:
                resolved: true
                inputCitation: 42 U.S.C. 1983
                section:
                  actId: USC_T42_C21_S1983
                  citation: 42 U.S.C. § 1983 (2026)
                  citationShort: 42 U.S.C. § 1983
                  title: Civil action for deprivation of rights
                  corpusType: USC
                  state: federal
                  year: 2026
                  relevanceScore: 0.0
                  excerpt: 'officer''s judicial capacity, injunctive relief shall not be granted unless a declaratory decree was violated or declaratory relief was unavailable".


                    1979—Pub. L. 96–170 inserted "or the District of Columbia" after "Territory", and provisions relating to Acts of Congress applicable solely to the District of Columbia.


                    Statutory Notes and Related Subsidiaries


                    Effective Date of 1979 Amendment


                    Amendment by Pub. L. 96–170 applicable with respect to any deprivation of rights, privileges, or...'
                  titleNumber: '42'
                  titleName: THE PUBLIC HEALTH AND WELFARE
                  chapter: '21'
                  chapterName: CIVIL RIGHTS
                  sectionNumber: '1983'
                  sectionTitle: Civil action for deprivation of rights
                  displayPath: 'Title 42: THE PUBLIC HEALTH AND WELFARE / Chapter 21: CIVIL RIGHTS / Subchapter I: GENERALLY / Section 1983: Civil action for deprivation of rights'
                  breadcrumb:
                  - type: title
                    num: '42'
                    label: Title 42
                    name: THE PUBLIC HEALTH AND WELFARE
                  - type: chapter
                    num: '21'
                    label: Chapter 21
                    name: CIVIL RIGHTS
                  - type: subchapter
                    num: I
                    label: Subchapter I
                    name: GENERALLY
                  - type: section
                    num: '1983'
                    label: Section 1983
                    name: Civil action for deprivation of rights
                  parent:
                    corpusType: USC
                    titleNumber: 42
                    chapter: '21'
                  subchapter: I
                  subchapterName: GENERALLY
                  popularName: Public Health and Welfare
                  actStatus: in_force
                  goodLawStatus: good_law
                  renumberedTo: ''
                  transferredTo: ''
                  sourceCredit: R.S. §1979; Pub. L. 96–170, §1, Dec. 29, 1979, 93 Stat. 1284; Pub. L. 104–317, title III, §309(c), Oct. 19, 1996, 110 Stat. 3853.
                  amendmentYears:
                  - 1996
                  - 1979
                  lastAmendedYear: 1996
                  amendmentsCount: 2
                  currentThrough: '2026-09-02'
                  publicLaws:
                  - Pub. L. 104-317
                  - Pub. L. 96-170
                  textUrl: https://statutes-us.vaquill.ai/usc/olrc/119-103/sections/USC_T42_C21_S1983.txt
                  externalUrl: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section1983&num=0&edition=prelim
                  sourceUrl: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section1983&num=0&edition=prelim
                processingTimeMs: 7.0
                creditsConsumed: 2.0
        '400':
          description: '`state` or `corpusType` is outside the accepted set. The credits for the call are refunded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '401':
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '402':
          description: Insufficient credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - US Statutes
      summary: Resolve many citations at once
      description: 'Resolve up to 50 Bluebook citations to their exact sections in one call.


        The batch form of `GET /us/statutes/resolve`, and the same verdict per

        citation. Use it when you are checking the citations in a document rather than

        looking one up: a brief, a memo, or a model''s output typically carries dozens,

        and the single-citation route makes that dozens of round trips.


        **Cost**: 2 credits per citation, the same as resolving them one at a time.

        Batching buys a round trip and latency, not a discount. Unresolved citations

        are charged (a confident "this does not resolve" is the answer you are paying

        for when verifying a model''s output); only citations we failed to process

        because of a backend error are refunded, and `creditsConsumed` reports what was

        actually billed.


        **Duplicates are collapsed** before pricing and before the response is built,

        so sending the same citation twice costs once and returns one entry.


        **Every input gets an entry.** An unresolved citation appears with

        `resolved: false`, never as an omission: a caller checking thirty citations

        needs to know WHICH failed, and a shorter array cannot say that.


        ## Example


        ```python

        requests.post(url, headers=h, json={

        "citations": [

        "42 U.S.C. 1983",

        "16 C.F.R. 444.1",

        "Cal. Civ. Code 1950.5",

        ],

        })

        ```


        Scope the whole batch with `state` or `corpusType` when every citation belongs

        to one jurisdiction or corpus (`22 CCR 76227` is California and `8 CCR 1206-2`

        is Colorado; the acronym alone cannot say which). Omit both for a batch that

        spans jurisdictions and let each citation name its own.


        A citation to a STATE session law (an act as enacted, for example `CHAPTER 2025-12` or `S.F.No. 1552`) names no code section, so `resolved` stays `false` and `section` stays `null`. The law is described in `sessionLaw`, beside `matchedCorpus: "session_law"`, with an `href` to read it under `/us/session-laws`, and enough to answer what it is and when it took effect without a second call: `title`, `billNumber`, `approvedDate`, `effectiveFirst` and `effectiveLast` (null when the publisher prints no effective date), `enactmentOutcome` and `sourceUrl`, the government publisher''s own text. A citation naming several laws comes back `ambiguous` with every candidate and none chosen for you. A `state` scope applies to session laws; a `corpusType` scope excludes them. No extra charge, and a citation that resolves to a section is never checked against session laws. A citation that names no state is matched against every state''s laws, so at most 6 of them are checked per call: the others carry no `sessionLaw` block, which says nothing about whether the law exists. Name the state, or send the rest in another call.'
      operationId: resolve_statute_citations_batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatuteResolveBatchRequest'
      responses:
        '200':
          description: One verdict per submitted citation, in order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatuteResolveBatchResponse'
        '401':
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '402':
          description: Insufficient credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '422':
          description: Empty `citations`, more than 50, or a bad `state`/`corpusType`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
    servers:
    - url: https://api.vaquill.ai
      description: Production
  /api/v1/us/statutes/section/{act_id}/related:
    get:
      tags:
      - US Statutes
      summary: Get the sections around this one
      description: 'The sections immediately before and after a given section, in statutory order.


        **Cost**: 2 credits. Not-found and failed lookups are not charged.


        Search cannot answer "what comes next", because relevance ranking is not

        statutory order: the definitions a section relies on usually sit a few sections

        back and its exceptions a few forward.


        Neighbours never cross the containing chapter (or, where a section has no

        chapter, the containing title or state code), so you get the sections a reader

        would actually turn to, not the numerically adjacent row from an unrelated part

        of the corpus.


        Ordering is natural, not lexicographic: `9` before `10`, `240.9` before

        `240.10`, `1983` before `1983a`.'
      operationId: get_section_neighbors_api_v1_us_statutes_section__act_id__related_get
      parameters:
      - name: act_id
        in: path
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 200
          description: 'Section identifier, e.g. `USC_T42_C21_S1983` (Title 42, Chapter 21, Section 1983, which a lawyer writes as 42 U.S.C. § 1983). Take it from a `/us/statutes/search` or `/us/statutes/resolve` result.


            A citation also works here: `26 U.S.C. § 1`, `42 USC 1983` or `Cal. Civ. Code § 1950.5` is resolved with the same resolver `/resolve` uses, and the section is served. A citation costs this endpoint''s price PLUS the `/resolve` price (2 credits), charged as its own line whether or not it resolves, exactly as `/resolve` charges; that is the same total as calling `/resolve` and then this endpoint, in one round trip. An exact act_id costs only this endpoint''s price. When a citation resolves, or when the id only matched after surrounding whitespace, quotes or a trailing period were removed, the response carries `resolvedFrom` saying what your input was matched as. Check it the way you would check a `/resolve` answer. A citation containing `/` cannot travel in a URL path segment; resolve it with `GET /us/statutes/resolve` instead.


            Do not assemble an id from a citation: the title and section are derivable, but the CHAPTER is not, so `USC_T26_S1` misses. A miss returns 404 with `reason` and, where the section exists under another id, `didYouMean`.


            State session laws (acts as enacted, ids starting `SSL_`) are not code sections: read them at `/us/session-laws/{sessionLawId}`.'
          examples:
          - USC_T42_C21_S1983
