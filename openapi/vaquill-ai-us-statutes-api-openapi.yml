    StatuteResolveResponse:
      properties:
        resolved:
          type: boolean
          title: Resolved
          description: True when the citation resolved to an exact section.
        inputCitation:
          type: string
          title: Inputcitation
          description: The citation string you asked to resolve, echoed back.
        section:
          anyOf:
          - $ref: '#/components/schemas/StatuteResult'
          - type: 'null'
          description: The resolved section, or null when the citation did not resolve.
        subsection:
          anyOf:
          - type: string
          - type: 'null'
          title: Subsection
          description: 'Parsed pinpoint subsection when the citation carried one, e.g. ''b.2'' for ''42 U.S.C. 1983(b)(2)''. The returned section is the parent. It is also set when the citation names a unit SMALLER than the one the publisher issues: Rhode Island cites a regulation by section (''250-RICR-120-05-15.2'') but publishes the whole Part, so `section` is Part 15 and `subsection` is ''15.2''. A non-null `subsection` always means `section` is the containing document, not the exact unit you cited.'
        citationOutsideFilters:
          anyOf:
          - $ref: '#/components/schemas/CitationOutsideFilters'
          - type: 'null'
          description: 'Set only when `resolved` is false because your `state` or `corpusType` scope excludes a section this citation DOES name, e.g. `42 U.S.C. 1983` under `state=ca`. The scope is a constraint, so the verdict stays `resolved: false`; this says why, so an unresolved result is not read as ''no such section''. Retry without the scope named in `excludedBy` to resolve it. No extra charge.'
        matchedCorpus:
          anyOf:
          - type: string
            const: session_law
          - type: 'null'
          title: Matchedcorpus
          description: Present only when the citation names a STATE session law (an act as enacted, for example `CHAPTER 2025-12` or `S.F.No. 1552`) rather than a code section. `resolved` stays false and `section` stays null, because both describe a code section; the law is in `sessionLaw`.
        sessionLaw:
          anyOf:
          - $ref: '#/components/schemas/SessionLawCitationMatch'
          - type: 'null'
          description: The state session law this citation names, when it names no code section. `status` is `matched` (one law, read it at `href`) or `ambiguous` (several, all in `candidates`, none chosen for you). Absent when the citation resolved to a section, and whenever session laws cannot be checked. No extra charge.
        processingTimeMs:
          type: number
          title: Processingtimems
          description: Server-side time for this request in milliseconds, excluding network transit. Useful for spotting a slow query; not billed on.
          default: 0.0
          examples:
          - 240.5
        creditsConsumed:
          type: number
          title: Creditsconsumed
          description: 'Credits actually charged for this call. Read it rather than assuming the list price: failed and refunded work bills 0, and batch endpoints charge per item returned, so a partial result costs less than a full one.'
          default: 0.0
          examples:
          - 4
      type: object
      required:
      - resolved
      - inputCitation
      title: StatuteResolveResponse
      description: Response for `GET /us/statutes/resolve`.
    SessionLawSession:
      properties:
        code:
          type: string
          title: Code
          description: Session code, `{year}{type}{ordinal}`. `type` is `R` regular, `S` special, `X` extraordinary, `F` fiscal, `V` veto, `U` unknown. A regular session has no ordinal (`2025R`); a numbered special session carries it (`2025S1`, the first special session of 2025); a lettered one carries its letter (`2025SC`, Florida's Special Session C). `year` is the year the publisher numbers the session by, which for a period spanning two years is the first (District of Columbia Council Period 25 is `2023R`). Pass it as `session` to `GET /us/session-laws/list`.
