    StatuteResolveBatchRequest:
      properties:
        citations:
          items:
            type: string
          type: array
          maxItems: 500
          minItems: 1
          title: Citations
          description: 'Bluebook citation strings to resolve. Duplicates are collapsed FIRST and order is preserved, so the response''s `results` array lines up with the de-duplicated input.


            The cap is **50 UNIQUE citations, applied after that collapse**, so a brief quoting one section sixty times is one citation and is accepted. 500 is the raw list ceiling, which exists so an unbounded list of duplicates cannot make us walk it.


            Priced PER CITATION at the single-resolve rate, exactly like `POST /us/statutes/sections`: batching is a round-trip and latency win, not a discount. Thirty citations cost the same 60 credits either way and take one request instead of thirty.'
          examples:
          - - 42 U.S.C. 1983
            - 16 C.F.R. 444.1
            - Cal. Civ. Code 1950.5
        state:
          anyOf:
          - type: string
            enum:
            - federal
            - al
            - ak
            - az
            - ar
            - ca
            - co
            - ct
            - de
            - dc
            - fl
            - ga
            - gu
            - hi
            - id
            - il
            - in
            - ia
            - ks
            - ky
            - la
            - me
            - md
            - ma
            - mi
            - mn
            - ms
            - mo
            - mt
            - ne
            - nv
            - nh
            - nj
            - nm
            - ny
            - nc
            - nd
            - mp
            - oh
            - ok
            - or
            - pa
            - pr
            - ri
            - sc
            - sd
            - tn
            - tx
            - ut
            - vt
            - va
            - wa
            - wv
            - wi
            - wy
            maxLength: 7
            minLength: 2
          - type: 'null'
          title: State
          description: 'Optional jurisdiction to resolve every citation WITHIN: a two-letter state code, or `federal` for the U.S. Code, the C.F.R., federal rules and the U.S. Constitution. Applies to the whole batch: a batch spanning jurisdictions should omit it and let each citation name its own. Same semantics as the single-citation route -- a constraint, not a hint.'
          examples:
          - ca
        corpusType:
          anyOf:
          - type: string
            enum:
            - CONSTITUTION
            - REGULATION
            - STATE
            - STATE_CONSTITUTION
            - STATE_RULES
          - type: 'null'
          title: Corpustype
          description: 'Optional corpus to resolve every citation WITHIN: `STATE` (statutory text, federal or state), `REGULATION` (administrative codes), `STATE_RULES` (court rules), `CONSTITUTION` (constitutional text), `STATE_CONSTITUTION` (constitutional text; a synonym of `CONSTITUTION` here, since `state` is what separates the two). Same semantics as the single-citation route.'
          examples:
          - REGULATION
      additionalProperties: false
      type: object
      required:
      - citations
      title: StatuteResolveBatchRequest
      description: 'Batch citation resolution. See `POST /us/statutes/resolve`.


        `/resolve` took 1,159 calls in the 16 days to 2026-08-31, second only to

        search, and every one of them carried a single citation. The caller shape it

        is actually serving is an agent handed a brief, a memo or a model''s output

        with thirty citations in it, doing thirty round trips to check them.'
    BodyFigure:
      properties:
