  /api/v1/us/statutes/section/{act_id}/enactments:
    get:
      tags:
      - US Statutes
      summary: Which acts a state publisher lists against this section
      description: 'The state session laws a publisher''s own tables list against one code section: which act added,

        amended or repealed it, when the act took effect, and what the publisher printed. Start from a

        section (an `actId` from `/us/statutes/search`, or a citation) and get to the act, then read the

        act at `href`, or its text at `href` plus `/body`.


        **Stage 1, and honest about it.** This reads the code-section TABLES that state publishers print

        against their session laws ("sections affected"), through a reverse lookup. It is never read out of

        the acts'' prose and it is **never a complete amendment history**: only acts we hold, in sessions we

        hold (`coverage.sessionsHeld`), whose table lists the section in the printed form we map. Every row

        says `basis: publisher_sections_affected` and `matchQuality: as_printed`. An empty `enactments` with

        `supported: true` means "no held table lists this section", not "this section was never amended". The

        published `coverage.note` says, per jurisdiction, what is not read: entries printed as lists or ranges

        (`338-15, 21`), with a subsection pincite, or by an act''s own section number are not matched.


        **Where it works.** CA, DC, HI, KY, MO, MS, NE, UT, WA: the jurisdictions where the publisher''s printed form was shown to

        map to our section numbers against real data on both sides, and each section''s stored number must be

        in the form that mapping was proven on. Any other jurisdiction (and any federal, regulation or

        constitution section) answers `supported: false`, an empty list, a `reason` and a `coverage.note`,

        and is **not charged**. A wrong match is worse than a miss, so equality is on the whole number after

        folding case, spacing, dashes and the section sign: `71-24,104` does not match `71-24,10`, and `3` does

        not match `3.1`. Where a publisher qualifies a section by code (California, Hawaii, DC) the printed code

        must match too.


        **Cost**: 1 credit. A section that does not exist is not charged. A supported section whose

        answer is empty IS charged: "no held table lists it" is the answer you paid for, as an empty history

        is on `/us/statutes/section/{actId}/changes`. An unsupported jurisdiction or section is refunded, and

        so is any failure on our side (503, 500). `creditsConsumed` reports what was billed. A citation in

        place of the id also pays the `/resolve` price, whether or not it resolves.


        **What a row says.** `sessionLawId` and `href` name the act; `action` is the normalised

        `added | amended | repealed | renumbered | other`, mapped only where the publisher''s legend is settled

        and `other` otherwise (Nebraska prints no action; Mississippi''s `BF` is "brought forward", not a

        change), and `actionAsPrinted` is always the publisher''s own code. `effectiveDates` are the ACT''s

        dates, as printed, not necessarily this section''s. `sectionAsPrinted`, `codeAsPrinted` and

        `actSectionAsPrinted` are verbatim. Rows are newest act first and one per printed entry: an act that

        lists the section twice appears twice. `truncated` is true past 200 rows.


        **Example**


        ```bash

        curl "https://api.vaquill.ai/api/v1/us/statutes/section/STATE_MS_T27_C71_S27-71-5/enactments" \

        -H "Authorization: Bearer $VAQUILL_API_KEY"

        ```


        **Related endpoints**


        - `GET /us/statutes/section/{actId}/changes` is what our refreshes observed to the section.

        - `GET /us/session-laws/{sessionLawId}` reads an act from `href`; `/body` reads its text.

        - `GET /us/statutes/coverage` says which sessions we hold and how complete each is, in each

        jurisdiction''s `sessionLaws` block.'
      operationId: get_section_enactments_api_v1_us_statutes_section__act_id__enactments_get
      parameters:
      - name: act_id
        in: path
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 200
          description: 'Section identifier, e.g. `USC_T42_C21_S1983` (Title 42, Chapter 21, Section 1983, which a lawyer writes as 42 U.S.C. § 1983). Take it from a `/us/statutes/search` or `/us/statutes/resolve` result.


            A citation also works here: `26 U.S.C. § 1`, `42 USC 1983` or `Cal. Civ. Code § 1950.5` is resolved with the same resolver `/resolve` uses, and the section is served. A citation costs this endpoint''s price PLUS the `/resolve` price (2 credits), charged as its own line whether or not it resolves, exactly as `/resolve` charges; that is the same total as calling `/resolve` and then this endpoint, in one round trip. An exact act_id costs only this endpoint''s price. When a citation resolves, or when the id only matched after surrounding whitespace, quotes or a trailing period were removed, the response carries `resolvedFrom` saying what your input was matched as. Check it the way you would check a `/resolve` answer. A citation containing `/` cannot travel in a URL path segment; resolve it with `GET /us/statutes/resolve` instead.


