            - CFR_ANNUAL
            - USC_ANNUAL
          - items:
              type: string
              enum:
              - USC
              - CFR
              - STATE
              - CONSTITUTION
              - FEDERAL_RULES
              - FEDERAL_LOCAL_RULES
              - STATE_CONSTITUTION
              - STATE_RULES
              - EXECUTIVE_ACTION
              - REGULATION
              - FEDERAL_REGISTER
              - FEDERAL_REGISTER_NOTICE
              - AGENCY_GUIDANCE
              - SENTENCING_GUIDELINES
              - US_TAX_TREATY
              - STATE_AGENCY_GUIDANCE
              - STATE_AG_OPINION
              - SESSION_LAW
              - STATUTE_COMPILATION
              - AGENCY_ADJUDICATION
              - CFR_ANNUAL
              - USC_ANNUAL
            type: array
          - type: 'null'
          title: Corpustype
          description: 'Restrict to one corpus, or to several by passing a list (`"corpusType": ["USC", "CFR"]`). One of: `USC` (United States Code), `CFR` (Code of Federal Regulations), `STATE` (state statutory codes; call `/us/statutes/coverage` for the list of ingested jurisdictions), `CONSTITUTION` (U.S. Constitution), `FEDERAL_RULES` (FRCP / FRCrP / FRE / FRAP / FRBP), `STATE_CONSTITUTION` (state constitutions; call `/us/statutes/coverage` for the current jurisdiction list), `STATE_RULES` (state court rules; see `/us/statutes/coverage`), `EXECUTIVE_ACTION` (Federal Register Presidential Documents), `REGULATION` (state administrative regulations; pair with `state`), `FEDERAL_REGISTER` (Federal Register agency rules, final and proposed), `AGENCY_GUIDANCE` (sub-regulatory federal agency guidance, 53 named sources spanning the tax, banking, securities, labor, immigration, health-privacy, export-control, intellectual-property, antitrust, energy and communications agencies; each is independently filterable with `source`, which lists them all), `STATE_AGENCY_GUIDANCE` (state-issued regulatory guidance, currently state Department of Insurance bulletins and circular letters; pair with `state`, and see `/us/statutes/coverage`), `SENTENCING_GUIDELINES` (US Sentencing Guidelines Manual), `US_TAX_TREATY` (US income tax treaties and protocols), `SESSION_LAW` (US Statutes at Large: federal public and private laws AS ENACTED, 1789 to date. This is the source the US Code is compiled from, so a section''s `publicLawCites` resolve here to the enacting text; call `/us/statutes/coverage` for the live section count). Omit to search across all corpora. The `enum` on this field is the complete token list, and `/us/statutes/coverage` serves a one-line description of each in its legend.'
          examples:
          - CFR
        state:
          anyOf:
