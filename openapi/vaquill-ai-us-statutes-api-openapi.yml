  /api/v1/us/statutes/divisions:
    get:
      tags:
      - US Statutes
      summary: Browse the statutory hierarchy
      description: 'Walk the statutory tree one level at a time, in statutory order. Each call

        returns the immediate children of wherever you are, so you can enumerate a code

        top to bottom without searching.


        **Cost**: 1 credit. A request whose filters do not fit the corpus is

        rejected before anything is charged. A filter naming a container that does not

        exist is refunded, and so is a browse that returns no rows, so exploring the

        hierarchy never costs you anything for a level that turns out to be empty.


        Pass the deepest level you already know; the response returns the level below it:


        - `corpusType=USC` -> the titles

        - `corpusType=USC&titleNumber=42` -> the chapters in Title 42

        - `corpusType=USC&titleNumber=42&chapter=21` -> the sections in Chapter 21 (leaf)

        - `corpusType=CFR&titleNumber=17&part=240` -> the sections in Part 240 (leaf)

        - `corpusType=STATE&state=tx` -> the state''s codes

        - `corpusType=STATE&state=tx&code=tx_pe` -> the chapters in the Texas Penal Code

        - `corpusType=STATE&state=ny&code=ny_jud&article=2` -> the sections in a New York article (leaf)

        - `corpusType=CONSTITUTION` -> the articles and amendments of the US Constitution

        - `corpusType=CONSTITUTION&article=Article III` -> the sections of Article III (leaf)

        - `corpusType=STATE_CONSTITUTION&state=nm` -> the articles of the New Mexico Constitution

        - `corpusType=FEDERAL_RULES` -> the rule sets (FRCP, FRE, FRCrP, ...)

        - `corpusType=FEDERAL_RULES&code=frcp` -> the Federal Rules of Civil Procedure (leaf)


        Interior nodes carry a `sectionCount` and `isLeaf: false`; drill into one by

        passing its `identifier` back as the filter its `kind` names (`title` ->

        `titleNumber`, `chapter`, `part`, `code`, `article`). Leaf nodes are sections

        and carry an `actId` for `/us/statutes/section/{actId}`. Browse supports `USC`,

        `CFR`, `STATE`, `REGULATION`, `CONSTITUTION`, `STATE_CONSTITUTION` and

        `FEDERAL_RULES`, which is also what `browsable` says on each

        `GET /us/statutes/coverage` legend entry. The rest are dated series or share no

        tree, so use `/us/statutes/search` for those.


        Federal rules are published twice: by the Judicial Conference at uscourts.gov

        (`frcp`, `fre`, ...) and as an appendix to the U.S. Code (`uscapp_t28a_fre`,

        ...). Each is its own rule set here, so neither is listed twice under one heading.'
