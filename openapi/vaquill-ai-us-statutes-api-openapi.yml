        sourceUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourceurl
          description: The government publisher's own URL for the act's text, so a citation answer links to the primary source. Null when we hold no text source from a government host. Null when ambiguous.
          examples:
          - https://www.revisor.mn.gov/laws/2025/0/Session+Law/Chapter/1/
        href:
          anyOf:
          - type: string
          - type: 'null'
          title: Href
          description: Where to read the law, relative to the API host. Null when ambiguous.
          examples:
