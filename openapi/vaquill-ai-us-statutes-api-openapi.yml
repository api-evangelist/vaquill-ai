  /api/v1/us/statutes/section/{act_id}/cross-state:
    get:
      tags:
      - US Statutes
      summary: Compare this provision against other states
      description: 'Provisions in other states that address the same subject as a given state

        statute section.


        **Cost**: 6 credits. Not-found, failed lookups, and sections outside the state

        statute corpus are not charged.


        Every state words and numbers its provisions differently, so comparing a rule

        across jurisdictions normally means running one search per state and reconciling

        the results by hand. This starts from one section you already have and returns

        the comparable provision elsewhere.


        **At most one provision per state**, most similar first, so the response reads

        as a jurisdiction comparison rather than a relevance list. `statesCovered` tells

        you how many distinct states are represented.


        **Scope**: state statute sections. USC, CFR, regulations and court rules return

        empty with a `note`, refunded, since a federal section has no state analogue by

        definition.


        **What `similarity` is**: a retrieval score between 0 and 1, describing how

        closely two provisions read. It is not a legal opinion. A high score means the

        provisions cover the same ground, never that they impose the same obligation,

        and the differences are usually the point. Treat this as the shortlist to read,

        not the answer.'
      operationId: get_section_cross_state_api_v1_us_statutes_section__act_id__cross_state_get
      parameters:
      - name: act_id
        in: path
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 200
          description: 'Section identifier, e.g. `USC_T42_C21_S1983` (Title 42, Chapter 21, Section 1983, which a lawyer writes as 42 U.S.C. § 1983). Take it from a `/us/statutes/search` or `/us/statutes/resolve` result.


            A citation also works here: `26 U.S.C. § 1`, `42 USC 1983` or `Cal. Civ. Code § 1950.5` is resolved with the same resolver `/resolve` uses, and the section is served. A citation costs this endpoint''s price PLUS the `/resolve` price (2 credits), charged as its own line whether or not it resolves, exactly as `/resolve` charges; that is the same total as calling `/resolve` and then this endpoint, in one round trip. An exact act_id costs only this endpoint''s price. When a citation resolves, or when the id only matched after surrounding whitespace, quotes or a trailing period were removed, the response carries `resolvedFrom` saying what your input was matched as. Check it the way you would check a `/resolve` answer. A citation containing `/` cannot travel in a URL path segment; resolve it with `GET /us/statutes/resolve` instead.


            Do not assemble an id from a citation: the title and section are derivable, but the CHAPTER is not, so `USC_T26_S1` misses. A miss returns 404 with `reason` and, where the section exists under another id, `didYouMean`.


            State session laws (acts as enacted, ids starting `SSL_`) are not code sections: read them at `/us/session-laws/{sessionLawId}`.'
          examples:
          - USC_T42_C21_S1983
          title: Act Id
        description: 'Section identifier, e.g. `USC_T42_C21_S1983` (Title 42, Chapter 21, Section 1983, which a lawyer writes as 42 U.S.C. § 1983). Take it from a `/us/statutes/search` or `/us/statutes/resolve` result.


          A citation also works here: `26 U.S.C. § 1`, `42 USC 1983` or `Cal. Civ. Code § 1950.5` is resolved with the same resolver `/resolve` uses, and the section is served. A citation costs this endpoint''s price PLUS the `/resolve` price (2 credits), charged as its own line whether or not it resolves, exactly as `/resolve` charges; that is the same total as calling `/resolve` and then this endpoint, in one round trip. An exact act_id costs only this endpoint''s price. When a citation resolves, or when the id only matched after surrounding whitespace, quotes or a trailing period were removed, the response carries `resolvedFrom` saying what your input was matched as. Check it the way you would check a `/resolve` answer. A citation containing `/` cannot travel in a URL path segment; resolve it with `GET /us/statutes/resolve` instead.


          Do not assemble an id from a citation: the title and section are derivable, but the CHAPTER is not, so `USC_T26_S1` misses. A miss returns 404 with `reason` and, where the section exists under another id, `didYouMean`.


          State session laws (acts as enacted, ids starting `SSL_`) are not code sections: read them at `/us/session-laws/{sessionLawId}`.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 25
          minimum: 1
          description: Maximum states to return, one provision each.
          examples:
          - 5
          default: 5
          title: Limit
        description: Maximum states to return, one provision each.
      responses:
        '200':
          description: The section plus comparable provisions in other states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatuteCrossStateResponse'
        '401':
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '402':
          description: Insufficient credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '404':
          description: Section not found. `reason` says why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatuteSectionNotFoundError'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.vaquill.ai
      description: Production
components:
  schemas:
    ApiFieldError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Loc
          description: 'Where the bad value is: `body`, `query` or `path`, then the parameter name exactly as you send it (camelCase), then list indexes. A bare `["body"]` means the body as a whole was not a JSON object.'
          examples:
          - - body
            - corpusType
        msg:
          type: string
          title: Msg
          description: What is wrong with the value, in plain English.
          examples:
          - Input should be 'USC', 'CFR' or 'STATE'
        type:
          type: string
          title: Type
          description: Machine-readable error kind, e.g. `missing`, `literal_error`, `json_invalid`.
          examples:
          - literal_error
      type: object
      required:
      - loc
      - msg
      - type
      title: ApiFieldError
      description: One rejected field in a 422 response.
    UsCorpusTypeInfo:
      properties:
        token:
          type: string
          title: Token
          description: The `corpusType` value to pass to `/us/statutes/search`.
          examples:
          - REGULATION
        description:
          type: string
          title: Description
          description: What this corpus contains.
        scope:
          type: string
          enum:
          - federal
          - state
          title: Scope
          description: '`federal` corpora appear under the `federal` jurisdiction; `state` corpora are scoped per state (pair with the `state` filter).'
        browsable:
          type: boolean
          title: Browsable
          description: Whether `GET /us/statutes/divisions` can walk this corpus level by level (titles, chapters, parts, codes, articles, rule sets). False for dated series such as the Federal Register and executive actions, and for corpora with no shared tree such as agency guidance. Every corpus is searchable either way; this only says whether you can NAVIGATE it instead of querying it.
          default: false
          examples:
          - true
        scopeNote:
          anyOf:
          - type: string
          - type: 'null'
          title: Scopenote
          description: 'Present ONLY when we hold part of a corpus rather than all of it, and then it names both what is held and what is not. Null means no class-level exclusion applies. It is a STRUCTURED completeness claim, deliberately separate from `description` (prose a caller cannot act on). It says nothing about how recently the corpus was refreshed, a different fact: a filtered corpus can be, and `FEDERAL_REGISTER_NOTICE` is, refreshed weekly. `GET /boards` answers that one.'
          examples:
          - 'Held: notices withdrawing a proposed rule ... About 2.4% of Federal Register notices. Not held: Paperwork Reduction Act information collections ...'
        sourceScopeNotes:
          additionalProperties:
            type: string
          type: object
          title: Sourcescopenotes
          description: Scope statements for INDIVIDUAL sources inside this token, keyed by the `source` value you can filter on. `scopeNote` is the right unit for a token that is one corpus; it is the wrong unit for `AGENCY_GUIDANCE`, which fans out to more than thirty unrelated sources, so a partial source declares its own coverage here rather than describing every sibling. Empty when every source under this token is held whole.
          examples:
          - cms_iom: 'Held: the 204 chapter, appendix and exhibit documents ... Not held ... Pub. 100-12 (State Medicaid Manual) ... publish no chapters at all ...'
      type: object
      required:
      - token
      - description
      - scope
      title: UsCorpusTypeInfo
      description: 'One entry in the coverage legend: what a `corpusType` token means.'
    StatuteResolveBatchResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/StatuteResolveBatchItem'
          type: array
          title: Results
          description: 'One entry per de-duplicated input citation, in the order supplied. An unresolved citation is an entry with `resolved: false`, never an omission: a caller checking thirty citations needs to know which of them failed, and a shorter array cannot say.'
        resolvedCount:
          type: integer
          title: Resolvedcount
          description: How many of the submitted citations resolved to a code section. A citation answered only by a `sessionLaw` block is not counted.
          default: 0
          examples:
          - 2
        count:
          type: integer
          title: Count
          description: Total entries in `results`, after de-duplication.
          default: 0
          examples:
          - 3
        processingTimeMs:
          type: number
          title: Processingtimems
          description: Server-side time for this request in milliseconds.
          default: 0.0
          examples:
          - 610.2
        creditsConsumed:
          type: number
          title: Creditsconsumed
          description: 'Credits actually charged. Read it rather than multiplying the list price by your input length: a backend failure on some citations refunds those, so this can be lower than 2 x `count`.'
          default: 0.0
          examples:
          - 6
      type: object
      title: StatuteResolveBatchResponse
      description: Response for `POST /us/statutes/resolve`.
    FrRelatedDocument:
      properties:
        actId:
          type: string
          title: Actid
        citation:
          anyOf:
          - type: string
          - type: 'null'
          title: Citation
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: The related document's own title/heading, when known.
        documentType:
          anyOf:
          - type: string
          - type: 'null'
          title: Documenttype
          description: '`proposed_rule`, `final_rule`, or the raw Federal Register category otherwise.'
        publicationDate:
          anyOf:
          - type: string
          - type: 'null'
          title: Publicationdate
          description: Federal Register publication date (ISO 8601 date), when known.
      type: object
      required:
      - actId
      title: FrRelatedDocument
      description: 'One other Federal Register document sharing a RIN with this one.


        A Regulation Identifier Number (RIN) tracks one regulatory action through

        its lifecycle -- a proposed rule, its final rule, and any later

        corrections all carry the same RIN. This is what answers "what happened

        to this proposed rule": look up its RIN''s other documents.'
    StatuteSearchRequest:
      properties:
        query:
          type: string
          maxLength: 500
          minLength: 2
          title: Query
          description: Search query in natural language.
          examples:
          - insider trading penalties
        corpusType:
