              - sd
              - tn
              - tx
              - ut
              - vt
              - va
              - wa
              - wv
              - wi
              - wy
            type: array
          - type: 'null'
          title: State
          description: 'Jurisdiction filter. A 2-letter code for one of the 52 supported US jurisdictions (50 states + DC + PR), or `federal` to scope to USC / CFR / Constitution / federal rules. Pass a LIST to search several at once (`"state": ["ca", "ny", "tx"]`), which is one call instead of one per jurisdiction. Case-insensitive: `ca` and `CA` both work. An unrecognized value is rejected with 422 rather than silently matching nothing. Omit to search every jurisdiction.'
          examples:
          - ca
        code:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          title: Code
          description: 'Restrict to specific state statutory codes, e.g. `tx_pe` for the Texas Penal Code. Values are the `identifier`s returned by `GET /us/statutes/divisions?corpusType=STATE&state=XX`, so the browse output can be fed straight back in. Pass a list to search several codes, across states if you like (`["tx_pe", "ca_pen"]`). This is the only way to scope below a whole jurisdiction: `state=tx` alone searches every Texas code at once.


            With `corpusType=FEDERAL_RULES`, a value can instead be a federal rule set as `GET /us/statutes/divisions?corpusType=FEDERAL_RULES` lists it: `frcp`, `fre`, `frcpsuppadm`, or an appendix copy such as `uscapp_t28a_fre`. Without that corpusType a bare `frcp` is refused, because it cannot be told apart from a state code missing its state.'
          examples:
          - tx_pe
        article:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          title: Article
          description: 'Scope a search to one or more articles. On `CONSTITUTION` and `STATE_CONSTITUTION` this is the article label as `GET /us/statutes/divisions` lists it (`Amendment XIV`, `Article IV`, `Preamble`). On `STATE` / `REGULATION` it is the article of a code divided by article instead of chapter, such as New York (`2-A` in `ny_jud`). This is the search side of `parent.article`: pass a hit''s `parent` straight back to search within its article.


            Pass the `identifier` exactly as the listing returned it; a case slip such as `amendment xiv` also matches. Article labels repeat, so `article` needs a `corpusType` from one of those two families, `STATE_CONSTITUTION` also needs `state`, and `STATE` / `REGULATION` need the `code`. A request missing one is refused with 422 before anything is charged. String or list.'
          examples:
          - Amendment XIV
        yearFrom:
          anyOf:
          - type: integer
            maximum: 2100.0
            minimum: 1700.0
          - type: 'null'
          title: Yearfrom
          description: 'Only return sections dated in or after this year. Combine with `yearTo` for a window. A section matches on the first of three years it carries: the most recent amendment the publisher credits in its own history note; else its effective year, for a section adopted once and never amended; else, for corpora dated by publication rather than amendment (Federal Register proposed rules, agency guidance, adjudications, the treaty record), the document''s own publication or issue year. Every one of those tracks the LAW or the document, never when we last rebuilt the corpus. A section carrying none of the three is excluded once either bound is set, so an unbounded search returns strictly more.'
          examples:
          - 2020
        yearTo:
          anyOf:
          - type: integer
            maximum: 2100.0
            minimum: 1700.0
          - type: 'null'
          title: Yearto
          description: 'Only return sections dated in or before this year, on the same three years `yearFrom` describes. Note it filters the LAST such date, so a section amended in 2025 is excluded by `yearTo=2024` even though it existed in 2024. This is a currency filter, not point-in-time retrieval: the corpus holds one current text per citation.'
          examples:
          - 2026
        excludeRepealed:
          type: boolean
          title: Excluderepealed
          description: 'Drop sections whose own status says they are no longer operative: repealed, renumbered, transferred, recodified, rescinded, revoked, expired, superseded, omitted, reserved, and the rest of the dead and not-operative vocabulary (the full set is the one behind each result''s `goodLawStatus`).


            **This removes what we KNOW is dead. It does not promise the remainder is good law.** A section survives this filter when its status is `in_force` OR when we hold no trustworthy repeal signal for its jurisdiction, and those two are not the same thing. Read `goodLawStatus` on each surviving result to tell them apart: `good_law` is checked, `unknown` is unchecked. Filtering on the status we store and reporting the verdict we derive are deliberately separate, because only the first is indexable.


            **The United States Code is served from a stored annual edition** (`year` 2024, `currentThrough` 2025-01-06), so a section repealed after that edition closed still carries `actStatus: in_force` and survives this filter. Every USC result therefore reports `goodLawStatus: unknown`, which is the honest answer and the one this field''s second paragraph tells you to read. Use `/section/{actId}/changes` for the timeline on a section you depend on.'
          default: false
          examples:
          - true
        actStatus:
          anyOf:
          - type: string
            enum:
            - abolished
            - deleted
            - expired
            - in_force
            - inactive
            - non_precedential
            - not_funded
            - not_yet_effective
            - omitted
            - proposed
            - recodified
            - recompiled
            - rejected
            - relocated
            - removed
            - renumbered
            - repealed
            - rescinded
            - reserved
            - revoked
            - superseded
            - terminated
            - transferred
            - unconstitutional
            - vacant
            - vacated
            - vetoed
            - withdrawn
          - items:
              type: string
              enum:
              - abolished
              - deleted
              - expired
              - in_force
              - inactive
              - non_precedential
              - not_funded
              - not_yet_effective
              - omitted
              - proposed
              - recodified
              - recompiled
              - rejected
              - relocated
              - removed
              - renumbered
              - repealed
              - rescinded
              - reserved
              - revoked
              - superseded
              - terminated
              - transferred
              - unconstitutional
              - vacant
              - vacated
              - vetoed
              - withdrawn
            type: array
          - type: 'null'
          title: Actstatus
          description: 'Positively scope to one or more raw publisher statuses, e.g. `"repealed"` to find only dead law, or `["in_force"]` for only sections affirmatively marked current. This is the inverse of `excludeRepealed` and is what you want for a compliance diff that asks what was LOST rather than what remains.


            Values are the `actStatus` returned on each result. Combining a dead status here with `excludeRepealed: true` contradicts itself and is rejected with 422 rather than silently returning nothing.'
          examples:
          - repealed
        changedSince:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
          format: date
          title: Changedsince
          description: 'Only return sections we have OBSERVED change on or after this date (`YYYY-MM-DD`). This is the sync filter: it turns a lookup API into something a nightly job can poll, without creating a board watch per jurisdiction.


            **These are observed changes, not effective dates.** A refresh compared the publisher against the copy we held and found it different; the date is when we SAW it, an upper bound on when it took effect. It is the same event stream `GET /us/statutes/section/{actId}/changes` serves per section, so a hit here has a history there.


            **Coverage is bounded by capture, not by the age of the law.** Change capture began long after the corpus did, it is per-source, and events are swept at 24 months. An empty result means no captured change in the window, never that nothing was amended.


            Narrow with `corpusType` and `state` for a tighter window: the change set is resolved to concrete sections before the search runs, and a window matching too many sections is rejected with a 422 that says so rather than silently truncating your answer.'
          examples:
          - '2026-08-01'
        agency:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          title: Agency
          description: Federal Register agency slug, e.g. `environmental-protection-agency`. The agency's full name (`Environmental Protection Agency`) or its Federal Register acronym (`EPA`, `e.p.a.`) resolves to the same slug; an acronym the Federal Register gives to more than one agency (`FS`) or a value naming no agency the corpus holds is a 422, never a charge. Pass a list to match any of several. Applies to `FEDERAL_REGISTER` and `EXECUTIVE_ACTION`; other corpora carry no agency, so combining this with them returns nothing.
          examples:
          - environmental-protection-agency
        documentType:
          anyOf:
          - type: string
            enum:
            - final
            - proposed
            - presidential
          - type: 'null'
          title: Documenttype
          description: 'Federal Register document stage: `final` (a rule in force), `proposed` (an NPRM), or `presidential` (a Presidential Document, the `EXECUTIVE_ACTION` corpus). The same distinction appears in each row''s `actId` prefix (`FR_RULE_` vs `FR_PRORULE_`).'
          examples:
          - final
        publishedFrom:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
          format: date
          title: Publishedfrom
          description: 'Only return Federal Register documents published on or after this date (`YYYY-MM-DD`). This is the PUBLICATION date, which is not the same as `yearFrom`: that filters the version year of a section.'
          examples:
          - '2024-01-01'
        publishedTo:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
          format: date
          title: Publishedto
          description: Only return Federal Register documents published on or before this date.
          examples:
          - '2024-12-31'
        titleNumber:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Titlenumber
          description: Filter by USC/CFR title number (e.g., 17 for SEC, 42 for civil rights). Only meaningful for `USC`/`CFR`; ignored for state corpora whose titles are alphabetic (e.g. Texas `pe` = Penal Code).
          examples:
          - 17
        chapter:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          title: Chapter
          description: 'Scope a search to one or more chapters within a title or code, e.g. `21` for USC Title 42 Chapter 21. This is the search-side of the `parent` object on each result: pass a hit''s `parent.chapter` straight back to search that hit''s neighbors. Chapter numbers repeat across titles, so pair it with `titleNumber` (USC) or `code` (state); an unpaired chapter is rejected. String or list.'
          examples:
          - '21'
        part:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          title: Part
          description: 'Scope a search to one or more parts within a title, e.g. `240` for 17 C.F.R. Part 240. The CFR counterpart to `chapter`: pass a hit''s `parent.part` straight back to search within that part. Pair it with `titleNumber`; an unpaired part is rejected. String or list.'
          examples:
          - '240'
        source:
          anyOf:
          - type: string
            enum:
            - administrative_guidance
            - ag_precedent
            - agency_guidance
            - bia_precedent
            - bis_advisory_opinion
            - cfpb_circular
            - cfpb_enforcement_action
            - cfpb_supervisory_guidance
            - cftc_staff_letter
            - cms_iom
            - copyright_circular
            - copyright_compendium
            - cpsc_advisory_opinion
            - cpsc_secg
            - ddtc_commodity_jurisdiction
            - ddtc_guidance
            - dfars
            - dfars_pgi
