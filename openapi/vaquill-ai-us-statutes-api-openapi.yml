    UsStatutesDivisionsResponse:
      properties:
        corpusType:
          type: string
          title: Corpustype
          description: The corpus being walked, echoed back from the request.
          examples:
          - USC
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
          description: The jurisdiction, for state-scoped corpora.
        level:
          type: string
          title: Level
          description: 'Kind of children returned: `titles`, `chapters`, `parts`, `codes`, `articles`, or `sections`.'
        parentLabel:
          anyOf:
          - type: string
          - type: 'null'
          title: Parentlabel
          description: Human label for the container these divisions sit under.
        divisions:
          items:
            $ref: '#/components/schemas/UsDivisionNode'
          type: array
          title: Divisions
          description: The child divisions, in statutory (natural) order.
        count:
          type: integer
          title: Count
          description: Number of divisions returned.
          default: 0
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
          description: 'Opaque token to resume this listing. Present only when `truncated` is true. Pass it back as `cursor` to get the next batch of sections in the same container, and keep going until it comes back null. Treat it as opaque: it encodes a storage position, and building one by hand will not work.


            One ordering caveat. `divisions` is sorted into statutory order WITHIN each response, and pages are walked in storage order, so concatenating pages does not give you one globally sorted list. The union of every page is the complete container; sort it yourself once you hold it all.'
          examples:
          - s~a3f1c2e0-55b1-4a7d-9d02-1f3b6c8e9a44
        truncated:
          type: boolean
          title: Truncated
          description: 'True when this container held more sections than one call can walk, so `divisions` is a PREFIX of its contents rather than all of them. Check it before treating a listing as complete: the level that returns sections is bounded, and a container past that bound previously returned a short list that looked whole. When it is true, narrow the scope (drill into a chapter or part rather than a whole code), or page through it with `nextCursor`.'
          default: false
          examples:
          - false
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
          description: Why the result is empty, when it is. Absent on a normal result. An empty `divisions` with a note is an answer; without one it would be ambiguous between a bad identifier and a level this corpus does not store.
          examples:
          - New York statutes are organized by article, which this corpus does not index.
        processingTimeMs:
          type: number
          title: Processingtimems
          description: Server-side time for this request in milliseconds, excluding network transit. Useful for spotting a slow query; not billed on.
          default: 0.0
          examples:
          - 240.5
        creditsConsumed:
          type: number
          title: Creditsconsumed
          description: 'Credits actually charged for this call. Read it rather than assuming the list price: failed and refunded work bills 0, and batch endpoints charge per item returned, so a partial result costs less than a full one.'
          default: 0.0
          examples:
          - 1
      type: object
      required:
      - corpusType
      - level
      title: UsStatutesDivisionsResponse
      description: Response for `GET /us/statutes/divisions`.
    ApiDetailError:
      properties:
        detail:
          type: string
          title: Detail
          description: 'Human-readable reason, safe to surface to an end user. Branch on the HTTP status rather than on this string: the wording is not part of the contract and may be reworded, but 401 (bad key), 402 (out of credits), 403 (missing scope), 404 (no such resource) and 429 (rate limited) are stable.'
          examples:
          - Insufficient API credits.
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ApiFieldError'
            type: array
          - type: 'null'
          title: Errors
          description: 'Present on 422 only: every field that failed validation.'
      type: object
      required:
      - detail
      title: ApiDetailError
      description: 'Error envelope the API actually returns.


        Every error (400/401/402/403/404/405/422/429/5xx) carries a `detail`

        string, e.g. `{"detail": "Insufficient API credits."}`, on every mount of

        the API. A 422 adds `errors`, one entry per rejected field. Some 404s add

        endpoint-specific diagnosis beside `detail` (the statutes section routes

        add `actId`, `reason` and `didYouMean`); treat unknown keys as optional.'
    SessionLawCitationCandidate:
      properties:
        sessionLawId:
          type: string
          title: Sessionlawid
          description: Permanent identifier. Pass it to `GET /us/session-laws/{sessionLawId}`.
          examples:
          - SSL_MN_2025R_G_Y2025_C1
        citation:
          anyOf:
          - type: string
          - type: 'null'
          title: Citation
          description: Canonical citation for the act.
          examples:
          - CHAPTER 1--S.F.No. 1552
        jurisdiction:
          type: string
          title: Jurisdiction
          description: Two-letter state code.
          examples:
          - mn
        session:
          $ref: '#/components/schemas/SessionLawSession'
          description: The session the law was enacted in.
        textStatus:
          type: string
          enum:
          - held
          - withheld
          - not_held
          - pending
          title: Textstatus
          description: '`held`: the text is served. `withheld`: the law is listed but its text is withheld, see the law itself for why. `not_held` and `pending`: no text yet.'
          examples:
          - held
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: The act's title, as the publisher prints it (usually `An act relating to ...`). Null when none is printed.
          examples:
          - An act relating to agriculture; modifying financial reporting requirements for grain buyers; amending Minnesota Statutes 2024, section 223.17, subdivision 6.
        billNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Billnumber
          description: The bill the act originated as, as the publisher prints it. Null when none is printed.
          examples:
          - S.F.No. 1552
        approvedDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Approveddate
          description: Date the governor (or the equivalent authority) approved the act, ISO 8601. Never an effective date. Null when none is printed.
          examples:
          - '2025-03-17'
        effectiveFirst:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effectivefirst
          description: 'Earliest of the act''s effective dates we hold, ISO 8601. Null when we hold none: a date the publisher does not print, or prints as a relative rule, is not guessed. Read every date from `effectiveDates` on `GET /us/session-laws/{sessionLawId}`.'
          examples:
          - '2025-09-01'
        effectiveLast:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effectivelast
          description: 'Latest of the act''s effective dates we hold, ISO 8601: equal to `effectiveFirst` when the act takes effect on one date. Null when we hold none.'
          examples:
          - '2025-09-01'
        enactmentOutcome:
          anyOf:
          - type: string
          - type: 'null'
          title: Enactmentoutcome
          description: 'How the measure became, or failed to become, law: `signed`, `became_law_without_signature`, `veto_overridden`, `line_item_veto` (signed with some items vetoed), `vetoed` and `pocket_veto` (not law), `not_presented`, `approved_by_voters`, or `unknown` when the publisher does not say.'
          examples:
          - signed
        sourceUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourceurl
          description: The government publisher's own URL for the act's text, so a citation answer links to the primary source. Null when we hold no text source from a government host.
          examples:
          - https://www.revisor.mn.gov/laws/2025/0/Session+Law/Chapter/1/
        href:
          type: string
          title: Href
          description: Where to read the law, relative to the API host.
          examples:
          - /api/v1/us/session-laws/SSL_MN_2025R_G_Y2025_C1
        isDefault:
          type: boolean
          title: Isdefault
          description: 'True for the publisher''s conventional reading of an ambiguous citation. Informational: no candidate is chosen for you.'
          default: false
          examples:
          - false
      type: object
      required:
      - sessionLawId
      - jurisdiction
      - session
      - textStatus
      - href
      title: SessionLawCitationCandidate
      description: One session law a citation names.
    BodyTable:
      properties:
        tableId:
          type: string
          title: Tableid
          examples:
          - t1
        order:
          type: integer
          title: Order
          description: 1-based position among the section's tables.
          default: 0
        caption:
          anyOf:
          - type: string
          - type: 'null'
          title: Caption
          description: The table's caption, when it has one.
        rows:
          type: integer
          title: Rows
          description: Row count, header rows included.
          default: 0
        cols:
          type: integer
          title: Cols
          description: Column count.
          default: 0
      type: object
      required:
      - tableId
      title: BodyTable
      description: One table inside a rendered section body.
    StatuteDefinitionTerm:
      properties:
        term:
          type: string
          title: Term
          description: The defined term, as the statute writes it.
          examples:
          - person
        definition:
          type: string
          title: Definition
          description: What the statute says the term means, verbatim.
        marker:
          anyOf:
          - type: string
          - type: 'null'
          title: Marker
          description: The enumerator the definition sits under (e.g. `1`, `a`, `A`), where the source paragraph-numbers its definitions.
          examples:
          - '1'
      type: object
      required:
      - term
      - definition
      title: StatuteDefinitionTerm
      description: One defined term drawn from a chapter's definitions section.
    StatuteChangeEvent:
      properties:
        id:
          type: integer
          title: Id
          description: Stable identifier for this change. Monotonic across the whole corpus, so it doubles as the paging cursor, and it is the id the board-watch diff endpoint takes.
          examples:
          - 91
        changeKind:
          type: string
          enum:
          - added
          - amended
          - removed
          title: Changekind
          description: '`added`: the section first appeared. `amended`: its text was replaced. `removed`: it disappeared from a full refresh of the source, which usually means repealed or renumbered. Note that a narrow, section-scoped refresh cannot observe a removal, so absence of a `removed` event is not proof a section still stands.'
          examples:
          - amended
        detectedAt:
          type: string
          title: Detectedat
          description: 'When our refresh OBSERVED the change, ISO-8601 UTC. An upper bound on the effective date, never the effective date itself: a source published weekly is seen up to a week late. Do not present it to an end user as when the law changed.'
          examples:
          - '2026-08-07T04:10:00Z'
        citation:
          anyOf:
          - type: string
          - type: 'null'
          title: Citation
          description: The section's citation as recorded at capture time. Null for corpora that do not carry one; `displayCitation` always has something readable.
          examples:
          - 21 CFR 314.50
        displayCitation:
          anyOf:
          - type: string
          - type: 'null'
          title: Displaycitation
          description: 'Always human-readable: the stored citation, or one derived from the section''s hierarchy when the source recorded none. Use this for display and `citation` only when you specifically need what capture recorded.'
          examples:
          - 21 C.F.R. § 314.50
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: The section heading as of this change. Null where the source carries none.
          examples:
          - Content and format of an NDA
        hasDiff:
          type: boolean
          title: Hasdiff
          description: 'Whether the superseded text was captured, so a before/after diff can be rendered for this event. Always false for `added` (there is no before). Retrieving the diff itself needs a board watch covering this source: `GET /boards/watches/{watchId}/changes/{changeId}/diff`.'
          default: false
        corpusType:
          type: string
          title: Corpustype
          description: The board this change was captured on, e.g. `cfr`, `usc`, `state_regulation`. This is the value to subscribe to if you want alerts on future changes to this section.
          examples:
          - cfr
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
          description: Two-letter state code for state corpora, null for federal ones.
          examples:
          - wa
      type: object
      required:
      - id
      - changeKind
      - detectedAt
      - corpusType
      title: StatuteChangeEvent
      description: 'One time this section was added, amended, or removed by its publisher.


        An OBSERVED change, not a publisher-declared one. It exists because a

        refresh of the source corpus found this section''s text different from the

        copy we already held, so it carries the date WE detected it, which is at or

        after the date the change took effect. For the publisher''s own effective

        and amendment dates, read `amendmentHistory` on the section itself.'
    StatuteSectionNotFoundError:
      properties:
        detail:
          type: string
          title: Detail
          description: Human-readable reason, safe to show a user. Branch on `reason`, not on this string.
          examples:
          - Section not found. This id does not exist, but the section does, ...
        actId:
          type: string
          title: Actid
          description: The identifier exactly as you sent it.
        reason:
          type: string
          enum:
          - assembled_id
          - unresolved_citation
          - not_in_corpus
          - missing_act_id
          - state_session_law
          title: Reason
          description: '`assembled_id` -- the id does not exist but the section does, under the ids in `didYouMean` (usually an id built by hand from a citation, or sent in the wrong case). `unresolved_citation` -- the input is a citation and resolves to nothing we hold; check it with `/us/statutes/resolve`. `not_in_corpus` -- nothing matched. `missing_act_id` -- the URL left the id out, so an endpoint name (`body`, `changes`, ...) sits where the id goes; `detail` names the path you meant. Never charged. `state_session_law` -- the id starts `SSL_`: it names a STATE session law (an act as enacted), which is not a code section; read it at `GET /us/session-laws/{sessionLawId}`.'
          examples:
          - assembled_id
        didYouMean:
          items:
            type: string
          type: array
          title: Didyoumean
          description: Real act_ids for the section your id pointed at, best first, at most 3.
          examples:
          - - USC_T26_C1_S1
      type: object
      required:
      - detail
      - actId
      - reason
      title: StatuteSectionNotFoundError
      description: The 404 from any `/us/statutes/section/{act_id}/...` route.
    SessionLawDate:
      properties:
        kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Kind
          description: 'What the date is, on `otherDates`: `approved`, `filed` or `other` (`kindAsPrinted` carries the publisher''s label for `other`). Null on `effectiveDates`, where every entry is an effective date.'
          examples:
          - approved
          - other
          - null
        date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date
          description: The date as ISO 8601 when the printed text could be read as one. Null when the publisher's wording is not a calendar date.
          examples:
          - '2025-03-17'
        dateAsPrinted:
          anyOf:
          - type: string
          - type: 'null'
          title: Dateasprinted
          description: The date exactly as the publisher wrote it, including any time of day.
          examples:
          - March 17, 2025, 10:54 a.m.
          - 06/20/25
        kindAsPrinted:
          anyOf:
          - type: string
          - type: 'null'
          title: Kindasprinted
          description: The publisher's own label for what the date is, when it prints one.
          examples:
          - Presentment Date
          - Presented to the governor
        scopeAsPrinted:
          anyOf:
          - type: string
          - type: 'null'
          title: Scopeasprinted
          description: 'What the date applies to when it is not the whole act, as printed: an act can take effect in parts. Null when the date applies to the act as a whole.'
          examples:
          - CCP §871.20.
          - null
      type: object
      title: SessionLawDate
      description: One printed date on a session law.
    StatuteBodyResponse:
      properties:
        actId:
          type: string
          title: Actid
          description: The act_id of the section served. Equal to your request unless `resolvedFrom` is set, in which case it is the id your citation or cleaned-up input resolved to.
          examples:
          - USC_T42_C21_S1983
        html:
          anyOf:
          - type: string
          - type: 'null'
          title: Html
          description: 'The section text as HTML. When `source` is `r2_render` this is our structured rendering of the publisher''s source: real `<table>` elements (with `<caption>`, `colspan` and `rowspan`) and `<figure>` / `<img>` elements at the position the publisher prints them, with images hosted on `statutes-us.vaquill.ai`. When `source` is `r2_s3` this is the publisher''s own markup (tables, paragraph structure, history lines), cut to the section''s own content where we recognise the publisher''s page layout. For any other `source` the text was not held as per-section HTML, and `html` carries the same text as `plain` with no markup.'
        plain:
          anyOf:
          - type: string
          - type: 'null'
          title: Plain
          description: Plain text version.
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
          description: 'Which copy the text came from: `r2_render` (our structured rendering, carrying `markdown`, `tables` and `figures`), `r2_s3` (the publisher''s page for this section), `r2_text` (our per-section text extraction), `qdrant_reconstructed` (reassembled from indexed passages), and on `asOf` requests `stored_edition` or `corpus_change_history`. A storage identifier, not a citation: cite `sourceUrl`.'
        sourceUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourceurl
          description: 'Where this text was published by the government, so the bytes you were served can be cited and verified against the official record. Null when we hold no publishable link for the section: a third-party compiler is never served here, and an absent link is the correct answer in that case. `source` is a storage identifier and is NOT a citation.'
          examples:
          - https://www.govinfo.gov/content/pkg/USCODE-2024-title17/html/USCODE-2024-title17-chap1-sec107.htm
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
          description: 'The OPERATIVE TEXT of the section, with the source credit and the notes apparatus removed. This is the law; `plain` is the law plus everything the publisher prints around it.


            Populated for **United States Code** sections, where GPO delimits the fields in the granule it publishes. Null for CFR and for state corpora, whose sources carry no equivalent structure -- null means "we cannot split this reliably", never "this section is empty", and `plain` is still the whole body.


            Worth using if you feed sections to a model: the operative text is a median 46% of `plain` across USC and as little as 3.4% (`17 U.S.C. § 107`, where nearly all of the body is committee reports and amendment notes). A model handed the full body can quote a 1992 amendment note as the law in force.'
          examples:
          - Notwithstanding the provisions of sections 106 and 106A, the fair use...
        sourceCredit:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourcecredit
          description: 'The publisher''s credit line for the section, e.g. `(Pub. L. 94-553, title I, §101, Oct. 19, 1976, 90 Stat. 2546; ...)`. Split out of the body rather than left inside it.


            The same value is also on `GET /us/statutes/section/{actId}` as `sourceCredit`; it is repeated here so a caller fetching the text does not need a second call to know what enacted it.'
          examples:
          - (Pub. L. 94-553, title I, §101, Oct. 19, 1976, 90 Stat. 2546)
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
          description: 'The notes apparatus the publisher prints after the section: Historical and Revision Notes, committee reports, Editorial Notes (codification and amendments), Statutory Notes and Related Subsidiaries (effective dates), and any guidelines reprinted by the editors.


            Kept, not discarded: it is the legislative history, and it is the reason a section''s body can be twenty times the length of the law. It is simply NOT the operative text, so it is served as its own field. Null where we cannot split the body.


            Also null, deliberately, when you pass `format=operative`: that is the one format that asks us to leave the apparatus off the wire. Null there means "not sent", not "none exists" -- the same request at `format=content` returns it.'
          examples:
          - 'Historical and Revision Notes


            house report no. 94–1476...'
        available:
          type: boolean
          title: Available
          description: Whether full text is available.
          default: true
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
          description: Note if text is unavailable.
        markdown:
          anyOf:
          - type: string
          - type: 'null'
          title: Markdown
          description: 'The body as GitHub-flavoured Markdown. When `source` is `r2_render` this is the structured rendering: tables as GFM pipe tables (a caption line above, footnotes below, multi-level headers joined as `Parent / Child`) and figures as `![alt](url)` at their position in the text. Returned only when `format` is `all` or `markdown`, not on the default `both`, where it would be a third full copy.


            For a section with no structured rendering, `markdown` is null unless you pass `structured=true`, in which case it is the body as nested Markdown lists (the pre-existing behaviour). When both exist the structured rendering wins, because it is the one that keeps the tables; `subsections` is returned either way.'
        tables:
          anyOf:
          - items:
              $ref: '#/components/schemas/BodyTable'
            type: array
          - type: 'null'
          title: Tables
          description: 'The tables in the body, in document order, with their size. An empty list means the section has none. Null means not known: the section''s corpus has no structured rendering yet, so a table may still be present in `html`.'
        figures:
          anyOf:
          - items:
              $ref: '#/components/schemas/BodyFigure'
            type: array
          - type: 'null'
          title: Figures
          description: 'The figures, equations and form images in the body, in document order, with hosted image urls and each one''s offset into `markdown` and `plain`. An empty list means the section has none. Null means not known: the section''s corpus has no structured rendering yet.'
        hasTables:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Hastables
          description: True when the body contains at least one table, false when it contains none. Null when not known, because the section's corpus has no structured rendering yet.
        hasFigures:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Hasfigures
          description: True when the body contains at least one figure, equation or form image, false when it contains none. Null when not known, because the section's corpus has no structured rendering yet.
        subsections:
          anyOf:
          - items:
              $ref: '#/components/schemas/SubsectionNode'
            type: array
          - type: 'null'
          title: Subsections
          description: The section broken into its lettered and numbered subsections, nested as they appear in the text. Use it to quote or link a single clause rather than the whole section. Present only when `structured=true`.
        asOf:
          anyOf:
          - $ref: '#/components/schemas/AsOfProvenance'
          - type: 'null'
          description: Present only when the request passed `asOf`. Says WHICH version of the section you are holding and how far the evidence for it goes. Read `isBounded` before treating the text as the law on that date.
        resolvedFrom:
          anyOf:
          - $ref: '#/components/schemas/SectionIdentifierResolution'
          - type: 'null'
          description: 'Null when the section is exactly the act_id you sent. Otherwise how your input was matched: a citation, or an act_id with transport damage (whitespace, quotes, a trailing period) removed.'
        processingTimeMs:
          type: number
          title: Processingtimems
          description: Server-side time for this request in milliseconds, excluding network transit. Useful for spotting a slow query; not billed on.
          default: 0.0
          examples:
          - 240.5
        creditsConsumed:
          type: number
          title: Creditsconsumed
          description: 'Credits actually charged for this call. Read it rather than assuming the list price: failed and refunded work bills 0, and batch endpoints charge per item returned, so a partial result costs less than a full one.'
          default: 0.0
          examples:
          - 4
      type: object
      required:
      - actId
      title: StatuteBodyResponse
      description: Full text of a statute section in HTML and/or plain text.
    StatuteSectionsNotFoundDetail:
      properties:
        actId:
          type: string
          title: Actid
          description: The identifier from your request that did not resolve.
        reason:
          type: string
          title: Reason
          description: '`assembled_id` -- this id does not exist, but the section does, under the ids in `didYouMean`. Almost always an id built from a citation: the chapter/article/part segments are not derivable from one, so take ids from a `/us/statutes/search` response instead. `unresolved_citation` -- the input is a citation and resolves to nothing we hold; check its form with `/us/statutes/resolve`. `not_in_corpus` -- nothing matching was found. Either the id is malformed beyond recovery, or the section is genuinely absent; check `/us/statutes/coverage` for the jurisdiction. `state_session_law` -- the id starts `SSL_`: a state session law (an act as enacted), read at `GET /us/session-laws/{sessionLawId}`, not a code section.'
          examples:
          - assembled_id
        didYouMean:
          items:
            type: string
          type: array
          title: Didyoumean
          description: Real act_ids carrying the section number your id pointed at, best match first, at most 3. Empty when nothing matched. Send one of these back to `/us/statutes/sections` to get the section.
          examples:
          - - STATE_CO_T38_A12_P1_S38-12-103
      type: object
      required:
      - actId
      - reason
      title: StatuteSectionsNotFoundDetail
      description: 'Why one `actId` missed, and what to send instead.


        A bare id in `notFound` is ambiguous between the two things a caller most

        needs to tell apart: an id they built by hand that never existed, and a real

        section we do not hold. Read as the latter, the first one looks like missing

        coverage, which is how a working integration gets abandoned.'
