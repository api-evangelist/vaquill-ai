      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatuteSearchRequest'
        required: true
      responses:
        '200':
          description: Ranked sections for the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatuteSearchResponse'
              example:
                results:
                - actId: CFR_T17_P240_S240_10b5_1
                  citation: 17 C.F.R. § 240.10b5-1 (2026)
                  citationShort: 17 C.F.R. § 240.10b5-1
                  title: Trading on the basis of material nonpublic information in insider trading cases
                  corpusType: CFR
                  state: federal
                  year: 2026
                  relevanceScore: 0.91
                  excerpt: The manipulative and deceptive devices prohibited by section 10(b)...
                  titleNumber: 17
                  sectionNumber: 240.10b5-1
                  displayPath: Title 17 CFR > Chapter II > Part 240 > Section 240.10b5-1
                  htmlUrl: https://statutes-us.vaquill.ai/ecfr/...
                  externalUrl: https://www.ecfr.gov/...
                  sourceUrl: https://www.ecfr.gov/...
                total: 1
                query: insider trading material nonpublic information
                processingTimeMs: 412.3
                creditsConsumed: 4
        '402':
          description: Insufficient API credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
              example:
                detail: Insufficient credits
        '422':
          description: Invalid request body (e.g. query too short, limit over 50, bad corpusType).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
              example:
                detail: Invalid request parameters
                errors:
                - loc:
                  - body
                  - limit
                  msg: Input should be less than or equal to 50
                  type: less_than_equal
    servers:
    - url: https://api.vaquill.ai
