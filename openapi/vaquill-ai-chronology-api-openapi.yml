  /v1/matters/{matterId}/chronology/exports:
    post:
      tags:
      - Chronology
      summary: Export the chronology as CSV, PDF or DOCX
      description: 'Render the filtered timeline to CSV, PDF or DOCX and return the bytes.


        A POST, and the filters are a field on the body rather than eleven query

        parameters: they are the SAME filters the list accepts, read by the same code,

        so one cannot go missing here.


        **It never truncates.** Over the event ceiling it answers 413 carrying `limit`

        and `requested`, so you can narrow the date range rather than receiving a

        partial file you would have no way to detect. `eventCount` on the response is

        exactly what the file contains.'
      operationId: chronology.export
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChronologyExportRequest'
            example:
              format: csv
              filters:
                dateFrom: '2026-08-19'
                dateTo: '2026-08-19'
                eventTypes:
                - signed
                categories:
                - contract_event
                significance:
                - high
                documentId: doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                isAiExtracted: false
                minConfidence: 1.0
                searchQuery: value
                party: value
                primaryOnly: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChronologyExport'
              example:
                format: docx
                filename: msa-acme-v3.docx
                sizeBytes: 248193
                content: UEsDBBQABgAIAAAAIQ...
