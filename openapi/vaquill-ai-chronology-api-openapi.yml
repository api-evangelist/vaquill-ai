      summary: Get chronology extraction status
      description: 'How far automatic extraction has got across the matter.


        This is the completion signal for a capability that publishes no operation:

        poll a document''s `document.ingest` operation to know the document landed,

        then read this to know its events are in.


        Per-document `status` is published verbatim (`pending`, `in_progress`,

        `completed`, `failed`, `skipped`) rather than as one of the five operation

        statuses. There is no operation here to be consistent with, and mapping

        `in_progress` would add a sixth spelling of "running" to the contract.'
