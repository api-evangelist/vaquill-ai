openapi: 3.2.0
info:
  title: Vaquill Ai Chronology API
  version: 1.0.0
  description: 'Operations tagged Chronology across 2 of this provider''s published API definitions: vaquill-ai-workspace-openapi.json, vaquill-ai-workspace-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vaquill.ai/workspace
  description: Vaquill Legal Workspace API (production)
- url: /workspace
  description: Vaquill Legal Workspace API (relative to the mount)
security:
- WorkspaceAuth: []
tags:
- name: Chronology
  description: The dated events across a matter's documents, as one timeline, with duplicate and date-conflict flags.
paths:
  /v1/matters/{matterId}/chronology/events:
    get:
      tags:
      - Chronology
      summary: List chronology events
      description: 'The matter''s events, OLDEST first, filtered however you ask.


        `eventDate` ascending by default, which is the opposite of every other list on

        this surface and is deliberate: a chronology sorted newest-first is a

        chronology nobody can read. Pass `sortOrder=desc` for the other direction.


        `eventType`, `category` and `significance` come back as plain strings. The

        columns behind them carry no constraint, so production holds values this API

        would refuse on a write; read them, do not switch on a closed list.


        `primaryOnly=true` collapses duplicate events to one per group, which is what

        the product''s own timeline does.'
      operationId: chronologyEvents.list
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: dateFrom
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Only events on or after this date.
          title: Datefrom
        description: Only events on or after this date.
      - name: dateTo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Only events on or before this date.
          title: Dateto
        description: Only events on or before this date.
      - name: eventTypes
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              enum:
              - signed
              - executed
              - filed
              - served
              - effective
              - expired
              - terminated
              - notice_sent
              - notice_received
              - payment
              - hearing
              - meeting
              - judgment
              - order
              - correspondence
              - amended
              - enacted
              - published
              - decided
              - incident
              - referenced
              - founded
              - incorporated
              - appointed
              - resigned
              - acquired
              - launched
              - awarded
              - approved
              - registered
              - commenced
              - completed
              - transferred
              - invested
              - dissolved
              - announced
              - renewed
              - other
              type: string
          - type: 'null'
          description: Only these event types. Omit for all of them.
          title: Eventtypes
        description: Only these event types. Omit for all of them.
      - name: categories
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              enum:
              - contract_event
              - court_filing
              - correspondence
              - payment_financial
              - deadline_notice
              - meeting_hearing
              - legislative
              - case_law
              - historical
              - corporate
              - regulatory
              - employment
              - milestone
              - other
              type: string
          - type: 'null'
          description: Only these swim lanes.
          title: Categories
        description: Only these swim lanes.
      - name: significance
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              enum:
              - high
              - medium
              - low
              type: string
          - type: 'null'
          description: Only these significance levels.
          title: Significance
        description: Only these significance levels.
      - name: documentId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only events extracted from this `doc_` document.
          title: Documentid
        description: Only events extracted from this `doc_` document.
      - name: isAiExtracted
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: True for extracted events only, false for hand-entered ones only.
          title: Isaiextracted
        description: True for extracted events only, false for hand-entered ones only.
      - name: minConfidence
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          description: Only extracted events at or above this confidence. Note that a manual event has no confidence at all and is excluded by any value here.
          title: Minconfidence
        description: Only extracted events at or above this confidence. Note that a manual event has no confidence at all and is excluded by any value here.
      - name: searchQuery
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          description: Substring match on title or description.
          examples:
          - termination notice
          title: Searchquery
        description: Substring match on title or description.
      - name: party
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          description: Only events naming this party exactly.
          examples:
          - Acme Corporation
          title: Party
        description: Only events naming this party exactly.
      - name: primaryOnly
        in: query
        required: false
        schema:
          type: boolean
          description: Collapse duplicate events to one per group. Events that are in no duplicate group are always kept.
          default: false
          title: Primaryonly
        description: Collapse duplicate events to one per group. Events that are in no duplicate group are always kept.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: How many events to return.
          default: 50
          title: Limit
        description: How many events to return.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: How many to skip first.
          default: 0
          title: Offset
        description: How many to skip first.
      - name: sortBy
        in: query
        required: false
        schema:
          enum:
          - event_date
          - created_at
          - significance
          - title
          type: string
          description: Which field to order by.
          default: event_date
          title: Sortby
        description: Which field to order by.
      - name: sortOrder
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          description: Ascending by default, because a timeline reads forward in time.
          default: asc
          title: Sortorder
        description: Ascending by default, because a timeline reads forward in time.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ChronologyEvent_'
              example:
                data:
                - id: evt_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  matterId: mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  documentId: doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  documentName: value
                  eventDate: '2026-08-19'
                  eventDateEnd: '2026-08-19'
                  eventDateApproximate: false
                  eventType: signed
                  category: commercial
                  significance: high
                  title: Master Services Agreement
                  description: Master services agreement with Acme for the 2026 platform rollout.
                  parties:
                  - value
                  tags:
                  - saas
                  - buyer-side
                  sourceText: value
                  sourcePageNumber: 1
                  isAiExtracted: false
                  confidenceScore: 1.0
                  isPrimaryInGroup: false
                  createdAt: '2026-08-19T14:32:10Z'
                  updatedAt: '2026-08-19T14:32:10Z'
                pagination:
                  limit: 50
                  offset: 0
                  total: 128
                  hasMore: false
        '422':
          description: The request does not match the published schema. `errors` names each rejected field and why. The submitted value is never echoed back.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: The credential is missing, malformed, unknown, revoked or expired. `type` is `invalid-credential`, or `wrong-product-credential` when a `vq_key_` Data API key was sent to this API.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
            WWW-Authenticate:
              description: RFC 9110 authentication challenge.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The credential does not carry a scope this operation requires (`insufficient-scope`), or the organization's installation is suspended (`installation-inactive`).
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
            WWW-Authenticate:
              description: RFC 9110 authentication challenge.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The resource does not exist, is not this organization's, or is outside this installation's matter allowlist. The three are deliberately indistinguishable, so the status code cannot be used to discover which ids exist in another organization. Each resource has its own `type`.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests for this credential's tier. Honour `Retry-After`.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: An unexpected error on our side. The body carries a stable `type` and the request id and nothing else; the cause is in our logs.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: A dependency this request needs is unavailable, so nothing was done. Retryable. Authentication fails closed rather than admitting the request, so this is never a statement about your credential.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - Chronology
      summary: Create a chronology event
      description: 'Add an event by hand. 201 with the stored event.


        Created events are recorded as not AI-extracted and carry no confidence, which

        is what keeps them distinguishable from the pipeline''s output forever.

        `documentId` is optional; when given it must name a document in THIS matter.'
      operationId: chronologyEvents.create
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChronologyEventCreateRequest'
            example:
              eventDate: '2026-08-19'
              eventDateEnd: '2026-08-19'
              eventDateApproximate: false
              eventType: signed
              category: contract_event
              title: Master Services Agreement
              description: Master services agreement with Acme for the 2026 platform rollout.
              parties:
              - value
              tags:
              - saas
              - buyer-side
              significance: high
              documentId: doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
              sourcePageNumber: 1
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChronologyEvent'
              example:
                id: evt_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                matterId: mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                documentId: doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                documentName: value
                eventDate: '2026-08-19'
                eventDateEnd: '2026-08-19'
