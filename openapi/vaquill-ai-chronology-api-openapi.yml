components:
  schemas:
    ChronologyFilters:
      properties:
        dateFrom:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Datefrom
          description: Only events on or after this date.
          examples:
          - '2026-08-19'
        dateTo:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Dateto
          description: Only events on or before this date.
          examples:
          - '2026-08-19'
        eventTypes:
          anyOf:
          - items:
              type: string
              enum:
              - signed
              - executed
              - filed
              - served
              - effective
              - expired
              - terminated
              - notice_sent
              - notice_received
              - payment
              - hearing
              - meeting
              - judgment
              - order
              - correspondence
              - amended
              - enacted
              - published
              - decided
              - incident
              - referenced
              - founded
              - incorporated
              - appointed
              - resigned
              - acquired
              - launched
              - awarded
              - approved
              - registered
              - commenced
              - completed
              - transferred
              - invested
              - dissolved
              - announced
              - renewed
              - other
            type: array
          - type: 'null'
          title: Eventtypes
          description: Only these event types. Omit for all of them.
          examples:
          - - signed
        categories:
          anyOf:
          - items:
              type: string
              enum:
              - contract_event
              - court_filing
              - correspondence
              - payment_financial
              - deadline_notice
              - meeting_hearing
              - legislative
              - case_law
              - historical
              - corporate
              - regulatory
              - employment
              - milestone
              - other
            type: array
          - type: 'null'
          title: Categories
          description: Only these swim lanes.
          examples:
          - - contract_event
        significance:
          anyOf:
          - items:
              type: string
              enum:
              - high
              - medium
              - low
            type: array
          - type: 'null'
          title: Significance
          description: Only these significance levels.
          examples:
          - - high
        documentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Documentid
          description: Only events extracted from this `doc_` document.
          examples:
          - doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        isAiExtracted:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Isaiextracted
          description: True for extracted events only, false for hand-entered ones only.
          examples:
          - false
        minConfidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Minconfidence
          description: Only extracted events at or above this confidence. Note that a manual event has no confidence at all and is excluded by any value here.
          examples:
          - 1.0
        searchQuery:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Searchquery
          description: Substring match on title or description.
          examples:
          - termination notice
        party:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Party
          description: Only events naming this party exactly.
          examples:
          - Acme Corporation
        primaryOnly:
          type: boolean
          title: Primaryonly
          description: Collapse duplicate events to one per group. Events that are in no duplicate group are always kept.
          default: false
          examples:
          - false
      additionalProperties: false
      type: object
      title: ChronologyFilters
      description: 'Which events to include.


        ONE model, two call sites: the list takes it as a query model and the export

        takes it as a field on its body. That is deliberate, and it is why the export

        is a POST. The web app''s export accepts eleven filter parameters and honours

        every one of them; two separately-declared filter sets is how one of them

        quietly stops being honoured on the export, which nobody notices until a

        customer files a chronology that includes events they excluded.'
    DocumentExtractionState:
      properties:
        documentId:
          type: string
          title: Documentid
          description: The `doc_` document.
          examples:
          - doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        documentName:
          anyOf:
          - type: string
          - type: 'null'
          title: Documentname
          description: Its filename.
          examples:
          - msa-acme-v3.docx
        status:
          type: string
          title: Status
          description: '`pending`, `in_progress`, `completed`, `failed` or `skipped`. Deliberately NOT one of the five operation statuses: this is per-document bookkeeping under a capability that publishes no operation, and mapping it would put a sixth spelling of ''running'' into the contract.'
          examples:
          - completed
        eventsExtracted:
          type: integer
          title: Eventsextracted
          description: How many events came out of this document.
          examples:
          - 1
      additionalProperties: false
      type: object
      required:
      - documentId
      - status
      - eventsExtracted
      title: DocumentExtractionState
      description: Where one document's chronology extraction got to.
    Page_ChronologyEvent_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ChronologyEvent'
          type: array
          title: Data
          description: The rows in this window, in the collection's default order.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Where this window sits in the full result set.
      additionalProperties: false
      type: object
      required:
      - data
      - pagination
      title: Page[ChronologyEvent]
    ChronologyExtractionStatus:
      properties:
        documents:
          items:
            $ref: '#/components/schemas/DocumentExtractionState'
          type: array
          title: Documents
          description: Per-document state, for every document extraction has touched.
        totalDocuments:
          type: integer
          title: Totaldocuments
          description: Finished documents in the matter.
          examples:
          - 1
        completedDocuments:
          type: integer
          title: Completeddocuments
          description: Documents whose extraction succeeded.
          examples:
          - 1
        pendingDocuments:
          type: integer
          title: Pendingdocuments
          description: Documents still waiting, including ones extraction has not reached yet and therefore has no per-document row for.
          examples:
          - 1
        failedDocuments:
          type: integer
          title: Faileddocuments
          description: Documents whose extraction failed.
          examples:
          - 1
        isExtractionComplete:
          type: boolean
          title: Isextractioncomplete
          description: True when nothing is outstanding and the matter had something to extract.
          examples:
          - false
      additionalProperties: false
      type: object
      required:
      - documents
      - totalDocuments
      - completedDocuments
      - pendingDocuments
      - failedDocuments
      - isExtractionComplete
      title: ChronologyExtractionStatus
      description: How far the automatic extraction has got across the whole matter.
    Pagination:
      properties:
        limit:
          type: integer
          title: Limit
          description: The `limit` that was applied to this request.
          examples:
          - 50
        offset:
          type: integer
          title: Offset
          description: The `offset` that was applied to this request.
          examples:
          - 0
        total:
