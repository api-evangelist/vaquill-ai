  /v1/matters/{matterId}/chronology/events/{eventId}:
    patch:
      tags:
      - Chronology
      summary: Update a chronology event
      description: 'Correct an event. Omitted fields are left alone.


        A PATCH, so send only what changes. An explicit null clears `description` or

        `eventDateEnd`; every other field is backed by a NOT NULL column and a null

        for one is refused by name. `documentId` is not patchable: which document an

        event came from is provenance, and re-pointing it would make an extracted

        event claim a source it was never read from.'
      operationId: chronologyEvents.update
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          title: Eventid
        description: '`evt_` identifier of one chronology event. Take it from the matter''s chronology.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChronologyEventUpdateRequest'
            example:
              eventDate: '2026-08-19'
              eventDateEnd: '2026-08-19'
              eventDateApproximate: false
              eventType: signed
              category: contract_event
              title: Master Services Agreement
              description: Master services agreement with Acme for the 2026 platform rollout.
              parties:
              - value
              tags:
              - saas
              - buyer-side
              significance: high
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChronologyEvent'
              example:
                id: evt_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                matterId: mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                documentId: doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                documentName: value
                eventDate: '2026-08-19'
                eventDateEnd: '2026-08-19'
                eventDateApproximate: false
                eventType: signed
                category: commercial
                significance: high
                title: Master Services Agreement
                description: Master services agreement with Acme for the 2026 platform rollout.
                parties:
