  /v1/uploads/{uploadId}/complete:
    post:
      tags:
      - Uploads
      summary: Finish an upload and start ingesting
      description: 'Assemble the parts and start ingesting. Always a 202 with an operation.


        Ordered assemble-then-mint. The assembly is guarded by the session''s own

        status, so a retry after a lost response skips it; the launcher then

        recognises the derived key and returns the first operation with

        `is_new=False`, and the dispatch is skipped with it. Minting first would

        mean a transient storage failure produced an operation whose retry found it

        and declined to dispatch.'
      operationId: uploads.complete
      parameters:
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
          title: Uploadid
        description: '`upl_` identifier of the upload session, returned when the upload was initiated. This is NOT the storage provider''s own upload id.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCompleteRequest'
            example:
              parts:
              - partNumber: 1
                etag: '"d41d8cd98f00b204e9800998ecf8427e"'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                id: op_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                type: matrix.run
                status: succeeded
                createdAt: '2026-08-19T14:32:10Z'
                completedAt: '2026-08-19T14:32:10Z'
                matterId: mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                resource:
                  kind: matrix
                  id: mtx_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  url: https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
                progress:
                  done: 24
                  total: 128
                  unit: cells
                requestId: req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        '422':
          description: The request does not match the published schema. `errors` names each rejected field and why. The submitted value is never echoed back.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: The credential is missing, malformed, unknown, revoked or expired. `type` is `invalid-credential`, or `wrong-product-credential` when a `vq_key_` Data API key was sent to this API.
          headers:
            X-Request-ID:
