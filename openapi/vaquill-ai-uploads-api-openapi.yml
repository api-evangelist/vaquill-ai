              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags:
      - Uploads
      summary: List upload sessions
      description: 'Every upload session in your organization, newest first.


        No part URLs. A list of them would be a page of presigned capabilities for

        files you are not currently uploading; sign the parts you still need with

        `uploads.presignPart`.


        Pass `status=in_progress` to find sessions you left open. A session past its

        `expiresAt` cannot be completed even if it still reads `in_progress`:

        storage discards the parts, and the upload has to start again.'
      operationId: uploads.list
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: How many rows to return, 1 to 200. Defaults to 50.
          default: 50
          title: Limit
        description: How many rows to return, 1 to 200. Defaults to 50.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: 'How many rows to skip before returning any. Combine with `limit` to page: `offset=0`, then `offset=50`, and so on. Offsets are positional, not stable, so a set that changes while you page can show a row twice or not at all.'
          default: 0
          title: Offset
        description: 'How many rows to skip before returning any. Combine with `limit` to page: `offset=0`, then `offset=50`, and so on. Offsets are positional, not stable, so a set that changes while you page can show a row twice or not at all.'
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Narrow to one session status, for example `in_progress` to find uploads left open. Omit for every session in the organization.
          title: Status
        description: Narrow to one session status, for example `in_progress` to find uploads left open. Omit for every session in the organization.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_UploadSummary_'
              example:
                data:
                - uploadId: upl_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  matterId: mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  filename: msa-acme-v3.docx
                  contentType: application/pdf
                  sizeBytes: 248193
                  totalParts: 3
                  status: completed
                  createdAt: '2026-08-19T14:32:10Z'
                  expiresAt: '2026-08-19T14:32:10Z'
                pagination:
                  limit: 50
                  offset: 0
                  total: 128
                  hasMore: false
