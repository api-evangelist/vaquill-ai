  /v1/uploads/{uploadId}/parts/{partNumber}:
    get:
      tags:
      - Uploads
      summary: Re-sign one upload part
      description: 'Re-sign one part, for an upload that outlived its original URLs.


        Part URLs expire well before the session does, so a large upload is expected

        to re-sign as it goes. Parts already uploaded stay valid and do not need

        re-sending; only sign the ones still outstanding.'
      operationId: uploads.presignPart
      parameters:
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
          title: Uploadid
        description: '`upl_` identifier of the upload session, returned when the upload was initiated. This is NOT the storage provider''s own upload id.'
      - name: partNumber
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Partnumber
        description: Which part of a multipart upload to sign, counting from 1. Must be one of the parts the session was opened for.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPartLink'
              example:
                partNumber: 1
                url: https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
