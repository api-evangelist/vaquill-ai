  /v1/uploads/{uploadId}:
    delete:
      tags:
      - Uploads
      summary: Abort an upload
      description: 'Abandon an upload and clean up after it.


        Cancels the upload in storage, discards whatever parts were sent, and

        removes the placeholder document the session created. Nothing else is

        touched: the placeholder has no bytes and no extracted text.


        Refused with `409 upload-not-completable` once the session is `completed`.

        At that point the document is real and the ingest has started, so the thing

        to remove is the document; use `documents.delete`, which also clears its

        stored file and its vectors.


        The session itself stays visible in `GET /v1/uploads` with `status:

        aborted`, so your own reconciliation can see that it ended rather than

        finding it simply gone.


        A repeated abort answers `404`. If an abort timed out, treat a subsequent

        `404` as success.'
      operationId: uploads.abort
      parameters:
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
          title: Uploadid
        description: '`upl_` identifier of the upload session, returned when the upload was initiated. This is NOT the storage provider''s own upload id.'
