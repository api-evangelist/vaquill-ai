components:
  schemas:
    MatterSummary:
      properties:
        id:
          type: string
          title: Id
          description: '`sum_` identifier. The same id the operation''s resource carries, and the only id this API publishes for a summary.'
          examples:
          - sum_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        matterId:
          type: string
          title: Matterid
          description: The `mat_` matter this summary covers.
          examples:
          - mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: The generation's status, in the same five values every operation uses.
          examples:
          - succeeded
        altitude:
          anyOf:
          - type: string
          - type: 'null'
          title: Altitude
          description: 'How much detail was synthesized. `executive` or `detailed`; read it as an open string, because the column carries no constraint. Null on the one row shape where it is genuinely unknown: `matter_summary_jobs` does not record the altitude, so a job whose summary row is gone has nothing to report and the commoner answer would be an invention.'
          examples:
          - executive
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: The title the synthesizer gave the matter. Null until it runs.
          examples:
          - Acme / Series B Financing
        matterType:
          anyOf:
          - type: string
          - type: 'null'
          title: Mattertype
          description: What the classifier decided the matter is.
          examples:
          - financing
        isStale:
          type: boolean
          title: Isstale
          description: 'True when the matter''s documents have changed since this summary was built. Computed per request, never stored. A summary can also refresh ITSELF: a document change schedules a debounced regeneration for an altitude that already has a completed summary, so `isStale` can flip between two polls with no call from you.'
          examples:
          - false
        docCount:
          type: integer
          title: Doccount
          description: Documents in the matter right now.
          examples:
          - 1
        docCountUsed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Doccountused
          description: Documents this generation read.
          examples:
          - 1
        docCountExcluded:
          anyOf:
          - type: integer
          - type: 'null'
          title: Doccountexcluded
          description: Documents this generation skipped.
          examples:
          - 1
        warnings:
          items:
            type: string
          type: array
          title: Warnings
          description: What the pipeline wants you to know about this result, if anything.
          examples:
          - - value
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: When the generation was requested.
          examples:
          - '2026-08-19T14:32:10Z'
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completedat
          description: When the summary finished, read from the summary itself rather than from the job, which records no completion time.
          examples:
          - '2026-08-19T14:32:10Z'
        sections:
          anyOf:
          - items:
              $ref: '#/components/schemas/MatterSummarySection'
            type: array
          - type: 'null'
          title: Sections
          description: The rendered narrative. Present only on the by-id read; the list omits it rather than sending an empty array, so `null` here means 'not included in this response' and `[]` means 'nothing was written'.
      additionalProperties: false
      type: object
      required:
      - id
      - matterId
      - status
      - isStale
      - docCount
      - createdAt
      title: MatterSummary
      description: One generation of a matter summary, and its content once it has one.
    MatterSummarySection:
      properties:
        id:
          type: string
          title: Id
          description: Stable within this summary.
          examples:
          - 9f2c8b1e-4a7d-43c9-b6e0-f1a2c3d4e5f6
        title:
          type: string
          title: Title
          description: The section heading.
          examples:
          - Master Services Agreement
        position:
          type: integer
          title: Position
          description: Reading order within the summary.
          examples:
          - 0
        claims:
          items:
            $ref: '#/components/schemas/SummaryClaim'
          type: array
          title: Claims
          description: The section's claims.
      additionalProperties: false
      type: object
      required:
      - id
      - title
      - position
      title: MatterSummarySection
      description: One heading of the narrative.
    MatterSummaryExport:
      properties:
        format:
          type: string
          title: Format
          description: The format that was rendered.
          examples:
          - docx
        filename:
          type: string
          title: Filename
          description: A filename derived from the matter's own name.
          examples:
          - msa-acme-v3.docx
        sizeBytes:
          type: integer
          title: Sizebytes
          description: Decoded size, so you can check `content` round-tripped.
          examples:
          - 248193
        content:
          type: string
          title: Content
          description: The file, base64-encoded.
          examples:
          - UEsDBBQABgAIAAAAIQ...
      additionalProperties: false
      type: object
      required:
      - format
      - filename
      - sizeBytes
      - content
      title: MatterSummaryExport
      description: 'A rendered summary, returned as bytes rather than as a signed URL.


        Same reasoning as the facts and draft exports: the renderer runs on demand and

        writes no object, so a URL would mean storing client work product first.'
    OperationStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - cancelled
      title: OperationStatus
      description: 'The public five. There is no sixth, and there are no synonyms.


        Internal vocabularies spell terminal success `completed`, `ready`,

        `extracted`, `succeeded` and `fresh`; terminal failure `failed` and `error`;

        queued `pending`, `queued` and `draft`. All of that is collapsed here by

        `app.workspace_api.adapters.status_map`, which refuses to guess.'
    Pagination:
      properties:
        limit:
          type: integer
          title: Limit
          description: The `limit` that was applied to this request.
          examples:
          - 50
        offset:
          type: integer
          title: Offset
          description: The `offset` that was applied to this request.
          examples:
          - 0
        total:
          type: integer
          title: Total
          description: Total rows matching the filter, not the number returned in `data`. Use it to size a job before running it.
          examples:
          - 128
        hasMore:
          type: boolean
          title: Hasmore
          description: True when rows remain beyond this window. Derived from `offset + len(data) < total`, so a full final page correctly reports `false` rather than sending you after an empty page.
          examples:
          - false
      additionalProperties: false
      type: object
      required:
      - limit
      - offset
      - total
      - hasMore
      title: Pagination
      description: 'Where the caller is, and whether there is more.


        `total` is the count of rows matching the filter, not the count returned,

        so a caller can size a job before running it.'
    OperationProgress:
      properties:
        done:
          type: integer
          minimum: 0.0
          title: Done
          description: How many units are finished.
          examples:
          - 24
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: How many units there are in total. Can legitimately be zero for an empty run.
          examples:
          - 128
        unit:
          type: string
          enum:
          - cells
          - steps
          - documents
          - files
          - rows
          - percent
          title: Unit
          description: 'What `done` and `total` are counting. Always read it: a workflow run counts `percent` while a matrix run counts `cells`, so `{done: 43, total: 100}` alone is ambiguous.'
          examples:
          - cells
      additionalProperties: false
      type: object
      required:
      - done
      - total
      - unit
      title: OperationProgress
      description: 'How far along, and in what units.


        The unit is not decoration. A workflow run stores only a percentage while a

        matrix run stores cell counts, so `{done: 43, total: 100}` with no unit reads

        as 43 of 100 documents and a client builds a wrong estimate from it.'
    SummaryClaim:
      properties:
        id:
          type: string
          title: Id
          description: Stable within this summary.
          examples:
          - 3d7a1c05-8e64-4b2f-9a1d-7c5e8f0b2a41
        text:
          type: string
          title: Text
          description: The claim, as one sentence.
          examples:
          - Neither party shall be liable for indirect or consequential damages.
        position:
          type: integer
          title: Position
          description: Reading order within the section.
          examples:
          - 0
        claimType:
          anyOf:
          - type: string
          - type: 'null'
