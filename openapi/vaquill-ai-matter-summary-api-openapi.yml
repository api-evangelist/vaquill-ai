  /v1/matters/{matterId}/summaries/{summaryId}/exports:
    post:
      tags:
      - Matter summary
      summary: Export a matter summary as PDF or DOCX
      description: 'Render the summary to PDF or DOCX and return the bytes.


        A POST rather than a GET because the file is rendered per call rather than

        fetched, and recording that as a creation is what lets an audit answer who

        took a copy and when.


        409 while the summary is still generating: it exists, and there is nothing to

        render yet.'
      operationId: summaries.export
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: summaryId
        in: path
        required: true
        schema:
          type: string
          title: Summaryid
        description: '`sum_` identifier of the matter summary. Returned on the operation that generated it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatterSummaryExportRequest'
            example:
              format: pdf
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterSummaryExport'
              example:
                format: docx
                filename: msa-acme-v3.docx
                sizeBytes: 248193
                content: UEsDBBQABgAIAAAAIQ...
        '422':
          description: The request does not match the published schema. `errors` names each rejected field and why. The submitted value is never echoed back.
          headers:
