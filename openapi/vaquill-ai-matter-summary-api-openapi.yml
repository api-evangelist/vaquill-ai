          description: The date the claim is about, when it names one.
          examples:
          - '2026-08-19'
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
          description: 0 to 1.
          examples:
          - 0.92
        citations:
          items:
            $ref: '#/components/schemas/SummaryCitation'
