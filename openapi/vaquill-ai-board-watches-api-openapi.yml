          - type: 'null'
          title: Webhookurl
          description: Required when channel is webhook or both.
        webhookSecret:
          anyOf:
          - type: string
          - type: 'null'
          title: Webhooksecret
          description: 'Optional signing secret, stored encrypted and never returned. When set, every delivery carries an `X-Vaquill-Signature: sha256=<hex>` header: HMAC-SHA256 of the raw request body bytes, keyed with this secret. To verify, compute the same HMAC over the raw body you received (before parsing JSON) and compare it, constant-time, to the hex digest after `sha256=`.'
