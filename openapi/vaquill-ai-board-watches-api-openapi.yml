  /api/v1/watches/{watch_id}/changes/{change_id}/diff:
    get:
      tags:
      - Board Watches
      summary: Old-vs-new text for one change
      description: 'The section''s text before and after this specific change, when available (see `hasDiff` on the change list above).


        How many sides a change has depends on its kind, and each is a complete answer:


        - `amended` -- both sides. This is the only kind where one side alone is not a partial answer but no answer.

        - `added` -- after side only. There is no before side by definition, and the full text of a newly published section is precisely what the notification is for.

        - `removed` -- before side only, the last text we held.


        A missing side is not an error: `hasBefore`/`hasAfter` say which text is actually present, so a caller can render a graceful ''diff unavailable'' state for older changes or a snapshot that failed to capture, instead of treating null as a failure.


        **Cost**: 4 credits per call (see `/api-credits/pricing`). This is the only metered route in the alerts family: every other board and watch endpoint, including the `/changes` list this reads from, is free.


        You are charged only for a diff that answers the question its kind asks, and `creditsConsumed` always reports what was actually billed. Refunded in full (`creditsConsumed: 0`): an `amended` change missing either side, an `amended` change whose two sides resolve to identical text (a capture artifact on our side, not a change on the publisher''s), and any change resolving no text at all. A one-sided `added` or `removed` diff is the complete answer and is charged normally.'
      operationId: get_watch_change_diff_api_v1_watches__watch_id__changes__change_id__diff_get
      parameters:
      - name: watch_id
        in: path
        required: true
        schema:
          type: string
          title: Watch Id
      - name: change_id
        in: path
        required: true
        schema:
          type: integer
          title: Change Id
      responses:
        '200':
          description: The change's before/after text (either side may be absent).
          content:
            application/json:
              schema: {}
              example:
                data:
                  changeId: 91
                  changeKind: amended
                  beforeText: An application for approval of a new drug...
                  afterText: An application for approval of a new drug or amended new drug...
                  hasBefore: true
                  hasAfter: true
                meta:
                  processingTimeMs: 41.0
                  creditsConsumed: 4
        '401':
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '402':
          description: Insufficient API credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '403':
          description: API key lacks `research:read` scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '404':
          description: Watch not found, or the change is not covered by this watch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    servers:
    - url: https://api.vaquill.ai
      description: Production
  /api/v1/watches/{watch_id}/deliveries:
    get:
      tags:
      - Board Watches
      summary: List delivery history for a watch
      description: 'The most recent webhook delivery attempts for a watch you own, newest first. Only webhook/both channel watches have delivery history; an email-only watch always returns an empty list here (email sends are not logged per-attempt). Test deliveries (`POST /watches/{id}/test`) never appear -- they are deliberately not persisted.


        `consecutiveFailures` counts how many of the most recent attempts failed in a row, and `deliveryHealth` is `failing` once that reaches 3. Read them before reading the list: a watch can keep firing on schedule and delivering nothing, and the streak is the only field that distinguishes that from a bad day. `consecutiveFailuresTruncated` is true when the streak fills the whole page, meaning the real run is at least this long.


        **Nothing notifies you when a webhook starts failing. Poll this route.** We alert ourselves after 3 consecutive failures, but we send you no email and no callback, and a failing receiver is in your infrastructure rather than ours. A watch stays active and keeps being dispatched while every delivery fails, so silence from your endpoint is not evidence that the law did not change. Check `deliveryHealth` on a schedule of your own.


        `error` on each attempt says WHY it failed, including the redirect target when an endpoint answered 3xx. Deliveries do not follow redirects: a 3xx is a failed delivery, not a delivered one, so register the endpoint''s final URL.


        **Free.**'
      operationId: list_watch_deliveries_api_v1_watches__watch_id__deliveries_get
      parameters:
      - name: watch_id
        in: path
        required: true
        schema:
          type: string
          title: Watch Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Max deliveries to return.
          default: 50
          title: Limit
        description: Max deliveries to return.
      responses:
        '200':
          description: The watch's delivery history, newest first.
          content:
            application/json:
              schema: {}
              example:
                data:
                  deliveries:
                  - id: 42
                    watchId: 9f2b1e0a-1234-4a11-8b1c-abcdef123456
                    refreshLogId: 1587
                    attemptedAt: '2026-08-05T07:00:03Z'
                    statusCode: 200
                    success: true
                    attemptNumber: 1
                  consecutiveFailures: 0
                  consecutiveFailuresTruncated: false
                  deliveryHealth: ok
                meta:
                  processingTimeMs: 15.0
                  creditsConsumed: 0
        '401':
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '403':
          description: API key lacks `research:read` scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '404':
          description: Watch not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
