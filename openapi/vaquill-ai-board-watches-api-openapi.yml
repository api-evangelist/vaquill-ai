          anyOf:
          - type: string
          - type: 'null'
          title: Emailaddress
          description: New email address. Only valid on an email/both channel watch. Cannot be cleared.
        webhookAuth:
          anyOf:
          - $ref: '#/components/schemas/WebhookAuthRequest'
          - type: 'null'
          description: 'Replace the outbound credential config. Sent as a whole object, not field by field: a scheme without a credential is not a partial edit, it is a broken config. Send `{"scheme": "none"}` to remove auth entirely. Keeping the same scheme and omitting `secret` retains the stored credential, so you can rename a header without re-entering the token.'
      type: object
      title: UpdateWatchRequest
    ApiDetailError:
      properties:
        detail:
          type: string
          title: Detail
          description: 'Human-readable reason, safe to surface to an end user. Branch on the HTTP status rather than on this string: the wording is not part of the contract and may be reworded, but 401 (bad key), 402 (out of credits), 403 (missing scope), 404 (no such resource) and 429 (rate limited) are stable.'
          examples:
