  /v1/matters/{matterId}:
    get:
      tags:
      - Matters
      summary: Get a matter
      description: 'One matter by id.


        A `404` covers "no such matter", "not this organization''s" and "outside this

        installation''s matter allowlist" alike. The three are deliberately

        indistinguishable, so the status cannot be used to discover which matters

        exist elsewhere.'
      operationId: matters.get
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matter'
              example:
                id: mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                name: Acme / Series B Financing
                clientId: cli_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                description: Master services agreement with Acme for the 2026 platform rollout.
                instructions: House paper. Cap liability at 12 months of fees; never accept uncapped indemnity.
                status: open
                practiceArea: commercial
                matterType: financing
                caseNumber: 2026-CV-0117
                responsibleAttorneyName: Dana Whitfield
                openDate: '2026-08-19'
                closeDate: '2026-08-19'
                billingType: hourly
