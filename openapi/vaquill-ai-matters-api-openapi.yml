components:
  schemas:
    Matter:
      properties:
        id:
          type: string
          title: Id
          description: Public identifier, `mat_` followed by 32 hex characters. This is the value that goes in every matter-nested path.
          examples:
          - mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        name:
          type: string
          title: Name
          description: The matter's display name.
          examples:
          - Acme / Series B Financing
        clientId:
          anyOf:
          - type: string
          - type: 'null'
          title: Clientid
          description: '`cli_` identifier of the client this matter belongs to, if one was set.'
          examples:
          - cli_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Free-text description of the matter.
          examples:
          - Master services agreement with Acme for the 2026 platform rollout.
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
          description: Standing instructions the customer wants applied to AI work on this matter. Carried into drafting and review prompts.
          examples:
          - House paper. Cap liability at 12 months of fees; never accept uncapped indemnity.
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          description: Lifecycle status. Usually `open`, `pending` or `closed`, but published as a plain string because production holds values no UI offers. Do not branch on it without a fallback.
          examples:
          - open
        practiceArea:
          anyOf:
          - type: string
          - type: 'null'
          title: Practicearea
          description: Practice area, for example `employment` or `real_estate`. Free text.
          examples:
          - commercial
        matterType:
          anyOf:
          - type: string
          - type: 'null'
          title: Mattertype
          description: Customer's own sub-classification of the matter. Free text.
          examples:
          - financing
        caseNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Casenumber
          description: Docket or internal case reference.
          examples:
          - 2026-CV-0117
        responsibleAttorneyName:
          anyOf:
          - type: string
          - type: 'null'
          title: Responsibleattorneyname
          description: Name of the attorney responsible for the matter. The underlying user id is deliberately not published.
          examples:
          - Dana Whitfield
        openDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Opendate
          description: Date the matter opened (`YYYY-MM-DD`).
          examples:
          - '2026-08-19'
        closeDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Closedate
          description: Date the matter closed (`YYYY-MM-DD`). Absent while it is open.
          examples:
          - '2026-08-19'
        billingType:
          anyOf:
          - type: string
          - type: 'null'
          title: Billingtype
          description: Billing arrangement, normally one of `hourly`, `flat_fee`, `contingency` or `pro_bono`. Published as a plain string.
          examples:
          - hourly
        billingRate:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Billingrate
          description: Billing rate in `billingCurrency`. Rendered as a JSON STRING, not a number, so the value stays exact.
          examples:
          - '450.00'
        billingCurrency:
          anyOf:
          - type: string
          - type: 'null'
          title: Billingcurrency
          description: ISO 4217 currency code for `billingRate`, for example `USD`.
          examples:
          - USD
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
          description: ISO 3166-1 alpha-2 country code, for example `US`. Unlike a client's `country`, this is a validated code.
          examples:
          - US
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Arbitrary JSON the customer stores against the matter. Vaquill never reads it.
        isDefault:
          type: boolean
          title: Isdefault
          description: 'True for the one matter minted at signup that unfiled work lands in. Read-only: exactly one exists per organization and this API cannot create or move it.'
          default: false
          examples:
          - false
        createdAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Createdat
          description: When the matter was created (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
        updatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updatedat
          description: When the matter was last modified (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
      additionalProperties: false
      type: object
      required:
      - id
      - name
      title: Matter
      description: A matter as this API publishes it.
    MatterUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
          description: New display name. Cannot be set to null; omit it to leave the name alone.
          examples:
          - Acme / Series B Financing
        clientId:
          anyOf:
          - type: string
          - type: 'null'
          title: Clientid
          description: '`cli_` identifier to refile the matter under, or null to unfile it. Must belong to your organization.'
          examples:
          - cli_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        description:
          anyOf:
          - type: string
            maxLength: 5000
          - type: 'null'
          title: Description
          description: New description, or null to clear it.
          examples:
          - Master services agreement with Acme for the 2026 platform rollout.
        instructions:
          anyOf:
          - type: string
            maxLength: 10000
          - type: 'null'
          title: Instructions
          description: New standing instructions, or null to clear them.
          examples:
          - House paper. Cap liability at 12 months of fees; never accept uncapped indemnity.
        status:
          anyOf:
          - $ref: '#/components/schemas/MatterStatus'
          - type: 'null'
          description: New lifecycle status, or null to clear it.
          examples:
          - open
        practiceArea:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Practicearea
          description: New practice area, or null to clear it.
          examples:
          - commercial
        matterType:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Mattertype
          description: New matter type, or null to clear it.
          examples:
          - financing
        caseNumber:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Casenumber
          description: New case reference, or null to clear it.
          examples:
          - 2026-CV-0117
        responsibleAttorneyName:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Responsibleattorneyname
          description: New responsible attorney name, or null to clear it.
          examples:
          - Dana Whitfield
        openDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Opendate
          description: New open date, or null to clear it.
          examples:
          - '2026-08-19'
        closeDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Closedate
          description: New close date, or null to clear it. Setting one does not change `status`.
          examples:
          - '2026-08-19'
        billingType:
          anyOf:
          - $ref: '#/components/schemas/BillingType'
          - type: 'null'
          description: New billing arrangement, or null to clear it.
          examples:
          - hourly
        billingRate:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Billingrate
          description: New billing rate, or null to clear it.
          examples:
          - '450.00'
        billingCurrency:
          anyOf:
          - type: string
            pattern: ^[A-Z]{3}$
          - type: 'null'
          title: Billingcurrency
          description: New ISO 4217 currency code, or null to clear it.
          examples:
          - USD
        country:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}$
          - type: 'null'
          title: Country
          description: New ISO 3166-1 alpha-2 country code, or null to clear it.
          examples:
          - US
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Replacement metadata object, or null to clear it. Not merged with what is stored.
      additionalProperties: false
      type: object
      title: MatterUpdateRequest
      description: A partial update. Absent leaves alone; explicit null clears.
    MatterStatus:
      type: string
      enum:
      - open
      - pending
      - closed
      title: MatterStatus
      description: The write vocabulary. The read side accepts whatever is stored.
    MatterCreateRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          description: Display name for the matter. Trimmed; whitespace alone is refused.
          examples:
          - Acme / Series B Financing
        clientId:
          anyOf:
          - type: string
          - type: 'null'
          title: Clientid
          description: '`cli_` identifier of the client to file this matter under. Must belong to your organization.'
          examples:
          - cli_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        description:
          anyOf:
          - type: string
            maxLength: 5000
          - type: 'null'
          title: Description
          description: Free-text description of the matter.
          examples:
          - Master services agreement with Acme for the 2026 platform rollout.
        instructions:
          anyOf:
          - type: string
            maxLength: 10000
          - type: 'null'
          title: Instructions
          description: Standing instructions to apply to AI work on this matter. Carried into drafting and review prompts, so this is where house style and known counterparties belong.
          examples:
          - House paper. Cap liability at 12 months of fees; never accept uncapped indemnity.
        status:
          $ref: '#/components/schemas/MatterStatus'
          description: Lifecycle status. Defaults to `open`.
          default: open
          examples:
          - open
        practiceArea:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Practicearea
          description: Practice area, for example `employment`. Free text.
          examples:
          - commercial
        matterType:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Mattertype
          description: Your own sub-classification of the matter. Free text.
          examples:
          - financing
        caseNumber:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Casenumber
          description: Docket or internal case reference.
          examples:
          - 2026-CV-0117
        responsibleAttorneyName:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Responsibleattorneyname
          description: 'Name of the responsible attorney. A name, not an identifier: this API does not resolve users.'
          examples:
          - Dana Whitfield
        openDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Opendate
          description: Date the matter opened (`YYYY-MM-DD`).
          examples:
          - '2026-08-19'
        closeDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Closedate
          description: Date the matter closed (`YYYY-MM-DD`).
          examples:
          - '2026-08-19'
        billingType:
          anyOf:
          - $ref: '#/components/schemas/BillingType'
          - type: 'null'
          description: Billing arrangement for the matter.
          examples:
          - hourly
        billingRate:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Billingrate
          description: Billing rate in `billingCurrency`. Send it as a JSON string to keep the value exact.
          examples:
          - '450.00'
        billingCurrency:
          anyOf:
          - type: string
            pattern: ^[A-Z]{3}$
          - type: 'null'
          title: Billingcurrency
          description: ISO 4217 currency code for `billingRate`, three uppercase letters, for example `USD`.
          examples:
          - USD
        country:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}$
          - type: 'null'
          title: Country
          description: ISO 3166-1 alpha-2 country code, two uppercase letters, for example `US`.
          examples:
          - US
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Arbitrary JSON to store against the matter. Vaquill never reads it.
      additionalProperties: false
      type: object
      required:
      - name
      title: MatterCreateRequest
      description: Everything a caller may set when creating a matter.
    Page_Matter_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Matter'
          type: array
          title: Data
          description: The rows in this window, in the collection's default order.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Where this window sits in the full result set.
      additionalProperties: false
      type: object
      required:
      - data
      - pagination
      title: Page[Matter]
    ValidationProblem:
      type: object
      title: ValidationProblem
      description: A problem document for a schema rejection. `errors` lists the fields that were refused. The value you submitted is deliberately not echoed, so a validation failure cannot copy your content into an error response or into either side's logs.
      required:
      - type
      - title
      - status
      - detail
      - instance
      - errors
      properties:
        type:
          type: string
          format: uri
          description: The stable identifier for this error, and the one field to branch on. Resolves to a page describing it.
          examples:
          - https://vaquill.ai/docs/workspace-api/errors/insufficient-scope
        title:
          type: string
          description: A short human-readable summary.
          examples:
