    patch:
      tags:
      - Matters
      summary: Update a matter
      description: 'Apply a partial update to a matter.


        Omitted fields are left alone; an explicit `null` clears the field, except

        `name`, which cannot be nulled. Setting `closeDate` does not change

        `status`: the two are independent, so close the matter explicitly if that is

        what you mean.'
      operationId: matters.update
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatterUpdateRequest'
            example:
              name: Acme / Series B Financing
              clientId: cli_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
              description: Master services agreement with Acme for the 2026 platform rollout.
