          application/json:
            schema:
              $ref: '#/components/schemas/ResearchConfigUpdateRequest'
            example:
              ragTier: standard
              enableWebSearch: false
              enableCorpusSearch: false
              enableMatterDocsSearch: false
              enableAgenticMode: false
              enableDeepResearchMode: false
              countryCode: US
              usStates:
              - ca
