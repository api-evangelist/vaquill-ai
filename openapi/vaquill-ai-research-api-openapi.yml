  /v1/matters/{matterId}/messages/{messageId}/verifications:
    post:
      tags:
      - Research
      summary: Verify an answer against its sources
      description: 'Check an answer against the sources that produced it. 202 with an operation.


        Verification is RAG-native: it checks whether the answer accurately

        represented the passages it was built from, not whether the answer agrees

        with the open web. When a question is scoped to a customer''s own documents,

        fact-checking it against the internet contradicts what they asked for.


        An answer with no stored source passages is refused with 422

        `message-not-verifiable` rather than a generic error. That is a real state

        rather than a defect: a turn answered by a summarize, extract or rewrite

        route emits no source cards by design, and there is nothing to check it

        against.


        Verifying twice replaces the previous result. `message_verifications` holds

        one row per message.'
      operationId: messages.verify
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
