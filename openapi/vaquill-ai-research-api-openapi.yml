    patch:
      tags:
      - Research
      summary: Update a matter's research settings
      description: 'Change a matter''s research defaults. Omitted fields are left alone.


        `maxMultiHopIterations` above 3, `enableHallucinationDetection` and

        `enableTemporalTracking` are deep-tier only, enforced by a database

        constraint over all four columns at once. So a patch that sets `ragTier` to

        `standard` while any of them is on is refused with 422 naming both sides; set

        the tier and clear the flags in the same request.


        An unrecognised `usCorpusTypes` token is refused rather than dropped.

        Silently ignoring one hands back the whole unfiltered corpus, and the answer

        it produces is just as confident.'
      operationId: matters.updateResearchConfig
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
