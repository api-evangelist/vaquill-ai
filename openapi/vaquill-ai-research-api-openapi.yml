          description: '`standard` (fast, 26 techniques) or `deep` (35 techniques, multi-hop, hallucination detection).'
          examples:
          - standard
        enableWebSearch:
          type: boolean
          title: Enablewebsearch
          description: Whether questions may search the web by default.
          examples:
          - false
        enableCorpusSearch:
          type: boolean
          title: Enablecorpussearch
          description: Whether questions may search the shared US legal corpus by default.
          examples:
          - false
        enableMatterDocsSearch:
          type: boolean
          title: Enablematterdocssearch
          description: Whether questions search this matter's own documents by default.
          examples:
          - false
        enableAgenticMode:
          type: boolean
          title: Enableagenticmode
          description: Whether questions run the LLM-driven tool loop by default.
          examples:
          - false
        enableDeepResearchMode:
          type: boolean
          title: Enabledeepresearchmode
          description: Whether questions run a long web-research pass by default.
          examples:
          - false
        countryCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Countrycode
          description: ISO 3166-1 alpha-2 jurisdiction for this matter.
          examples:
          - US
        usStates:
          items:
            type: string
          type: array
          title: Usstates
          description: 'Retrieval scope: state codes and/or `federal`. Empty means no restriction.'
          examples:
          - - ca
            - federal
        usCorpusTypes:
          items:
            type: string
          type: array
          title: Uscorpustypes
          description: Retrieval scope by kind of law. Empty means every corpus is in scope.
          examples:
          - - STATE
        maxMultiHopIterations:
          anyOf:
          - type: integer
          - type: 'null'
          title: Maxmultihopiterations
          description: How many retrieval hops a deep-tier question may take, 1 to 5.
          examples:
          - 1
        enableHallucinationDetection:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enablehallucinationdetection
          description: Deep tier only. Cannot be true while `ragTier` is `standard`; the database refuses the combination.
          examples:
          - false
        enableTemporalTracking:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabletemporaltracking
          description: Deep tier only, under the same constraint.
          examples:
          - false
        tierChangedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Tierchangedat
          description: When the tier was last changed.
          examples:
          - '2026-08-19T14:32:10Z'
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: When these settings were first written.
          examples:
          - '2026-08-19T14:32:10Z'
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
          description: When they last changed.
          examples:
          - '2026-08-19T14:32:10Z'
      additionalProperties: false
      type: object
      required:
      - matterId
      - ragTier
      - enableWebSearch
      - enableCorpusSearch
      - enableMatterDocsSearch
      - enableAgenticMode
      - enableDeepResearchMode
      - createdAt
      - updatedAt
      title: ResearchConfig
      description: 'The retrieval settings a matter applies to every question asked in it.


        Narrower than the internal `RAGTierConfigResponse`, and each omission is a

        rule rather than an oversight. `embedderProvider` and `rerankerProvider` are

        provider selection. `maxCostPerQueryCents` and `maxLatencyMs` are NULL on all

        771 production rows and are read by nothing in the pipeline, so publishing

        them would publish a budget knob that bounds no budget. `tierChangedBy` is an

        internal `auth.users` uuid. `enableSlackThreads` positions a panel in our

        web app. `tierCapabilities` and `costEstimate` are marketing copy and an

        estimate we do not stand behind. `agenticToolConfig` is six keys that are

        accepted, stored, and dropped on read by a model that declares no fields.'
    ArticleRequest:
      properties:
        url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Url
          description: The page to read.
          examples:
          - https://example.com
        maxCharacters:
          type: integer
          maximum: 100000.0
          minimum: 1000.0
          title: Maxcharacters
          description: Ceiling on the text returned.
          default: 50000
          examples:
          - 50000
      additionalProperties: false
      type: object
      required:
      - url
      title: ArticleRequest
      description: Fetch one page's full text. Same egress note as `SimilarRequest`.
    Page_Skill_:
      properties:
