      title: Page[Chat]
    OperationStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - cancelled
      title: OperationStatus
      description: 'The public five. There is no sixth, and there are no synonyms.


        Internal vocabularies spell terminal success `completed`, `ready`,

        `extracted`, `succeeded` and `fresh`; terminal failure `failed` and `error`;

        queued `pending`, `queued` and `draft`. All of that is collapsed here by

        `app.workspace_api.adapters.status_map`, which refuses to guess.'
    Verification:
      properties:
        messageId:
          type: string
          title: Messageid
          description: '`msg_` identifier of the message that was verified.'
          examples:
          - msg_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: Where the verification got to. `succeeded` means the numbers below are final; before that they are zero.
          examples:
          - queued
        overallStatus:
          anyOf:
          - type: string
            enum:
            - fully_verified
            - mostly_verified
            - partially_verified
            - mostly_unverified
            - no_claims
            - web_sources_only
            - error
          - type: 'null'
          title: Overallstatus
          description: 'The headline verdict. `web_sources_only` is not a failure: the answer was built from web pages, which this verifier does not re-fetch. `no_claims` means nothing in the answer was checkable, which is the honest result for a clarifying question.'
          examples:
          - fully_verified
        verificationScore:
          anyOf:
          - type: number
          - type: 'null'
          title: Verificationscore
          description: Share of claims that came back verified, 0 to 1.
          examples:
          - 1.0
        calibratedScore:
          anyOf:
          - type: number
          - type: 'null'
          title: Calibratedscore
          description: The same score adjusted for the model's known overconfidence. Prefer this one when you are thresholding.
          examples:
          - 1.0
        totalClaims:
          type: integer
          title: Totalclaims
          description: How many checkable claims were extracted.
          default: 0
          examples:
          - 0
        verifiedClaims:
          type: integer
          title: Verifiedclaims
          description: How many were supported by a source.
          default: 0
          examples:
          - 0
        unverifiedClaims:
          type: integer
          title: Unverifiedclaims
          description: How many had no supporting source.
          default: 0
          examples:
          - 0
        contradictedClaims:
          type: integer
          title: Contradictedclaims
          description: How many a source actively contradicted.
          default: 0
          examples:
          - 0
        claims:
          items:
            $ref: '#/components/schemas/VerifiedClaim'
          type: array
          title: Claims
          description: The per-claim verdicts, in the order they appear.
        verifiedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Verifiedat
          description: When the verification finished. Null while it is still running.
          examples:
          - '2026-08-19T14:32:10Z'
      additionalProperties: false
      type: object
      required:
      - messageId
      - status
      title: Verification
      description: 'Whether an answer accurately represented the sources it was built from.


        RAG-NATIVE, and deliberately so: it checks the answer against the passages

        that produced it, not against the open web. When a customer scopes a question

        to its own documents, fact-checking the answer against the internet

        contradicts what they asked for. The internal product has a web-backed

        variant; publishing both would publish a choice this API has no way to

        explain.'
    WebResult:
      properties:
        url:
