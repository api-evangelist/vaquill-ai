                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    servers:
    - url: https://api.vaquill.ai/workspace
      description: Vaquill Legal Workspace API (production)
    - url: /workspace
      description: Vaquill Legal Workspace API (relative to the mount)
  /v1/web-search/contents:
    post:
      tags:
      - Research
      summary: Read a page in full
      description: 'Read one page in full, with boilerplate removed.


        A live fetch rather than a cached excerpt, so it is the right call when a

        search result''s snippet is not enough to decide whether a source is on point.'
      operationId: webSearch.content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
            example:
              url: https://example.com
              maxCharacters: 50000
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleContent'
              example:
                url: https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
                title: Master Services Agreement
                text: Neither party shall be liable for indirect or consequential damages.
                summary: Twelve substantive changes, seven of them in the liability and indemnity sections.
                highlights:
                - value
                publishedDate: '2026-08-19T14:32:10Z'
                author: value
        '422':
          description: The request does not match the published schema. `errors` names each rejected field and why. The submitted value is never echoed back.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: The credential is missing, malformed, unknown, revoked or expired. `type` is `invalid-credential`, or `wrong-product-credential` when a `vq_key_` Data API key was sent to this API.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
            WWW-Authenticate:
              description: RFC 9110 authentication challenge.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The credential does not carry a scope this operation requires (`insufficient-scope`), or the organization's installation is suspended (`installation-inactive`).
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
            WWW-Authenticate:
              description: RFC 9110 authentication challenge.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests for this credential's tier. Honour `Retry-After`.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: An unexpected error on our side. The body carries a stable `type` and the request id and nothing else; the cause is in our logs.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: A dependency this request needs is unavailable, so nothing was done. Retryable. Authentication fails closed rather than admitting the request, so this is never a statement about your credential.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    servers:
    - url: https://api.vaquill.ai/workspace
      description: Vaquill Legal Workspace API (production)
    - url: /workspace
      description: Vaquill Legal Workspace API (relative to the mount)
components:
  schemas:
    DeepResearchRequest:
      properties:
        query:
          type: string
          maxLength: 5000
          minLength: 10
          title: Query
          description: The research question, 10 to 5,000 characters. Detailed questions work best; this is a research brief rather than a search query.
          examples:
          - value valu
        jurisdiction:
          type: string
          maxLength: 32
          title: Jurisdiction
          description: Legal jurisdiction context for the research prompt. Defaults to `us`.
          default: us
          examples:
          - US
        usState:
          anyOf:
          - type: string
          - type: 'null'
          title: Usstate
          description: 'Two-letter lowercase state code to steer the research toward, honoured only when `jurisdiction` is `us`. A soft steer: there is no hard state filter on web research.'
          examples:
          - ca
      additionalProperties: false
      type: object
      required:
      - query
      title: DeepResearchRequest
      description: 'A long web-research pass, posted into a conversation.


        Answers 202. The report lands as an assistant message in the chat named in

        the path, which is what "somewhere a customer can read it later" means on a

        surface where conversation state is ours: there is no second place a

        research report belongs, and inventing one would be a second transcript.'
    WebSearchRequest:
      properties:
        query:
          type: string
          maxLength: 10000
          minLength: 2
          title: Query
          description: What to search for. Written as a search query rather than as a question; the provider is a search engine, not a model.
          examples:
          - California non-compete enforceability 2026
        limit:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Limit
          description: How many results to return, 1 to 20.
          default: 8
          examples:
          - 8
        jurisdiction:
          type: string
          maxLength: 32
          title: Jurisdiction
          description: Legal jurisdiction to steer the search toward.
          default: us
          examples:
          - US
      additionalProperties: false
      type: object
      required:
      - query
      title: WebSearchRequest
      description: A one-off web search. Touches no client data and stores nothing.
    SimilarRequest:
      properties:
        url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Url
          description: The page to find neighbours of.
          examples:
          - https://example.com
        limit:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Limit
          description: How many results to return.
          default: 8
          examples:
          - 8
        jurisdiction:
          type: string
          maxLength: 32
          title: Jurisdiction
          description: Jurisdiction to steer toward.
          default: us
          examples:
          - US
      additionalProperties: false
      type: object
      required:
      - url
      title: SimilarRequest
      description: 'Find pages similar to one you already have.


        The URL is handed to the search provider, which does the fetching, so this

        is not a request-forgery primitive against our own network. **If anyone ever

        replaces that call with a direct fetch, this URL becomes attacker-controlled

        input to our egress and needs an allowlist.** `HttpUrl` is what rejects a

        non-HTTP scheme today; do not widen it to `str`.'
    Problem:
      type: object
      title: Problem
      description: An RFC 9457 problem document. Branch on `type`, which is stable; `title` and `detail` are written for people and may be reworded. Some problems carry extra members (`requiredScopes`, `limit`, `expectedVersion`), which is why this object is open.
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          format: uri
          description: The stable identifier for this error, and the one field to branch on. Resolves to a page describing it.
          examples:
          - https://vaquill.ai/docs/workspace-api/errors/insufficient-scope
        title:
          type: string
          description: A short human-readable summary.
          examples:
          - Insufficient scope
        status:
          type: integer
          description: The HTTP status code, repeated.
          examples:
          - 403
        detail:
          type: string
          description: What went wrong on this specific request. May be reworded at any time.
          examples:
          - This credential carries matters:read. This operation needs matters:write.
        instance:
          type: string
          description: The path this problem occurred on.
          examples:
          - /workspace/v1/matters/mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        requestId:
          type: string
          description: The id of this request, identical to the `X-Request-ID` response header. Quote it when contacting support.
          examples:
          - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
      additionalProperties: true
    Citation:
      properties:
        index:
          type: integer
          title: Index
          description: 'The bracketed marker this citation belongs to. `index: 1` is every `[1]` in the answer text.'
          examples:
          - 2
        sourceType:
          type: string
          enum:
          - document
          - corpus
          - web
          - draft
          title: Sourcetype
          description: '`document` for one of your own uploaded files, `corpus` for a statute, regulation or case from the legal corpus, `web` for a page found by web search, `draft` for one of your in-progress drafts.'
          examples:
          - document
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: 'What to call the source: a filename for a document, a case or act name for corpus, a page title for web.'
          examples:
          - Master Services Agreement
        citation:
          anyOf:
          - type: string
          - type: 'null'
          title: Citation
          description: The formal legal citation string where the source has one, for example `42 U.S.C. § 1983`. Present on roughly 43% of stored sources.
          examples:
          - 42 U.S.C. § 1983
        documentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Documentid
          description: '`doc_` identifier, present only when `sourceType` is `document` and the source is one of your own files. Never a raw uuid.'
          examples:
          - doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
          description: Where to read the source, for `web` and for corpus sources that have a public page. Never a link into our storage.
          examples:
          - https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
        pageStart:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pagestart
          description: First page of the cited passage. Published only for `document` sources, so a viewer can jump to it.
          examples:
          - 1
        pageEnd:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pageend
          description: Last page of the cited passage, for `document` sources.
          examples:
          - 1
        excerpt:
          anyOf:
          - type: string
          - type: 'null'
          title: Excerpt
          description: The cited passage, truncated to 600 characters. Not the whole chunk.
          examples:
          - Every person who, under color of any statute, ordinance, regulation, custom, or usage, of any State or Territory or the District of Columbia, subjects, or causes to be subjected, any citizen of the United States or other person within the jurisdiction thereof to the deprivation of any rights, privileges, or immunities secured by the Constitution and laws, shall be liable to the party injured in an action at law.
      additionalProperties: false
      type: object
      required:
      - index
      - sourceType
      title: Citation
      description: One source behind an answer, matched to its `[N]` marker in the text.
    WebSearchResults:
      properties:
        query:
          type: string
          title: Query
          description: The query that was run.
          examples:
          - California non-compete enforceability 2026
        results:
          items:
            $ref: '#/components/schemas/WebResult'
          type: array
          title: Results
          description: The pages found.
        totalFound:
          type: integer
          title: Totalfound
          description: How many are in `results`.
          default: 0
          examples:
          - 0
      additionalProperties: false
      type: object
      required:
      - query
      title: WebSearchResults
      description: What a web search returned. Nothing is stored.
    Chat:
      properties:
        id:
          type: string
          title: Id
          description: Public identifier, `cht_` followed by 32 hex characters. Post turns to it and read its transcript back.
          examples:
          - cht_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        matterId:
          anyOf:
          - type: string
          - type: 'null'
          title: Matterid
          description: '`mat_` identifier of the matter this conversation belongs to. Null only for a conversation created before matters existed; every chat this API creates has one.'
          examples:
          - mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        title:
          type: string
          title: Title
          description: Display title. Set at creation and editable; this API never renames a conversation for you.
          examples:
          - Master Services Agreement
        hasDocuments:
          type: boolean
          title: Hasdocuments
          description: Whether any turn in this conversation pinned a document. Maintained by the pipeline, not writable.
          examples:
          - false
        documentCount:
          type: integer
          title: Documentcount
          description: How many distinct documents have been pinned across this conversation's turns.
          examples:
          - 1
        usedSkill:
          type: boolean
          title: Usedskill
          description: Whether any turn ran with a skill. Maintained by the pipeline, not writable.
          examples:
          - false
        usedAgentic:
          type: boolean
          title: Usedagentic
          description: Whether any turn ran in agentic mode. Maintained by the pipeline, not writable.
          examples:
          - false
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: When the conversation was created.
          examples:
          - '2026-08-19T14:32:10Z'
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
          description: When the conversation last changed. Maintained by a database trigger, and the order `chats.list` uses.
          examples:
          - '2026-08-19T14:32:10Z'
      additionalProperties: false
      type: object
      required:
      - id
      - title
      - hasDocuments
      - documentCount
      - usedSkill
      - usedAgentic
      - createdAt
      - updatedAt
      title: Chat
      description: One conversation inside a matter.
    OperationProgress:
      properties:
        done:
          type: integer
          minimum: 0.0
          title: Done
          description: How many units are finished.
          examples:
          - 24
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: How many units there are in total. Can legitimately be zero for an empty run.
          examples:
          - 128
        unit:
          type: string
          enum:
          - cells
          - steps
          - documents
          - files
          - rows
          - percent
          title: Unit
          description: 'What `done` and `total` are counting. Always read it: a workflow run counts `percent` while a matrix run counts `cells`, so `{done: 43, total: 100}` alone is ambiguous.'
          examples:
          - cells
      additionalProperties: false
      type: object
      required:
      - done
      - total
      - unit
      title: OperationProgress
      description: 'How far along, and in what units.


        The unit is not decoration. A workflow run stores only a percentage while a

        matrix run stores cell counts, so `{done: 43, total: 100}` with no unit reads

        as 43 of 100 documents and a client builds a wrong estimate from it.'
    ChatCreateRequest:
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 1
          title: Title
          description: Display title for the conversation, 1 to 255 characters. Whitespace is trimmed and a whitespace-only title is refused.
          examples:
          - Master Services Agreement
      additionalProperties: false
      type: object
      required:
      - title
      title: ChatCreateRequest
      description: 'Open a conversation. One INSERT; nothing is generated and nothing is spent.


        A title is required rather than derived from the first question, because the

        web app derives one from a human''s opening message and a machine''s opening

        message is usually a template. A caller that wants our derivation can send

        the question as the title.'
    OperationResource:
      properties:
        kind:
          type: string
          title: Kind
          description: What sort of thing was produced, for example `matrix` or `document`.
          examples:
          - matrix
        id:
          type: string
          title: Id
          description: Public identifier of the produced resource, carrying its own type prefix, for example `mtx_` for a matrix.
          examples:
          - mtx_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
          description: Path on this API where the resource can be read, RELATIVE to the API root and never absolute. Absent when the resource has no addressable path, which happens for work started outside a matter. Absent means the id is real and there is nowhere to GET it; it is not an error.
          examples:
          - https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
      additionalProperties: false
      type: object
      required:
      - kind
      - id
      title: OperationResource
      description: 'What the operation produced, or is producing.


        `url` is a path on this API rather than an absolute URL, because the service

        is mounted today and gets its own hostname later (docs 07.5). A relative

        path survives that move; a baked-in host does not.'
    Skill:
      properties:
        slug:
          type: string
          title: Slug
          description: The value to send as `skillSlug` on an ask.
          examples:
          - msa-buyer-side
        title:
          type: string
          title: Title
          description: Display title.
          examples:
          - Master Services Agreement
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: What the skill is for.
          examples:
          - Master services agreement with Acme for the 2026 platform rollout.
        scope:
          type: string
          title: Scope
          description: '`system` for one of ours, `organization` for one your organization authored. Personal skills are never listed here.'
          examples:
          - system
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
          description: Grouping label, where the skill has one.
          examples:
          - commercial
        jurisdiction:
          anyOf:
          - type: string
          - type: 'null'
          title: Jurisdiction
          description: Jurisdiction the skill was written for, where it is scoped to one.
          examples:
          - US
      additionalProperties: false
      type: object
      required:
      - slug
      - title
      - scope
      title: Skill
      description: 'A named prompt a question can be asked through.


        Read-only on this API. Skill authoring is a product surface with an upload

        parser behind it, and publishing a write here would make this API a second

        authoring path for prompts that steer every future answer.'
    ChatUpdateRequest:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Title
          description: New display title. Cannot be set to null; omit it to leave the title alone.
          examples:
          - Master Services Agreement
      additionalProperties: false
      type: object
      title: ChatUpdateRequest
      description: Rename a conversation. Absent leaves alone; an explicit null is refused.
    VerifiedClaim:
      properties:
        text:
          type: string
          title: Text
          description: The claim as it appears in the answer.
          examples:
          - Neither party shall be liable for indirect or consequential damages.
        status:
          type: string
          enum:
          - verified
          - partially_verified
          - unverified
          - contradicted
          - unable_to_verify
          title: Status
          description: '`contradicted` is the one that matters: a source says something different. `unverified` means no source was found for it, which for a claim of general law is common and not by itself an error.'
          examples:
          - verified
        confidence:
          type: number
          title: Confidence
          description: How sure the verifier is of this verdict, 0 to 1.
          examples:
          - 0.92
        citationIndex:
          anyOf:
          - type: integer
          - type: 'null'
          title: Citationindex
          description: The `[N]` marker the claim itself cited, when it cited one.
          examples:
          - 1
        explanation:
          anyOf:
          - type: string
          - type: 'null'
          title: Explanation
          description: Why the verifier reached this verdict, in a sentence or two.
          examples:
          - Source [2] is section 8.1 of the agreement, which excludes indirect and consequential damages for both parties, so the claim is supported as written.
        issue:
          anyOf:
          - type: string
          - type: 'null'
          title: Issue
          description: 'The specific problem, when there is one: a wrong number, a missing qualifier, a misattributed holding.'
          examples:
          - The answer says the cap is eighteen months of fees; the cited clause says twelve.
      additionalProperties: false
      type: object
      required:
      - text
      - status
      - confidence
      title: VerifiedClaim
      description: One statement pulled out of an answer, and whether the sources support it.
    AskRequest:
      properties:
        question:
          type: string
          maxLength: 50000
          minLength: 1
          title: Question
          description: What to ask, 1 to 50,000 characters. Whitespace is trimmed. Put documents in `groundIn` or `alsoConsider` rather than pasting them here.
          examples:
          - What is the liability cap, and what does it apply to?
        groundIn:
          items:
            type: string
          type: array
          maxItems: 20
          title: Groundin
          description: LOCK the answer to these `doc_` documents, at most 20. The corpus and web are suppressed and the answer is grounded only in these files. Mutually exclusive with `alsoConsider`.
          examples:
          - - value
        alsoConsider:
          items:
            type: string
          type: array
          maxItems: 20
          title: Alsoconsider
          description: ADD these `doc_` documents to what is searched, at most 20. Unlike `groundIn` the corpus and web stay in play, so use this when the documents are context rather than the whole answer.
          examples:
          - - value
        alsoConsiderDrafts:
          items:
            type: string
          type: array
          maxItems: 20
          title: Alsoconsiderdrafts
          description: '`drf_` identifiers of in-progress drafts to pin into the answer''s context, at most 20.'
          examples:
          - - value
        skillSlug:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Skillslug
          description: Slug of a skill whose prompt should steer this answer. List them with `GET /v1/skills`. An unknown or invisible slug is refused rather than ignored.
          examples:
          - nda-review
        ragTier:
          anyOf:
          - type: string
            enum:
            - standard
            - deep
          - type: 'null'
          title: Ragtier
          description: '`standard` or `deep`. Omit to use the matter''s setting. Cannot be `deep` together with `enableAgenticMode`.'
          examples:
          - standard
        enableWebSearch:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enablewebsearch
          description: Omit to use the matter's setting, which defaults to ON. `false` turns web search off for this turn only and is not persisted.
          examples:
          - false
        enableCorpusSearch:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enablecorpussearch
          description: Search the shared US legal corpus (statutes, regulations, court rules, case law). Omit to use the matter's setting, which defaults to ON.
          examples:
          - false
        enableMatterDocsSearch:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enablematterdocssearch
          description: Search the matter's own uploaded documents. Omit to use the matter's setting, which defaults to ON.
          examples:
          - false
        enableDraftSearch:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabledraftsearch
          description: 'Search the organization''s in-progress drafts. Request-only: there is no column for it on a matter, so omitting it leaves the pipeline''s own default rather than falling back to a matter setting.'
          examples:
          - false
        enableAgenticMode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enableagenticmode
          description: 'Let the model drive tools (web search, URL reading, document search) rather than retrieving once. Omit to use the matter''s setting, which defaults to OFF. Agentic mode runs on the standard model, so it cannot be combined with `ragTier: deep`.'
          examples:
          - false
        enableDeepResearchMode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabledeepresearchmode
          description: 'Answer from a long web-research pass instead of retrieval. Omit to use the matter''s setting, which defaults to OFF. **Forced off when `groundIn` is set or the question refers to the matter''s documents**: answering from the web while ignoring a pinned file is wrong. Compare `requestedSettings` with `effectiveSettings` on the answer to see whether it applied.'
          examples:
          - false
        countryCode:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}$
          - type: 'null'
          title: Countrycode
          description: ISO 3166-1 alpha-2 jurisdiction for this turn. Omit to use the matter's setting.
          examples:
          - US
        usStates:
          items:
            type: string
          type: array
          title: Usstates
          description: 'Retrieval scope: two-letter state codes and/or `federal`, for example `["ca", "federal"]`. Omit to use the matter''s setting.'
          examples:
          - - ca
            - federal
        usCorpusTypes:
          items:
            type: string
          type: array
          title: Uscorpustypes
          description: 'Retrieval scope by KIND of law rather than by government: `STATE`, `REGULATION`, `STATE_RULES` and so on. An unrecognised token is refused, never dropped: silently ignoring one hands back the whole unfiltered corpus and the answer looks just as confident.'
          examples:
          - - STATE
      additionalProperties: false
      type: object
      required:
      - question
      title: AskRequest
      description: 'One turn posted to a conversation.


        Answers 202 with an operation. There is no streaming variant and no

        synchronous mode: a customer''s backend is not a browser, the answer is well

        over the ten-second threshold that decides 200 from 202, and one capability

        with two response shapes is two integrations to test.'
    ArticleContent:
      properties:
        url:
          type: string
          title: Url
