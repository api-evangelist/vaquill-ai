      summary: Get a conversation
      description: 'One conversation: its title, when it last moved, and what it has used.


        `hasDocuments`, `documentCount`, `usedSkill` and `usedAgentic` are

        maintained by the pipeline as turns are answered, so they describe what the

        conversation has actually done rather than what it was configured to do.

        Read the turns themselves from this conversation''s `messages` collection.'
      operationId: chats.get
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
