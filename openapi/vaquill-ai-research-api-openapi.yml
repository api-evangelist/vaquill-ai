  /v1/matters/{matterId}/chats/{chatId}/messages:
    post:
      tags:
      - Research
      summary: Ask a question in a conversation
      description: 'Ask a question in this conversation. 202 with an operation to poll.


        On `succeeded`, fetch the answer from the message the operation''s

        `resource.url` points at. The question and the answer are both appended to

        the conversation, so `messages.list` shows the turn immediately, with the

        answer empty until it is written.


        **An omitted toggle means "use the matter''s setting", not "off".** On a

        matter with web search on (the default), leaving `enableWebSearch` out leaves

        it on. Send `false` to turn it off for this turn only; nothing here is

        persisted to the matter.


        A retry carrying the same `Idempotency-Key` returns the original operation

        and starts nothing, which is what makes a client timeout free rather than a

        second billed generation.'
      operationId: research.ask
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: chatId
        in: path
        required: true
