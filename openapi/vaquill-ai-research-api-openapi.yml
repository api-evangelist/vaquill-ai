          examples:
          - https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
        title:
          type: string
          title: Title
          description: Page title.
          default: ''
          examples:
          - Master Services Agreement
        text:
          type: string
          title: Text
