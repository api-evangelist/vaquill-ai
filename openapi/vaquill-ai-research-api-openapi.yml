    patch:
      tags:
      - Research
      summary: Rename a conversation
      description: 'Rename a conversation. The title is the only field you own on it.


        Everything else on a chat is either derived from its turns (the four

        activity flags) or is chrome this API does not publish. Omitted fields are

        left alone; an explicit null on the title is refused rather than written,

        because the column is NOT NULL and the database''s own message names nothing

        useful.'
      operationId: chats.update
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
