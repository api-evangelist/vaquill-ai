      summary: Move a draft to the trash
      description: 'Move a draft to the trash.


        It stops being listed, stops being readable and stops being exportable

        through this API. It is restorable for **30 days**, after which it is

        permanently removed and `drafts.restore` answers `404`. List what is in the

        trash with `state=trashed`.


        Version history is preserved for as long as the draft is. That is why this

        is not a permanent delete: the history and the `draftId` on any template run

        that produced this draft both hang off the row, and removing it would take

        them with it.


