  /v1/matters/{matterId}/drafts/{draftId}/documents:
    post:
      tags:
      - Drafting
      summary: File a draft into its matter as a document
      description: 'File the draft into its matter as a DOCX document.


        Answers `202` with a `document.ingest` operation, the same kind and the same

        envelope `uploads.complete` returns, so a caller that already polls an ingest

        has nothing new to learn. Poll it, then read `resource.id` for the

        `documentId`.


        The document lands in the draft''s own matter, the one in this path. To file

        it elsewhere, duplicate the draft into the target matter first.


        The draft is not changed and not consumed: filing it produces a second,

        independent thing, and editing the draft afterwards does not alter the

        document.'
