    - url: https://api.vaquill.ai/workspace
      description: Vaquill Legal Workspace API (production)
    - url: /workspace
      description: Vaquill Legal Workspace API (relative to the mount)
  /v1/matters/{matterId}/drafts:
    get:
      tags:
      - Drafting
      summary: List drafts in a matter
      description: 'Every draft in this matter, newest edit first, without their bodies.


        Two status fields, and they are not the same thing. `status` is where the

        DOCUMENT is in its lifecycle and you set it. `generationStatus` is where the

        JOB that produced it got to, and only the pipeline sets it. Fetch a draft by

        id to get its body.


        Pass `state=trashed` to list what has been deleted and is still restorable.

        Deleted drafts are invisible to every other read on this API, so this is the

        only way to find one whose id you no longer hold.'
      operationId: drafts.list
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: How many rows to return, 1 to 200. Defaults to 50.
          default: 50
          title: Limit
        description: How many rows to return, 1 to 200. Defaults to 50.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: 'How many rows to skip before returning any. Combine with `limit` to page: `offset=0`, then `offset=50`, and so on. Offsets are positional, not stable, so a set that changes while you page can show a row twice or not at all.'
          default: 0
          title: Offset
        description: 'How many rows to skip before returning any. Combine with `limit` to page: `offset=0`, then `offset=50`, and so on. Offsets are positional, not stable, so a set that changes while you page can show a row twice or not at all.'
      - name: state
        in: query
        required: false
        schema:
          enum:
          - active
          - trashed
          type: string
          description: 'Which drafts to list: `active` (the default) or `trashed`. A trashed draft is restorable for 30 days and is invisible to every other read on this API.'
          default: active
          title: State
        description: 'Which drafts to list: `active` (the default) or `trashed`. A trashed draft is restorable for 30 days and is invisible to every other read on this API.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_DraftSummary_'
              example:
                data:
                - id: drf_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  matterId: mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  title: Master Services Agreement
                  category: commercial
                  practiceArea: commercial
                  status: draft
                  source: generated
                  version: 3
                  generationStatus: succeeded
                  governingLawState: ca
                  createdAt: '2026-08-19T14:32:10Z'
                  updatedAt: '2026-08-19T14:32:10Z'
                pagination:
                  limit: 50
                  offset: 0
                  total: 128
                  hasMore: false
        '422':
