  /v1/matters/{matterId}/templates/{templateId}/runs:
    post:
      tags:
      - Drafting
      summary: Generate a draft from a template
      description: 'Render a template into a new draft.


        Answers `202` with an operation. Poll it, then read the run to find the

        `draftId` it produced. Values you already know go in `slotOverrides` keyed

        by the variable''s `varId`; the extractor reads the rest out of `prompt` and

        never overwrites what you supplied.'
      operationId: templates.run
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          title: Templateid
        description: '`tpl_` identifier of one of your uploaded draft templates. Take it from `GET /v1/templates`.'
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: A unique value of your choosing, so a retried launch returns the FIRST operation instead of starting a second billable job. Reusing one with a different body is refused. Retrying with the same key and the same body is free and is the intended way to recover from a timeout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRunRequest'
            example:
              prompt: Two-year mutual NDA with Acme Corporation, governed by California law.
              slotOverrides:
                party_a_name: value
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                id: op_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                type: matrix.run
                status: succeeded
                createdAt: '2026-08-19T14:32:10Z'
                completedAt: '2026-08-19T14:32:10Z'
                matterId: mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                resource:
                  kind: matrix
                  id: mtx_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
