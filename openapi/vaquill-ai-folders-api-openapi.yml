    patch:
      tags:
      - Folders
      summary: Update a folder
      description: 'Rename a folder, or move it under a different parent.


        Omitted fields are left alone; an explicit `null` on `parentId` moves the

        folder to the root. `name` cannot be nulled. Any `parentId` you name is

        verified to belong to your organization, and a cycle is refused by the

        database. A folder cannot be moved to a different matter.'
      operationId: folders.update
      parameters:
      - name: folderId
        in: path
        required: true
        schema:
          type: string
          title: Folderid
        description: '`fld_` identifier of the folder. Take it from `GET /v1/folders`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderUpdateRequest'
            example:
              name: Closing Documents
              parentId: fld_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
      responses:
