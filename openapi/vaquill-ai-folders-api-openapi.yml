    delete:
      tags:
      - Folders
      summary: Delete a folder
      description: 'Delete a folder. Refused while it still contains a folder.


        Everything else pointing at it is unfiled rather than removed: documents,

        drafts, comparisons, matrices, templates, workflow runs and chats all stay

        exactly where they are and read back with no `folderId`. Only a child folder

        would be destroyed, so that is the one thing this refuses over; list them

        with `GET /v1/folders?parentId=`.


        There is no undo, and a repeated delete answers `404`. If a delete timed

        out, treat a subsequent `404` as success.'
      operationId: folders.delete
      parameters:
      - name: folderId
        in: path
        required: true
        schema:
          type: string
          title: Folderid
        description: '`fld_` identifier of the folder. Take it from `GET /v1/folders`.'
      responses:
        '204':
          description: Successful Response
        '422':
          description: The request does not match the published schema. `errors` names each rejected field and why. The submitted value is never echoed back.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: The credential is missing, malformed, unknown, revoked or expired. `type` is `invalid-credential`, or `wrong-product-credential` when a `vq_key_` Data API key was sent to this API.
          headers:
            X-Request-ID:
