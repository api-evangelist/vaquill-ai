  /v1/folders/{folderId}:
    get:
      tags:
      - Folders
      summary: Get a folder
      description: 'One folder by id.


        A `404` covers "no such folder", "not this organization''s" and a malformed

        id alike, so the status cannot be used to discover which ids exist elsewhere.'
