        matterId:
          anyOf:
          - type: string
          - type: 'null'
          title: Matterid
          description: '`mat_` identifier to scope this folder to one matter. Must belong to your organization. Omit for a workspace-level folder shared across drafts and chats.'
          examples:
          - mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
      additionalProperties: false
      type: object
      required:
      - name
      title: FolderCreateRequest
      description: 'Everything a caller may set when creating a folder.


        Both references are verified against the calling installation''s organization

        before the row is written. Cycles are refused by the `folders_prevent_cycle`

        trigger, which is a database-level guarantee this API does not duplicate.'
