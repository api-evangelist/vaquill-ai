          - MSA, buyer side
        description:
          type: string
          title: Description
          description: What this template is for and when to pick it.
          examples:
          - Master services agreement with Acme for the 2026 platform rollout.
        contractType:
          type: string
          title: Contracttype
          description: Which contract type the template governs.
          examples:
          - msa
        category:
          type: string
          title: Category
          description: 'Broad grouping for the gallery: `commercial`, `privacy`, `hr`, `ip` or `nda`.'
          examples:
          - commercial
        userSide:
          anyOf:
          - type: string
          - type: 'null'
          title: Userside
          description: Which side of the paper this template argues for. Most templates come in a pair, and adopting the wrong one produces reviews that negotiate against your own client.
          examples:
          - buyer
        featured:
          type: boolean
          title: Featured
          description: True for the templates we surface first in the gallery.
          default: false
          examples:
          - false
        positionCount:
          type: integer
          title: Positioncount
          description: 'How many clause positions the template holds. The positions themselves are not listed here: adopt the template and read the playbook.'
          default: 0
          examples:
          - 18
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Free-text labels for filtering the gallery.
          examples:
          - - saas
            - buyer-side
        recommendedFor:
          items:
            type: string
          type: array
          title: Recommendedfor
          description: Situations this template suits, in plain language.
          examples:
          - - Vendor agreements where you are the customer
      additionalProperties: false
      type: object
      required:
      - slug
      - name
      - description
      - contractType
      - category
      title: PlaybookTemplate
      description: 'A starter template. Ours, read-only, identical for every organization.


        `positionCount` rather than the positions themselves: the materialized

        positions of one template run to tens of kilobytes, and a list of twenty

        eight would be a megabyte of response for a gallery. A caller that wants the

        content adopts the template and reads the playbook.'
    PlaybookExtractionCreateRequest:
      properties:
        documentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Documentid
          description: '`doc_` identifier of a document in this organization to read. Mutually exclusive with `contractText`.'
          examples:
          - doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        contractText:
          anyOf:
          - type: string
            maxLength: 400000
          - type: 'null'
          title: Contracttext
          description: The contract as plain text. Mutually exclusive with `documentId`. Use it when you already hold the text and do not need the file kept.
          examples:
          - 'MASTER SERVICES AGREEMENT


            This Master Services Agreement is entered into as of 19 August 2026 between Acme Corporation, a Delaware corporation, and the Supplier identified on the signature page.


            8. LIMITATION OF LIABILITY. Supplier''s total liability arising out of this Agreement shall not exceed the fees paid in the preceding twelve months, except for breach of confidentiality and indemnification for third-party intellectual property claims, which are uncapped.


            9. INDEMNIFICATION. Supplier shall defend and indemnify Acme Corporation against any third-party claim that the services infringe a United States patent, copyright or trade secret.


            11. TERM AND TERMINATION. The initial term is two years, renewing for successive one-year terms unless either party gives ninety days written notice. Acme Corporation may terminate for convenience on thirty days notice.


            12. GOVERNING LAW. This Agreement is governed by the laws of the State of Delaware, without regard to its conflict of laws rules.'
        contractType:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Contracttype
          description: 'Pin the contract type instead of detecting it. Omit to have it detected from the opening of the document, which costs nothing extra: it runs concurrently with the extraction.'
          examples:
          - msa
        useTrackedChanges:
          type: boolean
          title: Usetrackedchanges
          description: 'Read the file''s Word revision marks and extract what a reviewer pushed FROM and TO, rather than the final-state positions. Requires a `documentId` whose filename ends in `.docx`: revision marks exist only in a DOCX.'
          default: false
          examples:
          - false
      additionalProperties: false
      type: object
      title: PlaybookExtractionCreateRequest
      description: 'The contract to read positions out of. Exactly one source.


        `documentId` or `contractText`, never both and never neither. Text is

        accepted for the same reason `reviews.create` accepts it: the caller usually

        has the contract in hand, and requiring an upload first would make the

        cheapest integration a four-call dance. A `documentId` is the better choice

        when the file is a DOCX whose structure matters, and it is REQUIRED for

        tracked-changes extraction.'
    PlaybookFromTemplateRequest:
      properties:
        templateSlug:
          type: string
          maxLength: 120
          title: Templateslug
          description: '`slug` of the starter template to adopt, from `GET /v1/playbook-templates`.'
          examples:
          - msa-buyer-side
        name:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Name
          description: Name for the new playbook. Omit to take the template's own name.
          examples:
          - Acme Corporation
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Description
          description: Description for the new playbook. Omit to take the template's own.
          examples:
          - Master services agreement with Acme for the 2026 platform rollout.
        jurisdiction:
          anyOf:
          - type: string
            pattern: ^([A-Z]{2}|INTL)$
          - type: 'null'
          title: Jurisdiction
          description: Two-letter uppercase jurisdiction code, or `INTL`. Selects which default positions the template resolves.
          examples:
          - US
      additionalProperties: false
      type: object
      required:
      - templateSlug
      title: PlaybookFromTemplateRequest
      description: 'Adopt one of our starter templates as an organization playbook.


        The result is an ordinary playbook, owned by the organization and editable.

        Nothing links it back to the template afterwards: a template is a starting

        point, and a live link would imply an update path that does not exist.'
    ContractType:
      type: string
      enum:
      - saas
      - professional_services
      - msa
      - sow
      - consulting
      - license
      - sale
      - partnership
      - procurement
      - vendor_agreement
      - reseller_distribution
      - supply
      - lease
      - loan
      - eula
      - terms_of_service
      - baa
      - order_form
      - nda
      - dpa
      - ip_assignment
      - employment
      - executive_employment
      - independent_contractor
      - offer_letter
      - severance_agreement
      - non_compete
      - asset_purchase
      - stock_purchase
      - merger_agreement
      - shareholders_agreement
      - operating_agreement
      - safe
      - term_sheet
      - settlement_agreement
      - engagement_letter
      - protective_order
      - joint_defense
      - other
      title: ContractType
      description: 'Contract types a playbook can encode negotiation positions for.


        A playbook is a set of clause-level negotiation positions, so this list

        covers contracts you negotiate clause-by-clause. Documents you only

        *generate* (litigation pleadings, notices) live in `DraftCategory`

        (`app/models/drafting_schemas.py`), NOT here.


        Each value backs a `legal_playbooks.contract_type` row, so adding one

        requires a DB migration to extend the CHECK constraint (see

        `20260502160000_expand_playbook_contract_type_dpa_vendor_ip.sql`,

        `20260612130000_expand_playbook_contract_type_msa_sale_sow_consulting.sql`,

        and `20260702120000_expand_playbook_contract_type_gc_litigation.sql`).

        Kept in sync with the FE `ContractType` union + `CONTRACT_TYPE_LABELS`

        (`frontend/src/types/legal-tools.ts`); the drift-guard in

        `app/tests/unit/test_contract_type_taxonomy.py` asserts all three layers

        both ways and fails fast if they diverge.'
    Problem:
      type: object
      title: Problem
      description: An RFC 9457 problem document. Branch on `type`, which is stable; `title` and `detail` are written for people and may be reworded. Some problems carry extra members (`requiredScopes`, `limit`, `expectedVersion`), which is why this object is open.
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          format: uri
          description: The stable identifier for this error, and the one field to branch on. Resolves to a page describing it.
          examples:
          - https://vaquill.ai/docs/workspace-api/errors/insufficient-scope
        title:
          type: string
          description: A short human-readable summary.
          examples:
          - Insufficient scope
        status:
          type: integer
          description: The HTTP status code, repeated.
          examples:
          - 403
        detail:
          type: string
          description: What went wrong on this specific request. May be reworded at any time.
          examples:
          - This credential carries matters:read. This operation needs matters:write.
        instance:
          type: string
          description: The path this problem occurred on.
          examples:
          - /workspace/v1/matters/mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        requestId:
          type: string
          description: The id of this request, identical to the `X-Request-ID` response header. Quote it when contacting support.
          examples:
          - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
      additionalProperties: true
    Page_PlaybookTemplate_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/PlaybookTemplate'
          type: array
          title: Data
          description: The rows in this window, in the collection's default order.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Where this window sits in the full result set.
      additionalProperties: false
      type: object
      required:
      - data
      - pagination
      title: Page[PlaybookTemplate]
    OperationProgress:
      properties:
        done:
          type: integer
          minimum: 0.0
          title: Done
          description: How many units are finished.
          examples:
          - 24
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: How many units there are in total. Can legitimately be zero for an empty run.
          examples:
          - 128
        unit:
          type: string
          enum:
          - cells
          - steps
          - documents
          - files
          - rows
          - percent
          title: Unit
          description: 'What `done` and `total` are counting. Always read it: a workflow run counts `percent` while a matrix run counts `cells`, so `{done: 43, total: 100}` alone is ambiguous.'
          examples:
          - cells
      additionalProperties: false
      type: object
      required:
      - done
      - total
      - unit
      title: OperationProgress
      description: 'How far along, and in what units.


        The unit is not decoration. A workflow run stores only a percentage while a

        matrix run stores cell counts, so `{done: 43, total: 100}` with no unit reads

        as 43 of 100 documents and a client builds a wrong estimate from it.'
    OperationResource:
      properties:
        kind:
          type: string
          title: Kind
          description: What sort of thing was produced, for example `matrix` or `document`.
          examples:
          - matrix
        id:
          type: string
          title: Id
          description: Public identifier of the produced resource, carrying its own type prefix, for example `mtx_` for a matrix.
          examples:
          - mtx_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
          description: Path on this API where the resource can be read, RELATIVE to the API root and never absolute. Absent when the resource has no addressable path, which happens for work started outside a matter. Absent means the id is real and there is nowhere to GET it; it is not an error.
          examples:
          - https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
      additionalProperties: false
      type: object
      required:
      - kind
      - id
      title: OperationResource
      description: 'What the operation produced, or is producing.


        `url` is a path on this API rather than an absolute URL, because the service

        is mounted today and gets its own hostname later (docs 07.5). A relative

        path survives that move; a baked-in host does not.'
    Page_Playbook_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Playbook'
          type: array
          title: Data
          description: The rows in this window, in the collection's default order.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Where this window sits in the full result set.
      additionalProperties: false
      type: object
      required:
      - data
      - pagination
      title: Page[Playbook]
    PlaybookCreateRequest:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
          description: Display name for the playbook. Trimmed; whitespace alone is refused.
          examples:
          - MSA, buyer side
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Description
          description: Free-text description of what this playbook covers.
          examples:
          - Master services agreement with Acme for the 2026 platform rollout.
        contractType:
          $ref: '#/components/schemas/ContractType'
          description: Which contract type this playbook governs. Cannot be changed afterwards, because it determines which reviews resolve the playbook.
          examples:
          - saas
        positions:
          additionalProperties:
            $ref: '#/components/schemas/PlaybookPosition'
          propertyNames:
            maxLength: 80
            minLength: 1
          type: object
          maxProperties: 200
          title: Positions
