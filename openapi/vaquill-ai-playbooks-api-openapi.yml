  /v1/playbooks/{playbookId}:
    get:
      tags:
      - Playbooks
      summary: Get a playbook
      description: 'One playbook, with every position it holds.


        Positions are returned in full rather than summarized, because a playbook is

        the input a review is measured against and a caller that cannot read the

        positions cannot tell what its reviews mean.'
      operationId: playbooks.get
      parameters:
      - name: playbookId
        in: path
        required: true
        schema:
          type: string
          title: Playbookid
        description: '`pbk_` identifier of the playbook. Take it from `GET /v1/playbooks`. A starter template is addressed by its `slug` instead, not by this.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playbook'
              example:
                id: pbk_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                name: MSA, buyer side
                description: Master services agreement with Acme for the 2026 platform rollout.
                contractType: msa
                positions:
                  limitation_of_liability:
                    standardPosition: Liability is capped at the fees paid in the preceding twelve months.
                    acceptableRange: Between one and two times the fees paid in the preceding twelve months.
                    escalationTriggers:
                    - value
                    fallbackLadder:
                    - value
                    dealBreaker: value
                    priority: must_have
                    approvalLevel: none
                    escalationConditions:
                    - attribute: clause_severity
                      operator: eq
                      value: '1000000'
                      escalateTo: manager
                      note: 'Escalated to GC: deal value over $1M.'
                    rationale: Our standard position caps liability at fees paid in the preceding 12 months.
                    riskWeight: 4
                    enabled: true
                isDefault: false
