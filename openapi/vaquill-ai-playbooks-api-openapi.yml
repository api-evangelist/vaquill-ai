openapi: 3.2.0
info:
  title: Vaquill Ai Playbooks API
  version: 1.0.0
  description: 'Operations tagged Playbooks across 2 of this provider''s published API definitions: vaquill-ai-workspace-openapi.json, vaquill-ai-workspace-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vaquill.ai/workspace
  description: Vaquill Legal Workspace API (production)
- url: /workspace
  description: Vaquill Legal Workspace API (relative to the mount)
security:
- WorkspaceAuth: []
tags:
- name: Playbooks
  description: The organization's negotiating positions, per contract type, and the starter templates to build them from. A playbook is the input a contract review is measured against.
paths:
  /v1/playbooks:
    get:
      tags:
      - Playbooks
      summary: List playbooks
      description: 'Every playbook this organization owns, one page at a time.


        Organization-visible only. Personal playbooks authored in the web app

        against no organization are deliberately invisible here, because a machine

        credential has no person behind it.'
      operationId: playbooks.list
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: How many rows to return, 1 to 200. Defaults to 50.
          default: 50
          title: Limit
        description: How many rows to return, 1 to 200. Defaults to 50.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: 'How many rows to skip before returning any. Combine with `limit` to page: `offset=0`, then `offset=50`, and so on. Offsets are positional, not stable, so a set that changes while you page can show a row twice or not at all.'
          default: 0
          title: Offset
        description: 'How many rows to skip before returning any. Combine with `limit` to page: `offset=0`, then `offset=50`, and so on. Offsets are positional, not stable, so a set that changes while you page can show a row twice or not at all.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Playbook_'
              example:
                data:
                - id: pbk_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  name: MSA, buyer side
                  description: Master services agreement with Acme for the 2026 platform rollout.
                  contractType: msa
                  positions:
                    limitation_of_liability:
                      standardPosition: Liability is capped at the fees paid in the preceding twelve months.
                      acceptableRange: Between one and two times the fees paid in the preceding twelve months.
                      escalationTriggers:
                      - value
                      fallbackLadder:
                      - value
                      dealBreaker: value
                      priority: must_have
                      approvalLevel: none
                      escalationConditions:
                      - attribute: clause_severity
                        operator: eq
                        value: '1000000'
                        escalateTo: manager
                        note: 'Escalated to GC: deal value over $1M.'
                      rationale: Our standard position caps liability at fees paid in the preceding 12 months.
                      riskWeight: 4
                      enabled: true
                  isDefault: false
                  sourceFilename: msa-acme-v3.docx
                  createdAt: '2026-08-19T14:32:10Z'
                  updatedAt: '2026-08-19T14:32:10Z'
                pagination:
                  limit: 50
                  offset: 0
                  total: 128
                  hasMore: false
        '422':
          description: The request does not match the published schema. `errors` names each rejected field and why. The submitted value is never echoed back.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          description: The credential is missing, malformed, unknown, revoked or expired. `type` is `invalid-credential`, or `wrong-product-credential` when a `vq_key_` Data API key was sent to this API.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
            WWW-Authenticate:
              description: RFC 9110 authentication challenge.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The credential does not carry a scope this operation requires (`insufficient-scope`), or the organization's installation is suspended (`installation-inactive`).
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
            WWW-Authenticate:
              description: RFC 9110 authentication challenge.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests for this credential's tier. Honour `Retry-After`.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: An unexpected error on our side. The body carries a stable `type` and the request id and nothing else; the cause is in our logs.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: A dependency this request needs is unavailable, so nothing was done. Retryable. Authentication fails closed rather than admitting the request, so this is never a statement about your credential.
          headers:
            X-Request-ID:
              description: The id of this request. The same value appears as `requestId` in the body. Quote it when contacting support.
              schema:
                type: string
                examples:
                - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - Playbooks
      summary: Create a playbook
      description: 'Author a playbook from positions you supply.


        `contractType` is fixed at creation and cannot be changed afterwards, since

        it determines which reviews resolve this playbook; create a second playbook

        instead. `positions` may be empty, so creating the shell and filling it

        clause by clause is a supported flow. Playbooks cannot be deleted, because

        every review that ever ran against one references it.'
      operationId: playbooks.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybookCreateRequest'
            example:
              name: MSA, buyer side
              description: Master services agreement with Acme for the 2026 platform rollout.
              contractType: saas
              positions:
                limitation_of_liability:
                  standardPosition: Liability is capped at the fees paid in the preceding twelve months.
                  acceptableRange: Between one and two times the fees paid in the preceding twelve months.
                  escalationTriggers:
                  - value
                  fallbackLadder:
                  - value
                  dealBreaker: value
                  priority: must_have
                  approvalLevel: none
                  escalationConditions:
                  - attribute: clause_severity
                    operator: eq
                    value: '1000000'
                    escalateTo: manager
                    note: 'Escalated to GC: deal value over $1M.'
                  rationale: Our standard position caps liability at fees paid in the preceding 12 months.
                  riskWeight: 4
                  enabled: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
