  /v1/playbooks/from-template:
    post:
      tags:
      - Playbooks
      summary: Create a playbook from a starter template
      description: 'Adopt a starter template as an organization playbook.


        The result is an ordinary playbook, owned and editable. Nothing links it back

        to the template afterwards, because a live link would imply an update path

        that does not exist.'
      operationId: playbooks.fromTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybookFromTemplateRequest'
            example:
              templateSlug: msa-buyer-side
              name: Acme Corporation
              description: Master services agreement with Acme for the 2026 platform rollout.
              jurisdiction: US
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playbook'
              example:
                id: pbk_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
