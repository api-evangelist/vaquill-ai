  /v1/playbook-extractions:
    post:
      tags:
      - Playbooks
      summary: Extract starter positions from a contract
      description: 'Read starter positions out of one of your own signed contracts.


        Answers `202` with an operation. Poll it, then read the extraction for the

        positions it found.


        **Nothing is saved.** The result comes back for you to review, and

        `playbooks.create` is the separate call that adopts it: an extraction is a

        model''s reading of a contract, and persisting a misclassified one as the

        positions your automated reviews run against is a mistake nobody would see

        until a review cited it. The published position shape is exactly the one

        `playbooks.create` accepts, so adopting is a copy rather than a translation.


        Send either a `documentId` you uploaded or `contractText` you already hold,

        never both. `useTrackedChanges` reads a `.docx`''s Word revision marks and

        extracts what a reviewer pushed FROM and TO, rather than the final positions.'
      operationId: playbookExtractions.create
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: A unique value of your choosing, so a retried launch returns the FIRST operation instead of starting a second billable job. Reusing one with a different body is refused. Retrying with the same key and the same body is free and is the intended way to recover from a timeout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybookExtractionCreateRequest'
            example:
              documentId: doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
              contractType: msa
              useTrackedChanges: false
