      additionalProperties: false
      type: object
      required:
      - name
      - contractType
      title: PlaybookCreateRequest
      description: Author a playbook from positions the caller supplies.
    PlaybookExtraction:
      properties:
        id:
          type: string
          title: Id
          description: Public identifier, `pex_` followed by 32 hex characters.
          examples:
          - pex_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: Where the extraction got to, in the same five values an operation uses. `positions` is empty until it reads `succeeded`.
          examples:
          - queued
        contractType:
          anyOf:
          - type: string
          - type: 'null'
          title: Contracttype
          description: 'The contract type that was pinned or detected. Pass it to `playbooks.create` when you adopt these positions: a playbook''s type decides which reviews resolve it.'
          examples:
          - msa
        positions:
          additionalProperties:
            $ref: '#/components/schemas/PlaybookPosition'
          type: object
          title: Positions
          description: The extracted positions, keyed by clause type. Review them, then send the map you want to keep to `playbooks.create`. Nothing here has been saved as a playbook.
        truncated:
          type: boolean
          title: Truncated
          description: True when the contract exceeded the extractor's block ceiling and some clauses were not read. The positions returned are correct; they are not complete. Split the contract and extract the remainder separately.
          default: false
          examples:
          - false
        sourceDocumentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourcedocumentid
          description: '`doc_` identifier of the document this was read from, when one was named. Null for an extraction from `contractText`, which keeps no file.'
          examples:
          - doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: When the extraction was accepted (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completedat
          description: When it reached a terminal status (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
      additionalProperties: false
      type: object
      required:
      - id
      - status
      - createdAt
      title: PlaybookExtraction
      description: 'What an extraction found, in the shape a playbook takes.


        A running extraction is a `200` with an EMPTY `positions` map and a truthful

        status, never a `404`: a 404 would be indistinguishable from an extraction

        that never existed. Why one FAILED lives on the operation rather than here,

        so there is exactly one sanitizer for internal error text on this surface.'
    Operation:
      properties:
        id:
          type: string
          title: Id
          description: Public identifier, `op_` followed by 32 hex characters. Poll `GET /v1/operations/{operationId}` with it.
          examples:
          - op_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        type:
          type: string
          title: Type
          description: What kind of work this is, for example `matrix.run` or `draft.generate`.
          examples:
          - matrix.run
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: 'One of five values: `queued`, `running`, `succeeded`, `failed`, `cancelled`. There is no sixth and there are no synonyms. Stop polling once it is `succeeded`, `failed` or `cancelled`.'
          examples:
          - succeeded
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: When the operation was accepted (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completedat
          description: When the operation reached a terminal status (RFC 3339). Present if and only if the status is terminal.
          examples:
          - '2026-08-19T14:32:10Z'
        matterId:
          anyOf:
          - type: string
          - type: 'null'
          title: Matterid
          description: '`mat_` identifier of the matter this work belongs to, when it belongs to one.'
          examples:
          - mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        resource:
          anyOf:
          - $ref: '#/components/schemas/OperationResource'
          - type: 'null'
          description: What the operation produced. Absent until the underlying job row exists, which an idempotent replay can briefly observe, so treat absence as 'not yet' rather than 'never'.
        error:
          anyOf:
          - $ref: '#/components/schemas/OperationError'
          - type: 'null'
          description: Why the work failed. Present only when `status` is `failed`. Partial success is `succeeded` with `progress.done < progress.total`, never an error.
        progress:
          anyOf:
          - $ref: '#/components/schemas/OperationProgress'
          - type: 'null'
          description: How far along the work is, when the underlying job reports it. Absent does not mean no progress.
        requestId:
          anyOf:
          - type: string
          - type: 'null'
          title: Requestid
          description: The `X-Request-ID` of the request that created this operation. Quote it in a support ticket.
          examples:
          - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
      additionalProperties: false
      type: object
      required:
      - id
      - type
      - status
      - createdAt
      title: Operation
      description: 'One long-running operation, whatever kind of work it is.


        Readable for `OPERATION_RETENTION_DAYS` after creation, per AIP-151.'
    ValidationProblem:
      type: object
      title: ValidationProblem
      description: A problem document for a schema rejection. `errors` lists the fields that were refused. The value you submitted is deliberately not echoed, so a validation failure cannot copy your content into an error response or into either side's logs.
      required:
      - type
      - title
      - status
      - detail
      - instance
      - errors
      properties:
        type:
          type: string
          format: uri
          description: The stable identifier for this error, and the one field to branch on. Resolves to a page describing it.
          examples:
          - https://vaquill.ai/docs/workspace-api/errors/insufficient-scope
        title:
          type: string
          description: A short human-readable summary.
          examples:
          - Insufficient scope
        status:
          type: integer
          description: The HTTP status code, repeated.
          examples:
          - 403
        detail:
          type: string
          description: What went wrong on this specific request. May be reworded at any time.
          examples:
          - This credential carries matters:read. This operation needs matters:write.
        instance:
          type: string
          description: The path this problem occurred on.
          examples:
          - /workspace/v1/matters/mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        requestId:
          type: string
          description: The id of this request, identical to the `X-Request-ID` response header. Quote it when contacting support.
          examples:
          - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        errors:
          type: array
          description: One entry per rejected field.
          items:
            type: object
            required:
            - location
            - message
            - type
            properties:
              location:
                type: string
                description: Dotted path to the rejected field, for example `body.contentMarkdown`.
              message:
                type: string
                description: Why it was rejected.
              type:
                type: string
                description: The validation rule that failed.
      additionalProperties: true
    Playbook:
      properties:
        id:
          type: string
          title: Id
          description: Public identifier, `pbk_` followed by 32 hex characters.
          examples:
          - pbk_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        name:
          type: string
          title: Name
          description: The playbook's display name.
          examples:
          - MSA, buyer side
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Free-text description of what this playbook covers.
          examples:
          - Master services agreement with Acme for the 2026 platform rollout.
        contractType:
          type: string
          title: Contracttype
          description: 'Which contract type this playbook governs. Fixed at creation: changing it would silently redirect which reviews resolve it.'
          examples:
          - msa
        positions:
          additionalProperties:
            $ref: '#/components/schemas/PlaybookPosition'
          type: object
          title: Positions
          description: Every negotiating position the playbook holds, keyed by clause-type slug. Returned in full, because a caller that cannot read the positions cannot tell what its reviews are measured against.
        isDefault:
          type: boolean
          title: Isdefault
          description: 'True when reviews of this contract type resolve to this playbook if none is named. Read-only here: exactly one default per contract type is enforced by the database, and this API cannot set it.'
          default: false
          examples:
          - false
        sourceFilename:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourcefilename
          description: Filename of the exemplar this playbook was extracted from, when it was imported rather than authored by hand.
          examples:
          - msa-acme-v3.docx
        createdAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Createdat
          description: When the playbook was created (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
        updatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updatedat
          description: When the playbook was last modified (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - contractType
      title: Playbook
      description: 'One organization playbook, with every position it holds.


        Positions are returned in full rather than summarized. A playbook is the

        input to a review, so a caller that cannot read the positions cannot tell

        what its reviews are being measured against, and a separate positions

        endpoint would make the common case two calls.'
    PlaybookPosition:
      properties:
        standardPosition:
          type: string
          maxLength: 8000
          title: Standardposition
          description: 'The position the organization opens with on this clause type. Required: a position with no standard is not a position.'
          examples:
          - Liability is capped at the fees paid in the preceding twelve months.
        acceptableRange:
          type: string
          maxLength: 4000
          title: Acceptablerange
          description: 'Free-text summary of the acceptable zone. Complements `fallbackLadder` rather than duplicating it: this is the summary, the ladder is the ordered retreat.'
          examples:
          - Between one and two times the fees paid in the preceding twelve months.
        escalationTriggers:
          items:
            type: string
          type: array
          maxItems: 50
          title: Escalationtriggers
          description: Free-text conditions that should raise a human's attention. Descriptive only; the machine-evaluated rules are `escalationConditions`.
          examples:
          - - value
        fallbackLadder:
          items:
            type: string
          type: array
          maxItems: 10
          title: Fallbackladder
          description: Ordered concrete retreat positions, BEST acceptable first. The reviewer steps down this ladder when the standard position is rejected.
          examples:
          - - value
        dealBreaker:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Dealbreaker
          description: The walk-away floor. A term at or below this is forced to red regardless of what the model reads. Absent means there is no hard floor, which is not the same as a floor of nothing.
          examples:
          - Any uncapped liability for indirect or consequential damages.
        priority:
          anyOf:
          - type: string
            enum:
            - must_have
            - should_have
            - nice_to_have
          - type: 'null'
          title: Priority
          description: How much this clause matters relative to the others in the playbook.
          examples:
          - must_have
        approvalLevel:
          anyOf:
          - type: string
            enum:
            - none
            - manager
            - partner
            - gc
          - type: 'null'
          title: Approvallevel
          description: The sign-off a deviation from this position needs. Feeds a review's `approvalGate`, which is REPORTED and never enforced.
          examples:
          - none
        escalationConditions:
          items:
            $ref: '#/components/schemas/EscalationCondition'
          type: array
          maxItems: 20
          title: Escalationconditions
          description: Machine-evaluated rules that raise the required sign-off when they hold.
        rationale:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Rationale
          description: Why the organization takes this position. Carried into review findings so a reviewer can see the reasoning.
          examples:
          - Our standard position caps liability at fees paid in the preceding 12 months.
        riskWeight:
          anyOf:
          - type: integer
            maximum: 5.0
            minimum: 0.0
          - type: 'null'
          title: Riskweight
          description: 0 to 5, multiplied by severity to weight the compliance score. Absent falls through to the clause-type default rather than to zero.
          examples:
          - 4
        enabled:
          type: boolean
          title: Enabled
          description: False keeps the position on the playbook but excludes it from review and drafting. This is how an alternative is parked without being deleted.
          default: true
          examples:
          - true
      additionalProperties: false
      type: object
      required:
      - standardPosition
      - acceptableRange
      title: PlaybookPosition
      description: 'The organization''s negotiating position on one clause type.


        Both a request and a response shape, which is a deliberate exception to the

        "read models are looser than write models" rule the resources follow. A

        position is authored by the customer rather than produced by a model, so

        there is no dirty-legacy-value problem to be loose about, and one shape means

        a caller can read a playbook, edit one field and write it straight back.'
    OperationStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - cancelled
      title: OperationStatus
      description: 'The public five. There is no sixth, and there are no synonyms.


        Internal vocabularies spell terminal success `completed`, `ready`,

        `extracted`, `succeeded` and `fresh`; terminal failure `failed` and `error`;

        queued `pending`, `queued` and `draft`. All of that is collapsed here by

        `app.workspace_api.adapters.status_map`, which refuses to guess.'
    Pagination:
      properties:
        limit:
          type: integer
          title: Limit
          description: The `limit` that was applied to this request.
          examples:
          - 50
        offset:
          type: integer
          title: Offset
          description: The `offset` that was applied to this request.
          examples:
          - 0
        total:
          type: integer
          title: Total
          description: Total rows matching the filter, not the number returned in `data`. Use it to size a job before running it.
          examples:
          - 128
        hasMore:
          type: boolean
          title: Hasmore
          description: True when rows remain beyond this window. Derived from `offset + len(data) < total`, so a full final page correctly reports `false` rather than sending you after an empty page.
          examples:
          - false
      additionalProperties: false
      type: object
      required:
      - limit
      - offset
      - total
      - hasMore
      title: Pagination
      description: 'Where the caller is, and whether there is more.


        `total` is the count of rows matching the filter, not the count returned,

        so a caller can size a job before running it.'
    PlaybookUpdateRequest:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
          description: 'Replacement display name. Required: this is a PUT, not a patch.'
          examples:
          - MSA, buyer side
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Description
          description: Replacement description, or null to clear it.
          examples:
          - Master services agreement with Acme for the 2026 platform rollout.
        positions:
          additionalProperties:
            $ref: '#/components/schemas/PlaybookPosition'
          propertyNames:
            maxLength: 80
            minLength: 1
          type: object
          maxProperties: 200
          title: Positions
          description: 'The COMPLETE set of positions after the write. Replacement happens at the map level: a clause type you omit is removed from the playbook. Within a clause type you do send, unpublished authoring fields set in the web app are preserved.'
      additionalProperties: false
      type: object
      required:
      - name
      title: PlaybookUpdateRequest
      description: 'Replace a playbook''s name, description and positions.


        A PUT, and it replaces at the MAP level: a clause type absent from

        `positions` is removed from the playbook. Within a clause type that IS

        present, the five unpublished authoring fields are preserved (see

        `playbook_positions.PRESERVED_ON_WRITE`), because the alternative is deleting

        a lawyer''s work with no error and no way to notice.


        `contractType` is absent on purpose, and so is `isDefault`. Both are

        explained in the module docstring.'
    EscalationCondition:
      properties:
        attribute:
          type: string
          enum:
          - clause_severity
          - counterparty_paper
          - contract_value
          - governing_law
          title: Attribute
          description: What to test. `clause_severity` is the review's own finding and needs no input; the other three come from the review request's `paperSide` and `dealContext`. A rule naming one you did not supply simply does not fire.
          examples:
          - clause_severity
        operator:
          type: string
          enum:
          - eq
          - neq
          - gt
          - gte
          - lt
          - lte
          - in
          title: Operator
          description: How to compare `attribute` against `value`. Use `in` with a comma-separated `value`.
          default: eq
          examples:
          - eq
        value:
          type: string
          maxLength: 200
          title: Value
          description: 'What to compare against, always a string and parsed per attribute: `red`, `true`, `1000000`, `CA,NY`.'
          examples:
          - '1000000'
        escalateTo:
          type: string
          enum:
          - manager
          - partner
          - gc
          title: Escalateto
          description: The sign-off level this rule raises the clause to when it fires.
          default: partner
          examples:
          - manager
        note:
          anyOf:
          - type: string
            maxLength: 280
          - type: 'null'
          title: Note
          description: Short explanation of why this escalation exists, shown to whoever reviews the finding.
          examples:
          - 'Escalated to GC: deal value over $1M.'
      additionalProperties: false
      type: object
      required:
      - attribute
      - value
      title: EscalationCondition
      description: 'A rule that RAISES a clause''s required sign-off when it holds.


        This is what lets a playbook say "partner normally, but GC if the deal is

        over a million, or if it is on their paper". The value stays a string across

        every attribute so the stored shape is uniform; it is parsed per attribute

        when the rule is evaluated.'
    OperationError:
      properties:
        code:
          type: string
          title: Code
          description: Stable, machine-readable failure code. Branch on this, never on `message`.
          examples:
          - EXTRACTION_FAILED
        message:
          type: string
          title: Message
          description: Human-readable explanation, sanitized of internal paths and stack frames. Wording may change; do not parse it.
          examples:
          - The upstream extraction did not finish.
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: OperationError
      description: 'Why a failed operation failed, in terms a customer can act on.


        `code` is stable and machine-readable. `message` is sanitized: the internal

        job tables store stack traces and file paths in their `error_message`

        columns, and forwarding those verbatim leaks our internals into a customer''s

        logs.'
