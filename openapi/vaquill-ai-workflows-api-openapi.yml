  /v1/matters/{matterId}/workflows/{workflowId}/runs:
    post:
      tags:
      - Workflows
      summary: Run a workflow
      description: 'Launch a run of one workflow definition inside this matter.


        Answers `202` with an operation to poll. Read the definition first: it

        declares which document roles it accepts and which inputs it requires, and

        validating against that is cheaper than discovering the shape from `422`s.

        Documents must already be in this matter. `estimatedMinutes` on the

        definition is what to size the polling interval against.'
      operationId: workflows.run
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          title: Workflowid
        description: Identifier of the workflow DEFINITION to run, from `GET /v1/workflows`. This names the catalogue entry, not a run of it.
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
        description: A unique value of your choosing, so a retried launch returns the FIRST operation instead of starting a second billable job. Reusing one with a different body is refused. Retrying with the same key and the same body is free and is the intended way to recover from a timeout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRunRequest'
            example:
              title: Diligence pass, Acme
              documents:
              - documentId: doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                role: subject
                position: 0
              inputs:
                counterpartyName: Acme Corporation
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                id: op_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                type: matrix.run
                status: succeeded
                createdAt: '2026-08-19T14:32:10Z'
                completedAt: '2026-08-19T14:32:10Z'
                matterId: mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                resource:
                  kind: matrix
                  id: mtx_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  url: https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
                progress:
                  done: 24
                  total: 128
                  unit: cells
                requestId: req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        '422':
          description: The request does not match the published schema. `errors` names each rejected field and why. The submitted value is never echoed back.
