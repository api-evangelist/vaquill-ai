components:
  schemas:
    WorkflowArtifact:
      properties:
        key:
          type: string
          title: Key
          description: Slug identifying this artifact. Pass it to the artifact download route to get bytes.
          examples:
          - redline
        label:
          type: string
          title: Label
          description: Human-readable name for the deliverable.
          examples:
          - Liability cap
        contentType:
          type: string
          title: Contenttype
          description: IANA media type of the produced file.
          examples:
          - application/pdf
        sizeBytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sizebytes
          description: Size of the artifact in bytes, when known.
          examples:
          - 248193
      additionalProperties: false
      type: object
      required:
      - key
      - label
      - contentType
      title: WorkflowArtifact
      description: 'An artifact a finished run produced. No URL: fetching one is its own call.


        Separating the listing from the signing is what lets the download route

        re-check the installation at signing time, so a URL cannot be minted for an

        installation that was revoked between the two.'
    WorkflowInputField:
      properties:
        key:
          type: string
          title: Key
          description: The key to use for this field inside the run request's `inputs` object.
          examples:
          - redline
        label:
          type: string
          title: Label
          description: Human-readable question text.
          examples:
          - Liability cap
        fieldType:
          type: string
          title: Fieldtype
          description: What sort of value is expected, for example a string, a date or a choice. A plain string, since the internal vocabulary grows whenever the launcher gains a widget.
          examples:
          - string
        required:
          type: boolean
          title: Required
          description: True when a run is refused without this input.
          default: false
          examples:
          - false
        options:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Options
          description: Allowed values when the field is a choice.
          examples:
          - - 'yes'
            - 'no'
            - not addressed
        placeholder:
          anyOf:
          - type: string
          - type: 'null'
          title: Placeholder
          description: Example value, for display.
          examples:
          - Acme Corporation
        helpText:
          anyOf:
          - type: string
          - type: 'null'
          title: Helptext
          description: Extra guidance on what to supply.
          examples:
          - The counterparty's full legal entity name.
      additionalProperties: false
      type: object
      required:
      - key
      - label
      - fieldType
      title: WorkflowInputField
      description: One question the definition asks, and how it is answered.
    WorkflowRun:
      properties:
        id:
          type: string
          title: Id
          description: Public identifier, `wfr_` followed by 32 hex characters.
          examples:
          - wfr_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        matterId:
          type: string
          title: Matterid
          description: '`mat_` identifier of the matter this run belongs to.'
          examples:
          - mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        workflowId:
          type: string
          title: Workflowid
          description: Identifier of the workflow definition that was run.
          examples:
          - contract-diligence
        title:
          type: string
          title: Title
          description: Display title for the run.
          examples:
          - Diligence pass, Acme
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: Run status, using the same five public values as an operation. The internal stage vocabulary (`preparing`, `extracting`, `synthesizing`, `rendering`) all reads as `running`.
          examples:
          - succeeded
        progressPercent:
          type: integer
          title: Progresspercent
          description: How far along the run is, 0 to 100. This is what carries progress, since the stages all collapse to `running`.
          examples:
          - 100
        progressMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Progressmessage
          description: Short human-readable stage label, for example 'synthesizing findings'. Free text for a progress line only. Never branch on it; branch on `status`.
          examples:
          - synthesizing findings
        artifacts:
          items:
            $ref: '#/components/schemas/WorkflowArtifact'
          type: array
          title: Artifacts
          description: Deliverables produced so far. Listing is separate from downloading, so that a URL cannot be minted for an installation revoked between the two calls.
        startedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Startedat
          description: When the run began executing (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completedat
          description: When the run reached a terminal status (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: When the run was created (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
          description: When the run was last updated (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
      additionalProperties: false
      type: object
      required:
      - id
      - matterId
      - workflowId
      - title
      - status
      - progressPercent
      - createdAt
      - updatedAt
      title: WorkflowRun
      description: 'One run. `status` is the public five, never the stored spelling.


        The internal vocabulary has eight values, five of which (`preparing`,

        `extracting`, `synthesizing`, `rendering`, plus `pending`) describe a stage

        rather than an outcome. Those read as `running`, and `progressPercent` is

        what carries how far along it is.'
    Problem:
      type: object
      title: Problem
      description: An RFC 9457 problem document. Branch on `type`, which is stable; `title` and `detail` are written for people and may be reworded. Some problems carry extra members (`requiredScopes`, `limit`, `expectedVersion`), which is why this object is open.
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          format: uri
          description: The stable identifier for this error, and the one field to branch on. Resolves to a page describing it.
          examples:
          - https://vaquill.ai/docs/workspace-api/errors/insufficient-scope
        title:
          type: string
          description: A short human-readable summary.
          examples:
          - Insufficient scope
        status:
          type: integer
          description: The HTTP status code, repeated.
          examples:
          - 403
        detail:
          type: string
          description: What went wrong on this specific request. May be reworded at any time.
          examples:
          - This credential carries matters:read. This operation needs matters:write.
        instance:
          type: string
          description: The path this problem occurred on.
          examples:
          - /workspace/v1/matters/mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        requestId:
          type: string
          description: The id of this request, identical to the `X-Request-ID` response header. Quote it when contacting support.
          examples:
          - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
      additionalProperties: true
    OperationProgress:
      properties:
        done:
          type: integer
          minimum: 0.0
          title: Done
          description: How many units are finished.
          examples:
          - 24
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: How many units there are in total. Can legitimately be zero for an empty run.
          examples:
          - 128
        unit:
          type: string
          enum:
          - cells
          - steps
          - documents
          - files
          - rows
          - percent
          title: Unit
          description: 'What `done` and `total` are counting. Always read it: a workflow run counts `percent` while a matrix run counts `cells`, so `{done: 43, total: 100}` alone is ambiguous.'
          examples:
          - cells
      additionalProperties: false
      type: object
      required:
      - done
      - total
      - unit
      title: OperationProgress
      description: 'How far along, and in what units.


        The unit is not decoration. A workflow run stores only a percentage while a

        matrix run stores cell counts, so `{done: 43, total: 100}` with no unit reads

        as 43 of 100 documents and a client builds a wrong estimate from it.'
    WorkflowArtifactSpec:
      properties:
        key:
          type: string
          title: Key
          description: Stable slug for this artifact. This is the value `workflowRuns.artifact` takes, so a download can be wired up before anything is run.
          examples:
          - redline
        label:
          type: string
          title: Label
          description: Human-readable name for the deliverable.
          examples:
          - Liability cap
        contentType:
          type: string
          title: Contenttype
          description: IANA media type the artifact will be produced in.
          examples:
          - application/pdf
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: What the artifact contains.
          examples:
          - Master services agreement with Acme for the 2026 platform rollout.
      additionalProperties: false
      type: object
      required:
      - key
      - label
      - contentType
      title: WorkflowArtifactSpec
      description: 'A deliverable this workflow produces, named before it exists.


        `key` is what `workflowRuns.artifact` takes, so a customer can wire up the

        download before running anything. `sampleUrl` is not carried over: it points

        into the web app''s static tree and means nothing to a backend.'
    OperationResource:
      properties:
        kind:
          type: string
          title: Kind
          description: What sort of thing was produced, for example `matrix` or `document`.
          examples:
          - matrix
        id:
          type: string
          title: Id
          description: Public identifier of the produced resource, carrying its own type prefix, for example `mtx_` for a matrix.
          examples:
          - mtx_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
          description: Path on this API where the resource can be read, RELATIVE to the API root and never absolute. Absent when the resource has no addressable path, which happens for work started outside a matter. Absent means the id is real and there is nowhere to GET it; it is not an error.
          examples:
          - https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
      additionalProperties: false
      type: object
      required:
      - kind
      - id
      title: OperationResource
      description: 'What the operation produced, or is producing.


        `url` is a path on this API rather than an absolute URL, because the service

        is mounted today and gets its own hostname later (docs 07.5). A relative

        path survives that move; a baked-in host does not.'
    Operation:
      properties:
        id:
          type: string
          title: Id
          description: Public identifier, `op_` followed by 32 hex characters. Poll `GET /v1/operations/{operationId}` with it.
          examples:
          - op_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        type:
          type: string
          title: Type
          description: What kind of work this is, for example `matrix.run` or `draft.generate`.
          examples:
          - matrix.run
        status:
          $ref: '#/components/schemas/OperationStatus'
          description: 'One of five values: `queued`, `running`, `succeeded`, `failed`, `cancelled`. There is no sixth and there are no synonyms. Stop polling once it is `succeeded`, `failed` or `cancelled`.'
          examples:
          - succeeded
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: When the operation was accepted (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completedat
          description: When the operation reached a terminal status (RFC 3339). Present if and only if the status is terminal.
          examples:
