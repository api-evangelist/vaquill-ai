  /v1/matters/{matterId}/workflow-runs/{runId}:
    get:
      tags:
      - Workflows
      summary: Get a workflow run
      description: 'One run, with the artifacts it has produced so far.


        The internal stage vocabulary collapses to `running`, so `progressPercent`

        and `progressMessage` are what carry how far along it is. Artifacts are

        listed without URLs; fetching one is its own call, so that a link cannot be

        minted for a credential revoked between the two.'
      operationId: workflowRuns.get
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: runId
        in: path
        required: true
        schema:
          type: string
          title: Runid
        description: '`wfr_` identifier of one workflow RUN. Returned on the operation that launched it, and distinct from the `workflowId` that was run.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRun'
              example:
                id: wfr_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                matterId: mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
