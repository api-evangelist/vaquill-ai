    delete:
      tags:
      - Workflows
      summary: Delete a workflow run
      description: 'Delete a workflow run and its event history.


        Documents the run produced and filed into the matter are NOT deleted. They

        stay where they are and simply stop pointing back at the run, so deleting

        the record of the work does not delete the work.


        Refused with `409 operation-in-flight` while the run has not finished. Poll

        the operation that started it first.


        There is no undo, and a repeated delete answers `404`. If a delete timed

        out, treat a subsequent `404` as success.'
      operationId: workflowRuns.delete
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: runId
        in: path
        required: true
