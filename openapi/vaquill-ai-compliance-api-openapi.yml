  /v1/matters/{matterId}/compliance-checks/{complianceCheckId}/exports:
    post:
      tags:
      - Compliance
      summary: Export a compliance check as a report
      description: 'Mint a short-lived URL to the check as a PDF or DOCX report.


        A POST rather than a GET because it creates something: a bearer URL over an

        analysis of a client document, and a rendering that did not exist before.'
      operationId: complianceChecks.export
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: complianceCheckId
        in: path
        required: true
        schema:
          type: string
          title: Compliancecheckid
        description: '`cck_` identifier of the compliance check. Returned on the operation that launched it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolReportExportRequest'
            example:
              format: pdf
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolReportExport'
              example:
                format: pdf
                filename: msa-acme-v3.docx
                url: https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
