openapi: 3.2.0
info:
  title: Vaquill Ai Documents API
  version: 1.0.0
  description: 'Operations tagged Documents across 2 of this provider''s published API definitions: vaquill-ai-workspace-openapi.json, vaquill-ai-workspace-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vaquill.ai/workspace
  description: Vaquill Legal Workspace API (production)
- url: /workspace
  description: Vaquill Legal Workspace API (relative to the mount)
security:
- WorkspaceAuth: []
tags:
- name: Documents
  description: 'Files in a matter: their metadata, their ingested text, and the original bytes. A document is only usable by retrieval, drafting and review once its status is `succeeded`.'
paths:
  /v1/matters/{matterId}/documents:
    get:
      tags:
      - Documents
      summary: List documents in a matter
      description: 'Every document in this matter, newest first, one page at a time.


        The matter is RESOLVED here rather than merely decoded, unlike the by-id

        routes below. Those authorize through the document row, whose organization

        predicate answers 404 for a matter this organization does not own. A list

        has no such row: filtering by `matter_id` alone answered 200 with an empty

        page for another organization''s matter, which leaks nothing and is still

        wrong, because every other matter-nested list answers `matter-not-found` and

        a caller cannot tell "not yours" from "empty".'
      operationId: documents.list
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: How many rows to return, 1 to 200. Defaults to 50.
          default: 50
          title: Limit
        description: How many rows to return, 1 to 200. Defaults to 50.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: 'How many rows to skip before returning any. Combine with `limit` to page: `offset=0`, then `offset=50`, and so on. Offsets are positional, not stable, so a set that changes while you page can show a row twice or not at all.'
          default: 0
          title: Offset
        description: 'How many rows to skip before returning any. Combine with `limit` to page: `offset=0`, then `offset=50`, and so on. Offsets are positional, not stable, so a set that changes while you page can show a row twice or not at all.'
      - name: folderId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Narrow the list to one folder inside the matter. Omit for every document in the matter. There is no way to ask for only the unfiled documents.
          title: Folderid
        description: Narrow the list to one folder inside the matter. Omit for every document in the matter. There is no way to ask for only the unfiled documents.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Document_'
              example:
                data:
                - id: doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  matterId: mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  folderId: fld_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
                  filename: msa-acme-v3.docx
                  contentType: application/pdf
                  fileSize: 248193
                  pageCount: 14
                  chunkCount: 37
                  sourceType: api
                  status: succeeded
                  isEncrypted: false
                  createdAt: '2026-08-19T14:32:10Z'
                  updatedAt: '2026-08-19T14:32:10Z'
                  processedAt: '2026-08-19T14:32:10Z'
                pagination:
                  limit: 50
                  offset: 0
                  total: 128
                  hasMore: false
        '422':
          description: The request does not match the published schema. `errors` names each rejected field and why. The submitted value is never echoed back.
