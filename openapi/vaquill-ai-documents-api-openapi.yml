    patch:
      tags:
      - Documents
      summary: Move a document between folders
      description: 'Move a document between folders.


        `folderId` is the only field a document accepts. Send `null` to unfile it.

        The folder must belong to your organization.


        Filename and matter cannot be changed. Both are part of the stored file''s

        identity, so changing either would leave the original unreadable; moving a

        document to another matter is an upload into the new matter followed by a

        delete from the old one.'
      operationId: documents.update
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          title: Documentid
        description: '`doc_` identifier of the document. Take it from the matter''s document list, or from the operation that completed its upload.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdateRequest'
            example:
              folderId: fld_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
      responses:
