components:
  schemas:
    Page_Document_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Document'
          type: array
          title: Data
          description: The rows in this window, in the collection's default order.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Where this window sits in the full result set.
      additionalProperties: false
      type: object
      required:
      - data
      - pagination
      title: Page[Document]
    DocumentUpdateRequest:
      properties:
        folderId:
          anyOf:
          - type: string
          - type: 'null'
          title: Folderid
          description: '`fld_` identifier of the folder to file this document under. Must belong to your organization. Send null to unfile it. Filename and matter cannot be changed: both are part of the stored object''s identity.'
          examples:
          - fld_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
      additionalProperties: false
      type: object
      title: DocumentUpdateRequest
      description: 'Move a document between folders. That is the whole of it.


        The web app''s `PATCH /documents/{id}` also accepts `filename`, `matterId`

        and `metadata`, and none of the three can be published here.


        `filename` and `matterId` are both INSIDE the R2 object key.

        `r2_storage._generate_file_key` composes

        `orgs/{org}/matters/{matter}/docs/{doc}/{filename}`, and both

        `r2_storage.download_document` and `adapters/document_content._object_key`

        REGENERATE that key from the row rather than reading a stored path. So

        changing either one makes the original permanently unreadable, with no error

        at write time and no error until somebody asks for the file. The web app has

        that defect today; publishing the fields here would inherit it, and a moved

        document is a copy-then-delete job rather than a PATCH.


        `metadata` is free-form JSONB whose keys the ingest pipeline owns:

        `{"handwritten": ...}` is written by `upload_store._insert_placeholder` and

        read back by the finalize task. Publishing it lets a customer overwrite a

        key a worker depends on.'
    OperationStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - cancelled
      title: OperationStatus
      description: 'The public five. There is no sixth, and there are no synonyms.


        Internal vocabularies spell terminal success `completed`, `ready`,

        `extracted`, `succeeded` and `fresh`; terminal failure `failed` and `error`;

        queued `pending`, `queued` and `draft`. All of that is collapsed here by

        `app.workspace_api.adapters.status_map`, which refuses to guess.'
    DocumentSummary:
      properties:
        documentId:
          type: string
          title: Documentid
          description: '`doc_` identifier of the document this summarizes.'
          examples:
          - doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        overview:
          type: string
          title: Overview
          description: The whole-document summary, a few paragraphs of prose. Empty string when the summary was stored with sections only.
          examples:
          - A Master Services Agreement between Acme Corporation and the Supplier, signed 19 August 2026, covering platform implementation and ongoing support for an initial two-year term. Fees are invoiced monthly in arrears and payable within 30 days. Supplier liability is capped at the fees paid in the preceding twelve months, with uncapped carve-outs for confidentiality breaches and third-party IP indemnity. The agreement is governed by Delaware law and either party may terminate for convenience on 90 days' written notice.
        sections:
          items:
            $ref: '#/components/schemas/SummarySection'
          type: array
          title: Sections
          description: Section-by-section summaries, in document order. Empty when the document was short enough to summarize in one pass.
        documentCategory:
          type: string
          title: Documentcategory
          description: How the summarizer classified the document, for example `contract` or `general`. Published as a plain string; do not branch on it without a fallback.
          examples:
          - contract
        pageCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pagecount
          description: Pages the summarizer read. Absent on older rows.
          examples:
          - 14
        length:
          type: string
          title: Length
          description: 'Which length this summary was produced at: `short`, `medium` or `long`. Published as a plain string for the same reason as `documentCategory`.'
          examples:
          - medium
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: When the summary was produced (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
        updatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updatedat
          description: When the summary was last regenerated (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
      additionalProperties: false
      type: object
      required:
      - documentId
      - overview
      - documentCategory
      - length
      - createdAt
      title: DocumentSummary
      description: What was persisted the last time this document was summarized.
    Document:
      properties:
        id:
          type: string
          title: Id
          description: Public identifier, `doc_` followed by 32 hex characters.
          examples:
          - doc_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        matterId:
          type: string
          title: Matterid
          description: '`mat_` identifier of the matter this document lives in.'
          examples:
          - mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        folderId:
          anyOf:
          - type: string
          - type: 'null'
          title: Folderid
          description: '`fld_` identifier of the folder it is filed under. Absent when unfiled.'
          examples:
          - fld_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        filename:
          type: string
          title: Filename
          description: Original filename as uploaded, including its extension.
          examples:
          - msa-acme-v3.docx
        contentType:
          anyOf:
          - type: string
          - type: 'null'
          title: Contenttype
          description: IANA media type detected at upload, for example `application/pdf`.
          examples:
          - application/pdf
        fileSize:
          anyOf:
          - type: integer
          - type: 'null'
          title: Filesize
          description: Size of the stored original in bytes.
          examples:
          - 248193
        pageCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pagecount
          description: Pages the pipeline read. Absent or zero until ingestion has read the file. This is the number to size a review or matrix run against.
          examples:
          - 14
        chunkCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chunkcount
          description: How many retrieval chunks the document was split into. Absent until ingestion finishes.
          examples:
          - 37
        sourceType:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourcetype
