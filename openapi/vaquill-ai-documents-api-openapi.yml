    delete:
      tags:
      - Documents
      summary: Delete a document
      description: 'Remove a document from the matter, its vectors and its stored file.


        The row goes synchronously, because that is what the customer''s next read

        observes; storage and vectors are swept by the same Celery task the web app

        dispatches, so neither surface leaves residue the other would not.


        This reaches further than the document itself. Deleting one also removes its

        extracted text and versions, its highlights and flags, its obligations and

        summary, its chronology entries in this matter, and its ROW in every

        document matrix it appears in, which changes the shape of a finished grid.

        There is no undo, and a repeated delete answers `404`. If a delete timed

        out, treat a subsequent `404` as success.'
      operationId: documents.delete
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: documentId
        in: path
