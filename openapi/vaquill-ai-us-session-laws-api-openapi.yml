          title: Othercitations
          description: 'Other citations the publisher prints for the same act, each exactly as printed: `Act No. 1` beside `CHAPTER 1`, `A.L.2025, c.1`, `70 DCR 1863`, `D.C. Act 25-5`. They are accepted as citations on `GET /us/session-laws/{sessionLawId}`. Empty when the publisher prints one form only.'
          examples:
          - - Act No. 1
          - - D.C. Act 25-5
            - 70 DCR 1863
        publisherFields:
          additionalProperties: true
          type: object
          title: Publisherfields
          description: 'The publisher''s own structured fields for this act, as the publisher states them and otherwise untouched: an object whose keys, nesting and values are the publisher''s own words. The keys DIFFER BY STATE and are not normalised or renamed: Texas gives the bill''s full action history with journal page numbers (`Actions`), Maryland the committees and the reading and hearing dates in each chamber, North Carolina and New Mexico a history that can carry vote counts, most states little more than the bill number and a sponsor. What a given state supplies is whatever its publisher printed; do not assume any key exists, and do not read a missing key as a fact about the act. Votes in particular are present only where a publisher printed them. A few values are the publisher''s own HTML: treat every string as untrusted text and never render it unescaped. `{}` when the publisher printed no such fields. A value too large to serve is left out and its key named in `publisherFieldsOmitted`.'
          examples:
          - Actions:
            - Action Chamber: E
              Action Comment: ''
              Action Date: 04/23/2025
              Action Description: Effective on 9/1/25
              Action Time: ''
              Journal Page Number: ''
            - Action Chamber: E
              Action Comment: ''
              Action Date: 04/23/2025
              Action Description: Signed by the Governor
              Action Time: ''
              Journal Page Number: '1441'
            - Action Chamber: E
              Action Comment: ''
              Action Date: 04/14/2025
              Action Description: Sent to the Governor
              Action Time: ''
              Journal Page Number: '1265'
            Bill: '14'
            Caption Version: Enrolled
            Chapter: '1'
            Last Action: 04/23/2025 E Effective on 9/1/25
          - BillNumber: HB0001
            ChapterNumber: CH0437
            CommitteePrimaryOpposite: Judicial Proceedings
            CommitteePrimaryOrigin: Environment and Transportation
            CrossfileBillNumber: SB0007
            FirstReadingDateHouseOfOrigin: '2025-01-08'
            SponsorPrimary: Delegate Ebersole
            Status: Approved by the Governor - Chapter 437
            ThirdReadingActionHouseOfOrigin: Passed
            ThirdReadingDateHouseOfOrigin: '2025-02-27'
          - Bill: S115
            History:
            - Action: Concurred In H Com Sub
              Chamber: Senate
              Date: 2/26/2025
              Documents: None
              Votes: 'PASS: 46-2'
            - Action: Passed 2nd Reading
              Chamber: House
              Date: 2/25/2025
              Documents: None
              Votes: 'PASS: 93-23'
            Session Law: 2025-1
        publisherFieldsOmitted:
          items:
            type: string
          type: array
          title: Publisherfieldsomitted
          description: Keys of `publisherFields` that exist on the record but were too large to serve inline (past 64 KiB of JSON the largest values are left out, whole, never cut). Typically a publisher's full-bill HTML copy, whose text is on the body route in any case. Empty when nothing was left out, which is almost always.
