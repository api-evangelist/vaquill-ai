          - type: 'null'
          title: Truncated
          description: True when `didYouMean` was capped and `candidateCount` is larger. Null otherwise.
          examples:
          - true
        sessionCoverage:
          anyOf:
          - $ref: '#/components/schemas/SessionLawSessionCoverage'
          - type: 'null'
          description: 'On `session_not_fully_collected`, the partly collected session the entry points into: how many laws we hold of how many it should have. Null otherwise.'
      type: object
      required:
      - input
      - status
      - reason
      - detail
      title: SessionLawBatchMiss
      description: One entry of `ids` that did not yield a law, and why.
