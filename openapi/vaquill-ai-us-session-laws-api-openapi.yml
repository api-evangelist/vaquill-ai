          examples:
          - - SSL_KY_2025R_G_Y2025_C100
            - SSL_MO_2025R_G_Y2025_BHB2
        defaultSessionLawId:
          anyOf:
          - type: string
          - type: 'null'
          title: Defaultsessionlawid
          description: 'On `ambiguous`, the conventional reading when the registry records one. Informational: it is never served for you.'
          examples:
          - null
        jurisdictions:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Jurisdictions
          description: On `needs_jurisdiction`, every state (lower-case postal code) where the citation exists. Name one in the citation, or send `jurisdiction`, and resend. Null otherwise.
          examples:
          - - il
            - mn
            - tx
        candidateCount:
          anyOf:
