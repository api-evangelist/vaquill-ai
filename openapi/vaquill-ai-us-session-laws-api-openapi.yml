      description: The legislative session a law was enacted in.
    SessionLawBatchMiss:
      properties:
        input:
          type: string
          title: Input
          description: The entry of your `ids`, exactly as you sent it (trimmed).
          examples:
          - SSL_MN_1801R_G_Y1801_C9999
        status:
          type: string
          enum:
          - ambiguous
          - needs_jurisdiction
          - unparsed
          - session_not_fully_collected
          - not_found
          - federal
          - error
          title: Status
          description: '`not_found`: no law carries this id (or it exists in another letter case, see `didYouMean`). `unparsed`: it reads as a citation and no state session law we hold carries it. `ambiguous`: the citation names several laws of one state, all in `didYouMean`, none chosen for you. `needs_jurisdiction`: the citation is in a form several states share and names none; `jurisdictions` lists where it exists. `session_not_fully_collected`: nothing matched and the session it points into is only partly collected, so the law may exist; `sessionCoverage` says how much we hold. `federal`: a federal act, served by `/us/statutes/section`. `error`: we failed to look this entry up; it is NOT a statement that the law does not exist, it is refunded in full, and it is safe to send again.'
          examples:
          - not_found
        reason:
          type: string
          title: Reason
          description: 'The finer reason, the same vocabulary as `reason` on the 404 of `GET /us/session-laws/{sessionLawId}`: `not_in_registry`, `wrong_case`, `unresolved_citation`, `ambiguous_citation`, `needs_jurisdiction`, `federal_session_law`, `missing_session_law_id`, `session_not_fully_collected`; or `lookup_failed` when `status` is `error`. Branch on `status`, which is the closed set; the wording of a reason can grow.'
          examples:
          - not_in_registry
        detail:
          type: string
          title: Detail
          description: A sentence safe to show a user, the same text the single route's 404 carries.
          examples:
