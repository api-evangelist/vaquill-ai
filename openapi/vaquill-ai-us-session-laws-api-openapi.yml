info:
  title: Vaquill Ai US Session Laws API
  version: 1.0.0
  contact:
    name: Vaquill API Support
    url: https://www.vaquill.ai
    email: support@vaquill.ai
  license:
    name: Proprietary
    url: https://www.vaquill.ai/terms
  termsOfService: https://www.vaquill.ai/terms
  description: 'Operations tagged US Session Laws across 2 of this provider''s published API definitions: vaquill-ai-openapi.json, vaquill-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vaquill.ai
  description: Production
security:
- ApiKeyAuth: []
- ApiKeyHeader: []
- ApiKeyQuery: []
tags:
- name: US Session Laws
  description: 'State session laws: the acts of each legislature as they were enacted, chapter by chapter, before they are folded into a code.'
paths:
  /api/v1/us/session-laws/changes:
    get:
      tags:
      - US Session Laws
      summary: Feed of changes to the session-law registry
      description: 'A sync feed of the registry: every state law that began to be served, had its text added, was

        corrected, unserved, withdrawn or merged, oldest first, as a cursor over an integer `id`. Poll it

        to keep a copy of the registry current without re-listing it: read from `sinceId=0` once, then

        call again with the `cursor` you were given.


        **Cost**: 1 credit per page of up to 200 entries (default 50). An empty

        page is an answer, "nothing changed since your cursor", and is charged. A request that fails

        validation (422) is never charged; a failure on our side (500, 503) is refunded.


        **Walking the feed.** Send `sinceId=0` for the first page. While `hasMore` is true, call again with

        `sinceId` set to `cursor`: the feed is ordered by `id`, `id` only grows, and a page carries the

        entries after `sinceId` and nothing else, so no entry is skipped or repeated between your calls.

        When `hasMore` is false you have caught up as of this call; keep your cursor and ask again later.

        An empty page has `cursor: null`: keep the one you hold.


        **What an entry says.** `kind` is what happened (see its description), `sessionLawId` the law,

        `jurisdiction` its state, and `detectedAt` when we recorded it, an upper bound on when the law

        changed in the world and never an approval or effective date. Read the law itself at

        `GET /us/session-laws/{sessionLawId}`, or many at once with `POST /us/session-laws/batch`. A

        `withdrawn` or `merged` entry is a tombstone: the law no longer answers there.


        **Filter.** `jurisdiction` limits the feed to one state, `dc` or `pr`, and then `hasMore` means

        more MATCHING entries follow. The cursor is a position in the whole feed, so the same `sinceId`

        means the same point with or without the filter, and a filtered page can skip ids.


        **Read a short window behind your cursor.** `id` is assigned in order but a row can become visible

        slightly after a later one if two writers commit at once. Every writer today commits a whole

        batch together, so this has not happened, but a job that must never miss an entry should re-read

        the last few hundred ids it has already seen.


        **Scope.** State session laws only: federal acts (`SAL_...`) are never in this feed.


        **Example**


        ```bash

        curl "https://api.vaquill.ai/api/v1/us/session-laws/changes?sinceId=0&limit=100" \

        -H "Authorization: Bearer $VAQUILL_API_KEY"

        ```


        ```javascript

        let cursor = 0;

        for (;;) {

        const res = await fetch(`https://api.vaquill.ai/api/v1/us/session-laws/changes?sinceId=${cursor}`, {

        headers: { Authorization: `Bearer ${process.env.VAQUILL_API_KEY}` },

        });

        const page = await res.json();

        for (const change of page.changes) handle(change);

        if (page.cursor !== null) cursor = page.cursor;

        if (!page.hasMore) break;

        }

        ```


        **Related endpoints**


        - `GET /us/session-laws/list` lists the laws of one state, filtered; this feed is how you learn

        that one changed.

        - `POST /us/session-laws/batch` reads many laws at once from the ids this feed returns.

        - `GET /us/statutes/coverage` says which sessions we hold and how complete each is, in each

        jurisdiction''s `sessionLaws` block.


        **Nulls.** Every field of a response is always present: one with no value is `null` (or `[]`

        for a list). The examples on this page leave the nulls out for brevity.'
      operationId: get_session_law_changes_api_v1_us_session_laws_changes_get
      parameters:
      - name: sinceId
        in: query
        required: false
        schema:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          description: 'Return only entries with an `id` greater than this: the cursor for walking the feed forward. Send 0 (the default) to start from the beginning, then the `cursor` of your last page. `id` is an integer that only grows, so this is exact and immune to clock skew. A negative or non-integer value is a 422 and is never charged; a value past the newest `id` is an empty page, which is charged.'
          examples:
          - 1500
          default: 0
          title: Sinceid
        description: 'Return only entries with an `id` greater than this: the cursor for walking the feed forward. Send 0 (the default) to start from the beginning, then the `cursor` of your last page. `id` is an integer that only grows, so this is exact and immune to clock skew. A negative or non-integer value is a 422 and is never charged; a value past the newest `id` is an empty page, which is charged.'
      - name: jurisdiction
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            enum:
            - al
            - ak
            - az
            - ar
            - ca
            - co
            - ct
            - de
            - dc
            - fl
            - ga
            - gu
            - hi
            - id
            - il
            - in
            - ia
            - ks
            - ky
            - la
            - me
            - md
            - ma
            - mi
            - mn
            - ms
            - mo
            - mt
            - ne
            - nv
            - nh
            - nj
            - nm
            - ny
            - nc
            - nd
            - mp
            - oh
            - ok
            - or
            - pa
            - pr
            - ri
            - sc
            - sd
            - tn
            - tx
            - ut
            - vt
            - va
            - wa
            - wv
            - wi
            - wy
          - type: 'null'
          description: 'Limit the feed to one jurisdiction: a two-letter state code, `dc` or `pr`, case-insensitive. Omit for every jurisdiction. `federal` and any unknown code is a 422 and is never charged: federal session laws are not in this feed. The cursor is a position in the whole feed, so a filtered page may have gaps in `id`.'
          examples:
          - mn
          title: Jurisdiction
        description: 'Limit the feed to one jurisdiction: a two-letter state code, `dc` or `pr`, case-insensitive. Omit for every jurisdiction. `federal` and any unknown code is a 422 and is never charged: federal session laws are not in this feed. The cursor is a position in the whole feed, so a filtered page may have gaps in `id`.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: 'Most entries on this page: 1 to 200, default 50. The price is per page, however many entries it holds, so a larger page is cheaper per entry. Out of range is a 422 and is never charged.'
          examples:
          - 100
          default: 50
          title: Limit
        description: 'Most entries on this page: 1 to 200, default 50. The price is per page, however many entries it holds, so a larger page is cheaper per entry. Out of range is a 422 and is never charged.'
      responses:
        '200':
          description: A page of the feed, oldest first. `hasMore` and `cursor` say how to continue; an empty `changes` is a charged answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLawChangesResponse'
              examples:
                page:
                  summary: 'A full page: more follow, so call again with `sinceId=1502`'
                  value:
                    changes:
                    - id: 1501
                      kind: served
                      sessionLawId: SSL_MN_2025R_G_Y2025_C1
                      jurisdiction: mn
                      detectedAt: '2026-10-05T09:04:11.120118+00:00'
                    - id: 1502
                      kind: served
                      sessionLawId: SSL_MN_2025R_G_Y2025_C10
                      jurisdiction: mn
                      detectedAt: '2026-10-05T09:04:11.120118+00:00'
                    count: 2
                    cursor: 1502
                    hasMore: true
                    creditsConsumed: 1
                    processingTimeMs: 41.8
                caughtUp:
                  summary: 'Nothing since your cursor: charged, `cursor` null, keep the one you hold'
                  value:
                    changes: []
                    count: 0
                    hasMore: false
                    creditsConsumed: 1
                    processingTimeMs: 12.4
        '401':
          description: Missing, invalid or revoked API key. Not charged.
          content:
            application/json:
              example:
                detail: Invalid or expired API key
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '402':
          description: Insufficient credits for this call. Nothing was done and nothing was charged. Read your balance, free, at `GET /credits/balance`.
          content:
            application/json:
              example:
                detail: Insufficient credits
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '403':
          description: The API key lacks the `research:read` scope. Not charged.
          content:
            application/json:
              example:
                detail: Insufficient permissions for this operation
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '422':
          description: 'A parameter failed validation: `sinceId` negative or not an integer, `limit` out of range, or `jurisdiction` not a state. Never charged. `errors[].loc` names the parameter exactly as you send it.'
          content:
            application/json:
              examples:
                negativeSinceId:
                  summary: '`sinceId=-1`'
                  value:
                    detail: Invalid request parameters
                    errors:
                    - loc:
                      - query
                      - sinceId
                      msg: Input should be greater than or equal to 0
                      type: greater_than_equal
                limitTooLarge:
                  summary: '`limit=500`: at most 200'
                  value:
                    detail: Invalid request parameters
                    errors:
                    - loc:
                      - query
                      - limit
                      msg: Input should be less than or equal to 200
                      type: less_than_equal
                federalJurisdiction:
                  summary: '`jurisdiction=federal`: federal acts are never in this feed'
                  value:
                    detail: Invalid request parameters
                    errors:
                    - loc:
                      - query
                      - jurisdiction
                      msg: 'Value error, Unknown `jurisdiction` value ''federal''. Expected one of: ak, al, ar, az, ca, co, ct, dc, de, fl, ga, gu, hi, ia, id, il, in, ks, ky, la, ma, md, me, mi, mn, mo, mp, ms, mt, nc, nd, ne, nh, nj, nm, nv, ny, oh, ok, or, pa, pr, ri, sc, sd, tn, tx, ut, va, vt, wa, wi, wv, wy.'
                      type: value_error
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '429':
          description: Rate limit exceeded for your key. Not charged. Wait `Retry-After` seconds.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                examples:
                - 12
            X-RateLimit-Limit:
              description: Requests per minute your key is allowed.
              schema:
                type: integer
                examples:
                - 60
            X-RateLimit-Remaining:
              description: Requests left in the current minute. 0 on a 429.
              schema:
                type: integer
                examples:
                - 0
            X-RateLimit-Reset:
              description: Unix time at which the minute window resets.
              schema:
                type: integer
                examples:
                - 1791194460
          content:
            application/json:
              example:
                detail: Rate limit exceeded. Try again in 12 seconds.
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '500':
          description: An unexpected failure on our side. The charge is refunded.
          content:
            application/json:
              example:
                detail: Internal server error
              schema:
                $ref: '#/components/schemas/ApiDetailError'
        '503':
          description: The session-laws database is temporarily unavailable. The charge is refunded; retry.
          content:
            application/json:
              example:
                detail: The US session-laws database is temporarily unavailable. Please retry.
              schema:
                $ref: '#/components/schemas/ApiDetailError'
    servers:
    - url: https://api.vaquill.ai
      description: Production
  /api/v1/us/session-laws/batch:
    post:
      tags:
      - US Session Laws
      summary: Get many state session laws at once, by id or citation
      description: 'Read up to 50 STATE session laws in one call: the same record

        `GET /us/session-laws/{sessionLawId}` returns, for each id or citation in `ids`, in the order

        you sent them.'
      operationId: get_session_laws_batch_api_v1_us_session_laws_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLawBatchRequest'
        required: true
      responses:
