          - type: 'null'
          title: Pageswithtext
          description: For a PDF, how many of its `pageCount` pages had a text layer to read. A figure below `pageCount` means some pages (a signature page, a scanned stamp) contributed no text. Null for a source that has no pages.
          examples:
          - 3
          - 162
          - null
        volume:
          anyOf:
          - $ref: '#/components/schemas/SessionLawVolume'
          - type: 'null'
          description: 'Present only when the act''s text was cut out of a bound volume of the session''s laws rather than published on its own: the volume and the pages. Null otherwise.'
        caveats:
          items:
            type: string
          type: array
          title: Caveats
          description: 'The collector''s own remarks on this record, one string each, verbatim and in order. Most say something about the act or its text that a reader should know: where the chapter number came from when the act does not print one, that the publisher prints no strike-through so there is no amendatory markup to carry, that an effective date is the publisher''s wording rather than a calendar date, that the text layer has kerning damage. Some are working notes about how the record was assembled and are published as written; they are free text for a person to read, not a vocabulary to branch on, and their wording can change. Notes that only describe how a page was fetched or decoded are not included. `[]` when there are none.'
          examples:
          - - Chapter number is from the publisher's Passed Legislation index ('Current Status'); the enrolled PDF prints a blank 'Chapter No. ____' field.
            - The 1-25 line-number column printed on every page is stripped.
      type: object
      title: SessionLawProvenance
      description: How the text of an act was obtained, and what the collector noted about the record.
    SessionLawDenominator:
      properties:
        kind:
          type: string
          enum:
          - stated_count
          - complete_listing
          - max_number
          - feed_total
          - our_recount
          - registry_union
          - none
          title: Kind
          description: 'Where the total comes from. `stated_count`: the publisher states how many measures the session enacted. `complete_listing`: the publisher''s own complete list of the session''s acts, which we counted. `max_number`: the highest chapter number the publisher printed. `feed_total`: the total a publisher feed reports. `our_recount`: we counted the publisher''s pages ourselves. `registry_union`: the measures we know of from several sources. `none`: no total is available, so completeness cannot be judged.'
