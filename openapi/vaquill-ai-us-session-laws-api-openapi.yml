          description: 'The identifiers the publisher itself gives the act, in the order it presents them: South Carolina''s ratification number, California''s `bill_id`, the District of Columbia''s act and bill numbers, Maryland''s `BillNumber`. Useful for joining to the publisher''s own site or data. Which identifiers exist differs by state. Empty when the publisher exposes none.'
