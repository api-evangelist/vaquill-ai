  /api/v1/us/session-laws/{session_law_id}/body:
    get:
      tags:
      - US Session Laws
      summary: Get a state session law's text
      description: 'The act''s text exactly as printed, one page of about 30,000 characters at a

        time, cut at a paragraph break where one is near.'
      operationId: get_session_law_body_api_v1_us_session_laws__session_law_id__body_get
      parameters:
      - name: session_law_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
