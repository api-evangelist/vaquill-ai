          description: 'The largest `id` on this page: send it as `sinceId` for the next page. Null when the page is empty, so keep the cursor you already hold.'
          examples:
          - 1502
        hasMore:
          type: boolean
          title: Hasmore
          description: 'True when more entries follow this page: call again with `sinceId` set to `cursor` straight away. False means you have caught up as of this call.'
          default: false
          examples:
          - true
        creditsConsumed:
          type: integer
          title: Creditsconsumed
          description: Credits actually charged for this call, never the list price. 0 when the call was refunded (a failure on our side).
          default: 0
          examples:
          - 1
        processingTimeMs:
          type: number
          title: Processingtimems
          description: Server-side time for this request in milliseconds, excluding network transit. Not billed on.
          default: 0.0
          examples:
          - 41.8
      type: object
      title: SessionLawChangesResponse
      description: Response for `GET /us/session-laws/changes`.
    ApiFieldError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Loc
          description: 'Where the bad value is: `body`, `query` or `path`, then the parameter name exactly as you send it (camelCase), then list indexes. A bare `["body"]` means the body as a whole was not a JSON object.'
          examples:
          - - body
            - corpusType
        msg:
          type: string
          title: Msg
          description: What is wrong with the value, in plain English.
          examples:
          - Input should be 'USC', 'CFR' or 'STATE'
        type:
          type: string
          title: Type
          description: Machine-readable error kind, e.g. `missing`, `literal_error`, `json_invalid`.
          examples:
          - literal_error
      type: object
      required:
      - loc
      - msg
      - type
      title: ApiFieldError
      description: One rejected field in a 422 response.
    SessionLawBatchLaw:
      properties:
        sessionLawId:
          type: string
          title: Sessionlawid
          description: 'Permanent identifier of the law, the key to use everywhere. Shape `SSL_{state}_{session code}_{series}[_Y{numberingYear}]_{C<chapter>|B<billKey>}`. It never changes: a correction to our reading of a law keeps the old id working. Pass it to `GET /us/session-laws/{sessionLawId}`.'
          examples:
          - SSL_MN_2025R_G_Y2025_C1
        lawId:
          anyOf:
          - type: string
          - type: 'null'
          title: Lawid
          description: The law's identifier in the open us1 scheme. Null until its identity is confirmed by a second source and the us1 state shape is minted, so it is null on every state law today. Use `sessionLawId`, which is always present.
          examples:
          - null
        jurisdiction:
          type: string
          title: Jurisdiction
          description: 'Lowercase two-letter code of the state, `dc` or `pr`. Federal acts are not served by this family: they are on `/us/statutes/section`.'
          examples:
          - mn
        citation:
          type: string
          title: Citation
          description: 'The act''s citation as its publisher prints it, falling back to `{session label}, ch. {number}` when none is printed. It is NOT unique: many states print a bare `CHAPTER 1` every session. Key on `sessionLawId`.'
          examples:
          - CHAPTER 1--S.F.No. 1552
          - ACT No. 2
          - Chapter 1, Laws of 2025
        citableAs:
          anyOf:
          - type: string
          - type: 'null'
          title: Citableas
          description: 'The law cited the way a lawyer writes it, from the state''s own form: `Minn. Laws 2025, ch. 1`, `2025 Fla. Laws ch. 3`, `Ill. Pub. Act 104-0001`, `S.L. 2025-12` (North Carolina), `Stats. 2025, ch. 12` (California), `Ohio S.B. 1 (2025)` for a state that numbers no chapters. A law in a special or extraordinary session carries it (`Minn. Laws 2025, 1st Spec. Sess., ch. 1`). Every value is read back through the grammar that `GET /us/session-laws/{sessionLawId}` accepts a citation in, and must name this law; one that would not is null, never guessed. Null where the state''s form is not known, for a series with no standard form (resolutions, memorials), or for a law with neither a chapter nor a bill key. Where a regular and a special session each have a chapter 1, the bare form is the regular session''s law and resolves with that law flagged as the default; the special session''s carries its session. Distinct from `citation`, which is the publisher''s printed form.'
          examples:
          - Minn. Laws 2025, ch. 1
          - 2025 Tex. Gen. Laws ch. 1
          - null
        citationShort:
          anyOf:
          - type: string
          - type: 'null'
          title: Citationshort
          description: 'A compact label for tables and badges: `MN ch. 1 (2025)`, `IL P.A. 104-0001`, `OH S.B. 1 (2025)`. Not a form to send back: use `citableAs` or the `sessionLawId`. Null exactly when `citableAs` is null.'
          examples:
          - MN ch. 1 (2025)
          - TX ch. 1 (2025)
          - null
        session:
          $ref: '#/components/schemas/SessionLawDetailSession'
          description: The legislative session the law was enacted in, and whether we hold all of it (`coverageStatus`).
        series:
          type: string
          title: Series
          description: The numbering series the law belongs to within its session. Most states have one, `general`. Others number acts, resolutions or local laws separately (`public`, `act`, `acts`, `law`, `public_act`, `resolve`, `resolution_chapter`, `local`, ...). An open list that grows as jurisdictions load. Filter with `series` on the list.
          examples:
          - general
        instrumentType:
          type: string
          title: Instrumenttype
          description: 'What kind of measure this is: `act`, `joint_resolution`, `concurrent_resolution`, `resolution`, `resolve`, `memorial` or `other`. An open list. A resolution that was numbered and published among the session laws is included, with `isLaw` saying whether it binds as law.'
          examples:
          - act
        number:
          anyOf:
          - type: string
          - type: 'null'
          title: Number
          description: 'The chapter or act number exactly as printed, as a string. It is not always an integer: `1`, `2025-12` (Florida), `104-0001` (Illinois), `1A`. Null where the state does not number its acts (see `billKey`).'
          examples:
          - '1'
          - 2025-12
        billKey:
          anyOf:
          - type: string
          - type: 'null'
          title: Billkey
          description: Normalised bill identifier (chamber and type letters plus the number) that stands in for a chapter number in states that do not number their acts (Missouri, Ohio, Nebraska). `House Bill 2` is `HB2`. Null whenever `number` is set. Part of the `sessionLawId` as `B<billKey>`.
          examples:
          - HB2
          - null
        billNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Billnumber
          description: The bill the act originated as, as the publisher prints it. Matches as a citation on `GET /us/session-laws/{sessionLawId}`.
          examples:
          - S.F.No. 1552
          - House Bill 2
        numberingYear:
          anyOf:
          - type: integer
          - type: 'null'
          title: Numberingyear
          description: 'The year of the numbering sequence the chapter number belongs to, where the state numbers by year (Minnesota, Florida, Texas). It appears in the `sessionLawId` as `_Y2025`. A chapter number is only unique within a session and numbering year: Minnesota''s regular and first special sessions of 2025 each have a Chapter 1. Null where one sequence runs across the session (Louisiana).'
          examples:
          - 2025
          - null
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: The act's long title as printed, usually beginning `An act relating to`. It names the code sections the act amends in prose.
          examples:
          - An act relating to agriculture; modifying financial reporting requirements for grain buyers; amending Minnesota Statutes 2024, section 223.17, subdivision 6.
        shortTitle:
          anyOf:
          - type: string
          - type: 'null'
          title: Shorttitle
          description: The act's short title when the publisher gives one (Ohio, New York, the District of Columbia and a few others do), otherwise null.
          examples:
          - Enact Advance Ohio Higher Education Act
          - null
        approvedDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Approveddate
          description: 'Date the governor (or the equivalent authority) approved the act, ISO 8601. Never an effective date: an act is usually in force on a different day, which is `effectiveDates`. Null when the publisher prints no approval date. Where the registry holds none but the publisher''s own dated label on `otherDates` names the governor''s signature, it is filled from that label and `approvedDateDerived` is true. The `approvedFrom` and `approvedTo` filters do NOT match a derived date: they read the registry''s own approval date.'
          examples:
          - '2025-03-17'
        approvedDateDerived:
          type: boolean
          title: Approveddatederived
          description: True only when `approvedDate` was not held as an approval date and we filled it from a dated label printed on the act (today South Dakota's `Signed by the Governor`, listed under `otherDates`), on an act whose `enactmentOutcome` is `signed` or `line_item_veto`. False when `approvedDate` is null or is the registry's own. We never read a `presented` or `passed` date as an approval, nor a signing label on an act that became law without signature.
          default: false
          examples:
          - false
          - true
        effectiveFirst:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effectivefirst
          description: 'Earliest of the act''s effective dates we hold. Null when we hold none: a date the publisher does not print, or prints as a relative rule (`the day following final enactment`), is not guessed. The full list is `effectiveDates` on `GET /us/session-laws/{sessionLawId}`.'
          examples:
          - '2025-09-01'
          - null
        effectiveLast:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effectivelast
          description: Latest of the act's effective dates we hold. Equal to `effectiveFirst` for an act with one date; null when we hold none.
          examples:
          - '2026-01-01'
          - null
        enactmentOutcome:
          type: string
          title: Enactmentoutcome
          description: How the measure became, or failed to become, law. `signed`; `became_law_without_signature`; `veto_overridden`; `line_item_veto` (signed with some items vetoed); `vetoed` and `pocket_veto` (not law); `not_presented` (no governor action recorded, usual for resolutions); `approved_by_voters`; `unknown` (the publisher does not say).
          examples:
          - signed
        isLaw:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Islaw
          description: 'True for an act that is law. False for a numbered measure that is not: a vetoed bill, a pocket veto. Null when `enactmentOutcome` does not settle it (`not_presented`, `unknown`).'
          examples:
          - true
        textStatus:
          type: string
          enum:
          - held
          - withheld
          - not_held
          - pending
          title: Textstatus
          description: 'Whether we serve this law''s text. `held`: the text is served by `/us/session-laws/{sessionLawId}/body`. `withheld`: we hold the text but a measured defect keeps it from being served, and `withheldReason` says what. `not_held`: we know the act exists and do not hold its text. `pending`: collected and not yet verified.'
          examples:
          - held
        withheldReason:
          anyOf:
          - type: string
          - type: 'null'
          title: Withheldreason
          description: 'Present only when `textStatus` is `withheld`: a plain sentence saying what is wrong with the text we hold and what would release it. Free text, not an enum: show it, do not branch on it. The record itself (dates, sources, title) is still served and still correct.'
          examples:
          - 'LA: struck (deleted) law is merged into the text as if current while the record declares the markup preserved or absent (audit 2026-10-03). Awaiting a re-run with strike and underline recovery.'
          - null
        charCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Charcount
          description: Length of the law's full text in characters, the same as `totalChars` on the body. Null when there is no text. It is reported for a withheld law too (a fact about the text we hold), though that text is not served.
          examples:
          - 5470
          - 310454
        estimatedBodyPages:
          anyOf:
          - type: integer
          - type: 'null'
          title: Estimatedbodypages
          description: 'How many body pages the text takes: `charCount` divided by the page size (30,000 characters), rounded up. Pages are cut back to a paragraph break, so a long act can run a few percent over. Null unless `textStatus` is `held`: there is nothing to read. Reading a whole law costs `estimatedBodyPages` times the price of one body page (6 credits per page on `GET /us/session-laws/{sessionLawId}/body`). Ohio''s 2025 budget act (HB 96) is 9,571,132 characters, about 320 pages or 1,920 credits to read in full; most acts are a page or two.'
          examples:
          - 1
          - 11
        textSha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Textsha256
          description: SHA-256 (hex) of the full text of this law. It changes only when the text does, so it is the cheap way to tell whether a copy you hold is current. Body pages carry the same value.
          examples:
          - 55c7a8d08647e41f87e23fc2016881a6583911a1d5cfa8687403442e9096451b
        versionNo:
          anyOf:
          - type: integer
          - type: 'null'
          title: Versionno
          description: 'Revision counter of our record of this law: 1 for the first collection, higher after a re-collection changed the text or the metadata. Not a legislative version.'
          examples:
          - 1
        amendatoryMarkup:
          anyOf:
          - type: string
          - type: 'null'
          title: Amendatorymarkup
          description: 'Whether the language an amending act strikes and inserts survives in the text. `preserved`: it is in `text`, in the convention `markupConvention` names. `lost`: the publisher printed it and our text does not keep it, so deleted words can read as law: check the source before quoting. `absent`: the act carries no such markup that we found. `not_applicable`: there is no text to carry it.'
          examples:
          - preserved
        markupConvention:
          anyOf:
          - type: string
          - type: 'null'
          title: Markupconvention
          description: 'How preserved markup is written, set only when `amendatoryMarkup` is `preserved`. `wdiff`: deleted language is `[-like this-]` and inserted language `{+like this+}`. `publisher_literal`: the publisher''s own words are left as printed (Minnesota prints `new text begin` / `new text end` and `deleted text begin` / `deleted text end` markers). `mixed`: both in one text.'
          examples:
          - publisher_literal
          - wdiff
        documentKind:
          anyOf:
          - type: string
          - type: 'null'
          title: Documentkind
          description: 'What kind of document the text was taken from: `session_law_print` (the publisher''s printed chapter), `enrolled_bill`, `slip_law`, `volume_extract` (carved out of a bound volume) or `other`. An open list. Null when there is no text.'
          examples:
          - session_law_print
          - enrolled_bill
        identityConfidence:
          type: string
          title: Identityconfidence
          description: 'How firmly the law''s identity (session and number) is established. `single_source`: read from one publisher source, which is every state law at launch. `confirmed`: agreed by a second independent source, the level at which a `lawId` can be minted. `inferred`: derived by us rather than printed. `disputed`: sources disagree. The `sessionLawId` is the same at every level.'
          examples:
          - single_source
        licenseNote:
          anyOf:
          - type: string
          - type: 'null'
          title: Licensenote
          description: 'What the law''s licence class is and what it means for reuse, in a plain sentence: `Government public: published by a government body with no restrictive terms, so the text may be reused, including commercially.` Every law served with text is of a class that permits reuse; a note saying otherwise describes a record whose text is held back. Free text to show, not an enum to branch on: branch on `textStatus`.'
          examples:
          - 'Government public: published by a government body with no restrictive terms, so the text may be reused, including commercially.'
        updatedAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Updatedat
          description: When this law's record last changed in our registry, ISO 8601 UTC with a `+00:00` offset, the same form as the statutes routes. Use it with `updatedSince` on the list to sync only what changed.
          examples:
          - '2026-10-05T09:06:39.998043+00:00'
        citationAsPrinted:
          anyOf:
          - type: string
          - type: 'null'
          title: Citationasprinted
          description: The citation exactly as the publisher prints it. Null when none is printed.
          examples:
          - CHAPTER 1--S.F.No. 1552
          - CCS SS SCS HCS HB 2
        vetoStatusAsPrinted:
          anyOf:
          - type: string
          - type: 'null'
          title: Vetostatusasprinted
          description: The publisher's own words on the governor's action. `enactmentOutcome` is our normalised reading of it.
          examples:
          - Signed by the governor March 17, 2025, 10:54 a.m.
        pageCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pagecount
          description: Pages in the source document when it is a PDF. Null for HTML sources.
          examples:
          - 162
          - null
        sourceUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourceurl
          description: 'The official page or file the act''s text was collected from, on a government publisher''s host: the first `sources` entry whose `role` is `text` and whose `hostClass` is `gov`. Open it to verify the text against the publisher. Null when we hold no such source (a law we know exists and have not collected) or when the text source is not a government host. Present on a withheld law too: the official copy is always where to go when we hold the text back.'
          examples:
          - https://www.revisor.mn.gov/laws/2025/0/Session+Law/Chapter/1/
        effectiveDates:
          items:
            $ref: '#/components/schemas/SessionLawDate'
          type: array
          title: Effectivedates
          description: 'Every effective date the publisher prints for the act, in printed order. Always a list, never null; empty when none is held. Empty does NOT mean the act is not in force: a date printed as a rule (`the day following final enactment`) or not printed in the publisher''s metadata is not guessed, and the approval date is never substituted for it. An act can take effect in parts, so a date may carry a `scopeAsPrinted`.'
          examples:
          - - date: '2024-12-05'
              dateAsPrinted: December 5, 2024
          - - date: '2025-04-02'
              dateAsPrinted: '2025-04-02 00:00:00'
              scopeAsPrinted: CCP §871.20.
          - []
        otherDates:
          items:
            $ref: '#/components/schemas/SessionLawDate'
          type: array
          title: Otherdates
          description: 'Every other date printed on the act, each with its `kind`: the approval date, filing dates and the publisher''s own milestones (presentment to the governor).'
          examples:
          - - date: '2025-03-17'
              dateAsPrinted: March 17, 2025, 10:54 a.m.
              kind: approved
            - date: '2025-03-14'
              dateAsPrinted: March 14, 2025
              kind: other
              kindAsPrinted: Presentment Date
        codeSectionsAffected:
          items:
            $ref: '#/components/schemas/CodeSectionAffected'
          type: array
          title: Codesectionsaffected
          description: 'The code sections the publisher''s own table lists the act as affecting, as printed. Always a list. Empty when the publisher prints no such table, which is common: the title still names sections in prose. We do not read sections out of the act text into this list.'
          examples:
          - - actSectionAsPrinted: '6'
              actionAsPrinted: AMD
              codeAsPrinted: RCW
              sectionAsPrinted: 19.27A.020
          - []
        sources:
          items:
            $ref: '#/components/schemas/SessionLawSource'
          type: array
          title: Sources
          description: 'The publisher documents the record was collected from, with the hash and fetch time of each: the audit trail from this response back to the official copy.'
          examples:
          - - byteLength: 69907
              contentType: text/html; charset=utf-8
              fetchedAt: '2026-09-29T00:41:01Z'
              hostClass: gov
              role: text
              sha256: 6c83d9c109c1ec61fcd96cea92c8c48414df7ae7dfda7452ebcfbddc181b6b45
              sourceIndex: 0
              url: https://www.revisor.mn.gov/laws/2025/0/Session+Law/Chapter/1/
        publisher:
          anyOf:
          - $ref: '#/components/schemas/SessionLawPublisher'
          - type: 'null'
          description: 'What the publisher itself printed or published about the act, beyond the dates and citation above: its own structured fields verbatim (`publisherFields`: the bill''s action history, committees, sponsors, and vote counts where the publisher gives them), its own identifiers, the legislature number and the printed pages. Omitted, not null, when it cannot be read or we only know the act exists.'
        provenance:
          anyOf:
          - $ref: '#/components/schemas/SessionLawProvenance'
          - type: 'null'
          description: How we came by the text (the extraction method, the bound volume it was cut from) and the collector's own `caveats` on the record. Omitted, not null, when it cannot be read or we only know the act exists.
        input:
          type: string
          title: Input
          description: The entry of your `ids` this law answers, exactly as you sent it (trimmed). When two entries name the same law, the law appears once, under the first.
          examples:
          - S.F.No. 1552
        status:
          type: string
          enum:
          - resolved
          - not_held
          title: Status
          description: '`resolved`: the law is in the registry and its text status is `held`, `withheld` or `pending`. `not_held`: the registry knows the law exists and we hold no text (`textStatus: not_held`); the record is still served, and charged like any other, because it is the answer the lookup was for.'
          examples:
          - resolved
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
          description: The first page of the law's text exactly as printed, present only when `includeBody` was true and the text is served. Null otherwise, and then not charged. Read `bodyHasMore` to know whether the act continues.
          examples:
          - 'CHAPTER 1--S.F.No. 1552


            An act


            relating to agriculture; ...'
        bodyPageEnd:
          anyOf:
          - type: integer
          - type: 'null'
          title: Bodypageend
          description: 'Character offset just past `body` in the full text: the first page starts at 0. Null when `body` is null.'
          examples:
          - 5470
        bodyTotalChars:
          anyOf:
          - type: integer
          - type: 'null'
          title: Bodytotalchars
          description: Length of the whole text in characters. Null when `body` is null.
          examples:
          - 5470
        bodyHasMore:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Bodyhasmore
          description: True when the text continues beyond `body`. Each further page is read, and charged, on `GET /us/session-laws/{sessionLawId}/body`. Null when `body` is null.
          examples:
          - false
        bodyNextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Bodynextcursor
          description: Send as `cursor` to `GET /us/session-laws/{sessionLawId}/body` to read the next page of this law. Null on the last page, and when `body` is null.
          examples:
          - null
      type: object
      required:
      - sessionLawId
      - jurisdiction
      - citation
      - session
      - series
      - instrumentType
      - enactmentOutcome
      - textStatus
      - identityConfidence
      - input
      - status
      title: SessionLawBatchLaw
      description: 'One served law: the same record `GET /us/session-laws/{sessionLawId}` returns.'
    SessionLawSearchResponse:
      properties:
        query:
          type: string
          title: Query
          description: The query as read, whitespace collapsed.
          examples:
          - can the sheriff pay with a debit card
        parsed:
          $ref: '#/components/schemas/SessionLawSearchParsed'
          description: How the query was split into words, phrases, citations and bill numbers.
        results:
          items:
            $ref: '#/components/schemas/SessionLawSearchResult'
          type: array
          title: Results
          description: The laws, best first. Empty when nothing matched, which is an answer and is charged.
        count:
          type: integer
          title: Count
          description: Laws on this page.
          default: 0
          examples:
          - 5
        offset:
          type: integer
          title: Offset
          description: The `offset` this page was read from.
          default: 0
          examples:
          - 0
        limit:
          type: integer
          title: Limit
          description: The `limit` this page was read with.
          default: 10
          examples:
          - 5
        hasMore:
          type: boolean
          title: Hasmore
          description: 'True when more laws follow: call again with `offset` raised by `limit` (within the 60 best).'
          default: false
          examples:
          - true
        creditsConsumed:
          type: integer
          title: Creditsconsumed
          description: Credits actually charged for this call, never the list price. 0 when the call was refunded.
          default: 0
          examples:
          - 4
        processingTimeMs:
          type: number
          title: Processingtimems
          description: Server-side time for this request in milliseconds, excluding network transit. Not billed on.
          default: 0.0
          examples:
          - 38.6
      type: object
      required:
      - query
      - parsed
      title: SessionLawSearchResponse
      description: Response for `POST /us/session-laws/search`.
    SessionLawSearchRequest:
      properties:
        query:
          type: string
          maxLength: 300
          minLength: 2
          title: Query
          description: 'What to look for: a question in plain words (`can a sheriff pay with a debit card`), words from a title, a quoted phrase (`"credit card or debit card"`), a citation (`63-3004`), a code section or a bill number (`S.F.No. 1552`). Quoted parts must appear verbatim; everything else is matched on its words, stemmed, so `licensing` finds `licensed`. Words are matched as the legislature wrote them: `teeth cleaning professional` does not find an act that says `dental hygienist`. 2 to 300 characters.'
          examples:
          - can the sheriff pay with a debit card
        jurisdiction:
          anyOf:
          - type: string
            enum:
            - al
            - ak
            - az
            - ar
            - ca
            - co
            - ct
            - de
            - dc
            - fl
            - ga
            - gu
            - hi
            - id
            - il
            - in
            - ia
            - ks
            - ky
            - la
            - me
            - md
            - ma
            - mi
            - mn
            - ms
            - mo
            - mt
            - ne
            - nv
            - nh
            - nj
            - nm
            - ny
            - nc
            - nd
            - mp
            - oh
            - ok
            - or
            - pa
            - pr
            - ri
            - sc
            - sd
            - tn
            - tx
            - ut
            - vt
            - va
            - wa
            - wv
            - wi
            - wy
          - type: 'null'
          title: Jurisdiction
          description: Limit to one state, `dc` or `pr`. Two-letter code, case-insensitive. Omit to search every jurisdiction we hold. `federal` and an unknown code are a 422, never charged.
          examples:
          - al
        session:
          anyOf:
          - type: string
            maxLength: 32
            minLength: 1
            pattern: ^[A-Za-z0-9._-]+$
          - type: 'null'
          title: Session
          description: Limit to one session, by the code `session.code` reports (`2025R`, `2025S1`). Case-sensitive. Matches the act's own session, so it narrows the TITLE, citation and bill signals; the passage text of an act carries its session year and type but not the code.
          examples:
          - 2025R
        series:
          anyOf:
          - items:
              type: string
              enum:
              - general
              - public
              - public_act
              - special_act
              - private_and_special
              - act
              - acts
              - law
              - local
              - municipal
              - appropriation
              - resolve
              - resolves
              - resolution
              - resolution_chapter
              - joint_resolution
              - concurrent_resolution
              - memorial
              - initiated_bill
              - constitutional_amendment
            type: array
          - type: 'null'
          title: Series
          description: Limit to these numbering series, one or more (they combine with OR). One of `general`, `public`, `public_act`, `special_act`, `private_and_special`, `act`, `acts`, `law`, `local`, `municipal`, `appropriation`, `resolve`, `resolves`, `resolution`, `resolution_chapter`, `joint_resolution`, `concurrent_resolution`, `memorial`, `initiated_bill`, `constitutional_amendment`. Any other value is a 422, never charged.
          examples:
          - - general
        instrumentType:
          anyOf:
          - items:
              type: string
              enum:
              - act
              - joint_resolution
              - concurrent_resolution
              - resolution
              - resolve
              - memorial
              - other
            type: array
          - type: 'null'
          title: Instrumenttype
          description: Limit to these kinds of measure, one or more (OR). One of `act`, `joint_resolution`, `concurrent_resolution`, `resolution`, `resolve`, `memorial`, `other`. Any other value is a 422, never charged.
          examples:
          - - act
            - joint_resolution
        approvedFrom:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
          format: date
          title: Approvedfrom
          description: Only laws approved on or after this date, `YYYY-MM-DD`, inclusive; a real calendar date (`2025-02-30` is a 422). A law with no printed approval date never matches.
          examples:
          - '2025-03-01'
        approvedTo:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
          format: date
          title: Approvedto
          description: Only laws approved on or before this date, `YYYY-MM-DD`, inclusive. An end before `approvedFrom` is a 422, never charged.
          examples:
          - '2025-06-30'
        limit:
          type: integer
          maximum: 25.0
          minimum: 1.0
          title: Limit
          description: Laws per page, 1 to 25. A page costs the same however many laws it holds, so a larger `limit` is cheaper per law.
          default: 10
          examples:
          - 5
        offset:
          type: integer
          maximum: 59.0
          minimum: 0.0
          title: Offset
          description: 'Laws to skip, for the next page: `offset` plus `limit` can reach at most the 60 best matches. Each page is a new search and is charged. Deeper than 60 is a 422, never charged: narrow the search with a filter instead.'
          default: 0
          examples:
          - 5
      additionalProperties: false
      type: object
      required:
      - query
      title: SessionLawSearchRequest
      description: Body of `POST /us/session-laws/search`.
    SessionLawSearchResult:
      properties:
        sessionLawId:
          type: string
          title: Sessionlawid
          description: The law's permanent id. Read the whole law at `GET /us/session-laws/{sessionLawId}`.
          examples:
          - SSL_AL_2025R_G_Y2025_C2025-127
        jurisdiction:
          type: string
          title: Jurisdiction
          description: Lowercase two-letter code of the state, `dc` or `pr`.
          examples:
          - al
        session:
          type: string
          title: Session
          description: The session's code, as `session.code` reports it.
          examples:
          - 2025R
        series:
          type: string
          title: Series
          description: The numbering series the law sits in.
          examples:
          - general
        instrumentType:
          type: string
          title: Instrumenttype
          description: 'The kind of measure: `act`, `joint_resolution` and so on.'
          examples:
          - act
        citation:
          type: string
          title: Citation
          description: The law's canonical citation, as the registry holds it.
          examples:
          - Act 2025-127
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: The act's title as the publisher prints it; null where the publisher printed none.
          examples:
          - Relating to Houston County; to authorize the sheriff to establish procedures for using a credit card.
        approvedDate:
          anyOf:
          - type: string
          - type: 'null'
          title: Approveddate
          description: The date the governor approved it, `YYYY-MM-DD`, where the publisher printed one; else null.
          examples:
          - '2025-04-15'
        enactmentOutcome:
          type: string
          title: Enactmentoutcome
          description: 'How it became law: `signed`, `became_law_without_signature`, `veto_overridden` and so on.'
          examples:
          - signed
        matchType:
          type: string
          enum:
          - exact
          - text
          title: Matchtype
          description: '`exact` when a quoted phrase, a citation, a code section or a bill number you typed matched this law; `text` when it matched on words alone. It says HOW it matched and makes no claim that this is the right law: a question with no true answer still returns its closest words.'
          examples:
          - text
        matchedBy:
          items:
            type: string
            enum:
            - title
            - text
            - phrase
            - citation
            - codeSection
            - billNumber
          type: array
          title: Matchedby
          description: 'Every way this law matched, strongest context first. `title`: the words are in the act''s title. `text`: they are in its enacted text. `phrase`: your quoted phrase appears verbatim. `citation`: a citation you typed (`63-3004`) appears in the text. `codeSection`: the act''s own table lists that code section. `billNumber`: the act''s bill number is the one you typed. A law matched by several ranks above one matched by a single way.'
          examples:
          - - title
            - text
        passage:
          anyOf:
          - $ref: '#/components/schemas/SessionLawSearchPassage'
          - type: 'null'
          description: The passage of the law's text that matched best, with a snippet. Null when this law matched only by title, citation, code section or bill number and no passage did.
        href:
          type: string
          title: Href
          description: 'The law''s record: `GET /us/session-laws/{sessionLawId}`.'
          examples:
          - https://api.vaquill.ai/api/v1/us/session-laws/SSL_AL_2025R_G_Y2025_C2025-127
      type: object
      required:
      - sessionLawId
      - jurisdiction
      - session
      - series
      - instrumentType
      - citation
      - enactmentOutcome
      - matchType
      - matchedBy
      - href
      title: SessionLawSearchResult
      description: One law in the ranking.
    SessionLawDetailSession:
      properties:
        code:
          type: string
          title: Code
          description: Session code, `{year}{type}{ordinal}`. `type` is `R` regular, `S` special, `X` extraordinary, `F` fiscal, `V` veto, `U` unknown. A regular session has no ordinal (`2025R`); a numbered special session carries it (`2025S1`, the first special session of 2025); a lettered one carries its letter (`2025SC`, Florida's Special Session C). `year` is the year the publisher numbers the session by, which for a period spanning two years is the first (District of Columbia Council Period 25 is `2023R`). Pass it as `session` to `GET /us/session-laws/list`.
          examples:
          - 2025R
          - 2025S1
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
          description: The session's canonical label, as the publisher names it.
          examples:
          - 2025 Regular Session
          - 2025 1st Special Session
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
          description: '`regular`, `special`, `extraordinary`, `fiscal`, `veto` or `unknown`.'
          examples:
          - regular
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
          description: The year the session convened, the same year `code` starts with.
          examples:
          - 2025
        coverageStatus:
          anyOf:
          - type: string
            enum:
            - complete
            - partial
          - type: 'null'
          title: Coveragestatus
          description: 'Whether we hold every law of this session. `complete`: every law the publisher lists for the session is accounted for, so a law absent from the list does not exist. `partial`: the collection of the session stopped short, so a law that is not found may exist, and this law''s neighbours may be missing. The same verdict, with the counts behind it, is in the `sessionLaws` block on `GET /us/statutes/coverage`. Omitted when it cannot be read.'
          examples:
          - complete
          - partial
      type: object
      required:
      - code
      title: SessionLawDetailSession
      description: 'The session block of a single law: the session, and whether we hold all of it.'
    SessionLawListCoverage:
      properties:
        scope:
          type: string
          enum:
          - session
          - jurisdiction
          title: Scope
          description: '`session` when the request named a `session`, `jurisdiction` when it named only the state.'
          examples:
          - session
          - jurisdiction
        jurisdiction:
          type: string
          title: Jurisdiction
          description: Lowercase two-letter code of the state, `dc` or `pr`.
          examples:
          - ok
        status:
          type: string
          enum:
          - complete
          - partial
          - not_held
          title: Status
          description: '`complete`: we hold every law the publisher lists for what you asked about, so an empty page means nothing matches your filters, and it is charged. `partial`: the collection stopped short, so the empty page may be a gap in our collection and not an absence of law; it is not charged when everything you asked about is partial. On a state-wide request (`scope: jurisdiction`) with some sessions complete and some partial the status is `partial`, `partialSessions` names the ones to doubt, and the page is charged, because for the complete sessions it is a true negative. `not_held`: we hold no session laws for this session or state at all (a state whose publisher we cannot yet collect from, for example); not charged.'
          examples:
          - complete
          - partial
          - not_held
        session:
          anyOf:
          - $ref: '#/components/schemas/SessionLawSession'
          - type: 'null'
          description: The session you named, when `scope` is `session` and we hold any of it. Its counts are in the jurisdiction's `sessionLaws` block on `GET /us/statutes/coverage`.
        sessionsHeld:
          type: integer
          minimum: 0.0
          title: Sessionsheld
          description: How many sessions of this state we hold session laws for. 0 when `not_held`.
          default: 0
          examples:
          - 1
          - 0
        partialSessions:
          items:
            type: string
          type: array
          title: Partialsessions
          description: 'Session codes of this state whose collection is `partial`: the ones an empty page may be missing laws from. Empty when none.'
          examples:
          - - 2025R
          - []
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: 'Present on `not_held`: why we hold nothing, in one plain sentence. A gap in our collection, not a statement that the state enacted no laws.'
          examples:
          - Indiana publishes its session laws only through a service that needs an access token we do not hold yet.
        message:
          type: string
          title: Message
          description: 'One sentence saying what this empty page means and whether it was charged. Free text to show, not an enum to branch on: branch on `status`.'
          examples:
          - No law in this session matches your filters. We hold every law the publisher lists for 2025R, so this is not a gap in our collection.
      type: object
      required:
      - scope
      - jurisdiction
      - status
      - message
      title: SessionLawListCoverage
      description: What we hold of the session or state an EMPTY page was asked about.
    SessionLawPublisherId:
      properties:
        name:
          type: string
          title: Name
          description: 'The publisher''s own label for the identifier, exactly as it prints or exposes it, so it is not a vocabulary: `RAT#` (South Carolina), `bill_id` (California), `num type="act"` (District of Columbia), `BillNumber` (Maryland), `L.D.` (Maine).'
          examples:
          - RAT#
          - bill_id
          - num type="act"
        value:
          type: string
          title: Value
          description: 'The identifier''s value as the publisher gives it, always a string: `5`, `202520260SB26`, `25-5`, `HB0001`.'
          examples:
          - '5'
          - 202520260SB26
          - 25-5
      type: object
      required:
      - name
      - value
      title: SessionLawPublisherId
      description: An identifier the publisher itself gives an act.
    SessionLawBodyResponse:
      properties:
        processingTimeMs:
          type: number
          title: Processingtimems
          description: Server-side time for this request in milliseconds, excluding network transit. Not billed on.
          default: 0.0
          examples:
          - 747.5
        creditsConsumed:
          type: integer
          title: Creditsconsumed
          description: 'Credits actually charged for this call, never the list price. It includes the `/us/statutes/resolve` fee when a citation was sent where an id goes. 0 when the call was not charged or was refunded (a body that answers `available: false`).'
          default: 0
          examples:
          - 2
        sessionLawId:
          type: string
          title: Sessionlawid
          description: The law this page belongs to.
          examples:
          - SSL_MN_2025S1_G_Y2025_C1
        citation:
          type: string
          title: Citation
          description: The act's citation as its publisher prints it, the same as `citation` on `GET /us/session-laws/{sessionLawId}`. Carried here so a page is attributable on its own, with no second call.
          examples:
          - CHAPTER 1--S.F.No. 3
        jurisdiction:
          type: string
          title: Jurisdiction
          description: Lowercase two-letter code of the state, `dc` or `pr`.
          examples:
          - mn
        session:
          $ref: '#/components/schemas/SessionLawSession'
          description: The legislative session the law was enacted in.
        approvedDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Approveddate
          description: 'Date the governor approved the act, ISO 8601, as on `GET /us/session-laws/{sessionLawId}`: never an effective date. Null when none is held. See `approvedDateDerived`.'
          examples:
          - '2025-06-14'
        approvedDateDerived:
          type: boolean
          title: Approveddatederived
          description: True only when `approvedDate` was filled from the publisher's dated signature label rather than held as the approval date. See the same field on `GET /us/session-laws/{sessionLawId}`.
          default: false
          examples:
          - false
        sourceUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourceurl
          description: 'The official page or file this text was collected from, on a government publisher''s host. Present on EVERY outcome, a withheld or not-held law included, so a reader is never at a dead end: where we do not serve the text, this is where to read it. Null only when we hold no government text source for the law.'
          examples:
          - https://www.revisor.mn.gov/laws/2025/1/Session+Law/Chapter/1/
        available:
          type: boolean
          title: Available
          description: 'False when we do not serve this law''s text; `reason` says why. A page with `available: false` is not charged.'
          examples:
          - true
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: 'Why `available` is false: `not_held`, `withheld`, `pending` or `empty_text`. Null when the text is served.'
          examples:
          - withheld
          - null
        textStatus:
          type: string
          enum:
          - held
          - withheld
          - not_held
          - pending
          title: Textstatus
          description: 'Whether we serve this law''s text. `held`: the text is served by `/us/session-laws/{sessionLawId}/body`. `withheld`: we hold the text but a measured defect keeps it from being served, and `withheldReason` says what. `not_held`: we know the act exists and do not hold its text. `pending`: collected and not yet verified.'
          examples:
          - held
        withheldReason:
          anyOf:
          - type: string
          - type: 'null'
          title: Withheldreason
          description: 'Present only when `textStatus` is `withheld`: what is wrong with the text we hold. A plain sentence to show, not an enum to branch on.'
          examples:
          - 'LA: struck (deleted) law is merged into the text as if current while the record declares the markup preserved or absent (audit 2026-10-03). Awaiting a re-run with strike and underline recovery.'
          - null
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
          description: This page of the act's text, exactly as printed, in reading order. Concatenating every page's `text` in order reproduces the whole text. Where `amendatoryMarkup` is `preserved`, struck and inserted language is in the text in the convention `markupConvention` names. Null when `available` is false.
          examples:
          - 'CHAPTER 1--S.F.No. 1552


            An act


            relating to agriculture; ...'
        pageStart:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pagestart
          description: 'Character offset in the full text where this page starts (0-based). Pages are contiguous: the next page''s `pageStart` equals this page''s `pageEnd`.'
          examples:
          - 0
        pageEnd:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pageend
          description: Character offset just past this page. A page is about 30,000 characters, cut back to a paragraph break where one is near, so the length varies.
          examples:
          - 29987
        totalChars:
          anyOf:
          - type: integer
          - type: 'null'
          title: Totalchars
          description: Length of the whole text in characters. This page is the last when `pageEnd` equals it.
          examples:
          - 310454
        totalPages:
          anyOf:
          - type: integer
          - type: 'null'
          title: Totalpages
          description: 'Estimated pages in the whole text: `totalChars` divided by the page size, rounded up. Pages are cut back to a paragraph break, so a long act can run a few percent over. Null when no text is served.'
          examples:
          - 11
        pagePrice:
          type: integer
          title: Pageprice
          description: 'Credits charged for the page in this response, the same as `creditsConsumed` on this route: the price of one page when a page was served, 0 when none was (`available` is false). Each further page costs the same.'
          default: 0
          examples:
          - 6
        estimatedRemainingCredits:
          anyOf:
          - type: integer
          - type: 'null'
          title: Estimatedremainingcredits
          description: 'Estimated credits to read the rest of the text from `pageEnd`: the pages still to come (`totalChars` less `pageEnd`, over the page size, rounded up) times the price of a page. 0 on the last page. Null when no text is served. An estimate: a page cut back to a paragraph break can add a page on a long act. Reading a whole law costs `estimatedBodyPages` times the price of one body page (6 credits per page on `GET /us/session-laws/{sessionLawId}/body`). Ohio''s 2025 budget act (HB 96) is 9,571,132 characters, about 320 pages or 1,920 credits to read in full; most acts are a page or two.'
          examples:
          - 60
        textSha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Textsha256
          description: SHA-256 (hex) of the full text of this law. It changes only when the text does, so it is the cheap way to tell whether a copy you hold is current. Body pages carry the same value.
          examples:
          - 02693d5b55d4709bdd36fdccee4a9737d2655a3988a90daeb6b7c486ce50260b
        amendatoryMarkup:
          anyOf:
          - type: string
          - type: 'null'
          title: Amendatorymarkup
          description: 'Whether the language an amending act strikes and inserts survives in the text. `preserved`: it is in `text`, in the convention `markupConvention` names. `lost`: the publisher printed it and our text does not keep it, so deleted words can read as law: check the source before quoting. `absent`: the act carries no such markup that we found. `not_applicable`: there is no text to carry it.'
          examples:
          - preserved
        markupConvention:
          anyOf:
          - type: string
          - type: 'null'
          title: Markupconvention
          description: 'How preserved markup is written, set only when `amendatoryMarkup` is `preserved`. `wdiff`: deleted language is `[-like this-]` and inserted language `{+like this+}`. `publisher_literal`: the publisher''s own words are left as printed (Minnesota prints `new text begin` / `new text end` and `deleted text begin` / `deleted text end` markers). `mixed`: both in one text.'
          examples:
          - publisher_literal
          - null
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
          description: 'Opaque cursor for the next page: send it as `cursor` on the same path. Null on the last page. It is tied to this exact text, so a cursor from before the text was re-collected is a 409.'
          examples:
          - eyJ2IjoxLCJvIjoyOTk4NywiaCI6IjAyNjkzZDViNTVkNDcwOWIifQ
        hasMore:
          type: boolean
          title: Hasmore
          description: True when more pages follow; fetch them with `nextCursor`. Each page is charged.
          default: false
          examples:
          - true
      type: object
      required:
      - sessionLawId
      - citation
      - jurisdiction
      - session
      - available
      - textStatus
      title: SessionLawBodyResponse
      description: Response for `GET /us/session-laws/{sessionLawId}/body`.
    SessionLawResolution:
      properties:
        input:
          type: string
          title: Input
          description: What you sent in the path, exactly.
          examples:
          - S.F.No. 1552
        sessionLawId:
          type: string
          title: Sessionlawid
          description: The id it resolved to. Send this next time to skip resolution and its fee.
          examples:
          - SSL_MN_2025R_G_Y2025_C1
        via:
          type: string
          enum:
          - normalized_id
          - citation
          title: Via
          description: '`citation`: your input was a citation and matched exactly one law''s citation form. `normalized_id`: your input was an id carrying surrounding whitespace, quotes or a trailing period, which were removed.'
          examples:
          - citation
        matchedForm:
          anyOf:
          - type: string
          - type: 'null'
          title: Matchedform
          description: 'Which of the law''s citation forms your input matched: `as_printed` (its printed citation), `bill` (its bill number) or `other_as_printed` (another printed form). Null for `normalized_id`.'
          examples:
          - bill
          - as_printed
      type: object
      required:
      - input
      - sessionLawId
      - via
      title: SessionLawResolution
      description: How a citation sent in place of a `sessionLawId` was matched.
    SessionLawSessionCoverage:
      properties:
        code:
          type: string
          title: Code
          description: Session code, for example `2025R`.
          examples:
          - 2025R
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
          description: The session's canonical label.
          examples:
          - 2025 Regular Session
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
          description: '`regular`, `special`, `extraordinary`, `fiscal`, `veto` or `unknown`.'
          examples:
          - regular
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
          description: The year the session convened, the year `code` starts with.
          examples:
          - 2025
        status:
          type: string
          enum:
          - complete
          - partial
          title: Status
          description: '`complete` when every law the publisher lists for the session is accounted for. Anything less is `partial`: a law missing from a partial session is not evidence that it does not exist, and asking for one by id or citation answers `session_not_fully_collected`, free of charge, rather than a plain not found.'
          examples:
          - complete
        servedCount:
          type: integer
          minimum: 0.0
          title: Servedcount
          description: 'Laws from this session we serve: every one we answer for by id, citation or list, whether or not we hold its text (`notHeldCount` of them have none). Laws whose text is withheld are not counted here, they are `withheldCount`. `servedCount + withheldCount` is `registryCount`, less any law still being verified.'
          examples:
          - 39
        withheldCount:
          type: integer
          minimum: 0.0
          title: Withheldcount
          description: 'Laws from this session we hold and list but whose text is withheld for a measured defect (`textStatus: withheld`). They are real laws: their records are served, their text is not.'
          default: 0
          examples:
          - 0
        notHeldCount:
          type: integer
          minimum: 0.0
          title: Notheldcount
          description: 'Of the laws counted in `servedCount`, how many have no text held (`textStatus: not_held` or `pending`). A subset of `servedCount`, not an addition to it: do not add it to `servedCount` or `withheldCount`.'
          default: 0
          examples:
          - 0
        registryCount:
          type: integer
          minimum: 0.0
          title: Registrycount
          description: 'Every law of this session in our registry, whether or not its text is held: `servedCount + withheldCount`. Any difference is a law still being verified, which is neither.'
          default: 0
          examples:
          - 39
        collectedCount:
          type: integer
          minimum: 0.0
          title: Collectedcount
          description: Laws from this session whose text we have collected, served or withheld. Compare it with `denominator.value` to see how much of the session we hold.
          default: 0
          examples:
          - 39
        denominator:
          anyOf:
          - $ref: '#/components/schemas/SessionLawDenominator'
          - type: 'null'
          description: How many laws the session is expected to hold, and where that figure comes from. Null when it could not be read.
          examples:
          - derivation: The publisher's complete listing of this session names 296 measures. We hold 43 of them; the rest are not yet collected.
            kind: complete_listing
            value: 296
        openGaps:
          type: integer
          minimum: 0.0
          title: Opengaps
          description: Laws the publisher lists for this session that we could not collect and have not yet. 0 on a `complete` session.
          default: 0
          examples:
          - 0
        measuredAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Measuredat
          description: When this session's coverage was last measured, ISO 8601 UTC.
          examples:
          - '2026-10-05T09:07:12+00:00'
      type: object
      required:
      - code
      - status
      - servedCount
      title: SessionLawSessionCoverage
      description: One legislative session's session-law coverage.
    SessionLawVolume:
      properties:
        url:
          type: string
          title: Url
          description: The publisher's URL of the whole volume (a PDF of every act of the session) that this act's text was cut from. A government host.
          examples:
          - https://static.legmt.gov/Laws/MCA-Supplements/2025SessionLaws_VOL1_Updated.pdf
        pageStart:
          type: integer
          title: Pagestart
          description: 'First physical page of the act in that volume, counted from 1 at the first page of the file. Not the page number printed on the page: see `publisher.printedPageStart` for that.'
          examples:
          - 135
        pageEnd:
          type: integer
          title: Pageend
          description: Last physical page of the act in that volume, the same counting as `pageStart`.
          examples:
          - 135
        boundaryHeading:
          anyOf:
          - type: string
          - type: 'null'
          title: Boundaryheading
          description: The heading in the volume at which the act's text begins, which is how the cut was found. Null when none is recorded.
          examples:
          - CHAPTER NO. 1
      type: object
      required:
      - url
      - pageStart
      - pageEnd
      title: SessionLawVolume
      description: The bound volume an act's text was cut out of.
    SessionLawChange:
      properties:
        id:
          type: integer
          title: Id
          description: 'The entry''s position in the feed: an integer that only ever grows. Send the largest `id` you hold as `sinceId` to read what came after it.'
          examples:
          - 1501
        kind:
          type: string
          enum:
          - added
          - text_available
          - corrected
          - served
          - unserved
          - withdrawn
          - merged
          title: Kind
          description: 'What happened to the law. `added`: the registry learned the act exists. `text_available`: its text was collected. `corrected`: our reading of the law (its identity, dates or text) was corrected, so a copy you hold may be stale. `served`: it began to be served by this API. `unserved`: it stopped being served. `withdrawn`: it was removed from the registry, a tombstone: `GET /us/session-laws/{sessionLawId}` no longer answers it. `merged`: it was found to be the same law as another and merged into it, also a tombstone. So far every entry is `served`, one per law served when the registry went live; the other kinds appear as laws change. A consumer should treat a kind it does not know as `corrected`: re-read the law.'
          examples:
          - served
        sessionLawId:
          type: string
          title: Sessionlawid
          description: The law this entry is about. Read it at `GET /us/session-laws/{sessionLawId}`, except after `withdrawn` or `merged`, when it no longer answers.
          examples:
          - SSL_MN_2025R_G_Y2025_C1
        jurisdiction:
          type: string
          title: Jurisdiction
          description: Lowercase two-letter code of the state, `dc` or `pr`.
          examples:
          - mn
        detectedAt:
          type: string
          title: Detectedat
          description: 'When we recorded the change, ISO 8601 in UTC: the start of the transaction that wrote it. An upper bound on when the law changed in the world, never the date the law took effect or was approved.'
          examples:
          - '2026-10-05T09:04:11.120118+00:00'
      type: object
      required:
      - id
      - kind
      - sessionLawId
      - jurisdiction
      - detectedAt
      title: SessionLawChange
      description: One entry of the registry feed.
    SessionLawListResponse:
      properties:
        processingTimeMs:
          type: number
          title: Processingtimems
          description: Server-side time for this request in milliseconds, excluding network transit. Not billed on.
          default: 0.0
          examples:
          - 747.5
        creditsConsumed:
          type: integer
          title: Creditsconsumed
          description: 'Credits actually charged for this call, never the list price. It includes the `/us/statutes/resolve` fee when a citation was sent where an id goes. 0 when the call was not charged or was refunded (a body that answers `available: false`).'
          default: 0
          examples:
          - 2
        results:
          items:
            $ref: '#/components/schemas/SessionLawSummary'
          type: array
          title: Results
          description: 'The page of laws, by `session.code` and then `sessionLawId`, both as text in the database''s collation, not chapter order (so `..._C10` comes before `..._C2`; sort by `number` client-side if you need chapter order). The record without its dates list, sources or text: fetch those with `GET /us/session-laws/{sessionLawId}`.'
        count:
          type: integer
          title: Count
          description: 'Rows on this page. Never a total: the list is paged by cursor and has no corpus-wide count.'
          default: 0
          examples:
          - 25
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
          description: 'Opaque cursor for the next page: send it as `cursor`, with the same filters. Null on the last page.'
          examples:
          - eyJ2IjoxLCJqIjoibW4iLCJzIjoiMjAyNVIiLCJpIjoiU1NMX01OXzIwMjVSX0dfWTIwMjVfQzEzIn0
        hasMore:
          type: boolean
          title: Hasmore
          description: True when another page follows. Each page is charged, an empty one included, except an empty page that `coverage` reports as a gap in our collection.
          default: false
          examples:
          - true
        coverage:
          anyOf:
          - $ref: '#/components/schemas/SessionLawListCoverage'
          - type: 'null'
          description: 'Present only on an EMPTY page: what we hold of the session (or state) you asked about, so you can tell `nothing matches your filters` from `we have not collected this`. `status: complete` means the first: the page is charged. `partial` (the collection stopped short) and `not_held` (we hold nothing of it) mean the second: the page is NOT charged and `creditsConsumed` is 0. Omitted when the coverage cannot be read, in which case the empty page is charged as before.'
      type: object
      title: SessionLawListResponse
      description: Response for `GET /us/session-laws/list`.
    SessionLawSummary:
      properties:
        sessionLawId:
          type: string
          title: Sessionlawid
          description: 'Permanent identifier of the law, the key to use everywhere. Shape `SSL_{state}_{session code}_{series}[_Y{numberingYear}]_{C<chapter>|B<billKey>}`. It never changes: a correction to our reading of a law keeps the old id working. Pass it to `GET /us/session-laws/{sessionLawId}`.'
          examples:
          - SSL_MN_2025R_G_Y2025_C1
        lawId:
          anyOf:
          - type: string
          - type: 'null'
          title: Lawid
          description: The law's identifier in the open us1 scheme. Null until its identity is confirmed by a second source and the us1 state shape is minted, so it is null on every state law today. Use `sessionLawId`, which is always present.
          examples:
          - null
        jurisdiction:
          type: string
          title: Jurisdiction
          description: 'Lowercase two-letter code of the state, `dc` or `pr`. Federal acts are not served by this family: they are on `/us/statutes/section`.'
          examples:
          - mn
        citation:
          type: string
          title: Citation
          description: 'The act''s citation as its publisher prints it, falling back to `{session label}, ch. {number}` when none is printed. It is NOT unique: many states print a bare `CHAPTER 1` every session. Key on `sessionLawId`.'
          examples:
          - CHAPTER 1--S.F.No. 1552
          - ACT No. 2
          - Chapter 1, Laws of 2025
        citableAs:
          anyOf:
          - type: string
          - type: 'null'
          title: Citableas
          description: 'The law cited the way a lawyer writes it, from the state''s own form: `Minn. Laws 2025, ch. 1`, `2025 Fla. Laws ch. 3`, `Ill. Pub. Act 104-0001`, `S.L. 2025-12` (North Carolina), `Stats. 2025, ch. 12` (California), `Ohio S.B. 1 (2025)` for a state that numbers no chapters. A law in a special or extraordinary session carries it (`Minn. Laws 2025, 1st Spec. Sess., ch. 1`). Every value is read back through the grammar that `GET /us/session-laws/{sessionLawId}` accepts a citation in, and must name this law; one that would not is null, never guessed. Null where the state''s form is not known, for a series with no standard form (resolutions, memorials), or for a law with neither a chapter nor a bill key. Where a regular and a special session each have a chapter 1, the bare form is the regular session''s law and resolves with that law flagged as the default; the special session''s carries its session. Distinct from `citation`, which is the publisher''s printed form.'
          examples:
          - Minn. Laws 2025, ch. 1
          - 2025 Tex. Gen. Laws ch. 1
          - null
        citationShort:
          anyOf:
          - type: string
          - type: 'null'
          title: Citationshort
          description: 'A compact label for tables and badges: `MN ch. 1 (2025)`, `IL P.A. 104-0001`, `OH S.B. 1 (2025)`. Not a form to send back: use `citableAs` or the `sessionLawId`. Null exactly when `citableAs` is null.'
          examples:
          - MN ch. 1 (2025)
          - TX ch. 1 (2025)
          - null
        session:
          $ref: '#/components/schemas/SessionLawSession'
          description: The legislative session the law was enacted in.
        series:
          type: string
          title: Series
          description: The numbering series the law belongs to within its session. Most states have one, `general`. Others number acts, resolutions or local laws separately (`public`, `act`, `acts`, `law`, `public_act`, `resolve`, `resolution_chapter`, `local`, ...). An open list that grows as jurisdictions load. Filter with `series` on the list.
          examples:
          - general
        instrumentType:
          type: string
          title: Instrumenttype
          description: 'What kind of measure this is: `act`, `joint_resolution`, `concurrent_resolution`, `resolution`, `resolve`, `memorial` or `other`. An open list. A resolution that was numbered and published among the session laws is included, with `isLaw` saying whether it binds as law.'
          examples:
          - act
        number:
          anyOf:
          - type: string
          - type: 'null'
          title: Number
          description: 'The chapter or act number exactly as printed, as a string. It is not always an integer: `1`, `2025-12` (Florida), `104-0001` (Illinois), `1A`. Null where the state does not number its acts (see `billKey`).'
          examples:
          - '1'
          - 2025-12
        billKey:
          anyOf:
          - type: string
          - type: 'null'
          title: Billkey
          description: Normalised bill identifier (chamber and type letters plus the number) that stands in for a chapter number in states that do not number their acts (Missouri, Ohio, Nebraska). `House Bill 2` is `HB2`. Null whenever `number` is set. Part of the `sessionLawId` as `B<billKey>`.
          examples:
          - HB2
          - null
        billNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Billnumber
          description: The bill the act originated as, as the publisher prints it. Matches as a citation on `GET /us/session-laws/{sessionLawId}`.
          examples:
          - S.F.No. 1552
          - House Bill 2
        numberingYear:
          anyOf:
          - type: integer
          - type: 'null'
          title: Numberingyear
          description: 'The year of the numbering sequence the chapter number belongs to, where the state numbers by year (Minnesota, Florida, Texas). It appears in the `sessionLawId` as `_Y2025`. A chapter number is only unique within a session and numbering year: Minnesota''s regular and first special sessions of 2025 each have a Chapter 1. Null where one sequence runs across the session (Louisiana).'
          examples:
          - 2025
          - null
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: The act's long title as printed, usually beginning `An act relating to`. It names the code sections the act amends in prose.
          examples:
          - An act relating to agriculture; modifying financial reporting requirements for grain buyers; amending Minnesota Statutes 2024, section 223.17, subdivision 6.
        shortTitle:
          anyOf:
          - type: string
          - type: 'null'
          title: Shorttitle
          description: The act's short title when the publisher gives one (Ohio, New York, the District of Columbia and a few others do), otherwise null.
          examples:
          - Enact Advance Ohio Higher Education Act
          - null
        approvedDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Approveddate
          description: 'Date the governor (or the equivalent authority) approved the act, ISO 8601. Never an effective date: an act is usually in force on a different day, which is `effectiveDates`. Null when the publisher prints no approval date. Where the registry holds none but the publisher''s own dated label on `otherDates` names the governor''s signature, it is filled from that label and `approvedDateDerived` is true. The `approvedFrom` and `approvedTo` filters do NOT match a derived date: they read the registry''s own approval date.'
          examples:
          - '2025-03-17'
        approvedDateDerived:
          type: boolean
          title: Approveddatederived
          description: True only when `approvedDate` was not held as an approval date and we filled it from a dated label printed on the act (today South Dakota's `Signed by the Governor`, listed under `otherDates`), on an act whose `enactmentOutcome` is `signed` or `line_item_veto`. False when `approvedDate` is null or is the registry's own. We never read a `presented` or `passed` date as an approval, nor a signing label on an act that became law without signature.
          default: false
          examples:
          - false
          - true
        effectiveFirst:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effectivefirst
          description: 'Earliest of the act''s effective dates we hold. Null when we hold none: a date the publisher does not print, or prints as a relative rule (`the day following final enactment`), is not guessed. The full list is `effectiveDates` on `GET /us/session-laws/{sessionLawId}`.'
          examples:
          - '2025-09-01'
          - null
        effectiveLast:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effectivelast
          description: Latest of the act's effective dates we hold. Equal to `effectiveFirst` for an act with one date; null when we hold none.
          examples:
          - '2026-01-01'
          - null
        enactmentOutcome:
          type: string
          title: Enactmentoutcome
          description: How the measure became, or failed to become, law. `signed`; `became_law_without_signature`; `veto_overridden`; `line_item_veto` (signed with some items vetoed); `vetoed` and `pocket_veto` (not law); `not_presented` (no governor action recorded, usual for resolutions); `approved_by_voters`; `unknown` (the publisher does not say).
          examples:
          - signed
        isLaw:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Islaw
          description: 'True for an act that is law. False for a numbered measure that is not: a vetoed bill, a pocket veto. Null when `enactmentOutcome` does not settle it (`not_presented`, `unknown`).'
          examples:
          - true
        textStatus:
          type: string
          enum:
          - held
          - withheld
          - not_held
          - pending
          title: Textstatus
          description: 'Whether we serve this law''s text. `held`: the text is served by `/us/session-laws/{sessionLawId}/body`. `withheld`: we hold the text but a measured defect keeps it from being served, and `withheldReason` says what. `not_held`: we know the act exists and do not hold its text. `pending`: collected and not yet verified.'
          examples:
          - held
        withheldReason:
          anyOf:
          - type: string
          - type: 'null'
          title: Withheldreason
          description: 'Present only when `textStatus` is `withheld`: a plain sentence saying what is wrong with the text we hold and what would release it. Free text, not an enum: show it, do not branch on it. The record itself (dates, sources, title) is still served and still correct.'
          examples:
          - 'LA: struck (deleted) law is merged into the text as if current while the record declares the markup preserved or absent (audit 2026-10-03). Awaiting a re-run with strike and underline recovery.'
          - null
        charCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Charcount
          description: Length of the law's full text in characters, the same as `totalChars` on the body. Null when there is no text. It is reported for a withheld law too (a fact about the text we hold), though that text is not served.
          examples:
          - 5470
          - 310454
        estimatedBodyPages:
          anyOf:
          - type: integer
          - type: 'null'
          title: Estimatedbodypages
          description: 'How many body pages the text takes: `charCount` divided by the page size (30,000 characters), rounded up. Pages are cut back to a paragraph break, so a long act can run a few percent over. Null unless `textStatus` is `held`: there is nothing to read. Reading a whole law costs `estimatedBodyPages` times the price of one body page (6 credits per page on `GET /us/session-laws/{sessionLawId}/body`). Ohio''s 2025 budget act (HB 96) is 9,571,132 characters, about 320 pages or 1,920 credits to read in full; most acts are a page or two.'
          examples:
          - 1
          - 11
        textSha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Textsha256
          description: SHA-256 (hex) of the full text of this law. It changes only when the text does, so it is the cheap way to tell whether a copy you hold is current. Body pages carry the same value.
          examples:
          - 55c7a8d08647e41f87e23fc2016881a6583911a1d5cfa8687403442e9096451b
        versionNo:
          anyOf:
          - type: integer
          - type: 'null'
          title: Versionno
          description: 'Revision counter of our record of this law: 1 for the first collection, higher after a re-collection changed the text or the metadata. Not a legislative version.'
          examples:
          - 1
        amendatoryMarkup:
          anyOf:
          - type: string
          - type: 'null'
          title: Amendatorymarkup
          description: 'Whether the language an amending act strikes and inserts survives in the text. `preserved`: it is in `text`, in the convention `markupConvention` names. `lost`: the publisher printed it and our text does not keep it, so deleted words can read as law: check the source before quoting. `absent`: the act carries no such markup that we found. `not_applicable`: there is no text to carry it.'
          examples:
          - preserved
        markupConvention:
          anyOf:
          - type: string
          - type: 'null'
          title: Markupconvention
          description: 'How preserved markup is written, set only when `amendatoryMarkup` is `preserved`. `wdiff`: deleted language is `[-like this-]` and inserted language `{+like this+}`. `publisher_literal`: the publisher''s own words are left as printed (Minnesota prints `new text begin` / `new text end` and `deleted text begin` / `deleted text end` markers). `mixed`: both in one text.'
          examples:
          - publisher_literal
          - wdiff
        documentKind:
          anyOf:
          - type: string
          - type: 'null'
          title: Documentkind
          description: 'What kind of document the text was taken from: `session_law_print` (the publisher''s printed chapter), `enrolled_bill`, `slip_law`, `volume_extract` (carved out of a bound volume) or `other`. An open list. Null when there is no text.'
          examples:
          - session_law_print
          - enrolled_bill
        identityConfidence:
          type: string
          title: Identityconfidence
          description: 'How firmly the law''s identity (session and number) is established. `single_source`: read from one publisher source, which is every state law at launch. `confirmed`: agreed by a second independent source, the level at which a `lawId` can be minted. `inferred`: derived by us rather than printed. `disputed`: sources disagree. The `sessionLawId` is the same at every level.'
          examples:
          - single_source
        licenseNote:
          anyOf:
          - type: string
          - type: 'null'
          title: Licensenote
          description: 'What the law''s licence class is and what it means for reuse, in a plain sentence: `Government public: published by a government body with no restrictive terms, so the text may be reused, including commercially.` Every law served with text is of a class that permits reuse; a note saying otherwise describes a record whose text is held back. Free text to show, not an enum to branch on: branch on `textStatus`.'
          examples:
          - 'Government public: published by a government body with no restrictive terms, so the text may be reused, including commercially.'
        updatedAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Updatedat
          description: When this law's record last changed in our registry, ISO 8601 UTC with a `+00:00` offset, the same form as the statutes routes. Use it with `updatedSince` on the list to sync only what changed.
          examples:
          - '2026-10-05T09:06:39.998043+00:00'
      type: object
      required:
      - sessionLawId
      - jurisdiction
      - citation
      - session
      - series
      - instrumentType
      - enactmentOutcome
      - textStatus
      - identityConfidence
      title: SessionLawSummary
      description: One session law, as it appears in lists and citation results.
    SessionLawNotFoundError:
      properties:
        detail:
          type: string
          title: Detail
          description: 'Human-readable reason, safe to show a user. Branch on `reason`, not on this string: the wording can change.'
          examples:
          - Session law not found. No law in the registry carries this id. Take ids from a /us/session-laws/list result, or send the citation in its place.
        sessionLawId:
          type: string
          title: Sessionlawid
          description: The identifier exactly as you sent it.
          examples:
          - SSL_MN_1801R_G_Y1801_C9999
        reason:
          type: string
          enum:
          - not_in_registry
          - wrong_case
          - unresolved_citation
          - ambiguous_citation
          - federal_session_law
          - missing_session_law_id
          - needs_jurisdiction
          - session_not_fully_collected
          title: Reason
          description: '`not_in_registry`: no law carries this id. `wrong_case`: it exists in another letter case, see `didYouMean`. `unresolved_citation`: you sent a citation and no law carries it. `ambiguous_citation`: the citation names several laws, all in `didYouMean`, none chosen for you; `defaultSessionLawId` is the publisher''s conventional reading when one is recorded. `federal_session_law`: federal acts are served by /us/statutes/section. `missing_session_law_id`: the URL names an endpoint where the id goes. `needs_jurisdiction`: the citation is in a form several states share and names none, so none was chosen for you; `jurisdictions` lists the states where it exists and `didYouMean` one law per state. `session_not_fully_collected`: nothing matched, and the session the id or citation points into is only partly collected, so the law may exist; `sessionCoverage` says how much of the session we hold. The route''s price is never charged on a 404; a citation''s resolution fee is kept on `unresolved_citation`, `ambiguous_citation` and `needs_jurisdiction`, and refunded on `session_not_fully_collected`: a miss in a partly collected session is never charged.'
          examples:
          - not_in_registry
        didYouMean:
          items:
            type: string
          type: array
          title: Didyoumean
          description: 'Real `sessionLawId`s the input points at: the one that exists in a different case, or every law an ambiguous citation names (at most 20, the conventional reading first). Empty when nothing matched.'
          examples:
          - - SSL_KY_2025R_G_Y2025_C100
            - SSL_MO_2025R_G_Y2025_BHB2
        defaultSessionLawId:
          anyOf:
          - type: string
          - type: 'null'
          title: Defaultsessionlawid
          description: 'On `ambiguous_citation`, the conventional reading when the registry records one, otherwise null. Informational: it is never served for you.'
          examples:
          - null
        jurisdictions:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Jurisdictions
          description: On `needs_jurisdiction`, every state (lower-case postal code) where the citation you sent exists. Name one of them in the citation and send it again. Absent on every other reason.
          examples:
          - - il
            - mn
            - tx
        candidateCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Candidatecount
          description: 'On `ambiguous_citation` and `needs_jurisdiction`, how many laws the citation names in all. Compare it with `len(didYouMean)`: when it is larger, `truncated` is true and the list is a sample, not the full set.'
          examples:
          - 22
        truncated:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Truncated
          description: True when `didYouMean` was capped (at most 20 ids) and `candidateCount` is larger than the list. Absent on reasons that carry no candidates.
          examples:
          - true
        sessionCoverage:
          anyOf:
          - $ref: '#/components/schemas/SessionLawSessionCoverage'
          - type: 'null'
          description: 'On `session_not_fully_collected`, the partly collected session the id or citation points into: how many laws we hold of how many it is expected to have (`denominator`), and how many are still open. Absent on every other reason. The same block is in `sessionLaws.sessions` on `GET /us/statutes/coverage`.'
      type: object
      required:
      - detail
      - sessionLawId
      - reason
      title: SessionLawNotFoundError
      description: The 404 from `GET /us/session-laws/{sessionLawId}` and its `/body`.
    CodeSectionAffected:
      properties:
        sectionAsPrinted:
          type: string
          title: Sectionasprinted
          description: The code section the act changes, as the publisher's table prints it. Not normalised and not linked to an `actId` on `/us/statutes`.
          examples:
          - 19.27A.020
        actionAsPrinted:
          anyOf:
          - type: string
          - type: 'null'
          title: Actionasprinted
          description: What the act does to that section, in the publisher's own words or abbreviation (`AMD` amended, `ADD`, `REP`, ...).
          examples:
          - AMD
        codeAsPrinted:
          anyOf:
          - type: string
          - type: 'null'
          title: Codeasprinted
          description: The code the section belongs to, as printed.
          examples:
          - RCW
        actSectionAsPrinted:
          anyOf:
          - type: string
          - type: 'null'
          title: Actsectionasprinted
          description: The section of the act itself that makes the change.
          examples:
          - '6'
      type: object
      required:
      - sectionAsPrinted
      title: CodeSectionAffected
      description: A code section the publisher lists the act as affecting.
    SessionLawResponse:
      properties:
        processingTimeMs:
          type: number
          title: Processingtimems
          description: Server-side time for this request in milliseconds, excluding network transit. Not billed on.
          default: 0.0
          examples:
          - 747.5
        creditsConsumed:
          type: integer
          title: Creditsconsumed
          description: 'Credits actually charged for this call, never the list price. It includes the `/us/statutes/resolve` fee when a citation was sent where an id goes. 0 when the call was not charged or was refunded (a body that answers `available: false`).'
          default: 0
          examples:
          - 2
        sessionLawId:
          type: string
          title: Sessionlawid
          description: 'Permanent identifier of the law, the key to use everywhere. Shape `SSL_{state}_{session code}_{series}[_Y{numberingYear}]_{C<chapter>|B<billKey>}`. It never changes: a correction to our reading of a law keeps the old id working. Pass it to `GET /us/session-laws/{sessionLawId}`.'
          examples:
          - SSL_MN_2025R_G_Y2025_C1
        lawId:
          anyOf:
          - type: string
          - type: 'null'
          title: Lawid
          description: The law's identifier in the open us1 scheme. Null until its identity is confirmed by a second source and the us1 state shape is minted, so it is null on every state law today. Use `sessionLawId`, which is always present.
          examples:
          - null
        jurisdiction:
          type: string
          title: Jurisdiction
          description: 'Lowercase two-letter code of the state, `dc` or `pr`. Federal acts are not served by this family: they are on `/us/statutes/section`.'
          examples:
          - mn
        citation:
          type: string
          title: Citation
          description: 'The act''s citation as its publisher prints it, falling back to `{session label}, ch. {number}` when none is printed. It is NOT unique: many states print a bare `CHAPTER 1` every session. Key on `sessionLawId`.'
          examples:
          - CHAPTER 1--S.F.No. 1552
          - ACT No. 2
          - Chapter 1, Laws of 2025
        citableAs:
          anyOf:
          - type: string
          - type: 'null'
          title: Citableas
          description: 'The law cited the way a lawyer writes it, from the state''s own form: `Minn. Laws 2025, ch. 1`, `2025 Fla. Laws ch. 3`, `Ill. Pub. Act 104-0001`, `S.L. 2025-12` (North Carolina), `Stats. 2025, ch. 12` (California), `Ohio S.B. 1 (2025)` for a state that numbers no chapters. A law in a special or extraordinary session carries it (`Minn. Laws 2025, 1st Spec. Sess., ch. 1`). Every value is read back through the grammar that `GET /us/session-laws/{sessionLawId}` accepts a citation in, and must name this law; one that would not is null, never guessed. Null where the state''s form is not known, for a series with no standard form (resolutions, memorials), or for a law with neither a chapter nor a bill key. Where a regular and a special session each have a chapter 1, the bare form is the regular session''s law and resolves with that law flagged as the default; the special session''s carries its session. Distinct from `citation`, which is the publisher''s printed form.'
          examples:
          - Minn. Laws 2025, ch. 1
          - 2025 Tex. Gen. Laws ch. 1
          - null
        citationShort:
          anyOf:
          - type: string
          - type: 'null'
          title: Citationshort
          description: 'A compact label for tables and badges: `MN ch. 1 (2025)`, `IL P.A. 104-0001`, `OH S.B. 1 (2025)`. Not a form to send back: use `citableAs` or the `sessionLawId`. Null exactly when `citableAs` is null.'
          examples:
          - MN ch. 1 (2025)
          - TX ch. 1 (2025)
          - null
        session:
          $ref: '#/components/schemas/SessionLawDetailSession'
          description: The legislative session the law was enacted in, and whether we hold all of it (`coverageStatus`).
        series:
          type: string
          title: Series
          description: The numbering series the law belongs to within its session. Most states have one, `general`. Others number acts, resolutions or local laws separately (`public`, `act`, `acts`, `law`, `public_act`, `resolve`, `resolution_chapter`, `local`, ...). An open list that grows as jurisdictions load. Filter with `series` on the list.
          examples:
          - general
        instrumentType:
          type: string
          title: Instrumenttype
          description: 'What kind of measure this is: `act`, `joint_resolution`, `concurrent_resolution`, `resolution`, `resolve`, `memorial` or `other`. An open list. A resolution that was numbered and published among the session laws is included, with `isLaw` saying whether it binds as law.'
          examples:
          - act
        number:
          anyOf:
          - type: string
          - type: 'null'
          title: Number
          description: 'The chapter or act number exactly as printed, as a string. It is not always an integer: `1`, `2025-12` (Florida), `104-0001` (Illinois), `1A`. Null where the state does not number its acts (see `billKey`).'
          examples:
          - '1'
          - 2025-12
        billKey:
          anyOf:
          - type: string
          - type: 'null'
          title: Billkey
          description: Normalised bill identifier (chamber and type letters plus the number) that stands in for a chapter number in states that do not number their acts (Missouri, Ohio, Nebraska). `House Bill 2` is `HB2`. Null whenever `number` is set. Part of the `sessionLawId` as `B<billKey>`.
          examples:
          - HB2
          - null
        billNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Billnumber
          description: The bill the act originated as, as the publisher prints it. Matches as a citation on `GET /us/session-laws/{sessionLawId}`.
          examples:
          - S.F.No. 1552
          - House Bill 2
        numberingYear:
          anyOf:
          - type: integer
          - type: 'null'
          title: Numberingyear
          description: 'The year of the numbering sequence the chapter number belongs to, where the state numbers by year (Minnesota, Florida, Texas). It appears in the `sessionLawId` as `_Y2025`. A chapter number is only unique within a session and numbering year: Minnesota''s regular and first special sessions of 2025 each have a Chapter 1. Null where one sequence runs across the session (Louisiana).'
          examples:
          - 2025
          - null
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: The act's long title as printed, usually beginning `An act relating to`. It names the code sections the act amends in prose.
          examples:
          - An act relating to agriculture; modifying financial reporting requirements for grain buyers; amending Minnesota Statutes 2024, section 223.17, subdivision 6.
        shortTitle:
          anyOf:
          - type: string
          - type: 'null'
          title: Shorttitle
          description: The act's short title when the publisher gives one (Ohio, New York, the District of Columbia and a few others do), otherwise null.
          examples:
          - Enact Advance Ohio Higher Education Act
          - null
        approvedDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Approveddate
          description: 'Date the governor (or the equivalent authority) approved the act, ISO 8601. Never an effective date: an act is usually in force on a different day, which is `effectiveDates`. Null when the publisher prints no approval date. Where the registry holds none but the publisher''s own dated label on `otherDates` names the governor''s signature, it is filled from that label and `approvedDateDerived` is true. The `approvedFrom` and `approvedTo` filters do NOT match a derived date: they read the registry''s own approval date.'
          examples:
          - '2025-03-17'
        approvedDateDerived:
          type: boolean
          title: Approveddatederived
          description: True only when `approvedDate` was not held as an approval date and we filled it from a dated label printed on the act (today South Dakota's `Signed by the Governor`, listed under `otherDates`), on an act whose `enactmentOutcome` is `signed` or `line_item_veto`. False when `approvedDate` is null or is the registry's own. We never read a `presented` or `passed` date as an approval, nor a signing label on an act that became law without signature.
          default: false
          examples:
          - false
          - true
        effectiveFirst:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effectivefirst
          description: 'Earliest of the act''s effective dates we hold. Null when we hold none: a date the publisher does not print, or prints as a relative rule (`the day following final enactment`), is not guessed. The full list is `effectiveDates` on `GET /us/session-laws/{sessionLawId}`.'
          examples:
          - '2025-09-01'
          - null
        effectiveLast:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effectivelast
          description: Latest of the act's effective dates we hold. Equal to `effectiveFirst` for an act with one date; null when we hold none.
          examples:
          - '2026-01-01'
          - null
        enactmentOutcome:
          type: string
          title: Enactmentoutcome
          description: How the measure became, or failed to become, law. `signed`; `became_law_without_signature`; `veto_overridden`; `line_item_veto` (signed with some items vetoed); `vetoed` and `pocket_veto` (not law); `not_presented` (no governor action recorded, usual for resolutions); `approved_by_voters`; `unknown` (the publisher does not say).
          examples:
          - signed
        isLaw:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Islaw
          description: 'True for an act that is law. False for a numbered measure that is not: a vetoed bill, a pocket veto. Null when `enactmentOutcome` does not settle it (`not_presented`, `unknown`).'
          examples:
          - true
        textStatus:
          type: string
          enum:
          - held
          - withheld
          - not_held
          - pending
          title: Textstatus
          description: 'Whether we serve this law''s text. `held`: the text is served by `/us/session-laws/{sessionLawId}/body`. `withheld`: we hold the text but a measured defect keeps it from being served, and `withheldReason` says what. `not_held`: we know the act exists and do not hold its text. `pending`: collected and not yet verified.'
          examples:
          - held
        withheldReason:
          anyOf:
          - type: string
          - type: 'null'
          title: Withheldreason
          description: 'Present only when `textStatus` is `withheld`: a plain sentence saying what is wrong with the text we hold and what would release it. Free text, not an enum: show it, do not branch on it. The record itself (dates, sources, title) is still served and still correct.'
          examples:
          - 'LA: struck (deleted) law is merged into the text as if current while the record declares the markup preserved or absent (audit 2026-10-03). Awaiting a re-run with strike and underline recovery.'
          - null
        charCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Charcount
          description: Length of the law's full text in characters, the same as `totalChars` on the body. Null when there is no text. It is reported for a withheld law too (a fact about the text we hold), though that text is not served.
          examples:
          - 5470
          - 310454
        estimatedBodyPages:
          anyOf:
          - type: integer
          - type: 'null'
          title: Estimatedbodypages
          description: 'How many body pages the text takes: `charCount` divided by the page size (30,000 characters), rounded up. Pages are cut back to a paragraph break, so a long act can run a few percent over. Null unless `textStatus` is `held`: there is nothing to read. Reading a whole law costs `estimatedBodyPages` times the price of one body page (6 credits per page on `GET /us/session-laws/{sessionLawId}/body`). Ohio''s 2025 budget act (HB 96) is 9,571,132 characters, about 320 pages or 1,920 credits to read in full; most acts are a page or two.'
          examples:
          - 1
          - 11
        textSha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Textsha256
          description: SHA-256 (hex) of the full text of this law. It changes only when the text does, so it is the cheap way to tell whether a copy you hold is current. Body pages carry the same value.
          examples:
          - 55c7a8d08647e41f87e23fc2016881a6583911a1d5cfa8687403442e9096451b
        versionNo:
          anyOf:
          - type: integer
          - type: 'null'
          title: Versionno
          description: 'Revision counter of our record of this law: 1 for the first collection, higher after a re-collection changed the text or the metadata. Not a legislative version.'
          examples:
          - 1
        amendatoryMarkup:
          anyOf:
          - type: string
          - type: 'null'
          title: Amendatorymarkup
          description: 'Whether the language an amending act strikes and inserts survives in the text. `preserved`: it is in `text`, in the convention `markupConvention` names. `lost`: the publisher printed it and our text does not keep it, so deleted words can read as law: check the source before quoting. `absent`: the act carries no such markup that we found. `not_applicable`: there is no text to carry it.'
          examples:
          - preserved
        markupConvention:
          anyOf:
          - type: string
          - type: 'null'
          title: Markupconvention
          description: 'How preserved markup is written, set only when `amendatoryMarkup` is `preserved`. `wdiff`: deleted language is `[-like this-]` and inserted language `{+like this+}`. `publisher_literal`: the publisher''s own words are left as printed (Minnesota prints `new text begin` / `new text end` and `deleted text begin` / `deleted text end` markers). `mixed`: both in one text.'
          examples:
          - publisher_literal
          - wdiff
        documentKind:
          anyOf:
          - type: string
          - type: 'null'
          title: Documentkind
          description: 'What kind of document the text was taken from: `session_law_print` (the publisher''s printed chapter), `enrolled_bill`, `slip_law`, `volume_extract` (carved out of a bound volume) or `other`. An open list. Null when there is no text.'
          examples:
          - session_law_print
          - enrolled_bill
        identityConfidence:
          type: string
          title: Identityconfidence
          description: 'How firmly the law''s identity (session and number) is established. `single_source`: read from one publisher source, which is every state law at launch. `confirmed`: agreed by a second independent source, the level at which a `lawId` can be minted. `inferred`: derived by us rather than printed. `disputed`: sources disagree. The `sessionLawId` is the same at every level.'
          examples:
          - single_source
        licenseNote:
          anyOf:
          - type: string
          - type: 'null'
          title: Licensenote
          description: 'What the law''s licence class is and what it means for reuse, in a plain sentence: `Government public: published by a government body with no restrictive terms, so the text may be reused, including commercially.` Every law served with text is of a class that permits reuse; a note saying otherwise describes a record whose text is held back. Free text to show, not an enum to branch on: branch on `textStatus`.'
          examples:
          - 'Government public: published by a government body with no restrictive terms, so the text may be reused, including commercially.'
        updatedAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Updatedat
          description: When this law's record last changed in our registry, ISO 8601 UTC with a `+00:00` offset, the same form as the statutes routes. Use it with `updatedSince` on the list to sync only what changed.
          examples:
          - '2026-10-05T09:06:39.998043+00:00'
        citationAsPrinted:
          anyOf:
          - type: string
          - type: 'null'
          title: Citationasprinted
          description: The citation exactly as the publisher prints it. Null when none is printed.
          examples:
          - CHAPTER 1--S.F.No. 1552
          - CCS SS SCS HCS HB 2
        vetoStatusAsPrinted:
          anyOf:
          - type: string
          - type: 'null'
          title: Vetostatusasprinted
          description: The publisher's own words on the governor's action. `enactmentOutcome` is our normalised reading of it.
          examples:
          - Signed by the governor March 17, 2025, 10:54 a.m.
        pageCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pagecount
          description: Pages in the source document when it is a PDF. Null for HTML sources.
          examples:
          - 162
          - null
        sourceUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourceurl
          description: 'The official page or file the act''s text was collected from, on a government publisher''s host: the first `sources` entry whose `role` is `text` and whose `hostClass` is `gov`. Open it to verify the text against the publisher. Null when we hold no such source (a law we know exists and have not collected) or when the text source is not a government host. Present on a withheld law too: the official copy is always where to go when we hold the text back.'
          examples:
          - https://www.revisor.mn.gov/laws/2025/0/Session+Law/Chapter/1/
        effectiveDates:
          items:
            $ref: '#/components/schemas/SessionLawDate'
          type: array
          title: Effectivedates
          description: 'Every effective date the publisher prints for the act, in printed order. Always a list, never null; empty when none is held. Empty does NOT mean the act is not in force: a date printed as a rule (`the day following final enactment`) or not printed in the publisher''s metadata is not guessed, and the approval date is never substituted for it. An act can take effect in parts, so a date may carry a `scopeAsPrinted`.'
          examples:
          - - date: '2024-12-05'
              dateAsPrinted: December 5, 2024
          - - date: '2025-04-02'
              dateAsPrinted: '2025-04-02 00:00:00'
              scopeAsPrinted: CCP §871.20.
          - []
        otherDates:
          items:
            $ref: '#/components/schemas/SessionLawDate'
          type: array
          title: Otherdates
          description: 'Every other date printed on the act, each with its `kind`: the approval date, filing dates and the publisher''s own milestones (presentment to the governor).'
          examples:
          - - date: '2025-03-17'
              dateAsPrinted: March 17, 2025, 10:54 a.m.
              kind: approved
            - date: '2025-03-14'
              dateAsPrinted: March 14, 2025
              kind: other
              kindAsPrinted: Presentment Date
        codeSectionsAffected:
          items:
            $ref: '#/components/schemas/CodeSectionAffected'
          type: array
          title: Codesectionsaffected
          description: 'The code sections the publisher''s own table lists the act as affecting, as printed. Always a list. Empty when the publisher prints no such table, which is common: the title still names sections in prose. We do not read sections out of the act text into this list.'
          examples:
          - - actSectionAsPrinted: '6'
              actionAsPrinted: AMD
              codeAsPrinted: RCW
              sectionAsPrinted: 19.27A.020
          - []
        sources:
          items:
            $ref: '#/components/schemas/SessionLawSource'
          type: array
          title: Sources
          description: 'The publisher documents the record was collected from, with the hash and fetch time of each: the audit trail from this response back to the official copy.'
          examples:
          - - byteLength: 69907
              contentType: text/html; charset=utf-8
              fetchedAt: '2026-09-29T00:41:01Z'
              hostClass: gov
              role: text
              sha256: 6c83d9c109c1ec61fcd96cea92c8c48414df7ae7dfda7452ebcfbddc181b6b45
              sourceIndex: 0
              url: https://www.revisor.mn.gov/laws/2025/0/Session+Law/Chapter/1/
        publisher:
          anyOf:
          - $ref: '#/components/schemas/SessionLawPublisher'
          - type: 'null'
          description: 'What the publisher itself printed or published about the act, beyond the dates and citation above: its own structured fields verbatim (`publisherFields`: the bill''s action history, committees, sponsors, and vote counts where the publisher gives them), its own identifiers, the legislature number and the printed pages. Omitted, not null, when it cannot be read or we only know the act exists.'
        provenance:
          anyOf:
          - $ref: '#/components/schemas/SessionLawProvenance'
          - type: 'null'
          description: How we came by the text (the extraction method, the bound volume it was cut from) and the collector's own `caveats` on the record. Omitted, not null, when it cannot be read or we only know the act exists.
        resolvedFrom:
          anyOf:
          - $ref: '#/components/schemas/SessionLawResolution'
          - type: 'null'
          description: 'Present only when your input did not match an id as sent: it says what was matched and how. Null when you sent an exact id.'
      type: object
      required:
      - sessionLawId
      - jurisdiction
      - citation
      - session
      - series
      - instrumentType
      - enactmentOutcome
      - textStatus
      - identityConfidence
      title: SessionLawResponse
      description: Response for `GET /us/session-laws/{sessionLawId}`.
    SessionLawSearchParsed:
      properties:
        text:
          type: string
          title: Text
          description: The free words, quoted parts removed.
          examples:
          - sheriff debit card
        phrases:
          items:
            type: string
          type: array
          title: Phrases
          description: Quoted phrases, matched verbatim.
          examples:
          - - debit card
        citationTokens:
          items:
            type: string
          type: array
          title: Citationtokens
          description: Citation-shaped tokens found in the query (`63-3004`), matched exactly.
          examples:
          - - 63-3004
        billNumbers:
          items:
            type: string
          type: array
          title: Billnumbers
          description: Bill numbers found in the query (`S.F.No. 1552`), matched exactly.
          examples:
          - - HB 145
      type: object
      required:
      - text
      title: SessionLawSearchParsed
      description: How the query was read, so a caller can see why a result matched.
    SessionLawBatchRequest:
      properties:
        ids:
          items:
            type: string
          type: array
          maxItems: 200
          minItems: 1
          title: Ids
          description: 'State session law ids, or citations, to read: up to 50 DISTINCT entries per call. Each entry is read exactly as the `{sessionLawId}` path of `GET /us/session-laws/{sessionLawId}` reads one: an id as sent, an id carrying copy damage, or a citation (`Minn. Laws 2025, ch. 1`, `P.A. 104-0001`, `S.F.No. 1552`). Entries are trimmed, and blank ones are dropped. Duplicates collapse FIRST (the first spelling wins, order is kept) and the cap applies to what is left, so a list quoting one law sixty times is one entry; `deduped` says how many were collapsed. 200 is the ceiling on the raw list. An entry is at most 300 characters. Federal ids (`SAL_...`) and endpoint names are misses, never charged.'
          examples:
          - - SSL_MN_2025R_G_Y2025_C1
            - S.F.No. 1552
            - SSL_MN_1801R_G_Y1801_C9999
        jurisdiction:
          anyOf:
          - type: string
            enum:
            - al
            - ak
            - az
            - ar
            - ca
            - co
            - ct
            - de
            - dc
            - fl
            - ga
            - gu
            - hi
            - id
            - il
            - in
            - ia
            - ks
            - ky
            - la
            - me
            - md
            - ma
            - mi
            - mn
            - ms
            - mo
            - mt
            - ne
            - nv
            - nh
            - nj
            - nm
            - ny
            - nc
            - nd
            - mp
            - oh
            - ok
            - or
            - pa
            - pr
            - ri
            - sc
            - sd
            - tn
            - tx
            - ut
            - vt
            - va
            - wa
            - wv
            - wi
            - wy
          - type: 'null'
          title: Jurisdiction
          description: 'Optional two-letter state code that scopes how a CITATION in `ids` is read, for the whole batch: it supplies the state a citation does not name (`Laws 2025, ch. 1` with `mn` is Minnesota''s) and vetoes a state the citation does name or whose form belongs to another. Ignored for an id. The 50 states, `dc` and `pr`, case-insensitive; `federal` or an unknown code is a 422 and nothing is charged. Omit it for a batch whose citations each name their own state.'
          examples:
          - mn
        includeBody:
          type: boolean
          title: Includebody
          description: 'Return the FIRST page of each served law''s text inline, on `body`, beside the record. A page is about 30,000 characters and costs the ordinary body price (6 credits) per law whose page is served; a law whose text is withheld, not held or empty comes back with `body: null` and is not charged for it. Read `creditsConsumed` rather than computing the total: the worst case is 50 laws at 2 + 6 credits each. `bodyNextCursor` continues a longer act on `GET /us/session-laws/{sessionLawId}/body`.'
          default: false
          examples:
          - true
      additionalProperties: false
      type: object
      required:
      - ids
      title: SessionLawBatchRequest
      description: Batch read. See `POST /us/session-laws/batch`.
    SessionLawPublisher:
      properties:
        legislatureNumber:
          anyOf:
          - type: integer
          - type: 'null'
          title: Legislaturenumber
          description: The number of the legislature that enacted the act, as the publisher counts them (Minnesota's 94th Legislature, Alaska's 34th). Null where the publisher does not number its legislatures on the act's own pages; a gap in what we hold, not a fact about the act.
          examples:
          - 94
          - 34
          - null
        sessionLastYear:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sessionlastyear
          description: The last calendar year of the session the act belongs to, for a session that spans two (the District of Columbia's Council Period 25 runs 2023 to 2024, California's regular session 2025 to 2026). Equal to `session.year` for a session inside one year.
          examples:
          - 2025
          - 2024
          - 2026
        printedPageStart:
          anyOf:
          - type: string
          - type: 'null'
          title: Printedpagestart
          description: 'The page number printed on the act''s first page in the publisher''s bound volume, as printed and therefore a string (`1`, `ix`, `42A`). Not the physical page of a PDF: see `provenance.volume`. Null where the act is not printed in a volume.'
          examples:
          - '1'
          - '135'
          - null
        printedPageEnd:
          anyOf:
          - type: string
          - type: 'null'
          title: Printedpageend
          description: The page number printed on the act's last page, as printed. Null as above.
          examples:
          - '1'
          - '142'
          - null
        documentKindAsPrinted:
          anyOf:
          - type: string
          - type: 'null'
          title: Documentkindasprinted
          description: 'The label the publisher''s own document carries for what kind of text it is, exactly as printed: `Enrolled version` (Texas), `As Adopted`, `Pamphlet Law` (New Jersey), `As Enacted`, `slip copy of this session law`. Our normalised reading of it is `documentKind`. Null where the document prints none.'
