  /v1/matters/{matterId}/nda-triages/{ndaTriageId}/exports:
    post:
      tags:
      - NDA triage
      summary: Export an NDA triage as a report
      description: 'Mint a short-lived URL to the triage as a PDF or DOCX report.


        A POST rather than a GET because it creates something: a bearer URL over an

        analysis of a client document, and a rendering that did not exist before.

        Recording that as a creation is what lets an audit answer who took a copy

        and when.'
      operationId: ndaTriages.export
      parameters:
      - name: matterId
        in: path
        required: true
        schema:
          type: string
          title: Matterid
        description: '`mat_` identifier of the matter to work inside. Everything in this API hangs off a matter, and the matter in the path is what the authorization boundary is checked against. Take it from `GET /v1/matters`.'
      - name: ndaTriageId
        in: path
        required: true
        schema:
          type: string
          title: Ndatriageid
        description: '`ndt_` identifier of the NDA triage. Returned on the operation that launched it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolReportExportRequest'
            example:
              format: pdf
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolReportExport'
              example:
                format: pdf
                filename: msa-acme-v3.docx
                url: https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
                expiresAt: '2026-08-19T14:32:10Z'
                sizeBytes: 248193
