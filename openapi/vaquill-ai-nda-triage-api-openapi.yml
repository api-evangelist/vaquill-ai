components:
  schemas:
    ToolReportExportRequest:
      properties:
        format:
          type: string
          enum:
          - pdf
          - docx
          title: Format
          description: Format to render. `pdf` for something a person reads and forwards, `docx` for something an editor opens.
          default: pdf
          examples:
          - pdf
      additionalProperties: false
      type: object
      title: ToolReportExportRequest
      description: Which format to render the finished analysis in.
    OperationStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - cancelled
      title: OperationStatus
      description: 'The public five. There is no sixth, and there are no synonyms.


        Internal vocabularies spell terminal success `completed`, `ready`,

        `extracted`, `succeeded` and `fresh`; terminal failure `failed` and `error`;

        queued `pending`, `queued` and `draft`. All of that is collapsed here by

        `app.workspace_api.adapters.status_map`, which refuses to guess.'
    NdaPlaybookAssessment:
      properties:
        verdict:
          type: string
          title: Verdict
          description: 'How this criterion measures against the playbook: `meets_standard`, `within_acceptable_range`, `outside_range`, `deal_breaker_hit`, or `not_assessed` when the playbook has no entry for it.'
          examples:
          - meets_standard
        playbookPosition:
          anyOf:
          - type: string
          - type: 'null'
          title: Playbookposition
          description: The standard position this criterion was measured against.
          examples:
          - Cap liability at fees paid in the preceding twelve months.
        deviationSummary:
          anyOf:
          - type: string
          - type: 'null'
          title: Deviationsummary
          description: 'How this NDA differs from the standard, in one line. For example `Your standard: 5y term cap; this NDA: 10y`.'
          examples:
          - 'Your standard: confidentiality obligations expire five years after disclosure.'
        triggeredEscalations:
          items:
            type: string
          type: array
          title: Triggeredescalations
          description: Which of the playbook's escalation triggers fired on this criterion.
          examples:
          - - value
      additionalProperties: false
      type: object
      required:
      - verdict
      title: NdaPlaybookAssessment
      description: 'One criterion measured against the organization''s own positions.


        Computed deterministically from the playbook, not by the model: the LLM

        knows what a market NDA looks like and only the playbook knows what this

        firm will sign.'
    ToolReportExport:
      properties:
        format:
          type: string
          enum:
          - pdf
          - docx
          title: Format
          description: Format of the exported file.
          examples:
          - pdf
        filename:
          type: string
          title: Filename
          description: Suggested filename for the download.
          examples:
          - msa-acme-v3.docx
        url:
          type: string
          title: Url
          description: Short-lived signed URL to download the report. Fetch it promptly and do not store it.
          examples:
          - https://storage.vaquill.ai/exports/msa-acme-v3-redline.docx?signature=...
        expiresAt:
          type: string
          format: date-time
          title: Expiresat
          description: When the URL stops working (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
        sizeBytes:
          type: integer
          title: Sizebytes
          description: Size of the exported file in bytes.
          examples:
          - 248193
      additionalProperties: false
      type: object
      required:
      - format
      - filename
      - url
      - expiresAt
      - sizeBytes
      title: ToolReportExport
      description: 'A short-lived URL to the rendered report.


        The route declares a response model and a PDF is not one, so the bytes live

        in object storage and the customer fetches them directly.'
    NdaTriageCriterion:
      properties:
        criterionId:
          type: integer
          title: Criterionid
          description: Stable number of this criterion, 1 through 10.
          examples:
          - 1
        criterionName:
          type: string
          title: Criterionname
          description: What the criterion checks.
          examples:
          - Term and Duration
        status:
          type: string
          title: Status
          description: 'The screen''s verdict on this criterion: `pass`, `warn`, `fail`, or `not_found` when the NDA is silent.'
          examples:
          - pass
        findings:
          type: string
          title: Findings
          description: What the NDA actually says about this criterion.
          examples:
          - Confidentiality obligations run for ten years from the effective date, with no separate treatment of trade secrets.
        issues:
          items:
            type: string
          type: array
          title: Issues
          description: Specific problems identified.
          examples:
          - - value
        recommendation:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommendation
          description: What to do about this criterion.
          examples:
          - Reduce the confidentiality term to five years and carve out trade secrets, which survive for as long as they remain secret.
