        empty body is refused rather than reported as a successful no-op.'
      operationId: clients.update
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
          title: Clientid
        description: '`cli_` identifier of the client. Take it from `GET /v1/clients`.'
