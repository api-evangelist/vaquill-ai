    delete:
      tags:
      - Clients
      summary: Delete a client
      description: 'Delete a client. Refused while it still owns a matter.


        Reassign or delete its matters first; list them at

        `GET /v1/clients/{clientId}/matters`. Any notes filed against the client in

        the app are deleted with it.


        There is no undo, and a repeated delete answers `404`. If a delete timed

        out, treat a subsequent `404` as success.'
      operationId: clients.delete
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
          title: Clientid
        description: '`cli_` identifier of the client. Take it from `GET /v1/clients`.'
      responses:
        '204':
          description: Successful Response
        '422':
