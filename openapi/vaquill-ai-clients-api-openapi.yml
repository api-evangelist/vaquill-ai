  /v1/clients/{clientId}/matters:
    get:
      tags:
      - Clients
      summary: List a client's matters
      description: 'Every matter belonging to one client, ordered by name, A to Z.


        A client that does not exist in your organization answers `404`; a real

        client with no matters answers an empty page with `total: 0`. The two are

        different facts and are reported differently.'
      operationId: clients.matters
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
          title: Clientid
        description: '`cli_` identifier of the client. Take it from `GET /v1/clients`.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: How many rows to return, 1 to 200. Defaults to 50.
          default: 50
          title: Limit
        description: How many rows to return, 1 to 200. Defaults to 50.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: 'How many rows to skip before returning any. Combine with `limit` to page: `offset=0`, then `offset=50`, and so on. Offsets are positional, not stable, so a set that changes while you page can show a row twice or not at all.'
          default: 0
          title: Offset
        description: 'How many rows to skip before returning any. Combine with `limit` to page: `offset=0`, then `offset=50`, and so on. Offsets are positional, not stable, so a set that changes while you page can show a row twice or not at all.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Matter_'
              example:
                data:
                - id: mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
