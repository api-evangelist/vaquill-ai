components:
  schemas:
    Matter:
      properties:
        id:
          type: string
          title: Id
          description: Public identifier, `mat_` followed by 32 hex characters. This is the value that goes in every matter-nested path.
          examples:
          - mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        name:
          type: string
          title: Name
          description: The matter's display name.
          examples:
          - Acme / Series B Financing
        clientId:
          anyOf:
          - type: string
          - type: 'null'
          title: Clientid
          description: '`cli_` identifier of the client this matter belongs to, if one was set.'
          examples:
          - cli_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Free-text description of the matter.
          examples:
          - Master services agreement with Acme for the 2026 platform rollout.
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
          description: Standing instructions the customer wants applied to AI work on this matter. Carried into drafting and review prompts.
          examples:
          - House paper. Cap liability at 12 months of fees; never accept uncapped indemnity.
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          description: Lifecycle status. Usually `open`, `pending` or `closed`, but published as a plain string because production holds values no UI offers. Do not branch on it without a fallback.
          examples:
          - open
        practiceArea:
          anyOf:
          - type: string
          - type: 'null'
          title: Practicearea
          description: Practice area, for example `employment` or `real_estate`. Free text.
          examples:
          - commercial
        matterType:
          anyOf:
          - type: string
          - type: 'null'
          title: Mattertype
          description: Customer's own sub-classification of the matter. Free text.
          examples:
          - financing
        caseNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Casenumber
          description: Docket or internal case reference.
          examples:
          - 2026-CV-0117
        responsibleAttorneyName:
          anyOf:
          - type: string
          - type: 'null'
          title: Responsibleattorneyname
          description: Name of the attorney responsible for the matter. The underlying user id is deliberately not published.
          examples:
          - Dana Whitfield
        openDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Opendate
          description: Date the matter opened (`YYYY-MM-DD`).
          examples:
          - '2026-08-19'
        closeDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Closedate
          description: Date the matter closed (`YYYY-MM-DD`). Absent while it is open.
          examples:
          - '2026-08-19'
        billingType:
          anyOf:
          - type: string
          - type: 'null'
          title: Billingtype
          description: Billing arrangement, normally one of `hourly`, `flat_fee`, `contingency` or `pro_bono`. Published as a plain string.
          examples:
          - hourly
        billingRate:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Billingrate
          description: Billing rate in `billingCurrency`. Rendered as a JSON STRING, not a number, so the value stays exact.
          examples:
          - '450.00'
        billingCurrency:
          anyOf:
          - type: string
          - type: 'null'
          title: Billingcurrency
          description: ISO 4217 currency code for `billingRate`, for example `USD`.
          examples:
          - USD
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
          description: ISO 3166-1 alpha-2 country code, for example `US`. Unlike a client's `country`, this is a validated code.
          examples:
          - US
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Arbitrary JSON the customer stores against the matter. Vaquill never reads it.
        isDefault:
          type: boolean
          title: Isdefault
          description: 'True for the one matter minted at signup that unfiled work lands in. Read-only: exactly one exists per organization and this API cannot create or move it.'
          default: false
          examples:
          - false
        createdAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Createdat
          description: When the matter was created (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
        updatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updatedat
          description: When the matter was last modified (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
      additionalProperties: false
      type: object
      required:
      - id
      - name
      title: Matter
      description: A matter as this API publishes it.
    ClientUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Name
          description: New display name. Cannot be set to null; omit it to leave the name alone.
          examples:
          - Acme Corporation
        email:
          anyOf:
          - type: string
            maxLength: 255
            format: email
          - type: 'null'
          title: Email
          description: New email address, or null to clear it.
          examples:
          - counsel@acme.example
        phone:
          anyOf:
          - type: string
            maxLength: 30
          - type: 'null'
          title: Phone
          description: New phone number, or null to clear it.
          examples:
          - +1 415 555 0142
        address:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Address
          description: New street address, or null to clear it.
          examples:
          - 500 Howard Street
        city:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: City
          description: New city, or null to clear it.
          examples:
          - San Francisco
        state:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: State
          description: New state or region, or null to clear it.
          examples:
          - CA
        zipCode:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Zipcode
          description: New postal code, or null to clear it.
          examples:
          - '94105'
        country:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Country
          description: New country as free text, or null to clear it.
          examples:
          - US
        clientType:
          anyOf:
          - $ref: '#/components/schemas/ClientType'
          - type: 'null'
          description: New client type, or null to clear it.
          examples:
          - individual
        taxId:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Taxid
          description: New tax or registration number, or null to clear it.
          examples:
          - 94-3211110
        notes:
          anyOf:
          - type: string
            maxLength: 10000
          - type: 'null'
          title: Notes
          description: New notes, or null to clear them.
          examples:
          - Primary contact is in-house counsel, not procurement.
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Replacement metadata object, or null to clear it. Not merged with what is stored.
      additionalProperties: false
      type: object
      title: ClientUpdateRequest
      description: A partial update. Absent leaves alone; explicit null clears.
    ClientType:
      type: string
      enum:
      - individual
      - organization
      - corporation
      title: ClientType
      description: 'The write vocabulary, matching the `clients_client_type_check` CHECK.


        Closed rather than free-form: widening this later is additive and safe,

        while narrowing a string field that customers have already populated is not.'
    Client:
      properties:
        id:
          type: string
          title: Id
          description: Public identifier, `cli_` followed by 32 hex characters.
          examples:
          - cli_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        name:
          type: string
          title: Name
          description: The client's display name, as the customer entered it.
          examples:
          - Acme Corporation
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
          description: Primary contact email address.
          examples:
          - counsel@acme.example
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
          description: Primary contact phone number, stored as written and not normalized.
          examples:
          - +1 415 555 0142
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
          description: Street address, one free-text line.
          examples:
          - 500 Howard Street
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
          description: City or town.
          examples:
          - San Francisco
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
          description: State, province or region.
          examples:
          - CA
        zipCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Zipcode
          description: Postal or ZIP code.
          examples:
          - '94105'
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
          description: Country as free text, NOT an ISO code. `matters.country` is a two-letter code; this column is not.
          examples:
          - US
        clientType:
          anyOf:
          - type: string
          - type: 'null'
          title: Clienttype
          description: What kind of client this is. Usually one of `individual`, `organization` or `corporation`, but published as a plain string because the column's CHECK is the only thing constraining it. Do not branch on it without a fallback.
          examples:
          - organization
        taxId:
          anyOf:
          - type: string
          - type: 'null'
          title: Taxid
          description: Tax or company registration number.
          examples:
          - 94-3211110
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
          description: Free-text notes the customer keeps against this client.
          examples:
          - Primary contact is in-house counsel, not procurement.
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Arbitrary JSON the customer stores against the client. Vaquill never reads it.
        createdAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Createdat
          description: When the client was created (RFC 3339). Absent on a small number of rows that predate the column default.
          examples:
          - '2026-08-19T14:32:10Z'
        updatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updatedat
          description: When the client was last modified (RFC 3339).
          examples:
          - '2026-08-19T14:32:10Z'
      additionalProperties: false
      type: object
      required:
      - id
      - name
      title: Client
      description: A client as this API publishes it.
    Pagination:
      properties:
        limit:
          type: integer
          title: Limit
          description: The `limit` that was applied to this request.
          examples:
          - 50
        offset:
          type: integer
          title: Offset
          description: The `offset` that was applied to this request.
          examples:
          - 0
        total:
          type: integer
          title: Total
          description: Total rows matching the filter, not the number returned in `data`. Use it to size a job before running it.
          examples:
          - 128
        hasMore:
          type: boolean
          title: Hasmore
          description: True when rows remain beyond this window. Derived from `offset + len(data) < total`, so a full final page correctly reports `false` rather than sending you after an empty page.
          examples:
          - false
      additionalProperties: false
      type: object
      required:
      - limit
      - offset
      - total
      - hasMore
      title: Pagination
      description: 'Where the caller is, and whether there is more.


        `total` is the count of rows matching the filter, not the count returned,

        so a caller can size a job before running it.'
    Page_Matter_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Matter'
          type: array
          title: Data
          description: The rows in this window, in the collection's default order.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Where this window sits in the full result set.
      additionalProperties: false
      type: object
      required:
      - data
      - pagination
      title: Page[Matter]
    ValidationProblem:
      type: object
      title: ValidationProblem
      description: A problem document for a schema rejection. `errors` lists the fields that were refused. The value you submitted is deliberately not echoed, so a validation failure cannot copy your content into an error response or into either side's logs.
      required:
      - type
      - title
      - status
      - detail
      - instance
      - errors
      properties:
        type:
          type: string
          format: uri
          description: The stable identifier for this error, and the one field to branch on. Resolves to a page describing it.
          examples:
          - https://vaquill.ai/docs/workspace-api/errors/insufficient-scope
        title:
          type: string
          description: A short human-readable summary.
          examples:
          - Insufficient scope
        status:
          type: integer
          description: The HTTP status code, repeated.
          examples:
          - 403
        detail:
          type: string
          description: What went wrong on this specific request. May be reworded at any time.
          examples:
          - This credential carries matters:read. This operation needs matters:write.
        instance:
          type: string
          description: The path this problem occurred on.
          examples:
          - /workspace/v1/matters/mat_9f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        requestId:
          type: string
          description: The id of this request, identical to the `X-Request-ID` response header. Quote it when contacting support.
          examples:
          - req_5f2c8b1e4a7d43c9b6e0f1a2c3d4e5f6
        errors:
          type: array
          description: One entry per rejected field.
          items:
            type: object
            required:
            - location
            - message
            - type
            properties:
              location:
                type: string
                description: Dotted path to the rejected field, for example `body.contentMarkdown`.
              message:
                type: string
                description: Why it was rejected.
              type:
                type: string
                description: The validation rule that failed.
      additionalProperties: true
    Page_Client_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Client'
          type: array
          title: Data
          description: The rows in this window, in the collection's default order.
        pagination:
          $ref: '#/components/schemas/Pagination'
          description: Where this window sits in the full result set.
      additionalProperties: false
      type: object
      required:
      - data
      - pagination
      title: Page[Client]
    ClientCreateRequest:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
