          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateRequest'
            example:
              name: Acme Corporation
              email: counsel@acme.example
              phone: +1 415 555 0142
              address: 500 Howard Street
              city: San Francisco
              state: CA
              zipCode: '94105'
