  /v1/clients/{clientId}:
    get:
      tags:
      - Clients
      summary: Get a client
      description: 'One client by id.


        A `404` covers "no such client", "not this organization''s" and a malformed

        id alike, so the status cannot be used to discover which ids exist elsewhere.'
      operationId: clients.get
      parameters:
      - name: clientId
